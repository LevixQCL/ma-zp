# Analyse d'usage (oct. 2026, temporaire, lancée à la main) : lit les parties (lecture seule) et dépose une copie CHIFFRÉE
# (clé publique ci-dessous ; seule la clé privée de l'analyse peut la lire). Fichier gardé un jour. À supprimer après l'analyse.
name: Analyse d'usage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save firebase-admin@12.7.0
      - run: node outils/serveur/usage.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Chiffrer
        run: |
          echo '' | base64 -d > pub.pem
          gzip -9 usage.json
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in usage.json.gz -out usage.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.enc
          rm -f usage.json.gz k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: usage
          path: |
            usage.enc
            k.enc
          retention-days: 1
