# Analyse d'usage (oct. 2026, temporaire, lancée à la main) : lit les parties (lecture seule) et n'en sort que des chiffres
# anonymes (joueurs J1, J2…, aucun texte ni pseudo), en annotations de la tâche. À supprimer après l'analyse.
name: Analyse d'usage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save firebase-admin@12.7.0
      - run: node outils/serveur/usage.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: for i in $(seq 1 10); do [ -f m$i ] && cat m$i; done; true
      - run: for i in $(seq 11 20); do [ -f m$i ] && cat m$i; done; true
      - run: for i in $(seq 21 30); do [ -f m$i ] && cat m$i; done; true
      - run: for i in $(seq 31 40); do [ -f m$i ] && cat m$i; done; true
