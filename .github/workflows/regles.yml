# Publie les règles de sécurité Firestore (firestore.rules) dans Firebase, sans copier-coller dans la console.
name: Publier les règles Firestore
on:
  push:
    branches: [main]
    paths: [firestore.rules, outils/serveur/regles.mjs, .github/workflows/regles.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save firebase-admin@12.7.0
      - run: node outils/serveur/regles.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
