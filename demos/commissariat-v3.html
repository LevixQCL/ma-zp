<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commissariat vivant (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Démo : commissariat en coupe, pièces en perspective (maison de poupée), éclairage doux. Thème nuit unique, volontaire. */
:root{
  color-scheme:dark;
  --bg:#0a0e22; --s1:#151b38; --s3:#27305a; --hair:rgba(190,205,255,.1);
  --text:#EDF0FA; --muted:#98a2c4; --amber:#FFB23F; --amber-ink:#241400; --green:#3DD39A; --red:#FF6E6A;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--body);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:0 0 74px}

.demo{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px 10px;background:#070a1a;border-bottom:1px solid var(--hair);font-size:11.5px;color:#E9C894;font-weight:700}
.demo button{padding:5px 10px;border-radius:9px;border:1px solid #2b3560;background:#141a36;font-size:12px;font-weight:700;color:var(--muted)}
.demo button[aria-pressed="true"]{border-color:rgba(255,178,63,.5);background:rgba(255,178,63,.12);color:var(--amber)}
.demo .go{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:6px;align-items:center;padding:8px 10px;background:linear-gradient(var(--bg) 70%,rgba(10,14,34,0))}
.pill{display:flex;align-items:center;gap:6px;background:rgba(21,27,56,.94);border:1px solid var(--hair);border-radius:99px;padding:5px 10px 5px 6px;font-size:13px;font-weight:700}
.pill b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.pill.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.18);background:var(--s3)}}
.tour{margin-left:auto;text-align:right;font-size:10.5px;color:var(--muted);line-height:1.1}
.tour b{display:block;font:800 16px var(--display);color:var(--amber)}

.scene{position:relative;width:100%;overflow:hidden}
.bat{position:absolute;left:0;top:0;width:360px;transform-origin:0 0}
.etoile{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:scint 3.4s ease-in-out infinite}
@keyframes scint{50%{opacity:.2}}
.salle{position:absolute;overflow:hidden}
.salle svg.fond{position:absolute;inset:0;width:100%;height:100%;display:block}
.salle .eteint{position:absolute;inset:0;background:rgba(4,6,20,.62);transition:opacity .7s;pointer-events:none;z-index:2}
.salle.vit .eteint{opacity:0}
.salle .led{position:absolute;left:10px;right:10px;bottom:1px;height:2.5px;border-radius:2px;transition:background .3s,box-shadow .3s;z-index:3}
.salle.ok .led{background:var(--green);box-shadow:0 0 7px var(--green)}
.salle.manque .led{background:var(--amber);box-shadow:0 0 7px var(--amber)}
.salle.drop::after{content:"";position:absolute;inset:0;border:3px solid var(--amber);box-shadow:inset 0 0 26px rgba(255,178,63,.35);z-index:4;pointer-events:none}
.etiq{position:absolute;left:3px;top:3px;z-index:6;display:flex;align-items:center;gap:3px;font-size:7.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(8,11,28,.72);padding:2px 6px 2px 5px;border-radius:6px;color:#e8ecf8;pointer-events:none;white-space:nowrap}
.etiq i{width:6px;height:6px;border-radius:50%}
.etiq .c{font-size:8.5px;letter-spacing:0;padding:0 5px;border-radius:99px;background:rgba(255,255,255,.14)}
.salle.ok .etiq .c{background:var(--green);color:#062417}
.salle.manque .etiq .c{background:var(--amber);color:var(--amber-ink)}

.gyro{animation:gyro .45s steps(1) infinite}
@keyframes gyro{50%{fill:#ff3d5a}}
.halo{opacity:0}
.alerte .halo{animation:halo .45s steps(1) infinite}
@keyframes halo{0%{opacity:.55;fill:#3b7bff}50%{opacity:.55;fill:#ff3d5a}}
.van{transition:transform 1.9s cubic-bezier(.55,0,.4,1)}
.van.sort{transform:translateX(-200px)}

/* Agents */
.ag{position:absolute;left:0;top:0;width:24px;height:40px;touch-action:none;cursor:grab;will-change:transform}
.ag .mir{width:100%;height:100%;transform-origin:50% 100%}
.ag svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 .6px rgba(0,0,0,.7))}
.ag .jg,.ag .jd,.ag .bg,.ag .bd{transform-box:fill-box;transform-origin:50% 8%}
.ag.marche .jg{animation:jambe .5s ease-in-out infinite}
.ag.marche .jd{animation:jambe .5s ease-in-out infinite reverse}
.ag.marche .bg{animation:bras .5s ease-in-out infinite reverse}
.ag.marche .bd{animation:bras .5s ease-in-out infinite}
.ag.marche .corps{animation:bob .25s ease-in-out infinite alternate}
@keyframes jambe{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes bras{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes bob{to{transform:translateY(-.9px)}}
.ag .corps{animation:souffle 3.2s ease-in-out infinite}
@keyframes souffle{50%{transform:translateY(-.35px)}}
.ag .tasse,.ag .radio{display:none}
.ag.cafe .tasse{display:block}
.ag.cafe .bd{animation:boire 2.8s ease-in-out infinite}
@keyframes boire{0%,100%{transform:rotate(-35deg)}45%,62%{transform:rotate(-150deg)}}
.ag.radio .bg{transform:rotate(155deg)}
.ag.radio .radio{display:block}
.ag.tient{position:fixed;z-index:200;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.5))}
.ag.tient .corps{animation:none}
.cabine{position:absolute;left:0;top:0;width:24px;height:36px;border-radius:5px;background:linear-gradient(90deg,#4b5687,#6b78ad 50%,#4b5687);border:2px solid #9aa6d4;box-shadow:0 0 14px rgba(155,170,230,.35);will-change:transform}

.bulle{position:absolute;z-index:2000;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.15);animation:flotte 1.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-4px)}}
.pastille{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:99px;background:#fff;color:#111;font:800 10px var(--body);display:grid;place-items:center;padding:0 3px}
.vol{position:fixed;z-index:300;font-size:18px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s}
.nuitvoile{position:absolute;inset:0;z-index:1500;background:rgba(3,5,18,0);pointer-events:none;transition:background .9s}
.nuitvoile.on{background:rgba(3,5,18,.5)}

.voile{position:fixed;inset:0;z-index:400;background:rgba(3,5,12,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.choix{width:100%;max-width:430px;background:#F4EFE3;color:#1D1A15;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
.choix .qui{display:flex;gap:10px;align-items:center}
.choix .av{width:46px;height:46px;border-radius:50%;background:#2a3350;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.choix .q{font:800 18px/1.2 var(--display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opts .non{background:#e3dac6} .opts .oui{background:#1D1A15;color:#F4EFE3}
.opts small{font-weight:600;font-size:11.5px;opacity:.8}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:500;background:var(--s3);border:1px solid #3a4680;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;max-width:90vw;text-align:center;animation:monte .2s}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:450;background:rgba(12,16,38,.95);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:10.5px;color:#67719A}
nav.tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs span i{font-style:normal;font-size:18px}
nav.tabs span.on{color:var(--amber)}
nav.tabs .badge{position:absolute;top:-2px;left:56%;background:var(--red);color:#fff;font:800 10px var(--body);border-radius:99px;padding:0 5px}
@media (prefers-reduced-motion:reduce){.etoile,.bulle,.gyro,.ag .corps{animation:none!important}}
</style>
</head>
<body>
<div class="demo" role="group" aria-label="Contrôles de la démo">
  DÉMO · niveau du commissariat
  <button type="button" data-niv="1" aria-pressed="true">1</button>
  <button type="button" data-niv="2" aria-pressed="false">2</button>
  <button type="button" data-niv="3" aria-pressed="false">3</button>
  <button type="button" class="go" id="nuit">Passer 20:00</button>
</div>
<div class="app">
  <div class="hud">
    <span class="pill" id="p-budget"><b style="background:#2f6b4f">€</b><span id="v-budget"></span></span>
    <span class="pill" id="p-moral"><b style="background:#6b4f2f">♥</b><span id="v-moral"></span></span>
    <span class="pill" id="p-ipz"><b style="background:#2f4b6b">↗</b><span id="v-ipz"></span></span>
    <span class="tour">tour de 20:00<b>5 h 12</b></span>
  </div>
  <div class="scene" id="scene"><div class="bat" id="bat"></div></div>
</div>
<nav class="tabs" aria-label="Onglets du jeu"><div class="in">
  <span class="on"><i>🏛</i>Commissariat</span><span id="tab-enq"><i>🔎</i>Enquête</span><span><i>🧩</i>Énigmes</span><span><i>🗺</i>Carte</span><span><i>📻</i>Radio</span>
</div></nav>

<script>
/* ================= Géométrie ================= */
// Pièces basses et larges (à la Fallout Shelter), largeurs variables, ascenseur à droite.
const W = 360, PAD = 14, PUITS = 34, FW = W - 2*PAD - PUITS, XS = PAD + FW, XP = XS + PUITS/2;
const RH = 86, DALLE = 7, TOIT = 74, RUE = 38, JOINT = 3;
const IN = 8, PL = 6, FOND = RH - 24;            // perspective : retrait latéral, plafond, bas du mur du fond
const LANE = [RH - 13, RH - 4];                   // lignes de pieds : fond, devant
const AG = .74;                                   // taille des agents

/* ================= Couleurs ================= */
function hex(c){ c=c.replace('#',''); return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16)); }
function mix(c, k){ const [r,g,b] = hex(c), t = k<0?0:255, a = Math.abs(k); return '#'+[r,g,b].map(v=>Math.round(v+(t-v)*a).toString(16).padStart(2,'0')).join(''); }

/* ================= Données ================= */
const SERVICES = {
  intervention:{ nom:'Intervention', coul:'#FF6E6A', besoin:6, mur:'#4a5470', sol:'#3d4254', solB:'beton' },
  accueil:{ nom:'Accueil', coul:'#B79BFF', besoin:3, mur:'#5c5488', sol:'#77634f', solB:'parquet' },
  proximite:{ nom:'Proximité', coul:'#3DD39A', besoin:3, mur:'#3e6c62', sol:'#77634f', solB:'parquet' },
  roulage:{ nom:'Roulage', coul:'#F2D04B', besoin:2, mur:'#6a6444', sol:'#4c4d56', solB:'carrelage' },
  recherche:{ nom:'Recherche', coul:'#63B0FF', besoin:4, mur:'#3d5886', sol:'#655344', solB:'parquet' },
  chef:{ nom:'Chef', coul:'#FFB23F', besoin:0, mur:'#70533a', sol:'#7d5236', solB:'parquet' },
  repos:{ nom:'Vestiaires', coul:'#98a2c4', besoin:0, mur:'#4c506e', sol:'#4c4d56', solB:'carrelage' },
  cachots:{ nom:'Cellule', coul:'#98a2c4', besoin:0, mur:'#3c3f4e', sol:'#34353d', solB:'beton' },
  tir:{ nom:'Stand de tir', coul:'#98a2c4', besoin:0, mur:'#46475b', sol:'#36373f', solB:'beton' },
  drone:{ nom:'Cellule drone', coul:'#98a2c4', besoin:0, mur:'#2f4b63', sol:'#3b4351', solB:'carrelage' },
  chantier:{ nom:'Travaux', coul:'#67719A', besoin:0, mur:'#45475c', sol:'#3a3b45', solB:'beton' },
};
// étages du haut vers le bas ; le dernier est le rez-de-chaussée, sur la rue
const PLANS = {
  1:[ [['recherche',.38],['repos',.30],['chef',.32]], [['proximite',.5],['roulage',.5]], [['intervention',.47],['chantier',.18],['accueil',.35]] ],
  2:[ [['recherche',.38],['repos',.30],['chef',.32]], [['proximite',.5],['roulage',.5]], [['intervention',.47],['cachots',.18],['accueil',.35]] ],
  3:[ [['tir',.55],['drone',.45]], [['recherche',.38],['repos',.30],['chef',.32]], [['proximite',.5],['roulage',.5]], [['intervention',.47],['cachots',.18],['accueil',.35]] ],
};
const PLACABLES = ['intervention','accueil','proximite','roulage','recherche','repos'];
const S = { niv:1, budget:91900, moral:61, agents:[], bulles:[] };
const PEAUX = ['#f2cba6','#e0ae84','#9a6444','#f6d9bd','#c58a60','#6f4630'];
const CHEVEUX = ['#2b1d14','#5a3a22','#c9a063','#1a1a1a','#7a4a2a','#d9d2c4'];
const DEPART = { recherche:3, proximite:3, accueil:2, intervention:5, roulage:2, repos:5 };

/* ================= Coque d'une pièce (perspective) ================= */
let uid = 0;
function coque(t, w){
  const s = SERVICES[t], m = s.mur, f = s.sol, id = 'c'+(uid++), b0 = IN, b1 = w - IN;
  let motif = '';
  if (s.solB === 'parquet') {
    const n = Math.round(w/16);
    for (let i=0;i<=n;i++) motif += `<path d="M${b0+(b1-b0)*i/n} ${FOND}L${w*i/n} ${RH}" stroke="${mix(f,-.22)}" stroke-width=".6"/>`;
    motif += `<path d="M0 ${FOND+12}H${w}" stroke="${mix(f,-.12)}" stroke-width=".5" stroke-dasharray="10 7"/>`;
  } else if (s.solB === 'carrelage') {
    const n = Math.round(w/20);
    for (let i=0;i<=n;i++) motif += `<path d="M${b0+(b1-b0)*i/n} ${FOND}L${w*i/n} ${RH}" stroke="${mix(f,.12)}" stroke-width=".55"/>`;
    motif += [FOND+7, FOND+16].map(y=>`<path d="M0 ${y}H${w}" stroke="${mix(f,.12)}" stroke-width=".55"/>`).join('');
  } else motif = `<path d="M${w*.25} ${FOND+15}q10 2 20 0M${w*.62} ${FOND+19}q12 2 20-1" stroke="${mix(f,-.2)}" stroke-width=".9" fill="none"/>`;
  return `<defs>
      <linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(m,-.12)}"/><stop offset=".8" stop-color="${m}"/><stop offset="1" stop-color="${mix(m,-.12)}"/></linearGradient>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${mix(f,-.28)}"/><stop offset="1" stop-color="${f}"/></linearGradient>
      <radialGradient id="${id}l" cx=".5" cy="0" r=".75"><stop offset="0" stop-color="#ffe9bf" stop-opacity=".32"/><stop offset="1" stop-color="#ffe9bf" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}p" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe2a6" stop-opacity=".3"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="${b0}" y="${PL}" width="${b1-b0}" height="${FOND-PL}" fill="url(#${id}m)"/>
    <rect x="${b0}" y="${FOND-12}" width="${b1-b0}" height="12" fill="${mix(m,-.14)}"/>
    <rect x="${b0}" y="${FOND-12}" width="${b1-b0}" height=".9" fill="${mix(m,.2)}"/>
    <rect x="${b0}" y="${FOND-1.8}" width="${b1-b0}" height="1.8" fill="${mix(m,-.34)}"/>
    <path d="M0 0H${w}L${b1} ${PL}H${b0}Z" fill="${mix(m,-.55)}"/>
    <path d="M0 0L${b0} ${PL}V${FOND}L0 ${RH}Z" fill="${mix(m,-.3)}"/>
    <path d="M${w} 0L${b1} ${PL}V${FOND}L${w} ${RH}Z" fill="${mix(m,-.4)}"/>
    <path d="M${b0} ${FOND}H${b1}L${w} ${RH}H0Z" fill="url(#${id}s)"/>${motif}
    <path d="M${b0} ${FOND}H${b1}l3 4H${b0-3}Z" fill="#000" opacity=".16"/>
    <rect x="${b0}" y="${PL}" width="${b1-b0}" height="${FOND-PL}" fill="url(#${id}l)"/>
    <ellipse cx="${w/2}" cy="${RH-9}" rx="${w*.36}" ry="9" fill="url(#${id}p)"/>`;
}
const lampe = (w) => `<path d="M${w/2-9} ${PL}h18l-3 3h-12z" fill="#1c2035"/><rect x="${w/2-6}" y="${PL+3}" width="12" height="1.3" rx=".6" fill="#fff4d6"/>`;

/* ================= Petits objets ================= */
const ombre = (cx, cy, rx) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${Math.max(1.2, rx*.09)}" fill="#000" opacity=".28"/>`;
const FENETRE = (x,y,w,h) => `<rect x="${x-1.6}" y="${y-1.6}" width="${w+3.2}" height="${h+3.2}" rx="1.4" fill="#2a2f4d"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#101538"/>
  <path d="M${x} ${y+h}l${w*.3} ${-h*.35} ${w*.25} ${h*.12} ${w*.45} ${-h*.3}V${y+h}Z" fill="#1d2557"/>
  ${[[.2,.68],[.4,.6],[.56,.72],[.78,.55]].map(([a,b])=>`<rect x="${x+w*a}" y="${y+h*b}" width="1.3" height="1.3" fill="#ffd27a" opacity=".85"/>`).join('')}
  <rect x="${x+w/2-.6}" y="${y}" width="1.2" height="${h}" fill="#2a2f4d"/><rect x="${x-3}" y="${y+h+1}" width="${w+6}" height="1.8" rx=".8" fill="#6b739c"/>`;
const PLANTE = (x, y, s=.75) => `<g transform="translate(${x},${y}) scale(${s})">${ombre(0,0,7)}<path d="M-5 -10h10l-1.6 10h-6.8z" fill="#c26b45"/><path d="M-5 -10h10v2h-10z" fill="#d98a62"/>
  <path d="M0 -10q-10-4-9-16q6 5 9 16zM0 -10q3-14 11-17q0 10-11 17zM0 -10q-2-12 1-22q4 10-1 22z" fill="#3fae7a"/><path d="M0 -10q-2-12 1-22q1 11-1 22z" fill="#2d8a5e"/></g>`;
const CADRE = (x, y, w, h, c='#c9a46b', inner='#3a4a7a') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/><rect x="${x+1.4}" y="${y+1.4}" width="${w-2.8}" height="${h-2.8}" fill="${inner}"/>`;
const HORLOGE = (x, y) => `<circle cx="${x}" cy="${y}" r="4.2" fill="#e9edf8"/><circle cx="${x}" cy="${y}" r="4.2" fill="none" stroke="#2a2f4d" stroke-width="1"/><path d="M${x} ${y}v-2.6M${x} ${y}h2" stroke="#1a1a1a" stroke-width=".7"/>`;
const ECRAN = (x, y, w=13, h=9, c='#4aa3ff') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1" fill="#151a33"/><rect x="${x+1}" y="${y+1}" width="${w-2}" height="${h-2}" fill="${c}"/><path d="M${x+2} ${y+h-3}l${w*.2} -2 ${w*.2} 1.4 ${w*.25} -3" stroke="#e6f2ff" stroke-width=".6" fill="none"/><rect x="${x+w/2-1.2}" y="${y+h}" width="2.4" height="2.4" fill="#151a33"/>`;
const BUREAU = (x, y, w, coul='#c79a5f') => `<g>${ombre(x+w/2, y+11, w*.55)}<rect x="${x}" y="${y}" width="${w}" height="2.6" rx=".8" fill="${mix(coul,.15)}"/><rect x="${x}" y="${y+2.6}" width="${w}" height="1.4" fill="${mix(coul,-.25)}"/>
  <rect x="${x+1.6}" y="${y+4}" width="${w*.36}" height="7.6" fill="${mix(coul,-.12)}"/><rect x="${x+3}" y="${y+6.6}" width="${w*.36-3}" height=".8" fill="${mix(coul,-.38)}"/><rect x="${x+w-3}" y="${y+4}" width="1.8" height="7.6" fill="${mix(coul,-.3)}"/></g>`;

    <path d="M6 -42h18v12H6zM28 -42h22v12H28zM54 -42h16v12H54z" fill="#25305e"/><path d="M6 -42h8l-6 12H6zM28 -42h7l-6 12h-1z" fill="#fff" opacity=".18"/>
    <path d="M77 -43h7q4 0 7 3l11 12H77z" fill="#25305e"/><path d="M78 -43h5l-5 8z" fill="#fff" opacity=".2"/>
    <text transform="scale(-1,1)" x="-60" y="-21.8" font-family="Arial,sans-serif" font-weight="800" font-size="4.6" fill="#fff" letter-spacing=".6">POLICE</text>
    <rect x="73" y="-30" width="1.2" height="17" fill="#c9cede"/>
    <rect class="${alerte?'gyro':'gyro-off'}" x="40" y="-51" width="26" height="4.5" rx="2" fill="#3b7bff"/><rect x="44" y="-49.6" width="18" height="1.2" fill="#fff" opacity=".5"/>
    <rect x="105" y="-25" width="5" height="4" rx="1" fill="#fff6c9"/><rect x="0" y="-33" width="2" height="7" fill="#e53a3a"/>

    ${[22,88].map(c=>`<circle cx="${c}" cy="-6" r="9" fill="#161925"/><circle cx="${c}" cy="-6" r="5" fill="#aeb5c8"/><circle cx="${c}" cy="-6" r="2" fill="#5b6276"/>`).join('')}
  </g></g>`;
}

  }
  if (t === 'chef'){
    L.push(`<g><rect x="${IN+2}" y="${PL+3}" width="20" height="${F-PL+4}" fill="#5a3f27"/><rect x="${IN+20}" y="${PL+3}" width="2" height="${F-PL+4}" fill="#3f2b1a"/>

function bornes(t){ const s = salleDe(t); return [s.x+IN+5, s.x+s.w-IN-5]; }
function creerAgent(a){
  const el = document.createElement('div');
  el.className = 'ag'; el.dataset.id = a.id; if (a.chef) el.style.cursor='default';
  el.innerHTML = AG_SVG(SERVICES[a.salle].coul, a);
  return el;
}
function initAgents(){
  let id = 0;
  for (const [t,n] of Object.entries(DEPART)) for (let i=0;i<n;i++) {
    S.agents.push({ id:id++, salle:t, x:0, y:0, face:1, mode:'pause', minuteur:Math.random()*2, chemin:[], peau:PEAUX[(id*5)%PEAUX.length], cheveux:CHEVEUX[(id*3)%CHEVEUX.length], femme:id%3===0, voie:id%2 });
  }
  S.chef = { id:'chef', chef:true, salle:'chef', x:0, y:0, face:-1, mode:'pause', minuteur:1, chemin:[], peau:'#f2cba6', cheveux:'#5a3a22', femme:false, voie:1 };
}
const piedY = (t, voie) => salleDe(t).y + LANE[voie];
function placer(a){ const [l,r] = bornes(a.salle); a.x = l + Math.random()*(r-l); a.y = piedY(a.salle, a.voie); a.chemin=[]; a.mode='pause'; a.minuteur=Math.random()*2; if (a.cab){a.cab.remove();a.cab=null;} a.enAsc=false; }
function cheminVers(a, t){
  const [l,r] = bornes(t), tx = l + Math.random()*(r-l), ty = piedY(t, a.voie), C = [];
  if (Math.abs(a.y - ty) > 1) {
    const yQuai = a.y; // on reste sur sa ligne jusqu'à l'ascenseur
    C.push({ x:XP, y:yQuai, m:'marche' });
    C.push({ x:XP, y:ty, m:'ascenseur' });
  }
  C.push({ x:tx, y:ty, m:'marche' });
  a.chemin = C; a.mode = 'route';
}
const VIT = 26, VIT_ASC = 95;
function pas(a, dt){
  if (a.mode==='pause' || a.mode==='cafe' || a.mode==='radio') {
    a.minuteur -= dt;
    if (a.minuteur <= 0) {
      const r = Math.random();
      if (r < .55) { const [l,rr] = bornes(a.salle); a.chemin = [{ x:l+Math.random()*(rr-l), y:a.y, m:'marche' }]; a.mode='route'; }
      else if (r < .75 && !a.chef) { a.mode='cafe'; a.minuteur = 3 + Math.random()*2; }
      else if (r < .87 && !a.chef) { a.mode='radio'; a.minuteur = 2.6; }
      else { a.mode='pause'; a.minuteur = 1.2 + Math.random()*2.8; }
    }
    return;
  }
  const p = a.chemin[0];
  if (!p) { a.mode='pause'; a.minuteur = 1 + Math.random()*3; return; }
  if (p.m === 'ascenseur') {
    const d = p.y - a.y; a.y += Math.sign(d)*Math.min(Math.abs(d), VIT_ASC*dt); a.enAsc = true;
    if (Math.abs(p.y - a.y) < .5) { a.y = p.y; a.chemin.shift(); a.enAsc = false; }
  } else {
    const d = p.x - a.x; if (Math.abs(d) > .5) a.face = Math.sign(d);
    a.x += Math.sign(d)*Math.min(Math.abs(d), VIT*dt);
    if (Math.abs(p.x - a.x) < .5) { a.x = p.x; a.chemin.shift(); }
  }
}
function rendre(a){
  if (!a.el || a.tenu) return;
  const k = AG * (a.voie===0 && !a.enAsc ? .9 : 1);
  a.el.style.transform = `translate(${a.x-12}px,${a.y-40}px) scale(${k})`;
  a.el.style.transformOrigin = '50% 100%';
  a.el.style.zIndex = Math.round(10 + a.y);
  a.el.querySelector('.mir').style.transform = a.face < 0 ? 'scaleX(-1)' : '';
  const marche = a.mode==='route' && a.chemin[0] && a.chemin[0].m==='marche';
  a.el.classList.toggle('marche', marche);
  a.el.classList.toggle('cafe', a.mode==='cafe');
  a.el.classList.toggle('radio', a.mode==='radio');
  if (a.enAsc) { if (!a.cab) { a.cab = document.createElement('div'); a.cab.className='cabine'; bat.appendChild(a.cab); } a.cab.style.transform = `translate(${a.x-12}px,${a.y-34}px)`; a.cab.style.zIndex = Math.round(9 + a.y); }
  else if (a.cab) { a.cab.remove(); a.cab = null; }
}
let t0 = performance.now();
function boucle(t){
  const dt = Math.min(.05, (t - t0)/1000); t0 = t;
  for (const a of S.agents) if (!a.tenu) { pas(a, dt); rendre(a); }
  if (S.chef) { pas(S.chef, dt); rendre(S.chef); }
  requestAnimationFrame(boucle);
}

const fmt = (n) => n.toLocaleString('fr-BE').replace(/ /g,' ');
const nb = (t) => S.agents.filter(a=>a.salle===t).length;
function ipz(){ let s=22; for (const [t,v] of Object.entries(SERVICES)) if (v.besoin) s += 7*Math.min(1,nb(t)/v.besoin)*(t==='intervention'?1.4:1); return (s*(0.8+S.moral/300)).toFixed(1).replace('.',','); }
function hud(){ document.getElementById('v-budget').textContent = fmt(S.budget)+' €'; document.getElementById('v-moral').textContent = S.moral; document.getElementById('v-ipz').textContent = ipz(); }
function pop(k){ const el=document.getElementById('p-'+k); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function etat(){
  for (const s of G.salles) {
    const el = bat.querySelector(`.salle[data-t="${s.t}"]`), v = SERVICES[s.t], n = nb(s.t);

let tenu = null;
bat.addEventListener('pointerdown', e => {
  const el = e.target.closest('.ag'); if (!el || el.dataset.id==='chef') return; e.preventDefault();
  const a = S.agents.find(x=>String(x.id)===el.dataset.id); a.tenu = true;

  el.style.transformOrigin = '0 0'; el.style.transform = `scale(${k*1.2})`;

});

  if (!tenu) return;
  tenu.el.style.left = (e.clientX - 14*tenu.k)+'px'; tenu.el.style.top = (e.clientY - 38*tenu.k)+'px';
  bat.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));

  { id:'b5', t:'recherche', fond:'#63B0FF', ico:'📁', x:.3, act:'dossier' },
];
function bulles(){
  bat.querySelectorAll('.bulle').forEach(b=>b.remove());
  for (const b of S.bulles) {
    const s = salleDe(b.t); if (!s) continue;
    const el = document.createElement('button'); el.type='button'; el.className='bulle'; el.dataset.b=b.id;
    el.style.background = b.fond; el.style.left = (s.x + s.w*b.x)+'px'; el.style.top = (s.y + 18)+'px';
    el.innerHTML = b.ico + (b.n?`<span class="pastille">${b.n}</span>`:'');
    el.setAttribute('aria-label', {amendes:'Récolter les amendes',courrier:'Ouvrir le courrier',incident:'Incident',gav:'Le gardé à vue veut parler',dossier:'Dossier bouclé'}[b.act]);
    bat.appendChild(el);
  }
}
function gyro(on){ const v = bat.querySelector('#van'); if (!v) return; v.classList.toggle('alerte', on); const r = v.querySelector('rect[class^="gyro"]'); if (r) r.setAttribute('class', on?'gyro':'gyro-off'); }
function volVers(depuis, cible, ico, n){
  const r = depuis.getBoundingClientRect(), t = document.getElementById(cible).getBoundingClientRect();
  for (let i=0;i<n;i++){ const s=document.createElement('span'); s.className='vol'; s.textContent=ico; s.style.left=(r.left+8)+'px'; s.style.top=(r.top+8)+'px'; document.body.appendChild(s);
    setTimeout(()=>{ s.style.transform=`translate(${t.left-r.left+i*4}px,${t.top-r.top}px) scale(.6)`; s.style.opacity='.2'; },30+i*90); setTimeout(()=>s.remove(),900+i*90); }
}
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function retirer(id){ S.bulles = S.bulles.filter(b=>b.id!==id); bulles(); if (id==='b3') gyro(false); }
function courrier(){
  const v = document.createElement('div'); v.className='voile';
  v.innerHTML = `<div class="choix" role="dialog" aria-label="Courrier"><div class="qui"><span class="av">🛍️</span><span class="q">La braderie de samedi : quatre agents en tenue ?</span></div>
    <div class="opts"><button type="button" class="non" data-r="non">Une patrouille<small>Satisfaction −</small></button><button type="button" class="oui" data-r="oui">Quatre agents<small>Satisfaction + · Moral −</small></button></div></div>`;
  v.addEventListener('click', e => { const b=e.target.closest('[data-r]'); if (!b && e.target!==v) return; v.remove(); if (!b) return;
    if (b.dataset.r==='oui'){ S.moral-=2; pop('moral'); toast('Signé · la présidente des commerçants te remercie'); } else toast('Signé · une patrouille passera samedi'); retirer('b2'); hud(); });
  document.body.appendChild(v);
}
bat.addEventListener('click', e => {
  const el = e.target.closest('.bulle'); if (!el) return; const b = S.bulles.find(x=>x.id===el.dataset.b);
  if (b.act==='amendes'){ volVers(el,'p-budget','💶',6); setTimeout(()=>{ S.budget+=1900; hud(); pop('budget'); },700); retirer(b.id); }
  if (b.act==='dossier'){ volVers(el,'p-budget','💶',3); setTimeout(()=>{ S.budget+=800; S.moral+=1; hud(); pop('budget'); pop('moral'); },700); toast('Dossier bouclé par la Recherche'); retirer(b.id); }
  if (b.act==='courrier') courrier();
  if (b.act==='incident'){ toast('Colis suspect → le mini-jeu s’ouvre ici'); retirer(b.id); }
  if (b.act==='gav'){ volVers(el,'tab-enq','📄',1); setTimeout(()=>{ const t=document.getElementById('tab-enq'); if(!t.querySelector('.badge')) t.insertAdjacentHTML('beforeend','<span class="badge">1</span>'); },700); toast('Le gardé à vue a parlé : nouvelle pièce d’enquête'); retirer(b.id); }
});
let nuitEnCours = false;
document.getElementById('nuit').addEventListener('click', () => {
  if (nuitEnCours) return; nuitEnCours = true;
  S.bulles = []; bulles();
  document.getElementById('nuitvoile').classList.add('on');
  gyro(true); const van = bat.querySelector('#van'); if (van) van.classList.add('sort');
  toast('20:00 · la patrouille de nuit sort');
  setTimeout(() => { const v = bat.querySelector('#van'); if (v) v.classList.remove('sort'); }, 2700);
  setTimeout(() => {
    document.getElementById('nuitvoile').classList.remove('on');
    S.bulles = BULLES.filter(b => salleDe(b.t)).map(b=>({...b})); bulles(); gyro(true);
    toast(`Matin · ${S.bulles.length} résultats de la nuit à récolter`); nuitEnCours = false;
  }, 4800);
});

/* ================= Niveaux ================= */
document.querySelectorAll('[data-niv]').forEach(b => b.addEventListener('click', () => {
  S.niv = +b.dataset.niv;
  document.querySelectorAll('[data-niv]').forEach(x=>x.setAttribute('aria-pressed', x===b));
  if (S.niv===1) S.bulles = S.bulles.filter(x=>x.t!=='cachots');
  dessiner(); for (const a of S.agents) placer(a); placer(S.chef);
  toast(['', 'Niveau 1 · commissariat de départ', 'Niveau 2 · cachots ouverts, services équipés', 'Niveau 3 · nouvel étage : stand de tir et cellule drone'][S.niv]);
}));

initAgents();
S.bulles = BULLES.filter(b=>b.t!=='cachots').map(b=>({...b}));
plan(); dessiner(); for (const a of S.agents) placer(a); placer(S.chef);
window.addEventListener('resize', echelle);
requestAnimationFrame(boucle);
</script>
</body>
</html>
