<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commissariat illustré (démo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Démo : illustration Gemini en fond, agents animés en code par-dessus. Thème nuit unique du jeu. */
:root{
  color-scheme:dark;
  --bg:#0a0e22; --s1:#151b38; --s3:#27305a; --hair:rgba(190,205,255,.1);
  --text:#EDF0FA; --muted:#98a2c4; --amber:#FFB23F; --amber-ink:#241400; --green:#3DD39A; --red:#FF6E6A;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--body);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding:0 0 80px}
.demo{text-align:center;padding:7px 10px;background:#070a1a;border-bottom:1px solid var(--hair);font-size:11.5px;color:#E9C894;font-weight:700}
.demo button{margin-left:6px;padding:5px 10px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:12px;font-weight:800}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:6px;align-items:center;padding:8px 10px;background:linear-gradient(var(--bg) 70%,rgba(10,14,34,0))}
.pill{display:flex;align-items:center;gap:6px;background:rgba(21,27,56,.94);border:1px solid var(--hair);border-radius:99px;padding:5px 10px 5px 6px;font-size:13px;font-weight:700}
.pill b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.pill.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.18);background:var(--s3)}}
.valider{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;background:var(--amber);color:var(--amber-ink);border-radius:12px;padding:5px 10px;font-weight:800;font-size:12.5px;line-height:1.15}
.valider small{font-weight:700;font-size:10px;opacity:.75}

.scene{position:relative;width:100%;overflow:hidden}
.plateau{position:absolute;left:0;top:0;width:1186px;height:768px;transform-origin:0 0;background-repeat:no-repeat;background-position:-95px 0;background-size:1376px 768px}
.nuit{position:absolute;inset:0;background:rgba(3,5,22,0);transition:background 1s;pointer-events:none;z-index:900}
.nuit.on{background:rgba(3,5,22,.55)}
.zone{position:absolute;border-radius:6px;transition:box-shadow .25s}
.zone.ok::after,.zone.manque::after{content:"";position:absolute;left:14px;right:14px;bottom:-4px;height:6px;border-radius:4px}
.zone.ok::after{background:var(--green);box-shadow:0 0 16px var(--green)}
.zone.manque::after{background:var(--amber);box-shadow:0 0 16px var(--amber)}
.zone.drop{box-shadow:inset 0 0 0 7px var(--amber),inset 0 0 60px rgba(255,178,63,.35)}
.etiq{position:absolute;left:8px;top:8px;z-index:800;display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:rgba(8,11,28,.78);padding:4px 12px 4px 9px;border-radius:12px;color:#eef1fb;pointer-events:none;white-space:nowrap}
.etiq i{width:12px;height:12px;border-radius:50%}
.etiq .c{font-size:20px;letter-spacing:0;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.16)}
.zone.ok .etiq .c{background:var(--green);color:#062417}
.zone.manque .etiq .c{background:var(--amber);color:var(--amber-ink)}
.enseigne{position:absolute;left:437px;top:22px;width:313px;height:60px;display:grid;place-items:center;z-index:800;pointer-events:none;text-align:center;line-height:1}
.enseigne b{font:800 38px var(--display);letter-spacing:6px;color:#16306e;text-shadow:0 0 18px rgba(255,255,255,.6)}
.enseigne small{display:block;font:800 13px var(--body);letter-spacing:3px;color:#3b5aa8;margin-bottom:3px}
.ipz{position:absolute;left:593px;top:92px;transform:translateX(-50%);z-index:850;display:flex;align-items:center;gap:12px;background:rgba(8,11,28,.86);border:2px solid rgba(99,176,255,.4);border-radius:99px;padding:5px 18px;font-size:20px;font-weight:700;white-space:nowrap}
.ipz .barre{width:110px;height:10px;border-radius:6px;background:#27305a;position:relative;overflow:hidden}
.ipz .barre i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#63B0FF,var(--green));transition:width .4s}

.ag{position:absolute;left:0;top:0;transform-origin:50% 100%;touch-action:none;cursor:grab;will-change:transform;background-repeat:no-repeat;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.ag.fixe{cursor:default}
.ag.tient{position:fixed;pointer-events:none;filter:drop-shadow(0 12px 10px rgba(0,0,0,.5))}
.fg{position:absolute;pointer-events:none;display:block}
.cabine{position:absolute;left:0;top:0;width:96px;height:140px;border-radius:6px;background:linear-gradient(90deg,#b9c3d6,#eef2f8 50%,#b9c3d6);border:4px solid #8e98ad;box-shadow:0 0 30px rgba(255,240,200,.35);will-change:transform}
.bulle{position:absolute;z-index:1000;width:64px;height:64px;margin-left:-32px;border-radius:50%;display:grid;place-items:center;font-size:32px;box-shadow:0 8px 20px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.18);animation:flotte 1.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-8px)}}
.bulle .n{position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;border-radius:99px;background:#fff;color:#111;font:800 17px var(--body);display:grid;place-items:center;padding:0 6px}
.vol{position:fixed;z-index:2100;font-size:20px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s}
.gyro{position:absolute;left:388px;top:584px;width:46px;height:12px;border-radius:6px;z-index:700;pointer-events:none;mix-blend-mode:screen;animation:gyro .45s steps(1) infinite;box-shadow:0 0 30px 12px currentColor}
@keyframes gyro{0%{background:#3b7bff;color:#3b7bff}50%{background:#ff3d5a;color:#ff3d5a}}

.voile{position:fixed;inset:0;z-index:3000;background:rgba(3,5,12,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.choix{width:100%;max-width:430px;background:#F4EFE3;color:#1D1A15;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
.choix .qui{display:flex;gap:10px;align-items:center}
.choix .av{width:46px;height:46px;border-radius:50%;background:#2a3350;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.choix .q{font:800 18px/1.2 var(--display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opts .non{background:#e3dac6} .opts .oui{background:#1D1A15;color:#F4EFE3}
.opts small{font-weight:600;font-size:11.5px;opacity:.8}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:3500;background:var(--s3);border:1px solid #3a4680;border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;max-width:90vw;text-align:center;animation:monte .2s}
.aide{font-size:12.5px;color:var(--muted);text-align:center;padding:10px 16px 0;line-height:1.45}
.aide b{color:var(--text)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:2500;background:rgba(12,16,38,.95);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:10.5px;color:#67719A}
nav.tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs span i{font-style:normal;font-size:18px}
nav.tabs span.on{color:var(--amber)}
nav.tabs .badge{position:absolute;top:-2px;left:56%;background:var(--red);color:#fff;font:800 10px var(--body);border-radius:99px;padding:0 5px}
@media (prefers-reduced-motion:reduce){.bulle,.gyro,.ag .corps{animation:none!important}}
</style>
</head>
<body>
<div class="demo">DÉMO · fond illustré par Gemini, agents animés en code — rien n'est en ligne <button type="button" id="nuitbtn">Passer 20:00</button></div>
<div class="app">
  <div class="hud">
    <span class="pill" id="p-budget"><b style="background:#2f6b4f">€</b><span id="v-budget"></span></span>
    <span class="pill" id="p-moral"><b style="background:#6b4f2f">♥</b><span id="v-moral"></span></span>
    <span class="valider">Valider ma journée<small>tour dans 5 h 12</small></span>
  </div>
  <div class="scene" id="scene"><div class="plateau" id="pl"></div></div>
  <p class="aide" id="aide">Touche les <b>bulles</b> pour récolter la nuit. <b>Glisse un agent</b> d'une pièce à l'autre : il prend l'ascenseur et va à un poste libre.</p>
</div>
<nav class="tabs" aria-label="Onglets du jeu"><div class="in">
  <span class="on"><i>🏛</i>Commissariat</span><span id="tab-enq"><i>🔎</i>Enquête</span><span><i>🧩</i>Énigmes</span><span><i>🗺</i>Carte</span><span><i>📻</i>Radio</span>
</div></nav>

/* ===== Agents ===== */
const rnd = (a,b) => a + Math.random()*(b-a);
function creer(a){ const el = document.createElement('div'); el.className = 'ag' + (a.chef||a.det ? ' fixe' : ''); el.dataset.id = a.id; el.style.backgroundImage = `url("${A.atlas}")`; return el; }
function posteLibre(t, a){ return (POSTES[t] || []).find(q => !q.chef && !q.det && !S.agents.some(b => b !== a && b.poste === q)); }
function vers(a, t){
  a.poste = posteLibre(t, a) || null;
  const p = PIECES[t], tx = a.poste ? a.poste.x : rnd(p.l, p.r), ty = a.poste ? a.poste.y : p.sol - rnd(0,5), C = [];
  if (Math.abs(a.y - ty) > 30) C.push({ x:ASC, y:a.y, m:'marche' }, { x:ASC, y:ty, m:'asc' });
  C.push({ x:tx, y:ty, m:'marche' }); a.chemin = C; a.mode = 'route';
}
function errer(a){ const p = PIECES[a.p]; a.chemin = [{ x:rnd(p.l,p.r), y:a.y, m:'marche' }]; a.mode = 'route'; }
const VIT = 75, VASC = 260;
function pas(a, dt){
  a.tf = (a.tf || 0) + dt;
  if (a.mode !== 'route') {
    if (a.poste) return;                 // au poste : il travaille
    a.t -= dt; if (a.t <= 0) { if (Math.random() < .6) errer(a); else { a.mode = 'pause'; a.t = rnd(2,5); } }
    return;
  }
  const c = a.chemin[0]; if (!c) { a.mode = 'pause'; a.t = rnd(2,5); if (a.poste) a.face = a.poste.pose === 'type' ? 1 : a.face; return; }
  if (c.m === 'asc') { const d = c.y - a.y; a.y += Math.sign(d)*Math.min(Math.abs(d), VASC*dt); a.asc = true; if (Math.abs(c.y-a.y) < 1) { a.y = c.y; a.chemin.shift(); a.asc = false; } }
  else { const d = c.x - a.x; if (Math.abs(d) > 1) a.face = Math.sign(d); a.x += Math.sign(d)*Math.min(Math.abs(d), VIT*dt); if (Math.abs(c.x-a.x) < 1) { a.x = c.x; a.chemin.shift(); } }
}
function poseDe(a){
  if (a.mode === 'route' && a.chemin[0] && a.chemin[0].m === 'marche') return 'walk';
  if (a.asc) return 'talk';
  return a.poste ? a.poste.pose : 'talk';
}
function rendre(a){
  if (!a.el || a.tenu) return;
  const pose = poseDe(a), m = M[pose], seq = ANIM[pose][(a.var || 0) % ANIM[pose].length];
  const fr = pose === 'talk' && !a.poste && a.mode !== 'route' ? seq[seq.length-1] : seq[Math.floor(a.tf * FPS[pose]) % seq.length];
  const [fx, fy] = m.f[fr], k = ECH[pose];
  const el = a.el;
  el.style.width = m.w+'px'; el.style.height = m.h+'px'; el.style.backgroundPosition = `-${fx}px -${fy}px`;
  const face = pose === 'type' || pose === 'det' || (pose === 'talk' && a.poste) ? 1 : a.face;
  el.style.transform = `translate(${a.x - m.w/2}px,${a.y - m.h}px) scale(${face < 0 ? -k : k},${k})`;
  const der = a.poste && a.poste.der && a.mode !== 'route';
  el.style.zIndex = der ? FG_Z[a.poste.der] - 2 : Math.round(a.y) + 20;
  if (a.asc) { if (!a.cab) { a.cab = document.createElement('div'); a.cab.className = 'cabine'; pl.appendChild(a.cab); } a.cab.style.transform = `translate(${ASC-48}px,${a.y-132}px)`; a.cab.style.zIndex = Math.round(a.y); }
  else if (a.cab) { a.cab.remove(); a.cab = null; }
}

let id = 0;
for (const [t,n] of Object.entries(DEPART)) for (let i=0;i<n;i++) {
  const a = { id:id++, p:t, var:id, face:1 }; const p = PIECES[t];
  a.poste = posteLibre(t, a) || null; a.x = a.poste ? a.poste.x : rnd(p.l,p.r); a.y = a.poste ? a.poste.y : p.sol - rnd(0,5); a.mode='pause'; a.t = rnd(0,3); a.chemin=[]; a.tf = rnd(0,3);
  S.agents.push(a);
}
const pc = POSTES.chef[0], pd = POSTES.cachots[0];
S.agents.push({ id:'chef', p:'chef', chef:true, poste:pc, x:pc.x, y:pc.y, face:1, mode:'pause', chemin:[], var:0, tf:0 });
S.agents.push({ id:'det', p:'cachots', det:true, poste:pd, x:pd.x, y:pd.y, face:1, mode:'pause', chemin:[], var:0, tf:0 });

let t0 = performance.now();
(function boucle(t){ const dt = Math.max(0, Math.min(.05,(t-t0)/1000)); t0 = t; for (const a of S.agents) if (!a.tenu) { pas(a,dt); rendre(a); } requestAnimationFrame(boucle); })(t0);

/* ===== Glisser ===== */
let tenu = null;
pl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.ag'); if (!el || el.classList.contains('fixe')) return; e.preventDefault();
  const a = S.agents.find(x => String(x.id) === el.dataset.id); a.tenu = true; a.poste = null; if (a.cab) { a.cab.remove(); a.cab = null; a.asc = false; }
  const k = pl.getBoundingClientRect().width / W, m = M.walk;
  el.classList.add('tient'); el.style.transformOrigin = '0 0'; el.style.width = m.w+'px'; el.style.height = m.h+'px';
  el.style.backgroundPosition = `-${m.f[0][0]}px -${m.f[0][1]}px`; el.style.transform = `scale(${k*.8*1.25})`;
  document.body.appendChild(el); tenu = { a, el, k }; bouge(e);
});
function bouge(e){
  if (!tenu) return;
  tenu.el.style.left = (e.clientX - M.walk.w*.5*tenu.k)+'px'; tenu.el.style.top = (e.clientY - M.walk.h*.7*tenu.k)+'px';
  pl.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  const z = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('zone'));
  tenu.cible = z && PLACABLES.includes(z.dataset.p) ? z.dataset.p : null; if (tenu.cible) z.classList.add('drop');
}
window.addEventListener('pointermove', bouge);
window.addEventListener('pointerup', () => {
  if (!tenu) return; const { a, el, cible } = tenu; tenu = null;
  pl.querySelectorAll('.drop').forEach(x => x.classList.remove('drop'));
  el.classList.remove('tient'); el.style.left = el.style.top = ''; el.style.transformOrigin = '50% 100%'; pl.appendChild(el); a.tenu = false;
  vers(a, cible || a.p); if (cible && cible !== a.p) { a.p = cible; }
  etat();
});
/* ===== Bulles et nuit ===== */
const BULLES0 = [
  { id:'b1', p:'roulage', fond:'#F2D04B', ico:'💶', n:3, x:.18, act:'amendes' },
  { id:'b2', p:'accueil', fond:'#F4EFE3', ico:'✉️', x:.2, act:'courrier' },
  { id:'b3', p:'intervention', fond:'#FF6E6A', ico:'🚨', x:.84, act:'incident' },
  { id:'b4', p:'cachots', fond:'#B79BFF', ico:'💬', x:.5, act:'gav' },
  { id:'b5', p:'recherche', fond:'#63B0FF', ico:'📁', x:.62, act:'dossier' },
];
let BULLES = BULLES0.map(b => ({...b}));
function bulles(){
  pl.querySelectorAll('.bulle').forEach(b => b.remove());
  for (const b of BULLES) { const p = PIECES[b.p], el = document.createElement('button'); el.type='button'; el.className='bulle'; el.dataset.b=b.id;
    el.style.background = b.fond; el.style.left = (p.x + p.w*b.x)+'px'; el.style.top = (p.y + 44)+'px'; el.innerHTML = b.ico + (b.n?`<span class="n">${b.n}</span>`:'');
    el.setAttribute('aria-label', {amendes:'Récolter les amendes',courrier:'Ouvrir le courrier',incident:'Incident',gav:'Le gardé à vue veut parler',dossier:'Dossier bouclé'}[b.act]); pl.appendChild(el); }
  const g = document.getElementById('gyro'); if (g) g.hidden = !BULLES.some(b => b.act === 'incident');
}
function volVers(depuis, cible, ico, n){ const r = depuis.getBoundingClientRect(), t = document.getElementById(cible).getBoundingClientRect();
  for (let i=0;i<n;i++){ const s=document.createElement('span'); s.className='vol'; s.textContent=ico; s.style.left=(r.left+r.width/3)+'px'; s.style.top=(r.top+r.height/3)+'px'; document.body.appendChild(s);
    setTimeout(()=>{ s.style.transform=`translate(${t.left-r.left+i*4}px,${t.top-r.top}px) scale(.6)`; s.style.opacity='.2'; },30+i*90); setTimeout(()=>s.remove(),900+i*90); } }
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function retirer(id){ BULLES = BULLES.filter(b => b.id !== id); bulles(); if (!BULLES.length) document.getElementById('aide').innerHTML = 'La nuit est récoltée. <b>Rien d’autre à lire.</b> Place tes agents et reviens après 20:00.'; }
function courrier(){
  const v = document.createElement('div'); v.className='voile';
  v.innerHTML = `<div class="choix" role="dialog" aria-label="Courrier"><div class="qui"><span class="av">🛍️</span><span class="q">La braderie de samedi : quatre agents en tenue ?</span></div>
    <div class="opts"><button type="button" class="non" data-r="non">Une patrouille<small>Satisfaction −</small></button><button type="button" class="oui" data-r="oui">Quatre agents<small>Satisfaction + · Moral −</small></button></div></div>`;
  v.addEventListener('click', e => { const b=e.target.closest('[data-r]'); if (!b && e.target!==v) return; v.remove(); if (!b) return;
    if (b.dataset.r==='oui'){ S.moral-=2; pop('moral'); toast('Signé · la présidente des commerçants te remercie'); } else toast('Signé · une patrouille passera samedi'); retirer('b2'); hud(); });
  document.body.appendChild(v);
}
pl.addEventListener('click', e => {
  const el = e.target.closest('.bulle'); if (!el) return; const b = BULLES.find(x => x.id === el.dataset.b);
  if (b.act==='amendes'){ volVers(el,'p-budget','💶',6); setTimeout(()=>{ S.budget+=1900; hud(); pop('budget'); },700); retirer(b.id); }
  if (b.act==='dossier'){ volVers(el,'p-budget','💶',3); setTimeout(()=>{ S.budget+=800; S.moral+=1; hud(); pop('budget'); pop('moral'); },700); toast('Dossier bouclé par la Recherche'); retirer(b.id); }
  if (b.act==='courrier') courrier();
  if (b.act==='incident'){ toast('Colis suspect → le mini-jeu s’ouvre ici'); retirer(b.id); }
  if (b.act==='gav'){ volVers(el,'tab-enq','📄',1); setTimeout(()=>{ const t=document.getElementById('tab-enq'); if(!t.querySelector('.badge')) t.insertAdjacentHTML('beforeend','<span class="badge">1</span>'); },700); toast('Le gardé à vue a parlé : nouvelle pièce d’enquête'); retirer(b.id); }
});
let enNuit = false;
document.getElementById('nuitbtn').addEventListener('click', () => {
  if (enNuit) return; enNuit = true; BULLES = []; bulles();
  document.getElementById('voile').classList.add('on'); document.getElementById('gyro').hidden = false;
  const sortants = S.agents.filter(a => a.p === 'intervention' && !a.tenu).slice(0, 3);
  for (const a of sortants) { a.poste = null; a.chemin = [{ x:-60, y:a.y, m:'marche' }]; a.mode = 'route'; }
  toast('20:00 · la patrouille de nuit sort');
  setTimeout(() => { for (const a of sortants) { a.x = -40; vers(a, 'intervention'); } }, 3200);
  setTimeout(() => { document.getElementById('voile').classList.remove('on'); BULLES = BULLES0.map(b => ({...b})); bulles(); toast('Matin · 5 résultats de la nuit à récolter'); enNuit = false; }, 5200);
});
window.addEventListener('resize', echelle);
echelle(); dessiner();
</script>
