/* Démo : l'illustration néo-polar sert de plateau, le jeu pose agents, compteurs et bulles par-dessus. Thème sombre unique. */
:root{
  color-scheme:dark;
  --bg:#070b16; --s1:#121a2e; --s3:#24304f; --line:#2b3757; --hair:rgba(190,205,255,.1);
  --text:#EDF0FA; --muted:#97a2bf; --amber:#FFB23F; --amber-ink:#241400; --green:#3DD39A; --red:#FF6E6A; --blue:#63B0FF; --violet:#B79BFF; --yellow:#F2D04B;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--body);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{max-width:460px;margin:0 auto;padding:0 0 76px}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:6px;align-items:center;padding:8px 10px;background:linear-gradient(var(--bg) 75%,rgba(7,11,22,0))}
.pill{display:flex;align-items:center;gap:5px;background:rgba(18,26,46,.92);border:1px solid var(--hair);border-radius:99px;padding:5px 10px 5px 7px;font-size:13px;font-weight:700}
.pill i{font-style:normal}
.pill.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.2);background:var(--s3)}}
.tour{margin-left:auto;text-align:right;font-size:10.5px;color:var(--muted);line-height:1.1}
.tour b{display:block;font:800 16px var(--display);color:var(--amber)}

.piece{position:absolute;border-radius:4px;transition:box-shadow .25s}
.piece.ok{box-shadow:inset 0 0 0 2px rgba(61,211,154,.7),inset 0 0 22px rgba(61,211,154,.18)}
.piece.manque{box-shadow:inset 0 0 0 2px rgba(255,178,63,.55)}
.piece.drop{box-shadow:inset 0 0 0 3px var(--amber),inset 0 0 30px rgba(255,178,63,.3)}
.etiq{position:absolute;left:5px;top:5px;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(5,8,16,.72);backdrop-filter:blur(3px);padding:3px 7px 3px 6px;border-radius:7px;color:#e6eaf5;pointer-events:none}
.etiq i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.etiq .c{font-size:12px;letter-spacing:0;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.12)}
.piece.ok .etiq .c{background:var(--green);color:#062417}
.piece.manque .etiq .c{background:var(--amber);color:var(--amber-ink)}

/* Agents : silhouettes de polar, liseré de lumière et brassard du service */
.agent{position:absolute;bottom:7%;width:30px;height:46px;margin-left:-15px;touch-action:none;cursor:grab;z-index:2;transition:left .35s ease}
.agent svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 2px rgba(255,200,120,.55))}
.agent:hover svg{filter:drop-shadow(0 0 4px rgba(255,200,120,.95))}
.agent .sway{transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.5deg)}}
.agent.tient{position:fixed;z-index:60;bottom:auto;pointer-events:none;transition:none;transform:scale(1.35)}

.bulle{position:absolute;z-index:4;width:42px;height:42px;margin-left:-21px;border-radius:50%;display:grid;place-items:center;font-size:21px;box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 14px currentColor;animation:flotte 1.6s ease-in-out infinite}
.bulle.or{background:var(--yellow);color:rgba(242,208,75,.5)} .bulle.rouge{background:var(--red);color:rgba(255,110,106,.55)} .bulle.bleu{background:var(--blue);color:rgba(99,176,255,.5)} .bulle.violet{background:var(--violet);color:rgba(183,155,255,.5)} .bulle.blanc{background:#F4EFE3;color:rgba(244,239,227,.4)}
@keyframes flotte{50%{transform:translateY(-5px)}}
.pastille{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#fff;color:#111;font:800 11px var(--body);display:grid;place-items:center;padding:0 4px}
.vol{position:fixed;z-index:70;font-size:18px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s}

.voile{position:fixed;inset:0;z-index:80;background:rgba(3,5,12,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px}
.choix{width:100%;max-width:430px;background:#F4EFE3;color:#1D1A15;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(40px);opacity:0}}
.choix .qui{display:flex;gap:10px;align-items:center}
.choix .av{width:46px;height:46px;border-radius:50%;background:#2a3350;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.choix .q{font:800 18px/1.2 var(--display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opts .non{background:#e3dac6} .opts .oui{background:#1D1A15;color:#F4EFE3}
.opts small{font-weight:600;font-size:11.5px;opacity:.8}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:90;background:var(--s3);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;max-width:90vw;text-align:center;animation:monte .2s}
.aide{font-size:12px;color:var(--muted);text-align:center;line-height:1.45;padding:10px 16px 0}
.aide b{color:var(--text)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(10,15,30,.94);backdrop-filter:blur(10px);border-top:1px solid var(--hair);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:10.5px;color:#67719A}
nav.tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.tabs span i{font-style:normal;font-size:18px}
nav.tabs span.on{color:var(--amber)}
nav.tabs .badge{position:absolute;top:-2px;left:56%;background:var(--red);color:#fff;font:800 10px var(--body);border-radius:99px;padding:0 5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const PIECES = [
  { k:'chef',         nom:'Chef',         besoin:0, coul:'#FFB23F', x:14,  y:10.3, w:41.6, h:19.5 },
  { k:'recherche',    nom:'Recherche',    besoin:4, coul:'#63B0FF', x:57,  y:10.3, w:32.5, h:19.5 },
  { k:'proximite',    nom:'Proximité',    besoin:3, coul:'#3DD39A', x:14,  y:31.5, w:41.6, h:19.3 },
  { k:'accueil',      nom:'Accueil',      besoin:3, coul:'#B79BFF', x:57,  y:31.5, w:32.5, h:19.3 },
  { k:'intervention', nom:'Intervention', besoin:6, coul:'#FF6E6A', x:14,  y:52.7, w:41.6, h:19.5 },
  { k:'roulage',      nom:'Roulage',      besoin:2, coul:'#F2D04B', x:57,  y:52.7, w:32.5, h:19.5 },
  { k:'repos',        nom:'Repos',        besoin:0, coul:'#97a2bf', x:14,  y:74,   w:41.6, h:17.8 },
  { k:'cachots',      nom:'Cachots',      besoin:0, coul:'#97a2bf', x:58,  y:74,   w:31.5, h:17.8 },
];
const S = { budget:91900, moral:61, agents:[] };
const DEPART = { recherche:3, proximite:3, accueil:2, intervention:5, roulage:2, repos:5 };
let id = 0; for (const [k,n] of Object.entries(DEPART)) for (let i=0;i<n;i++) S.agents.push({ id:id++, p:k });
let BULLES = [
  { id:'b1', p:'roulage', cl:'or', ico:'💶', n:3, x:30, act:'amendes' },
  { id:'b2', p:'accueil', cl:'blanc', ico:'✉️', x:55, act:'courrier' },
  { id:'b3', p:'intervention', cl:'rouge', ico:'🚨', x:78, act:'incident' },
  { id:'b4', p:'cachots', cl:'violet', ico:'💬', x:50, act:'gav' },
  { id:'b5', p:'recherche', cl:'bleu', ico:'📁', x:20, act:'dossier' },
];
const fmt = (n) => n.toLocaleString('fr-BE').replace(/ /g,' ');
const nb = (k) => S.agents.filter(a=>a.p===k).length;
function ipz(){ let s=22; for (const p of PIECES) if (p.besoin) s += 7*Math.min(1,nb(p.k)/p.besoin)*(p.k==='intervention'?1.4:1); return (s*(0.8+S.moral/300)).toFixed(1).replace('.',','); }
function hud(){ v('budget', fmt(S.budget)+' €'); v('moral', S.moral); v('ipz', ipz()); }
function v(k,t){ document.getElementById('v-'+k).textContent = t; }
function pop(k){ const el=document.getElementById('p-'+k); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

const AGENT = (c) => `<svg viewBox="0 0 30 46" aria-hidden="true"><g class="sway"><ellipse cx="15" cy="45" rx="9" ry="2" fill="rgba(0,0,0,.55)"/><path d="M9 27h5v17H9zM16 27h5v17h-5z" fill="#0b1020"/><path d="M6 15q0-4 4-4h10q4 0 4 4v14H6z" fill="#141c33"/><path d="M6 19h18v3H6z" fill="${c}"/><path d="M24 15q0-4-4-4" stroke="#f3c27a" stroke-width="1.2" fill="none" opacity=".8"/><circle cx="15" cy="7.5" r="4.6" fill="#c99a78"/><path d="M8.5 5.5h13l-1.4-4.2h-10.2z" fill="#0b1433"/><path d="M8 5h14v1.8H8z" fill="#050a1c"/><circle cx="15" cy="3.2" r=".9" fill="#d9b25a"/></g></svg>`;

const pl = document.getElementById('plateau');
function dessiner(){
  pl.innerHTML = PIECES.map(p => `<div class="piece" data-p="${p.k}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%">
      <span class="etiq"><i style="background:${p.coul}"></i>${p.nom}${p.besoin?` <span class="c" data-c="${p.k}"></span>`:''}</span></div>`).join('');
  for (const p of PIECES) {
    const el = pl.querySelector(`[data-p="${p.k}"]`), l = S.agents.filter(a=>a.p===p.k), n = l.length;
    l.forEach((a,i) => { const d=document.createElement('div'); d.className='agent'; d.dataset.id=a.id; d.style.left = (n===1?50:12 + i*(76/Math.max(1,n-1)))+'%'; d.innerHTML=AGENT(p.coul); el.appendChild(d); });
    if (p.besoin) { el.classList.toggle('ok', n>=p.besoin); el.classList.toggle('manque', n<p.besoin); el.querySelector('.c').textContent = `${n}/${p.besoin}`; }
  }
  for (const b of BULLES) {
    const el = document.createElement('button'); el.type='button'; el.className='bulle '+b.cl; el.dataset.b=b.id;
    el.style.left = b.x+'%'; el.style.top = '30%';
    el.innerHTML = b.ico + (b.n?`<span class="pastille">${b.n}</span>`:'');
    el.setAttribute('aria-label', {amendes:'Récolter les amendes',courrier:'Ouvrir le courrier',incident:'Incident',gav:'Le gardé à vue veut parler',dossier:'Dossier bouclé'}[b.act]);
    pl.querySelector(`[data-p="${b.p}"]`).appendChild(el);
  }
  hud();
}

// Glisser un agent
let drag = null;
pl.addEventListener('pointerdown', e => {
  const el = e.target.closest('.agent'); if (!el) return; e.preventDefault();
  const r = el.getBoundingClientRect();
  drag = { el, a:S.agents.find(x=>x.id==el.dataset.id), dx:e.clientX-r.left, dy:e.clientY-r.top };
  document.body.appendChild(el); el.classList.add('tient'); bouge(e);
});
function bouge(e){
  if (!drag) return;
  drag.el.style.left = (e.clientX-drag.dx+15)+'px'; drag.el.style.top = (e.clientY-drag.dy)+'px';
  pl.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  const t = document.elementFromPoint(e.clientX,e.clientY); const p = t && t.closest('.piece');
  drag.cible = p && !['chef','cachots'].includes(p.dataset.p) ? p.dataset.p : null;
  if (drag.cible) p.classList.add('drop');
}
window.addEventListener('pointermove', bouge);
window.addEventListener('pointerup', () => {
  if (!drag) return; const { a, cible } = drag; drag.el.remove(); drag = null;
  if (cible && cible!==a.p) { a.p = cible; pop('ipz'); }
  dessiner();
});

// Bulles
function volVers(depuis, cible, ico, n){
  const r = depuis.getBoundingClientRect(), t = document.getElementById(cible).getBoundingClientRect();
  for (let i=0;i<n;i++){ const s=document.createElement('span'); s.className='vol'; s.textContent=ico; s.style.left=(r.left+10)+'px'; s.style.top=(r.top+10)+'px'; document.body.appendChild(s);
    setTimeout(()=>{ s.style.transform=`translate(${t.left-r.left+i*4}px,${t.top-r.top}px) scale(.6)`; s.style.opacity='.2'; },30+i*90); setTimeout(()=>s.remove(),900+i*90); }
}
function toast(t){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2400); }
function retirer(id){ BULLES = BULLES.filter(b=>b.id!==id); dessiner(); if (!BULLES.length) document.getElementById('aide').innerHTML='La nuit est récoltée. <b>Rien d’autre à lire.</b> Place tes agents et reviens après 20:00.'; }
function courrier(){
  const v = document.createElement('div'); v.className='voile';
  v.innerHTML = `<div class="choix" role="dialog" aria-label="Courrier"><div class="qui"><span class="av">🛍️</span><span class="q">La braderie de samedi : quatre agents en tenue ?</span></div>
    <div class="opts"><button type="button" class="non" data-r="non">Une patrouille<small>Satisfaction −</small></button><button type="button" class="oui" data-r="oui">Quatre agents<small>Satisfaction + · Moral −</small></button></div></div>`;
  v.addEventListener('click', e => { const b=e.target.closest('[data-r]'); if (!b && e.target!==v) return; v.remove(); if (!b) return;
    if (b.dataset.r==='oui'){ S.moral-=2; pop('moral'); toast('Signé · la présidente des commerçants te remercie'); } else toast('Signé · une patrouille passera samedi'); retirer('b2'); });
  document.body.appendChild(v);
}
pl.addEventListener('click', e => {
  const el = e.target.closest('.bulle'); if (!el) return; const b = BULLES.find(x=>x.id===el.dataset.b);
  if (b.act==='amendes'){ volVers(el,'p-budget','💶',6); setTimeout(()=>{ S.budget+=1900; hud(); pop('budget'); },700); retirer(b.id); }
  if (b.act==='dossier'){ volVers(el,'p-budget','💶',3); setTimeout(()=>{ S.budget+=800; S.moral+=1; hud(); pop('budget'); pop('moral'); },700); toast('Dossier bouclé par la Recherche'); retirer(b.id); }
  if (b.act==='courrier') courrier();
  if (b.act==='incident'){ toast('Colis suspect → le mini-jeu s’ouvre ici'); retirer(b.id); }
  if (b.act==='gav'){ volVers(el,'tab-enq','📄',1); setTimeout(()=>{ const t=document.getElementById('tab-enq'); if(!t.querySelector('.badge')) t.insertAdjacentHTML('beforeend','<span class="badge">1</span>'); },700); toast('Le gardé à vue a parlé : nouvelle pièce d’enquête'); retirer(b.id); }
});
dessiner();
</script>
</body>
</html>
