<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Crochetage SER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}


.lockview{position:relative;flex:1;min-height:190px;border-radius:24px;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 35%,rgba(242,181,68,.07),transparent 70%),linear-gradient(180deg,#151c28,#0f141d);
  box-shadow:inset 0 0 0 1px var(--stroke),inset 0 1px 0 rgba(255,255,255,.05)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;left:14px;top:12px;display:flex;gap:5px}
.pins i{width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .2s}
.pins i.on{background:var(--ok);box-shadow:0 0 8px rgba(70,217,138,.6)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:clamp(160px,30vh,236px);margin-bottom:env(safe-area-inset-bottom,0px)}
.pad{position:relative;border-radius:22px;background:var(--surface);border:1px solid var(--stroke);touch-action:none;overflow:hidden;transition:opacity .2s,border-color .2s,background .2s}
.pad.dim{opacity:.28}
.pad.focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px var(--accent-soft)}
.pad .ttl{position:absolute;left:14px;top:12px;font:800 15px var(--f-disp);pointer-events:none}
.pad .lbl{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--mute);line-height:1.35;pointer-events:none}
.tension .lbl{right:66px}
.tension.held{background:var(--surface-2);border-color:var(--stroke-2)}
.meter{position:absolute;right:18px;top:14px;bottom:14px;width:34px;border-radius:17px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 6px rgba(0,0,0,.6);pointer-events:none}
.meter .zone{position:absolute;left:4px;right:4px;border-radius:12px;background:linear-gradient(180deg,rgba(70,217,138,.15),rgba(70,217,138,.35),rgba(70,217,138,.15));box-shadow:inset 0 0 0 1px rgba(70,217,138,.7)}
.meter .needle{position:absolute;left:-7px;right:-7px;height:8px;margin-top:-4px;border-radius:4px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.55);transition:background .15s,box-shadow .15s}
.meter .needle.out{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.meter .finger{position:absolute;left:3px;right:3px;height:22px;margin-top:-11px;border-radius:11px;border:2px solid rgba(255,255,255,.5);opacity:0;transition:opacity .15s}
.tension.held .finger{opacity:1}
.pick{display:grid;place-items:center;cursor:pointer}
.pick .ring{position:relative;width:clamp(86px,30vw,118px);height:clamp(86px,30vw,118px);margin-top:-14px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 95%,#fff),var(--accent) 60%,color-mix(in srgb,var(--accent) 70%,#000));
  color:var(--accent-ink);font:800 14px var(--f-body);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 -6px 12px rgba(0,0,0,.2);transition:transform .07s}
.pick .ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}

.pick.hit .ring{transform:scale(.9)}
.coach .prog{height:4px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.coach .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}

</style>
</head>
<body>
<script>document.body.classList.add('svc-ser')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg></div>
    <div class="ttl"><div class="eyebrow">SER · démo</div><h1>Crochetage</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>
  <div class="gauge" id="gaugeRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg><span>Jauge skins</span><div class="gbar"><i id="gfill"></i></div><span><b id="gtext">46</b> / 50</span></div>
  <div class="coach" id="coach" hidden></div>
  <div class="stage" id="stage">

  <div class="lockview" id="lockview"><canvas id="cv"></canvas><div class="pins" id="pinsBar"></div></div>
  <div class="status"><span id="pinsTxt">Goupilles <b>0</b> / 5</span><span id="faultTxt">Erreurs <b>0</b></span></div>
  <div class="pads">
    <div class="pad tension" id="tpad" aria-label="Tension : maintiens et glisse">
      <div class="ttl">Tension</div>
      <div class="meter" id="meter"><div class="zone" id="zone"></div><div class="finger" id="finger"></div><div class="needle" id="needle"></div></div>
      <div class="lbl">Maintiens ton pouce et glisse pour garder l'aiguille dans le vert.</div>
    </div>
    <div class="pad pick" id="ppad" aria-label="Crocheter">
      <div class="ring">Crocheter</div>
      <div class="lbl">Tape quand la goupille atteint son cran.</div>
    </div>
  </div>

  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3.5 13h17"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    c.innerHTML=`<div class="av">CP</div><div class="body"><div class="step"><span class="dots" aria-label="Étape ${step} sur ${total}">${dots}</span><button class="skip" id="skipTuto">Passer le tuto</button></div><div>${html}</div></div>`;
    $('skipTuto').onclick=endTuto;
  }
  function hideCoach(){ $('coach').hidden=true; }
  const hero = sub => `<div class="hero"><div class="badge">${document.querySelector('.top .badge').innerHTML}</div><div><div class="eyebrow">${sub}</div></div></div>`;

  // Intégration dans Ma ZP : ?mode=incident (incident du jour, un seul essai) ou ?mode=train (entraînement).
  const Q = new URLSearchParams(location.search);
  const MODE = ['incident','train'].includes(Q.get('mode')) ? Q.get('mode') : null;
  const INC = MODE==='incident';
  const escH = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function post(type, data={}){ try{ if(window.parent!==window) window.parent.postMessage({source:'mazp-mj', jeu:G.key, id:Q.get('id'), type, ...data}, location.origin); }catch(e){} }
  let joue=false, fini=false;
  const effectif = () => { const d=G.diffs[st.diff]; const n=Number(Q.get('agents')); return `${Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents} agent${(Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents)>1?'s':''}`; };

  function menu(){
    if(INC && fini){ post('close'); return; }
    st.mode='menu'; st.timerOn=false; hideCoach(); G.onMenu && G.onMenu();
    const touch=matchMedia('(pointer:coarse)').matches;
    const tutoBtns = (goLbl) => st.tuto
      ? `<button class="btn primary" id="go">${goLbl}</button><button class="btn" id="tuto">Revoir le tuto</button>`
      : `<button class="btn primary" id="tuto">Commencer le tuto</button><button class="btn" id="go">${INC?'Intervenir sans tuto':'Jouer directement'}</button>`;
    if(INC){
      const d=G.diffs[st.diff];
      showCard(`
        ${hero('Incident du jour · '+G.serviceShort)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="lbl2">Effectif ${G.serviceShort} sur place</div>
        <div class="seg seg1"><button aria-pressed="true" tabindex="-1"><span class="ppl">${'<i></i>'.repeat(Math.max(1,Math.min(12,Number(Q.get('agents'))||d.agents)))}</span><b>${effectif()}</b>${d.label}</button></div>
        <p class="small">Un seul essai. Réussi : jauge des skins et +1 de moral. Raté ou abandonné : ${escH(Q.get('malus')||G.malus)} (à 20:00).</p>
        <div class="row">${tutoBtns('Intervenir')}</div>
        <button class="btn small" id="later" style="align-self:center">Plus tard</button>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}`);
    } else {
      const seg=Object.entries(G.diffs).map(([k,d])=>`<button data-k="${k}" aria-pressed="${k===st.diff}"><span class="ppl">${'<i></i>'.repeat(d.agents)}</span><b>${d.agents} agents</b>${d.label}</button>`).join('');
      showCard(`
        ${hero((MODE==='train'?'Entraînement · ':'Ma ZP · ')+G.service)}

        ${G.story}

        <p class="small">${G.diffHint}</p>
        <div class="row">${tutoBtns('Jouer')}</div>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}
        <p class="demo">${MODE==='train'?'Entraînement : rien ne compte pour ta zone.':'Démo jouable, rien n\'est enregistré dans ta partie Ma ZP.'}</p>`);
      $('seg').onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.diff=b.dataset.k; store.set('diff',st.diff);

  }
  function play(){
    if(INC){ if(fini) return; if(!joue){ joue=true; post('start'); } }
    hide(); hideCoach(); st.mode='play'; G.onPlay(G.diffs[st.diff]);
  }
  function startTuto(){ hide(); st.mode='tuto'; st.timerOn=false; G.onTuto(); }
  function endTuto(){
    st.tuto=true; store.set('tuto',true); hideCoach(); st.mode='menu'; st.timerOn=false; G.onMenu && G.onMenu();
    showCard(`${hero('Tutoriel terminé')}<h2>Les règles en bref</h2><ul>${G.rules.map(r=>`<li><span>${r}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn primary" id="go">${INC?'Intervenir':'Lancer une partie'}</button><button class="btn" id="tomenu">${INC?'Plus tard':'Menu'}</button></div>`);
    $('go').onclick=play; $('tomenu').onclick=INC?()=>post('close'):menu;

  function startTimer(sec,onTimeout){ st.timeLeft=sec; st.timeTotal=sec; st.timerOn=true; st.timerRate=1; st.onTimeout=onTimeout; }
  function stopTimer(){ st.timerOn=false; }
  function fmt(s){ s=Math.max(0,Math.ceil(s)); return s>=60? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : String(s); }

  function result({ok, stats, faults, malus, note}){
    st.timerOn=false; st.mode='result';
    let pts=0, skin=false;
    if(ok) pts=faults===0?2:1;
    if(INC){
      fini=true; post('result',{ok, fautes:faults, pts});
      if(ok){ st.gauge+=pts; renderGauge(); }
    } else if(MODE!=='train' && ok){ st.gauge+=pts; if(st.gauge>=50){st.gauge-=50; skin=true;} store.set('gauge',st.gauge); renderGauge(); }
    const statHtml=stats.map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')+(MODE==='train'?'':`<div class="stat pts"><span>Jauge skins</span><b>${ok?'+'+pts:'+0'}</b></div>`);
    const boutons = INC ? `<button class="btn primary" id="back">Retour au commissariat</button>`
      : `<button class="btn primary" id="again">${ok?'Rejouer':'Réessayer'}</button><button class="btn" id="tomenu">Menu</button>`;
    const noteInc = INC ? (ok ? `Résultat enregistré : +${pts} sur la jauge des skins et +1 de moral à 20:00.${st.gauge>=50?' Ta jauge sera pleine ce soir : un nouveau skin t’attend.':''}` : '') : '';
    showCard(ok?`
      <div class="verdict ok">${ICONS.check}</div>
      <h2>${G.winTitle}</h2>
      <div class="stats">${statHtml}</div>
      ${skin?`<div class="skin">Jauge pleine : le skin « ${G.skin} » est débloqué pour ton commissariat.</div>`:''}
      <p class="small">${INC?noteInc:MODE==='train'?'Entraînement : rien ne compte pour ta zone.':(note || (faults===0?'Sans faute : double point.':'Termine sans erreur pour gagner +2.'))}</p>
      <div class="row">${boutons}</div>`
    :`
      <div class="verdict bad">${ICONS.cross}</div>
      <h2>${G.loseTitle}</h2>
      <div class="stats">${statHtml}</div>
      ${MODE==='train'?'<p class="small">Entraînement : aucune conséquence.</p>':`<div class="malus"><b>Malus</b> · ${escH(INC&&Q.get('malus')?Q.get('malus')+' (appliqué à 20:00)':(malus||G.malus))}</div>`}
      <div class="row">${boutons}</div>`);
    if(INC) $('back').onclick=()=>post('close'); else { $('again').onclick=play; $('tomenu').onclick=menu; }
  }

  const CIRC = 2*Math.PI*21;
  let last=performance.now();
  function frame(ts){
    const dt=Math.min(.05,(ts-last)/1000); last=ts;
    if(st.timerOn){ st.timeLeft-=dt*st.timerRate; if(st.timeLeft<=0){ st.timeLeft=0; st.timerOn=false; st.onTimeout && st.onTimeout(); } }
    const playing = st.mode==='play';

  }

  function init(cfg){
    G=cfg;
    st.diff=store.get('diff','normal'); st.tuto=store.get('tuto',false); st.gauge=store.get('gauge',46);
    if(INC){ if(G.diffs[Q.get('diff')]) st.diff=Q.get('diff'); st.gauge=Math.max(0,Number(Q.get('jauge'))||0); }
    if(MODE==='train') $('gaugeRow').hidden=true;
    $('ringval').style.strokeDasharray=CIRC;
    renderGauge();
    $('sound').onclick=()=>{ st.sound=!st.sound; $('sound').classList.toggle('off',!st.sound); $('sound').setAttribute('aria-label',st.sound?'Couper le son':'Activer le son'); };
    if(MODE){
      document.body.classList.add('embed');
      const eb=document.querySelector('.top .eyebrow'); if(eb) eb.textContent=(INC?'Incident du jour · ':'Entraînement · ')+G.serviceShort;
      // Dans Ma ZP : le bouton du haut ferme le mini-jeu.
      const b=$('menuBtn'); b.innerHTML=ICONS.cross; b.setAttribute('aria-label','Fermer');
      b.onclick=()=>{ if(INC && joue && !fini && st.mode==='play'){ askQuit(); return; } if(MODE==='train' && st.mode!=='menu'){ menu(); return; } post('close'); };
    } else $('menuBtn').onclick=menu;
    document.addEventListener('contextmenu',e=>e.preventDefault());
    G.onInit && G.onInit();
    menu();
    requestAnimationFrame(frame);
  }
  function askQuit(){
    const was=st.timerOn; st.timerOn=false; st.pause=true;
    showCard(`<h2>Abandonner l’incident ?</h2><p>Tu n’as qu’un essai : si tu quittes maintenant, l’incident compte comme raté et le malus tombera à 20:00.</p>
      <div class="row"><button class="btn primary" id="stay">Continuer</button><button class="btn" id="quit">Abandonner</button></div>`);
    $('stay').onclick=()=>{ hide(); st.timerOn=was; st.pause=false; };
    $('quit').onclick=()=>{ fini=true; post('result',{ok:false, fautes:1, pts:0, abandon:true}); post('close'); };
  }
  return {init, st, blip, good, bad, win, buzz, toast, shake, coach, hideCoach, endTuto, startTimer, stopTimer, result, menu, fmt};
})();


const cv=$('cv'), ctx=cv.getContext('2d');
const N=5;
const BAND=.78;
const TUTO_CFG={time:0,band:.075,zone:.14,drift:.12,speed:.7};
const S={cfg:{band:.06,zone:.11,drift:.2,speed:1}, pins:[], active:0, tension:0, finger:.5, holding:false,
  t:0,p1:0,p2:0,jolt:0,outT:0,faults:0,shake:0,over:true,openT:-1,canPick:false,assist:false,checkTension:false,freeze:false,
  tutoStep:-1,tutoProg:0,tutoSets:0};
const mode=()=>Shell.st.mode;

function resetPins(){
  const tg=[]; for(let i=0;i<N;i++){ let t,k=0; do{ t=.4+Math.random()*.5; k++; }while(i>0 && Math.abs(t-tg[i-1])<.15 && k<50); tg.push(t); }
  S.pins=Array.from({length:N},(_,i)=>({h:.15,phi:Math.random()*6.28,w:2+i*.5,set:false,flash:0,target:tg[i]}));
  S.active=0;
}
const pinH=(p,i)=>.5+.42*Math.sin(p.phi)+.06*Math.sin(2.7*p.phi+i);
function startRound(cfg,o={}){
  S.cfg=cfg; resetPins();
  Object.assign(S,{t:0,p1:Math.random()*6,p2:Math.random()*6,jolt:0,outT:0,faults:0,shake:0,over:false,openT:-1,tension:0,holding:false,
    canPick:o.canPick??true, assist:!!o.assist, checkTension:o.checkTension??true, freeze:!!o.freeze});
  const z=cfg.zone; $('zone').style.top=((.5-z)*100)+'%'; $('zone').style.height=(z*200)+'%';
}
function finish(win){
  S.over=true; S.canPick=false; S.holding=false; Shell.stopTimer();
  const used=S.cfg.time-Shell.st.timeLeft;
  setTimeout(()=>Shell.result(win
    ?{ok:true,faults:S.faults,stats:[['Temps',used.toFixed(1)+' s'],['Erreurs',S.faults]]}
    :{ok:false,faults:S.faults,stats:[['Goupilles',S.active+'/5'],['Erreurs',S.faults]]}), win?1100:400);
}

/* ---------- tutoriel ---------- */
const STEPS=[
  {id:'tension',html:'<b>Pouce gauche sur Tension.</b> Garde l\'aiguille blanche dans le vert pendant 3 secondes. Elle dérive toute seule : corrige en glissant ton pouce.'},
  {id:'pick',html:'<b>Pouce droit.</b> La goupille active monte et descend. Chaque goupille a son propre cran, comme une vraie clé. Tape quand la jonction laiton-acier passe dans le cran lumineux. Tension assistée pour cet exercice.'},
  {id:'both',html:'<b>Les deux pouces ensemble.</b> Garde la tension dans le vert et cale 2 goupilles. Si la tension sort trop longtemps, la dernière goupille retombe.'}
];
function tutoGo(i){
  S.tutoStep=i; S.tutoProg=0; S.tutoSets=0;
  const id=STEPS[i].id;
  if(id==='tension'){ startRound(TUTO_CFG,{canPick:false,checkTension:false,freeze:true}); setPads('t'); }
  if(id==='pick'){ startRound(TUTO_CFG,{assist:true,checkTension:false}); setPads('p'); }
  if(id==='both'){ startRound(TUTO_CFG,{}); setPads('both'); }
  Shell.coach(i+1,3,STEPS[i].html+'<div class="prog"><i id="tprog"></i></div>');
}
function prog(f){ const e=$('tprog'); if(e) e.style.width=Math.min(100,f*100)+'%'; }
function tutoAdvance(){
  Shell.win(); Shell.toast('Bien joué','ok');
  S.canPick=false; S.checkTension=false;
  if(S.tutoStep<STEPS.length-1){ const nx=S.tutoStep+1; S.tutoStep+=.5; setTimeout(()=>{ if(mode()==='tuto') tutoGo(nx); },700); }
  else setTimeout(Shell.endTuto,700);
}
function setPads(w){
  const t=$('tpad'),p=$('ppad');
  t.classList.toggle('dim',w==='p'); p.classList.toggle('dim',w==='t');
  t.classList.toggle('focus',w==='t'||w==='both'); p.classList.toggle('focus',w==='p'||w==='both');
}

/* ---------- actions ---------- */
const inZone=()=>S.assist||Math.abs(S.tension-.5)<=S.cfg.zone;
function tap(){
  const pp=$('ppad'); pp.classList.add('hit'); setTimeout(()=>pp.classList.remove('hit'),90);
  if(!S.canPick||S.over||S.active>=N) return;
  const p=S.pins[S.active];
  if(!inZone()){ miss(S.holding?'Tension hors zone':'Pas de tension'); return; }
  const d=p.h-p.target;
  if(Math.abs(d)<=S.cfg.band){
    p.set=true; p.flash=1; S.active++;
    Shell.blip(1400,.05,'square',.05); Shell.buzz(15); Shell.toast('Goupille calée','ok');
    if(mode()==='tuto'){ S.tutoSets++; const need=STEPS[S.tutoStep].id==='pick'?1:2; prog(S.tutoSets/need); if(S.tutoSets>=need) tutoAdvance(); }
    else if(S.active>=N){ S.openT=0; Shell.win(); finish(true); }
  } else miss(d<0?'Trop bas':'Trop haut');
}
function miss(msg){
  if(mode()!=='tuto'||STEPS[S.tutoStep].id!=='pick') S.faults++;
  if(!S.assist) S.jolt+=(Math.random()<.5?-1:1)*.13;
  S.shake=.25; Shell.bad(); Shell.toast(msg,'bad');
}
function dropLast(){
  if(S.active===0) return;
  S.active--; const p=S.pins[S.active]; p.set=false; p.phi=Math.random()*6.28;
  if(mode()==='play') S.faults++;
  S.shake=.35; Shell.blip(90,.25,'sawtooth',.06); Shell.buzz(80); Shell.toast('Goupille retombée','bad');
  if(mode()==='tuto'){ S.tutoSets=Math.max(0,S.tutoSets-1); prog(S.tutoSets/2); }
}

/* ---------- entrées ---------- */
const tpad=$('tpad'); let tId=null;
const fingerFrom=e=>{ const r=$('meter').getBoundingClientRect(); return Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height)); };
tpad.addEventListener('pointerdown',e=>{ e.preventDefault(); tId=e.pointerId; try{tpad.setPointerCapture(e.pointerId)}catch(_){} S.holding=true; S.finger=fingerFrom(e); tpad.classList.add('held'); Shell.blip(300,.04,'triangle',.03); });
tpad.addEventListener('pointermove',e=>{ if(e.pointerId===tId) S.finger=fingerFrom(e); });
const tRelease=e=>{ if(e.pointerId===tId){ tId=null; S.holding=false; tpad.classList.remove('held'); } };
tpad.addEventListener('pointerup',tRelease); tpad.addEventListener('pointercancel',tRelease);
$('ppad').addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
const keys={};
addEventListener('keydown',e=>{
  if(!$('overlay').hidden) return;
  if(e.code==='Space'){ e.preventDefault(); if(!keys.space){ keys.space=true; S.holding=true; tpad.classList.add('held'); } }
  if(e.code==='ArrowUp'){ keys.up=true; e.preventDefault(); }
  if(e.code==='ArrowDown'){ keys.down=true; e.preventDefault(); }
  if((e.code==='KeyK'||e.code==='Enter')&&!e.repeat){ e.preventDefault(); tap(); }
});
addEventListener('keyup',e=>{
  if(e.code==='Space'){ keys.space=false; if(tId===null){ S.holding=false; tpad.classList.remove('held'); } }
  if(e.code==='ArrowUp') keys.up=false;
  if(e.code==='ArrowDown') keys.down=false;
});

/* ---------- boucle ---------- */
function update(dt){
  const live=mode()==='play'||mode()==='tuto';
  S.t+=dt;
  if(keys.space) S.finger=Math.min(1,Math.max(0,S.finger+((keys.up?1:0)-(keys.down?1:0))*dt*.7));
  const d=S.cfg.drift*(.6*Math.sin(S.t*.8+S.p1)+.4*Math.sin(S.t*1.9+S.p2));
  S.jolt*=Math.exp(-1.6*dt);
  if(S.assist) S.tension+=(.5-S.tension)*Math.min(1,dt*10);
  else if(S.holding&&!S.over){ const tg=Math.min(1,Math.max(0,S.finger+d+S.jolt)); S.tension+=(tg-S.tension)*Math.min(1,dt*14); }
  else S.tension+=(0-S.tension)*Math.min(1,dt*5);
  const ok=inZone();
  if(live&&!S.over){
    if(S.checkTension){ if(!ok){ S.outT+=dt; if(S.outT>.85){ dropLast(); S.outT=0; } } else S.outT=Math.max(0,S.outT-dt*2); }
    if(mode()==='tuto'&&Number.isInteger(S.tutoStep)&&STEPS[S.tutoStep].id==='tension'){
      if(S.holding&&ok) S.tutoProg+=dt; else S.tutoProg=Math.max(0,S.tutoProg-dt*1.5);
      prog(S.tutoProg/3);
      if(S.tutoProg>=3){ S.tutoProg=-99; tutoAdvance(); }
    }
  }
  S.pins.forEach((p,i)=>{
    p.flash=Math.max(0,p.flash-dt*2);
    if(p.set) p.h+=(p.target-p.h)*Math.min(1,dt*20);
    else if(i===S.active&&!S.freeze&&live&&!S.over){ p.phi+=p.w*S.cfg.speed*dt; p.h=pinH(p,i); }
    else p.h+=(.15+.015*Math.sin(S.t*3+i)-p.h)*Math.min(1,dt*8);
  });
  S.shake=Math.max(0,S.shake-dt);
  if(S.openT>=0) S.openT+=dt;
  $('pinsTxt').innerHTML=`Goupilles <b>${S.active}</b> / ${N}`;
  $('faultTxt').innerHTML=`Erreurs <b>${S.faults}</b>`;
  $('pinsBar').innerHTML=S.pins.map(p=>`<i class="${p.set?'on':''}"></i>`).join('');
  $('needle').style.top=((1-S.tension)*100)+'%';
  $('needle').classList.toggle('out',!ok&&!S.assist&&live);
  $('finger').style.top=((1-S.finger)*100)+'%';
}

/* ---------- dessin ---------- */
let W=0,H=0,dpr=1;
function resize(){ const r=cv.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; }
new ResizeObserver(resize).observe(cv);
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h); }
function lg(x0,y0,x1,y1,stops){ const g=ctx.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>g.addColorStop(o,c)); return g; }
const ACC='#f2b544', OK='#46d98a', BAD='#ff5d5d';
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(S.shake>0){ const a=S.shake*10; ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  const live=mode()==='play'||mode()==='tuto';
  const top=30, bot=H-28, Hl=Math.max(90,bot-top), x0=14, w=W-28;
  const ys=top+Hl*.5, K=Hl*.42, Lk=Hl*.16, Ld=Hl*.17;
  const xs=i=>x0+w*(.3+i*.155), cw=Math.min(30,w*.08);
  const open=S.openT>=0?Math.min(1,S.openT/.6):0;

  // corps : coque métal brossé
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=24; ctx.shadowOffsetY=10;
  rr(x0,top,w,Hl,22); ctx.fillStyle=lg(0,top,0,top+Hl,[[0,'#3b4554'],[1,'#222a36']]); ctx.fill(); ctx.restore();
  rr(x0+.5,top+.5,w-1,Hl-1,22); ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1; ctx.stroke();
  // rotor
  const plugX=x0+w*.15, plugY=ys+open*5;
  rr(plugX,plugY,w*.83,top+Hl-plugY-10,14); ctx.fillStyle=lg(0,ys,0,top+Hl,[[0,'#4a3f2b'],[1,'#2c261b']]); ctx.fill();
  ctx.strokeStyle='rgba(242,181,68,.18)'; ctx.stroke();
  // canal de clé
  rr(plugX+6,top+Hl*.86,w*.83-12,Hl*.07,6); ctx.fillStyle='#0c1016'; ctx.fill();
  const bw=S.cfg.band*K;

  S.pins.forEach((p,i)=>{
    const cx=xs(i), x=cx-cw/2, yTop=ys+(BAND-p.h)*K, isAct=i===S.active&&live&&!S.over;
    // logement
    rr(x-4,top+10,cw+8,Hl*.83,10); ctx.fillStyle='#0b0f15'; ctx.fill();
    // ressort
    const sTop=top+14, sBot=yTop-Ld; ctx.strokeStyle='#8893a3'; ctx.lineWidth=1.6; ctx.beginPath();
    const turns=8; for(let k=0;k<=64;k++){ const f=k/64, yy=sTop+(sBot-sTop)*f; ctx.lineTo(cx+Math.sin(f*turns*Math.PI*2)*cw*.36, yy); } ctx.stroke();
    // goupille acier
    rr(x,yTop-Ld,cw,Ld-2,cw*.3); ctx.fillStyle=lg(x,0,x+cw,0,[[0,'#7b8697'],[.45,'#eef2f7'],[1,'#7b8697']]); ctx.fill();
    // goupille laiton
    ctx.beginPath(); ctx.moveTo(x,yTop+2); ctx.lineTo(x+cw,yTop+2); ctx.lineTo(x+cw,yTop+Lk*.74); ctx.quadraticCurveTo(cx+cw*.2,yTop+Lk,cx,yTop+Lk); ctx.quadraticCurveTo(cx-cw*.2,yTop+Lk,x,yTop+Lk*.74); ctx.closePath();
    ctx.fillStyle=lg(x,0,x+cw,0,[[0,'#9a7124'],[.45,'#ffd77a'],[1,'#9a7124']]); ctx.fill();
    // cran cible
    const yT=ys+(BAND-p.target)*K, col=(p.set||open)?OK:ACC;
    ctx.save();
    if(isAct||p.set){ ctx.shadowColor=col; ctx.shadowBlur=isAct?14:8; }
    rr(x-8,yT-bw,cw+16,bw*2,bw); ctx.fillStyle=(p.set||open)?'rgba(70,217,138,.22)':(isAct?'rgba(242,181,68,.28)':'rgba(242,181,68,.08)'); ctx.fill();
    ctx.strokeStyle=(p.set||open)?OK:(isAct?ACC:'rgba(242,181,68,.35)'); ctx.lineWidth=isAct?2:1.2; ctx.stroke();
    ctx.restore();
    if(p.set&&p.flash>0){ ctx.save(); ctx.globalAlpha=p.flash; ctx.strokeStyle=OK; ctx.lineWidth=3; rr(x-6,yTop-Ld-4,cw+12,Ld+Lk*.8+8,10); ctx.stroke(); ctx.restore(); }
    if(isAct){ ctx.strokeStyle='rgba(242,181,68,.55)'; ctx.lineWidth=1.5; rr(x-4,top+10,cw+8,Hl*.83,10); ctx.stroke(); }
  });

  // clé qui se dessine
  if(S.active>0){
    const kb=top+Hl*.93, tip=i=>ys+(BAND-S.pins[i].h)*K+Lk;
    ctx.beginPath(); ctx.moveTo(plugX+8,kb); ctx.lineTo(plugX+8,tip(0)+10);
    for(let i=0;i<S.active;i++){ const cx=xs(i); ctx.lineTo(cx-cw*.8,tip(i)+9); ctx.lineTo(cx,tip(i)+2); ctx.lineTo(cx+cw*.8,tip(i)+9); }
    ctx.lineTo(xs(S.active-1)+cw*1.2,kb); ctx.closePath();
    ctx.fillStyle=lg(0,top+Hl*.5,0,kb,[[0,'rgba(255,215,122,.85)'],[1,'rgba(176,129,40,.85)']]); ctx.fill();
  }
  // crochet
  if(live&&S.active<N&&!S.over){
    const p=S.pins[S.active], cx=xs(S.active), tipY=ys+(BAND-p.h)*K+Lk+2, base=top+Hl*.895;
    ctx.lineCap='round';
    ctx.strokeStyle='#5d6878'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-4,base+1); ctx.lineTo(cx-16,base+1); ctx.stroke();
    ctx.strokeStyle='#dfe5ec'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-4,base); ctx.lineTo(cx-16,base); ctx.quadraticCurveTo(cx-4,base,cx,Math.min(tipY,base-2)); ctx.stroke();
  }
  // clé de tension
  const ok=inZone();
  ctx.save(); ctx.translate(x0+w*.09,top+Hl*.895); ctx.rotate(-S.tension*.35+open*.5);
  ctx.strokeStyle=!live?'#6b7588':(ok?OK:BAD); ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
  if(live){ ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=10; }
  ctx.beginPath(); ctx.moveTo(-w*.02,-Hl*.18); ctx.lineTo(0,0); ctx.lineTo(w*.07,0); ctx.stroke(); ctx.restore();

  if(open>0){ ctx.save(); ctx.globalAlpha=open; ctx.fillStyle=OK; ctx.font='800 26px "Bricolage Grotesque", system-ui, sans-serif'; ctx.textAlign='right'; ctx.fillText('Ouvert', W-18, 22); ctx.restore(); }
}

Shell.init({
  key:'crochetage', service:'Incident SER', serviceShort:'SER',
  headline:'Porte verrouillée',
  story:`<p>Le juge d'instruction a délivré un mandat de perquisition pour le 14, rue des Tanneurs, dans un dossier de recel. Sur place, personne n'ouvre et le serrurier ne répond pas.</p><p>Ton équipe SER doit ouvrir la porte avant que le suspect ne fasse disparaître les preuves.</p>`,
  diffs:{difficile:{agents:2,label:'Difficile',time:45,band:.047,zone:.09,drift:.25,speed:1.18},normal:{agents:4,label:'Normal',time:60,band:.06,zone:.11,drift:.2,speed:1},facile:{agents:6,label:'Facile',time:75,band:.075,zone:.14,drift:.15,speed:.85}},
  diffHint:"Plus d'agents : crans plus larges, tension plus stable, plus de temps.",
  desktopHint:'Sur ordinateur : maintiens Espace pour la tension (flèches haut et bas pour doser) et appuie sur K pour crocheter.',
  rules:['Cale les <b>5 goupilles</b>, de gauche à droite, avant la fin du chrono.','Chaque goupille a <b>son propre cran</b>. Ta clé se dessine au fil des goupilles calées.','Un tap raté fait <b>tressauter la tension</b>.','Tension hors du vert près d\'une seconde : <b>la dernière goupille retombe</b>.','Sans erreur : <b>+2</b> sur la jauge skins. Avec erreurs : <b>+1</b>.'],
  winTitle:'Porte ouverte', loseTitle:'La porte a tenu', skin:'Porte blindée',
  malus:"perquisition reportée. 1 agent SER est mobilisé sur la planque et reste indisponible demain.",
  onMenu(){ S.over=true; S.canPick=false; setPads(null); },
  onInit(){ resize(); startRound(S.cfg,{canPick:false}); S.over=true; },
  onPlay(cfg){ S.tutoStep=-1; setPads(null); startRound(cfg); Shell.startTimer(cfg.time,()=>{ if(!S.over) finish(false); }); },
  onTuto(){ tutoGo(0); },
  onFrame(dt){ update(dt); draw(); }
});

</script>
