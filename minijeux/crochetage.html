<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Crochetage SER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-cyb{--accent:#b49bff;--accent-ink:#170a33;--accent-soft:rgba(180,155,255,.16)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:76px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.tuto-mini{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;margin:-4px 0 -6px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);background:transparent;color:var(--mute);font:600 12.5px var(--f-body);cursor:pointer}
.minis{align-self:flex-end;display:flex;gap:8px;margin:-4px 0 -6px}.minis .tuto-mini{margin:0}#guideBtn{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini:hover{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.debrief-list{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;display:grid;gap:6px}
.debrief-list ul{gap:6px}
.debrief-list li::before{background:var(--bad)!important}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}
/* Défi d'endurance (entraînement) */
.defi-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,#FFB23F 45%,transparent);background:color-mix(in srgb,#FFB23F 10%,transparent);border-radius:14px;padding:12px}
.defi-box>div{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.defi-box b{font-family:var(--f-disp);font-size:15px}
.btn.defi{flex:0 0 auto;background:#FFB23F;color:#241400;border-color:transparent}
.coeurs{color:#FF6E6A;letter-spacing:2px}


/* ---- habillage « atelier » : métal brossé, laiton, LED ---- */
.lockview{position:relative;flex:1;min-height:190px;border-radius:26px;overflow:hidden;
  background:radial-gradient(80% 60% at 30% 20%,rgba(255,196,110,.08),transparent 70%),linear-gradient(160deg,#17191d,#0b0c0f);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.45)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;left:50%;transform:translateX(-50%);top:21px;display:flex;gap:6px;pointer-events:none}
.pins i{width:20px;height:7px;border-radius:4px;background:linear-gradient(180deg,#07080a,#1d2025);box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08);transition:background .25s,box-shadow .25s}
.pins i.on{background:radial-gradient(60% 90% at 50% 40%,#c8ffe0,#46d98a 55%,#1d8a52);box-shadow:0 0 10px rgba(70,217,138,.75),0 1px 0 rgba(255,255,255,.1)}
.status{padding:0 4px}
.status span{font:600 12px var(--f-mono,'IBM Plex Mono',monospace);letter-spacing:.06em;text-transform:uppercase;color:#a4977d}
.status b{color:#ffd88a;font-size:15px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:clamp(160px,30vh,236px);margin-bottom:env(safe-area-inset-bottom,0px)}
.pad{position:relative;border-radius:22px;touch-action:none;overflow:hidden;transition:opacity .2s,box-shadow .2s;
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),linear-gradient(180deg,#1a1c21,#0f1013);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.35)}
.pad.dim{opacity:.28}
.pad.focus{box-shadow:inset 0 0 0 1px rgba(255,200,110,.55),0 0 0 3px rgba(255,178,63,.18),0 10px 24px rgba(0,0,0,.35)}
.pad .ttl{position:absolute;left:14px;top:12px;font:800 16px var(--f-disp);letter-spacing:.02em;color:#ffd88a;text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none}
.pad .lbl{position:absolute;left:14px;bottom:12px;font-size:12px;color:#9c9382;line-height:1.35;pointer-events:none}
.tension .lbl{right:68px}
.tension .read{position:absolute;left:14px;top:36px;right:68px;font:600 12px var(--f-mono,'IBM Plex Mono',monospace);letter-spacing:.04em;text-transform:uppercase;color:#6f6a60;pointer-events:none}
.tension .read.ok{color:var(--ok)} .tension .read.bad{color:var(--bad)}
.tension.held{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.1),0 10px 24px rgba(0,0,0,.35)}
.meter{position:absolute;right:16px;top:12px;bottom:12px;width:38px;border-radius:19px;pointer-events:none;
  background:linear-gradient(90deg,#050607,#121418 50%,#050607);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 0 0 3px #3a2f1c,0 0 0 4px #8a6a32,0 0 0 5px rgba(0,0,0,.6)}
.meter::before{content:"";position:absolute;inset:8px 3px;background:repeating-linear-gradient(180deg,rgba(255,216,138,.28) 0 1px,transparent 1px 10%);-webkit-mask:linear-gradient(90deg,#000 0 6px,transparent 6px calc(100% - 6px),#000 calc(100% - 6px));mask:linear-gradient(90deg,#000 0 6px,transparent 6px calc(100% - 6px),#000 calc(100% - 6px))}
.meter .zone{position:absolute;left:5px;right:5px;border-radius:12px;background:linear-gradient(180deg,rgba(70,217,138,.12),rgba(70,217,138,.38),rgba(70,217,138,.12));box-shadow:inset 0 0 0 1px rgba(70,217,138,.75),0 0 12px rgba(70,217,138,.25)}
.meter .needle{position:absolute;left:-8px;right:-8px;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(180deg,#ffffff,#b9c2cc);box-shadow:0 0 12px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.6);transition:background .15s,box-shadow .15s}
.meter .needle.out{background:linear-gradient(180deg,#ff9a9a,#ff5d5d);box-shadow:0 0 14px var(--bad)}
.meter .finger{position:absolute;left:3px;right:3px;height:24px;margin-top:-12px;border-radius:12px;border:2px solid rgba(255,216,138,.55);opacity:0;transition:opacity .15s}
.tension.held .finger{opacity:1}
.pick{display:grid;place-items:center;cursor:pointer}
.pick .ring{position:relative;width:clamp(88px,30vw,122px);height:clamp(88px,30vw,122px);margin-top:-16px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,transparent 0 52%,rgba(0,0,0,.18) 53%,transparent 56%),repeating-conic-gradient(from 10deg,rgba(255,255,255,.07) 0 2deg,rgba(0,0,0,.06) 2deg 4deg),radial-gradient(circle at 38% 30%,#fff1c4,#e2b866 30%,#a77a2c 70%,#6d4c18);
  color:#3a2508;font:800 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,240,200,.55);
  box-shadow:0 0 0 5px #2a2116,0 0 0 7px #8a6a32,0 0 26px 6px rgba(255,190,90,.35),0 12px 26px rgba(0,0,0,.55),inset 0 -6px 12px rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.35);transition:transform .07s,box-shadow .15s}
.pick .ring::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(255,206,120,.55);box-shadow:0 0 14px rgba(255,190,90,.45),inset 0 0 10px rgba(255,190,90,.25);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pick .ring::before{animation:none}}
.pick.hit .ring{transform:scale(.92);box-shadow:0 0 0 5px #2a2116,0 0 0 7px #8a6a32,0 0 34px 10px rgba(255,190,90,.55),0 6px 14px rgba(0,0,0,.55),inset 0 4px 10px rgba(0,0,0,.35)}
.coach .prog{height:4px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.coach .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}

</style>
</head>
<body>
<script>document.body.classList.add('svc-ser')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg></div>
    <div class="ttl"><div class="eyebrow">SER · démo</div><h1>Crochetage</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>

<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3.5 13h17"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6.5 6.5 0 0 1 11 0"/><path d="M5.5 13c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5c0 1.6-.2 3.1-.6 4.5"/><path d="M8.5 19.5c-.6-1.9-1-4-1-6.5a4.5 4.5 0 0 1 9 0c0 2.2-.4 4.3-1.1 6"/><path d="M12 12.5c0 3 .5 5.7 1.4 8"/><path d="M10.6 21c-.7-1.7-1.1-3.6-1.1-5.5"/></svg>',
  dna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',
  trace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="19" cy="15" r="2"/><path d="M6.2 16.3l4.6-7.6M13.4 8.6l4.3 4.8"/><path d="M19 3v4M17 5h4"/></svg>',
  barrage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="6" rx="1.5"/><path d="M8 7l-3 6M13 7l-3 6M18 7l-3 6"/><path d="M6 13v6M18 13v6M4 19h4M16 19h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    c.innerHTML=`<div class="av">CP</div><div class="body"><div class="step"><span class="dots" aria-label="Étape ${step} sur ${total}">${dots}</span><button class="skip" id="skipTuto">Passer le tuto</button></div><div>${html}</div></div>`;
    $('skipTuto').onclick=endTuto;
  }
  function hideCoach(){ $('coach').hidden=true; }
  const hero = sub => `<div class="hero"><div class="badge">${document.querySelector('.top .badge').innerHTML}</div><div><div class="eyebrow">${sub}</div></div></div>`;

  // Intégration dans Ma ZP : ?mode=incident (incident du jour, un seul essai), ?mode=renfort (renfort PJF pour
  // l'enquête, un seul essai, sans jauge) ou ?mode=train (entraînement).
  const Q = new URLSearchParams(location.search);
  const MODE = ['incident','train','renfort'].includes(Q.get('mode')) ? Q.get('mode') : null;
  const RENF = MODE==='renfort';
  const INC = MODE==='incident' || RENF;
  const escH = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function post(type, data={}){ try{ if(window.parent!==window) window.parent.postMessage({source:'mazp-mj', jeu:G.key, id:Q.get('id'), type, ...data}, location.origin); }catch(e){} }
  let joue=false, fini=false;

  // ───── Challenge (l'entraînement aux mini-jeux dans Ma ZP) : niveaux 1 → ∞, trois erreurs et la course s'arrête. ─────
  // Le record de la partie (et son détenteur) arrive par l'adresse ; chaque niveau réussi est signalé à Ma ZP.
  const DEFI = { rec: Math.max(0, Number(Q.get('rec'))||0), recNom: Q.get('recNom')||'', moi: Math.max(0, Number(Q.get('moi'))||0), erreurs: 3 };
  let run = null; // { niveau, erreurs, reussis } pendant une course
  /**
   * Réglages d'un niveau : du niveau 1 (plus doux que « facile ») au niveau 10 (= « difficile »), en passant par
   * facile (4) et normal (7) ; au-delà, chaque réglage continue de se serrer au même rythme que de normal à difficile,
   * en multipliant (au moins 3 % par niveau). Le temps, lui, tend vers un plancher jouable par un très bon joueur. Bornes par jeu.
   */
  function cfgNiveau(n){
    const F=G.diffs.facile, N=G.diffs.normal, D=G.diffs.difficile, B=G.bornes||{};
    const out={label:`Niveau ${n}`, niveau:n, defi:true};
    const val=(f,m,d,k)=>{
      if(n<=10){
        const pts=[[1,f+(f-m)*0.5],[4,f],[7,m],[10,d]];
        for(let i=0;i<3;i++){ const [a,va]=pts[i],[b,vb]=pts[i+1]; if(n<=b) return va+(vb-va)*(n-a)/(b-a); }
      }
      let r = m>0&&d>0 ? Math.pow(d/m,1/3) : 1;
      if(r===1 && k==='time') r=0.95;
      else if(r!==1 && Math.abs(r-1)<0.03) r = r>1?1.03:0.97;
      // Le temps s'approche de son plancher sans l'atteindre (un temps qu'un très bon joueur tient encore) :
      // ce sont la précision et la complexité qui finissent par départager.
      if(k==='time'){ const lo=(B.time&&B.time[0])||0; if(lo>0 && d>lo) return lo+(d-lo)*Math.pow(Math.min(r,.93),n-10); }
      return d*Math.pow(r,n-10);
    };
    const borne=(v,b,k,d,ent)=>{ const [lo,hi]=b||(k==='time'?[Math.max(15,d*0.3),Infinity]:[-Infinity,Infinity]); v=Math.min(hi,Math.max(lo,v)); return ent?Math.round(v):Math.round(v*1000)/1000; };
    const cles=new Set([...Object.keys(F),...Object.keys(N),...Object.keys(D)]);
    for(const k of cles){
      if(k==='agents'||k==='label') continue;
      const f=F[k], m=N[k], d=D[k];
      const ref = d!==undefined?d:m!==undefined?m:f;
      if(f===undefined||m===undefined||d===undefined){ // réglage propre aux niveaux durs
        if(d!==undefined && n>=10) out[k]=d; else if(m!==undefined && n>=7) out[k]=m; else if(f!==undefined && n<7) out[k]=f;
        continue;
      }
      if(typeof ref==='number') out[k]=borne(val(f,m,d,k),B[k],k,d,[f,m,d].every(Number.isInteger));
      else if(Array.isArray(ref)) out[k]=ref.map((_,i)=>borne(val(f[i],m[i],d[i],k),B[k]&&B[k][i],k,d[i],[f[i],m[i],d[i]].every(Number.isInteger)));
      else out[k] = n>=10?d:n>=7?m:f;
    }
    return G.niveau ? G.niveau(n,out) : out;
  }
  const eyebrow = t => { const eb=document.querySelector('.top .eyebrow'); if(eb) eb.textContent=t; };
  const eyebrowBase = () => (RENF?'Appui PJF · ':INC?'Incident du jour · ':G&&G.evt?'Événement · ':MODE==='train'?'Challenge · ':'')+G.serviceShort;
  const recLigne = () => DEFI.rec ? `Record de la partie : <b>niveau ${DEFI.rec}</b>${DEFI.recNom?` par ${escH(DEFI.recNom)}`:''}.` : 'Pas encore de record dans la partie : le premier niveau réussi le crée.';
  // Course en cours gardée sur l'appareil : on peut quitter le mini-jeu (ou être coupé) et reprendre au même niveau,
  // avec les mêmes cœurs. Un niveau quitté en cours de route est simplement rejoué. La sauvegarde vaut pour ce joueur
  // et pour la semaine du Challenge en cours (la prime du dimanche ne doit pas hériter d'une course de la semaine passée).
  const CLE_RUN = `defiRun.${Q.get('u')||'anon'}`;
  const sauverRun = () => { if(MODE==='train' && run) store.set(CLE_RUN, {...run, sem:Q.get('sem')||'', at:Date.now()}); };
  const oublierRun = () => store.set(CLE_RUN, null);
  function runSauvee(){
    const r = MODE==='train' ? store.get(CLE_RUN, null) : null;
    if(!r || !(r.niveau>1 || r.erreurs>0)) return null;
    if((r.sem||'') !== (Q.get('sem')||'')) { oublierRun(); return null; }
    return r;
  }
  function startDefi(){ oublierRun(); run={niveau:1, erreurs:0, reussis:0}; jouerNiveau(); }
  function reprendreDefi(){ const r=runSauvee(); if(!r) return startDefi(); run={niveau:r.niveau, erreurs:r.erreurs, reussis:r.reussis||r.niveau-1}; jouerNiveau(); }
  function jouerNiveau(){
    sauverRun();
    hide(); hideCoach(); st.mode='play';
    eyebrow(`Challenge · niv. ${run.niveau} · ${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`);
    G.onPlay(cfgNiveau(run.niveau)); toast(`Niveau ${run.niveau}`);
  }
  function resultDefi({ok, stats, details}){
    st.timerOn=false; st.mode='result';
    const n=run.niveau;
    post('result',{ok, defi:true}); // compté comme une partie d'entraînement
    const detailHtml = details && details.length && !ok ? `<div class="debrief-list"><b>Ce qui s’est mal passé</b><ul>${details.map(d=>`<li><span>${d}</span></li>`).join('')}</ul></div>` : '';
    const coeurs = `${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`;
    if(ok){
      run.reussis=n; run.niveau=n+1; sauverRun();
      const record = n>DEFI.rec, perso = n>DEFI.moi;
      post('defi',{niveau:n});
      if(record){ DEFI.rec=n; DEFI.recNom='toi'; } if(perso) DEFI.moi=n;
      showCard(`<div class="verdict ok">${ICONS.check}</div><h2>Niveau ${n} réussi</h2>
        <div class="stats">${stats.slice(0,2).map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="stat"><span>Erreurs</span><b class="coeurs">${coeurs}</b></div></div>
        ${record?'<div class="skin">Nouveau record de la partie ! Ton nom s’affiche sur la tuile du challenge.</div>':perso?'<p class="small">Nouveau record personnel.</p>':''}
        <p class="small">Le niveau ${n+1} sera un peu plus dur.</p>
        <div class="row"><button class="btn primary" id="suite">Niveau ${n+1}</button><button class="btn" id="stop">Terminer la course</button></div>
        ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n+1}.</p>`:''}`);
      $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
      return;
    }
    run.erreurs++; sauverRun();
    if(run.erreurs>=DEFI.erreurs){ finDefi(detailHtml); return; }
    const reste=DEFI.erreurs-run.erreurs;
    showCard(`<div class="verdict bad">${ICONS.cross}</div><h2>Niveau ${n} raté</h2>
      <p class="small">Encore <b>${reste} erreur${reste>1?'s':''}</b> permise${reste>1?'s':''} <span class="coeurs">${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}</span>.</p>${detailHtml}
      <div class="row"><button class="btn primary" id="suite">Retenter le niveau ${n}</button><button class="btn" id="stop">Terminer la course</button></div>
      ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n}.</p>`:''}`);
    $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
  }
  function finDefi(detailHtml=''){
    st.timerOn=false; st.mode='result';
    const k=run?run.reussis:0; run=null; oublierRun(); eyebrow(eyebrowBase());
    showCard(`${hero('Challenge')}<h2>Fin de la course</h2>
      <div class="stats"><div class="stat"><span>Niveaux réussis</span><b>${k}</b></div><div class="stat"><span>Ton record</span><b>${DEFI.moi}</b></div><div class="stat"><span>Record partie</span><b>${DEFI.rec}</b></div></div>
      ${typeof detailHtml==='string'?detailHtml:''}
      <p class="small">${recLigne()}</p>
      <div class="row"><button class="btn primary" id="encore">Nouvelle course</button><button class="btn" id="tomenu">Menu</button></div>`);
    $('encore').onclick=startDefi; $('tomenu').onclick=menu;
  }
  const unite = n => `${n} ${G.unit ? G.unit[n>1?1:0] : (n>1?'agents':'agent')}`;
  const effectif = () => { const d=G.diffs[st.diff]; const n=Number(Q.get('agents')); return unite(Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents); };
  const effLabel = () => G.effLabel || `Effectif ${G.serviceShort} sur place`;

  function menu(){
    if(INC && fini){ post('close'); return; }
    st.mode='menu'; st.timerOn=false; hideCoach(); G.onMenu && G.onMenu();
    if(run){ run=null; eyebrow(eyebrowBase()); }
    const touch=matchMedia('(pointer:coarse)').matches;
    // Tuto déjà vu (ou en option) : petit bouton discret au-dessus de l'action principale, pas un second gros bouton.
    const tutoSeul = () => `<button class="tuto-mini" id="tuto" type="button"><i aria-hidden="true">?</i>${st.tuto?'Revoir le tuto':'Tuto'}</button>`;
    // Guide illustré (si le mini-jeu en a un) : petit bouton à côté du tuto, sur tous les écrans de départ.
    const guideMini = () => G.guide ? `<button class="tuto-mini" id="guideBtn" type="button"><i aria-hidden="true">i</i>Comment jouer</button>` : '';
    const tutoMini = () => G.guide ? `<div class="minis">${guideMini()}${tutoSeul()}</div>` : tutoSeul();
    const tutoBtns = (goLbl) => st.tuto
      ? `<button class="btn primary" id="go">${goLbl}</button>`
      : `<button class="btn primary" id="tuto">Commencer le tuto</button><button class="btn" id="go">${RENF?'Commencer sans tuto':INC?'Intervenir sans tuto':'Jouer directement'}</button>`;
    // Événement d'actualité (lancé depuis Ma ZP) : une seule partie, réglage normal, puis invitation au Challenge.
    if(G.evt && !INC){
      showCard(`
        ${hero('Événement · '+G.service)}
        <h2>${G.headline}</h2>
        ${G.story}
        ${tutoMini()}<div class="row"><button class="btn primary" id="evtGo">${G.evt.go||'Jouer'}</button></div>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}
        <p class="demo">Une partie en difficulté normale, sans effet sur ta zone.</p>`);
      $('evtGo').onclick=jouerEvt; $('tuto').onclick=startTuto; brancherGuide();
      return;
    }
    if(INC){
      const d=G.diffs[st.diff];
      showCard(`
        ${hero((RENF?'Appui PJF · ':'Incident du jour · ')+G.serviceShort)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="lbl2">${effLabel()}</div>
        <div class="seg seg1"><button aria-pressed="true" tabindex="-1"><span class="ppl">${'<i></i>'.repeat(Math.max(1,Math.min(12,Number(Q.get('agents'))||d.agents)))}</span><b>${effectif()}</b>${d.label}</button></div>
        ${Q.get('pourquoi')?`<p class="small" style="opacity:.8">${escH(Q.get('pourquoi'))}</p>`:''}
        <p class="small">${RENF?`Un seul essai. Réussi : ${escH(Q.get('gain')||'une pièce pour ton enquête')}. Raté ou abandonné : ${escH(Q.get('malus')||'pas de pièce')}.`:`Un seul essai. Réussi : ${escH(Q.get('gain')||'un bonus')} et des points de jauge des skins. Raté ou abandonné : ${escH(Q.get('malus')||G.malus)}. Tout s’applique à 20:00.`}</p>
        ${st.tuto?tutoMini():guideMini()?`<div class="minis">${guideMini()}</div>`:''}<div class="row">${tutoBtns(RENF?'Commencer':'Intervenir')}</div>
        <button class="btn small" id="later" style="align-self:center">Plus tard</button>

const cv=$('cv'), ctx=cv.getContext('2d');
const N=5;
const BAND=.78;
const TUTO_CFG={time:0,band:.075,zone:.14,drift:.12,speed:.7};
const S={cfg:{band:.06,zone:.11,drift:.2,speed:1}, pins:[], active:0, tension:0, finger:.5, holding:false,
  t:0,p1:0,p2:0,jolt:0,outT:0,faults:0,shake:0,over:true,openT:-1,canPick:false,assist:false,checkTension:false,freeze:false,
  tutoStep:-1,tutoProg:0,tutoSets:0};
const mode=()=>Shell.st.mode;

function resetPins(){
  const tg=[]; for(let i=0;i<N;i++){ let t,k=0; do{ t=.4+Math.random()*.5; k++; }while(i>0 && Math.abs(t-tg[i-1])<.15 && k<50); tg.push(t); }
  S.pins=Array.from({length:N},(_,i)=>({h:.15,phi:Math.random()*6.28,w:2+i*.5,set:false,flash:0,target:tg[i]}));
  S.active=0;
}
const pinH=(p,i)=>.5+.42*Math.sin(p.phi)+.06*Math.sin(2.7*p.phi+i);
function startRound(cfg,o={}){
  S.cfg=cfg; resetPins(); keys.kbd=false; keys.up=keys.down=false; S.finger=.5; tpad.classList.remove('held');
  Object.assign(S,{t:0,p1:Math.random()*6,p2:Math.random()*6,jolt:0,outT:0,faults:0,shake:0,over:false,openT:-1,tension:0,holding:false,
    canPick:o.canPick??true, assist:!!o.assist, checkTension:o.checkTension??true, freeze:!!o.freeze});
  const z=cfg.zone; $('zone').style.top=((.5-z)*100)+'%'; $('zone').style.height=(z*200)+'%';
}
function finish(win){
  S.over=true; S.canPick=false; S.holding=false; Shell.stopTimer();
  const used=S.cfg.time-Shell.st.timeLeft;
  setTimeout(()=>Shell.result(win
    ?{ok:true,faults:S.faults,stats:[['Temps',used.toFixed(1)+' s'],['Erreurs',S.faults]]}
    :{ok:false,faults:S.faults,stats:[['Goupilles',S.active+'/5'],['Erreurs',S.faults]]}), win?1100:400);
}

/* ---------- tutoriel ---------- */
const STEPS=[
  {id:'tension',html:'<b>Pouce gauche sur Tension.</b> Garde l\'aiguille blanche dans le vert pendant 3 secondes. Elle dérive toute seule : corrige en glissant ton pouce.'},
  {id:'pick',html:'<b>Pouce droit.</b> La goupille active monte et descend. Chaque goupille a son propre cran, comme une vraie clé. Tape quand la jonction laiton-acier passe dans le cran lumineux. Tension assistée pour cet exercice.'},
  {id:'both',html:'<b>Les deux pouces ensemble.</b> Garde la tension dans le vert et cale 2 goupilles. Si la tension sort trop longtemps, la dernière goupille retombe.'}
];
function tutoGo(i){
  S.tutoStep=i; S.tutoProg=0; S.tutoSets=0;
  const id=STEPS[i].id;
  if(id==='tension'){ startRound(TUTO_CFG,{canPick:false,checkTension:false,freeze:true}); setPads('t'); }
  if(id==='pick'){ startRound(TUTO_CFG,{assist:true,checkTension:false}); setPads('p'); }
  if(id==='both'){ startRound(TUTO_CFG,{}); setPads('both'); }
  Shell.coach(i+1,3,STEPS[i].html+'<div class="prog"><i id="tprog"></i></div>');
}
function prog(f){ const e=$('tprog'); if(e) e.style.width=Math.min(100,f*100)+'%'; }
function tutoAdvance(){
  Shell.win(); Shell.toast('Bien joué','ok');
  S.canPick=false; S.checkTension=false;
  if(S.tutoStep<STEPS.length-1){ const nx=S.tutoStep+1; S.tutoStep+=.5; setTimeout(()=>{ if(mode()==='tuto') tutoGo(nx); },700); }
  else setTimeout(Shell.endTuto,700);
}
function setPads(w){
  const t=$('tpad'),p=$('ppad');
  t.classList.toggle('dim',w==='p'); p.classList.toggle('dim',w==='t');
  t.classList.toggle('focus',w==='t'||w==='both'); p.classList.toggle('focus',w==='p'||w==='both');
}

/* ---------- actions ---------- */
const inZone=()=>S.assist||Math.abs(S.tension-.5)<=S.cfg.zone;
function tap(){
  const pp=$('ppad'); pp.classList.add('hit'); setTimeout(()=>pp.classList.remove('hit'),90);
  if(!S.canPick||S.over||S.active>=N) return;
  const p=S.pins[S.active];
  if(!inZone()){ miss(S.holding?'Tension hors zone':'Pas de tension'); return; }
  const d=p.h-p.target;
  if(Math.abs(d)<=S.cfg.band){
    p.set=true; p.flash=1; S.active++;
    Shell.blip(1400,.05,'square',.05); Shell.buzz(15); Shell.toast('Goupille calée','ok');
    if(mode()==='tuto'){ S.tutoSets++; const need=STEPS[S.tutoStep].id==='pick'?1:2; prog(S.tutoSets/need); if(S.tutoSets>=need) tutoAdvance(); }
    else if(S.active>=N){ S.openT=0; Shell.win(); finish(true); }
  } else miss(d<0?'Trop bas':'Trop haut');
}
function miss(msg){
  if(mode()!=='tuto'||STEPS[S.tutoStep].id!=='pick') S.faults++;
  if(!S.assist) S.jolt+=(Math.random()<.5?-1:1)*(S.cfg.jolt??.13);
  S.shake=.25; Shell.bad(); Shell.toast(msg,'bad');
}
function dropLast(){
  if(S.active===0) return;
  S.active--; const p=S.pins[S.active]; p.set=false; p.phi=Math.random()*6.28;
  if(mode()==='play') S.faults++;
  S.shake=.35; Shell.blip(90,.25,'sawtooth',.06); Shell.buzz(80); Shell.toast('Goupille retombée','bad');
  if(mode()==='tuto'){ S.tutoSets=Math.max(0,S.tutoSets-1); prog(S.tutoSets/2); }
}

/* ---------- entrées ---------- */
const tpad=$('tpad'); let tId=null;
const fingerFrom=e=>{ const r=$('meter').getBoundingClientRect(); return Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height)); };
tpad.addEventListener('pointerdown',e=>{ e.preventDefault(); tId=e.pointerId; try{tpad.setPointerCapture(e.pointerId)}catch(_){} S.holding=true; S.finger=fingerFrom(e); tpad.classList.add('held'); Shell.blip(300,.04,'triangle',.03); });
tpad.addEventListener('pointermove',e=>{ if(e.pointerId===tId) S.finger=fingerFrom(e); });
const tRelease=e=>{ if(e.pointerId===tId){ tId=null; if(!keys.kbd){ S.holding=false; tpad.classList.remove('held'); } } };
tpad.addEventListener('pointerup',tRelease); tpad.addEventListener('pointercancel',tRelease);
$('ppad').addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
const keys={};
/* Ordinateur : la tension se règle à la souris (clic maintenu sur Tension) OU au clavier (flèches / Z-S / W-S :
   elle reste alors engagée toute seule, pas besoin de tenir une touche) ; on crochète avec Espace, K ou Entrée,
   ou d'un clic sur « Crocheter » quand la tension est au clavier. Jamais plus de deux mains occupées. */
const HAUT=['ArrowUp','KeyW','KeyZ'], BAS=['ArrowDown','KeyS'];
addEventListener('keydown',e=>{
  if(!$('overlay').hidden) return;
  if(HAUT.includes(e.code)||BAS.includes(e.code)){
    e.preventDefault();
    if(HAUT.includes(e.code)) keys.up=true; else keys.down=true;
    if(!keys.kbd&&!e.repeat){ keys.kbd=true; keys.hold=0; S.holding=true; tpad.classList.add('held'); }
  }
  if((e.code==='Space'||e.code==='KeyK'||e.code==='Enter')&&!e.repeat){ e.preventDefault(); tap(); }
});
addEventListener('keyup',e=>{
  if(HAUT.includes(e.code)) keys.up=false;
  if(BAS.includes(e.code)) keys.down=false;
  if(!keys.up&&!keys.down) keys.hold=0;
});
// Reprendre la souris sur Tension rend la main à la souris.
tpad.addEventListener('pointerdown',()=>{ keys.kbd=false; });

/* ---------- boucle ---------- */
function update(dt){
  const live=mode()==='play'||mode()==='tuto';
  S.t+=dt;
  if(keys.kbd){
    S.holding=!S.over;
    const dir=(keys.up?1:0)-(keys.down?1:0);
    if(dir){ keys.hold=(keys.hold||0)+dt; S.finger=Math.min(1,Math.max(0,S.finger+dir*dt*(keys.hold<.25?.32:.75))); }
  }
  const d=S.cfg.drift*(.6*Math.sin(S.t*.8+S.p1)+.4*Math.sin(S.t*1.9+S.p2));
  S.jolt*=Math.exp(-1.6*dt);
  if(S.assist) S.tension+=(.5-S.tension)*Math.min(1,dt*10);
  else if(S.holding&&!S.over){ const tg=Math.min(1,Math.max(0,S.finger+d+S.jolt)); S.tension+=(tg-S.tension)*Math.min(1,dt*14); }
  else S.tension+=(0-S.tension)*Math.min(1,dt*5);
  const ok=inZone();
  if(live&&!S.over){
    if(S.checkTension){ if(!ok){ S.outT+=dt; if(S.outT>(S.cfg.grace??.85)){ dropLast(); S.outT=0; } } else S.outT=Math.max(0,S.outT-dt*2); }
    if(mode()==='tuto'&&Number.isInteger(S.tutoStep)&&STEPS[S.tutoStep].id==='tension'){
      if(S.holding&&ok) S.tutoProg+=dt; else S.tutoProg=Math.max(0,S.tutoProg-dt*1.5);
      prog(S.tutoProg/3);
      if(S.tutoProg>=3){ S.tutoProg=-99; tutoAdvance(); }
    }
  }
  S.pins.forEach((p,i)=>{
    p.flash=Math.max(0,p.flash-dt*2);
    if(p.set) p.h+=(p.target-p.h)*Math.min(1,dt*20);
    else if(i===S.active&&!S.freeze&&live&&!S.over){ p.phi+=p.w*S.cfg.speed*dt; p.h=pinH(p,i); }
    else p.h+=(.15+.015*Math.sin(S.t*3+i)-p.h)*Math.min(1,dt*8);
  });
  S.shake=Math.max(0,S.shake-dt);
  if(S.openT>=0) S.openT+=dt;
  $('pinsTxt').innerHTML=`Goupilles <b>${S.active}</b> / ${N}`;
  $('faultTxt').innerHTML=`Erreurs <b>${S.faults}</b>`;
  $('pinsBar').innerHTML=S.pins.map(p=>`<i class="${p.set?'on':''}"></i>`).join('');
  $('needle').style.top=((1-S.tension)*100)+'%';
  $('needle').classList.toggle('out',!ok&&!S.assist&&live);
  $('finger').style.top=((1-S.finger)*100)+'%';
  const rd=$('tread'), st=!live?['Au repos','']:S.assist?['Assistée','ok']:!S.holding?['Relâchée','bad']:ok?['Zone verte','ok']:(S.tension>.5?['Trop forte','bad']:['Trop faible','bad']);
  const rc='read '+st[1]; if(rd.textContent!==st[0]) rd.textContent=st[0]; if(rd.className!==rc) rd.className=rc;
}

/* ---------- dessin ---------- */
let W=0,H=0,dpr=1, bg=null;
function resize(){ const r=cv.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; bg=null; }
new ResizeObserver(resize).observe(cv);
let g=ctx;
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h); }
function lg(x0,y0,x1,y1,stops){ const k=g.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>k.addColorStop(o,c)); return k; }
function rg(x,y,r0,r1,stops){ const k=g.createRadialGradient(x,y,r0,x,y,r1); stops.forEach(([o,c])=>k.addColorStop(o,c)); return k; }
const ACC='#ffc35a', OK='#46d98a', BAD='#ff5d5d';
const STEEL=[[0,'#4b525c'],[.18,'#9aa3ae'],[.38,'#f4f7fa'],[.55,'#b8c0c9'],[1,'#3d434b']];
const BRASS=[[0,'#6e4b17'],[.2,'#b8862f'],[.4,'#ffe3a0'],[.58,'#d6a548'],[1,'#5c3e12']];
function geo(){
  const top=40, bot=H-26, Hl=Math.max(90,bot-top), x0=14, w=W-28;
  return {top,Hl,x0,w, ys:top+Hl*.5, K:Hl*.42, Lk:Hl*.16, Ld:Hl*.17, xs:i=>x0+w*(.3+i*.155), cw:Math.min(30,w*.08)};
}
function screw(x,y,r){
  g.fillStyle=rg(x-r*.3,y-r*.3,0,r*1.2,[[0,'#d9dde2'],[.5,'#7b828c'],[1,'#2b2f35']]); g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=1; g.stroke();
  g.strokeStyle='rgba(20,22,26,.85)'; g.lineWidth=Math.max(1.2,r*.28); g.beginPath(); g.moveTo(x-r*.6,y-r*.25); g.lineTo(x+r*.6,y+r*.25); g.stroke();
}
function brushed(x,y,w,h,alpha,vertical){
  g.save(); rr(x,y,w,h,0); g.clip();
  for(let k=0;k<(vertical?w:h);k+=1.5){ const a=Math.random()*alpha; g.fillStyle=Math.random()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a*1.4})`;
    vertical?g.fillRect(x+k,y,1,h):g.fillRect(x,y+k,w,1); }
  g.restore();
}
/* Couche fixe (cadre, plaque, rotor, logements) : dessinée une fois par taille d'écran. */
function buildBg(){
  const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height; g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const {top,Hl,x0,w,xs,cw}=geo();
  // cadre extérieur (métal sombre biseauté)
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=26; g.shadowOffsetY=12;
  rr(x0,top-14,w,Hl+22,26); g.fillStyle=lg(0,top-14,0,top+Hl+8,[[0,'#40444b'],[.5,'#26292e'],[1,'#17191c']]); g.fill(); g.restore();
  rr(x0+.5,top-13.5,w-1,Hl+21,25.5); g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1; g.stroke();
  rr(x0+7,top-7,w-14,Hl+8,20); g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=2; g.stroke();
  // plaque intérieure brossée
  rr(x0+9,top-5,w-18,Hl+4,18); g.fillStyle=lg(0,top,0,top+Hl,[[0,'#3c4149'],[1,'#22262c']]); g.fill();
  brushed(x0+9,top-5,w-18,Hl+4,.05,false);
  rr(x0+9.5,top-4.5,w-19,Hl+3,17.5); g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; g.stroke();
  // vis aux coins
  const sr=Math.max(4,Math.min(7,w*.016));
  screw(x0+20,top+6,sr); screw(x0+w-20,top+6,sr); screw(x0+w-20,top+Hl-14,sr);
  // rotor laiton (fenêtre de coupe)
  const plugX=x0+w*.15, ys=top+Hl*.5, pw=w*.83, ph=top+Hl-ys-10;
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=10; g.shadowOffsetY=3;
  rr(plugX,ys,pw,ph,14); g.fillStyle=lg(0,ys,0,ys+ph,[[0,'#8a6a33'],[.18,'#c79a4c'],[.45,'#8e6a2c'],[1,'#3f2d10']]); g.fill(); g.restore();
  brushed(plugX,ys,pw,ph,.06,true);
  rr(plugX+.5,ys+.5,pw-1,ph-1,13.5); g.strokeStyle='rgba(255,226,160,.35)'; g.lineWidth=1; g.stroke();
  // ligne de cisaillement
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=2; g.beginPath(); g.moveTo(plugX+8,ys+1); g.lineTo(plugX+pw-8,ys+1); g.stroke();
  // canal de clé
  rr(plugX+6,top+Hl*.86,pw-12,Hl*.07,6); g.fillStyle=lg(0,top+Hl*.86,0,top+Hl*.93,[[0,'#020203'],[1,'#15171b']]); g.fill();
  g.strokeStyle='rgba(255,226,160,.18)'; g.stroke();
  // logements de goupilles (creusés)
  for(let i=0;i<N;i++){
    const x=xs(i)-cw/2-5, y=top+8, hh=Hl*.83+2, ww=cw+10;
    rr(x-1.5,y-1.5,ww+3,hh+3,12); g.fillStyle=lg(x,0,x+ww,0,[[0,'#6b5530'],[.5,'#2b2418'],[1,'#a2834a']]); g.fill();
    rr(x,y,ww,hh,11); g.fillStyle=lg(x,0,x+ww,0,[[0,'#020203'],[.25,'#0e1013'],[.7,'#15181c'],[1,'#050607']]); g.fill();
    g.save(); rr(x,y,ww,hh,11); g.clip(); g.fillStyle=lg(0,y,0,y+18,[[0,'rgba(0,0,0,.8)'],[1,'rgba(0,0,0,0)']]); g.fillRect(x,y,ww,18); g.restore();
  }
  // médaillon de serrure en laiton
  const mx=x0+w*.09, my=top+Hl*.895, mr=Math.min(w*.075,Hl*.088);
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=12; g.shadowOffsetY=4;
  g.fillStyle=rg(mx-mr*.35,my-mr*.4,0,mr*1.25,[[0,'#ffeab0'],[.35,'#d4a24a'],[.8,'#7d5719'],[1,'#4a320c']]); g.beginPath(); g.arc(mx,my,mr,0,7); g.fill(); g.restore();
  g.strokeStyle='rgba(60,40,10,.8)'; g.lineWidth=1.5; g.beginPath(); g.arc(mx,my,mr*.82,0,7); g.stroke();
  g.fillStyle='#0a0705'; g.beginPath(); g.arc(mx,my-mr*.18,mr*.22,0,7); g.fill();
  g.beginPath(); g.moveTo(mx-mr*.11,my-mr*.1); g.lineTo(mx+mr*.11,my-mr*.1); g.lineTo(mx+mr*.17,my+mr*.42); g.lineTo(mx-mr*.17,my+mr*.42); g.closePath(); g.fill();
  g=ctx; return c;
}
function spring(cx,y0,y1,r){
  const turns=Math.max(5,Math.round((y1-y0)/12)), n=turns*14, tilt=Math.min(4.5,(y1-y0)/turns*.3);
  const P=k=>{ const f=k/n, a=f*turns*Math.PI*2; return [cx+Math.sin(a)*r, y0+(y1-y0)*f+Math.cos(a)*tilt, Math.cos(a)]; };
  g.lineCap='round';
  for(const front of [false,true]){
    for(let k=0;k<n;k++){ const a=P(k), b=P(k+1); if((a[2]+b[2]>0)!==front) continue;
      const s=front?(.55+.45*Math.abs(Math.sin((k/n)*turns*Math.PI*2))):0;
      g.strokeStyle=front?`rgb(${150+s*95|0},${158+s*92|0},${168+s*84|0})`:'#3d434b'; g.lineWidth=front?2.2:1.6;
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  }
}
function driverPin(x,y,cw,h,i){
  rr(x,y,cw,h,cw*.22); g.fillStyle=lg(x,0,x+cw,0,STEEL); g.fill();
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(x+cw*.1,y+1.5,cw*.8,1.2);
  // goupilles de sécurité : profil en bobine / dentelé
  const grooves=i%2? [ .35,.5,.65 ] : [ .5 ];
  grooves.forEach(f=>{ const yy=y+h*f; g.fillStyle='rgba(15,17,20,.75)'; g.fillRect(x,yy-1.6,cw,3.2); g.fillStyle='rgba(255,255,255,.4)'; g.fillRect(x+1,yy+1.6,cw-2,1); });
  if(i%2){ g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x,y+h*.3,cw*.14,h*.4); g.fillRect(x+cw*.86,y+h*.3,cw*.14,h*.4); }
}
function keyPin(x,y,cw,Lk,cx){
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+cw,y); g.lineTo(x+cw,y+Lk*.74); g.quadraticCurveTo(cx+cw*.2,y+Lk,cx,y+Lk); g.quadraticCurveTo(cx-cw*.2,y+Lk,x,y+Lk*.74); g.closePath();
  g.fillStyle=lg(x,0,x+cw,0,BRASS); g.fill();
  g.fillStyle='rgba(255,240,200,.5)'; g.fillRect(x+cw*.1,y+1,cw*.8,1.2);
  g.fillStyle='rgba(60,38,8,.65)'; g.fillRect(x,y+Lk*.3,cw,2.4); g.fillStyle='rgba(255,230,170,.45)'; g.fillRect(x+1,y+Lk*.3+2.4,cw-2,1);
}
function draw(){
  if(!bg && W>0) bg=buildBg();
  g=ctx; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(S.shake>0){ const a=S.shake*10; ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  if(bg) ctx.drawImage(bg,0,0,W,H);
  const live=mode()==='play'||mode()==='tuto';
  const {top,Hl,x0,w,ys,K,Lk,Ld,xs,cw}=geo();
  const open=S.openT>=0?Math.min(1,S.openT/.6):0;
  const plugX=x0+w*.15, bw=S.cfg.band*K;

  S.pins.forEach((p,i)=>{
    const cx=xs(i), x=cx-cw/2, yTop=ys+(BAND-p.h)*K, isAct=i===S.active&&live&&!S.over;
    const ch={x:x-5,y:top+8,w:cw+10,h:Hl*.83+2};
    spring(cx,top+12,yTop-Ld,cw*.36);
    driverPin(x,yTop-Ld,cw,Ld-2,i);
    keyPin(x,yTop+1,cw,Lk,cx);
    // cran cible : anneau lumineux autour du logement
    const yT=ys+(BAND-p.target)*K, good=p.set||open, col=good?OK:ACC;
    ctx.save();
    if(isAct||good){ ctx.shadowColor=col; ctx.shadowBlur=isAct?18:10; }
    rr(x-9,yT-bw,cw+18,bw*2,bw); ctx.fillStyle=good?'rgba(70,217,138,.2)':(isAct?'rgba(255,195,90,.22)':'rgba(255,195,90,.05)'); ctx.fill();
    ctx.strokeStyle=good?OK:(isAct?ACC:'rgba(255,195,90,.32)'); ctx.lineWidth=isAct?2.4:1.3; ctx.stroke();
    ctx.restore();
    if(p.set&&p.flash>0){ ctx.save(); ctx.globalAlpha=p.flash; ctx.strokeStyle=OK; ctx.lineWidth=3; ctx.shadowColor=OK; ctx.shadowBlur=14; rr(x-6,yTop-Ld-4,cw+12,Ld+Lk*.8+8,10); ctx.stroke(); ctx.restore(); }
    if(isAct){ ctx.save(); ctx.shadowColor=ACC; ctx.shadowBlur=16; ctx.strokeStyle='rgba(255,195,90,.85)'; ctx.lineWidth=2; rr(ch.x,ch.y,ch.w,ch.h,11); ctx.stroke(); ctx.restore(); }
  });

  // clé qui se dessine au fil des goupilles calées
  if(S.active>0){
    const kb=top+Hl*.93, tip=i=>ys+(BAND-S.pins[i].h)*K+Lk;
    ctx.beginPath(); ctx.moveTo(plugX+8,kb); ctx.lineTo(plugX+8,tip(0)+10);
    for(let i=0;i<S.active;i++){ const cx=xs(i); ctx.lineTo(cx-cw*.8,tip(i)+9); ctx.lineTo(cx,tip(i)+2); ctx.lineTo(cx+cw*.8,tip(i)+9); }
    ctx.lineTo(xs(S.active-1)+cw*1.2,kb); ctx.closePath();
    ctx.fillStyle=lg(0,top+Hl*.5,0,kb,[[0,'rgba(255,227,160,.9)'],[1,'rgba(150,108,34,.9)']]); ctx.fill();
    ctx.strokeStyle='rgba(255,240,200,.5)'; ctx.lineWidth=1; ctx.stroke();
  }
  // crochet : tige d'acier poli
  if(live&&S.active<N&&!S.over){
    const p=S.pins[S.active], cx=xs(S.active), tipY=Math.min(ys+(BAND-p.h)*K+Lk+2,top+Hl*.895-2), base=top+Hl*.895;
    const path=()=>{ ctx.beginPath(); ctx.moveTo(-4,base); ctx.lineTo(cx-18,base); ctx.quadraticCurveTo(cx-4,base,cx,tipY); };
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2; ctx.strokeStyle='#30353c'; ctx.lineWidth=6.5; path(); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='#a9b2bd'; ctx.lineWidth=4.5; path(); ctx.stroke();
    ctx.strokeStyle='#f6f9fc'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-4,base-1.2); ctx.lineTo(cx-18,base-1.2); ctx.stroke();
  }
  // clé de tension : barre d'acier avec LED
  const ok=inZone(), led=!live?'#3b4048':(ok?OK:BAD);
  ctx.save(); ctx.translate(x0+w*.09,top+Hl*.895); ctx.rotate(-S.tension*.35+open*.5);
  const L1=Hl*.24, L2=w*.08; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  ctx.strokeStyle='#2b3036'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(-w*.025,-L1); ctx.lineTo(0,0); ctx.lineTo(L2,0); ctx.stroke(); ctx.restore();
  ctx.strokeStyle=lg(-6,0,6,0,STEEL); ctx.lineWidth=7.5; ctx.beginPath(); ctx.moveTo(-w*.025,-L1); ctx.lineTo(0,0); ctx.lineTo(L2,0); ctx.stroke();
  for(let k=0;k<4;k++){ const f=.18+k*.22, lx=-w*.025*f, ly=-L1*f;
    ctx.save(); if(live){ ctx.shadowColor=led; ctx.shadowBlur=10; }
    ctx.fillStyle=led; ctx.beginPath(); ctx.arc(lx,ly,2.6,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(lx-.7,ly-.8,.8,0,7); ctx.fill(); }
  ctx.restore();

  // reflet de la vitre
  ctx.save(); rr(x0+9,top-5,w-18,Hl+4,18); ctx.clip();
  ctx.fillStyle=lg(x0,top,x0+w*.7,top+Hl*.7,[[0,'rgba(255,255,255,.07)'],[.35,'rgba(255,255,255,.02)'],[.36,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']]); ctx.fillRect(x0,top-5,w,Hl+4);
  ctx.restore();

  if(open>0){ ctx.save(); ctx.globalAlpha=open; ctx.fillStyle=OK; ctx.shadowColor=OK; ctx.shadowBlur=14; ctx.font='800 24px "Bricolage Grotesque", system-ui, sans-serif'; ctx.textAlign='right'; ctx.fillText('Ouvert', x0+w-34, top+14); ctx.restore(); }
}

Shell.init({
  key:'crochetage', service:'Incident SER', serviceShort:'SER',
  headline:'Porte verrouillée',
  story:`<p>Le juge d'instruction a délivré un mandat de perquisition pour le 14, rue des Tanneurs, dans un dossier de recel. Sur place, personne n'ouvre et le serrurier ne répond pas.</p><p>Ton équipe SER doit ouvrir la porte avant que le suspect ne fasse disparaître les preuves.</p>`,
  diffs:{difficile:{agents:2,label:'Difficile',time:50,band:.05,zone:.095,drift:.22,speed:1.12,jolt:.09,grace:1},normal:{agents:4,label:'Normal',time:60,band:.06,zone:.11,drift:.2,speed:1},facile:{agents:6,label:'Facile',time:75,band:.075,zone:.14,drift:.15,speed:.85}},
  bornes:{time:[18,Infinity],band:[.02,1],zone:[.045,1],drift:[0,.45],speed:[0,2.3]},
  diffHint:"Plus d'agents : crans plus larges, tension plus stable, plus de temps.",
  desktopHint:'Sur ordinateur, au choix : <b>souris</b> (clic maintenu sur Tension, glisse haut/bas) et <b>Espace</b> pour crocheter ; ou <b>clavier seul</b> : flèches ↑ ↓ pour doser la tension (elle reste engagée toute seule) et Espace pour crocheter.',
  rules:['Cale les <b>5 goupilles</b>, de gauche à droite, avant la fin du chrono.','Chaque goupille a <b>son propre cran</b>. Ta clé se dessine au fil des goupilles calées.','Un tap raté fait <b>tressauter la tension</b>.','Tension hors du vert près d\'une seconde : <b>la dernière goupille retombe</b>.','Sans erreur : <b>+2</b> sur la jauge skins. Avec erreurs : <b>+1</b>.'],
  winTitle:'Porte ouverte', loseTitle:'La porte a tenu', skin:'Porte blindée',
  malus:"perquisition reportée. 1 agent SER est mobilisé sur la planque et reste indisponible demain.",
  onMenu(){ S.over=true; S.canPick=false; setPads(null); },

  onFrame(dt){ update(dt); draw(); }
});
