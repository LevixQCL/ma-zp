<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Profil ADN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:76px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}


.gel{position:relative;flex:1;min-height:200px;border-radius:18px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 80% at 50% 0%,#14233a,#0a111d 70%);box-shadow:inset 0 0 0 1px rgba(120,170,255,.14),inset 0 0 50px rgba(40,90,180,.12)}
.gel canvas{position:absolute;inset:0;width:100%;height:100%}
.sel{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:22px;font-size:13px;color:var(--mute)}
.sel b{color:var(--ink)}
.sel .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.legend{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle}
.status{flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}

</style>
</head>
<body>
<script>document.body.classList.add('svc-lab')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg></div>
    <div class="ttl"><div class="eyebrow">Labo · démo</div><h1>Profil ADN</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>
  <div class="gauge" id="gaugeRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg><span>Jauge skins</span><div class="gbar"><i id="gfill"></i></div><span><b id="gtext">46</b> / 50</span></div>
  <div class="coach" id="coach" hidden></div>
  <div class="stage" id="stage">

  <div class="gel" id="gel"><canvas id="cv" aria-label="Gel d’électrophorèse : échelle, trace, victime et suspects"></canvas></div>
  <div class="sel" id="sel">Glisse la piste <b>Vict.</b> ou un suspect sur la <b>Trace</b> pour comparer.</div>
  <div class="legend"><span><i style="border:1.5px dashed #8fb4ff"></i>Victime superposée</span><span><i style="border:1.5px solid var(--accent)"></i>Suspect superposé</span></div>
  <div class="status"><span id="exTxt">Exclus 0/3</span><span id="faultTxt">Erreurs 0</span></div>

  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3.5 13h17"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6.5 6.5 0 0 1 11 0"/><path d="M5.5 13c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5c0 1.6-.2 3.1-.6 4.5"/><path d="M8.5 19.5c-.6-1.9-1-4-1-6.5a4.5 4.5 0 0 1 9 0c0 2.2-.4 4.3-1.1 6"/><path d="M12 12.5c0 3 .5 5.7 1.4 8"/><path d="M10.6 21c-.7-1.7-1.1-3.6-1.1-5.5"/></svg>',
  dna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;

  let joue=false, fini=false;

      <div class="row">${boutons}</div>`);
    if(INC) $('back').onclick=()=>post('close'); else { $('again').onclick=play; $('tomenu').onclick=menu; }
  }

  const CIRC = 2*Math.PI*21;
  let last=performance.now();
  function frame(ts){
    const dt=Math.min(.05,(ts-last)/1000); last=ts;
    if(st.timerOn){ st.timeLeft-=dt*st.timerRate; if(st.timeLeft<=0){ st.timeLeft=0; st.timerOn=false; st.onTimeout && st.onTimeout(); } }

    $('timer').textContent = playing ? fmt(st.timeLeft) : '–';

  function init(cfg){

      b.onclick=()=>{ if(INC && joue && !fini && st.mode==='play'){ askQuit(); return; } if(MODE==='train' && st.mode!=='menu'){ menu(); return; } post('close'); };
    } else $('menuBtn').onclick=menu;

  function askQuit(){
    const was=st.timerOn; st.timerOn=false; st.pause=true;
    showCard(`<h2>Abandonner l’incident ?</h2><p>Tu n’as qu’un essai : si tu quittes maintenant, l’incident compte comme raté et le malus tombera à 20:00.</p>

    $('stay').onclick=()=>{ hide(); st.timerOn=was; st.pause=false; };
    $('quit').onclick=()=>{ fini=true; post('result',{ok:false, fautes:1, pts:0, abandon:true}); post('close'); };
  }
  return {init, st, blip, good, bad, win, buzz, toast, shake, coach, hideCoach, endTuto, startTimer, stopTimer, result, menu, fmt};
})();


/* Profil ADN mixte : la trace = ADN de la victime + ADN de l'auteur.
   Pour exclure un suspect, il faut montrer la preuve :
   A) un de ses allèles est absent de la trace, ou
   B) une bande de la trace n'est expliquée ni par la victime ni par lui. */
const LOCI=[
  {n:'TH01',min:5,max:11},{n:'TPOX',min:6,max:12},{n:'D3S1358',min:12,max:19},{n:'vWA',min:13,max:20},
  {n:'D8S1179',min:9,max:16},{n:'FGA',min:19,max:26},{n:'D5S818',min:8,max:14},{n:'D13S317',min:8,max:14}];
const NOMS=['DUBOIS','LAMBERT','PEETERS','JANSSENS','LEROY','RENARD','MERTENS','LEJEUNE','HERMANS','CLAES','WAUTERS','MICHAUX','DUMONT','GILSON'];
const PRE=['Kevin','Mehdi','Julien','Arnaud','Loïc','Damien','Youssef','Maxime','Dylan','Thomas'];
const PEN=8;
function allele(L){ const c=(L.min+1+L.max)/2, r=(L.max-L.min)/4; let a; do{ a=Math.round(c+(Math.random()+Math.random()+Math.random()-1.5)*r*1.4); }while(a<L.min+1||a>L.max); return a; }
const geno=L=>{ const a=allele(L), b=Math.random()<.14?a:allele(L); return [a,b].sort((x,y)=>x-y); };
const uniq=a=>[...new Set(a)];

function makeCase(cfg, forced){
  for(let tries=0;tries<200;tries++){
    const loci=forced?forced.loci.map(n=>LOCI.find(l=>l.n===n)):shuffle(LOCI).slice(0,cfg.loci);
    const vic=loci.map(geno), perp=loci.map(geno);
    const nS=cfg.suspects, srcIdx=forced?forced.src:randi(0,nS-1);
    const types=forced?forced.types:shuffle(cfg.types).slice(0,nS-1);
    const trace=loci.map((L,i)=>uniq([...vic[i],...perp[i]]));
    const sus=[]; let ok=true; const usedLoci=new Set();
    for(let k=0,d=0;k<nS;k++){
      if(k===srcIdx){ sus.push({g:perp.map(x=>x.slice()), perp:true}); continue; }
      const t=types[d++], g=perp.map(x=>x.slice());
      // variantes compatibles (camouflage) : un allèle partagé avec la victime remplacé par l'autre allèle de la victime
      loci.forEach((L,i)=>{ if(Math.random()<.35){ const j=g[i].findIndex(a=>vic[i].includes(a)); if(j>=0){ const alt=vic[i].find(a=>a!==g[i][j]); if(alt!==undefined) g[i][j]=alt; } } });
      // la différence qui l'exclut
      const cand=shuffle(loci.map((_,i)=>i)).filter(i=>!usedLoci.has(i)||usedLoci.size>=loci.length);
      let done=false;
      for(const i of (forced?[forced.at[d-1]]:cand)){
        const L=loci[i];
        if(t==='A'){ const free=[]; for(let a=L.min+1;a<=L.max;a++) if(!trace[i].includes(a)) free.push(a); if(!free.length) continue;
          g[i]=perp[i].slice(); g[i][randi(0,1)]=pick(free); }
        else { const own=perp[i].filter(a=>!vic[i].includes(a)); if(!own.length || perp[i][0]===perp[i][1]) continue;
          const x=pick(own); g[i]=perp[i].slice(); g[i][g[i].indexOf(x)]=pick(vic[i]); if(g[i].includes(x)) continue; }
        g[i].sort((a,b)=>a-b); usedLoci.add(i); done=true; break;
      }
      if(!done){ ok=false; break; }
      sus.push({g, type:t});
    }
    if(!ok) continue;
    // vérifications : l'auteur est compatible, chaque autre suspect a au moins une preuve d'exclusion, pas de doublon
    const proofs=s=>loci.reduce((n,L,i)=>n+s.g[i].filter(a=>!trace[i].includes(a)).length+trace[i].filter(b=>!vic[i].includes(b)&&!s.g[i].includes(b)).length,0);
    if(sus.some(s=>s.perp?proofs(s)!==0:proofs(s)===0)) continue;
    const keys=sus.map(s=>JSON.stringify(s.g)); if(new Set(keys).size!==keys.length) continue;
    const noms=shuffle(NOMS);
    sus.forEach((s,k)=>{ s.nom=noms[k]; s.pre=pick(PRE); s.ex=false; });
    // intensités de la trace (doses × part de chaque contributeur) et stutters (une répétition plus bas)
    const bands=loci.map((L,i)=>{
      const m=new Map(); const add=(a,w)=>m.set(a,(m.get(a)||0)+w);
      vic[i].forEach(a=>add(a,cfg.wv)); perp[i].forEach(a=>add(a,cfg.wp));
      const out=[...m].map(([a,w])=>({a, al:Math.min(1,.42*w*(.9+Math.random()*.2)), main:true}));
      if(cfg.stutter) for(const b of out.slice()){ if(!m.has(b.a-1) && b.a-1>=L.min) { const e=out.find(o=>o.a===b.a-1); const al=b.al*cfg.stutter*(.8+Math.random()*.4); if(e) e.al+=al; else out.push({a:b.a-1, al, main:false}); } }
      return out;
    });
    return {loci, vic, perp, sus, trace, bands, srcIdx};
  }
  throw new Error('cas introuvable');
}

/* ---------- état et géométrie ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), gel=$('gel');
const D={C:null, cfg:null, over:true, faults:0, sel:-1, ovV:false, ovS:-1, exp:0, ap:[], drag:null, flash:null, tuto:0, dirty:true};
let geo={w:0,h:0,dpr:1};
function resize(){ const r=gel.getBoundingClientRect(), dpr=Math.min(2.5,devicePixelRatio||1); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); geo={w:r.width,h:r.height,dpr}; D.dirty=true; }
new ResizeObserver(resize).observe(gel);
const HEAD=46, AX=52;
const lanesN=()=>3+D.C.sus.length;
const laneW=()=>(geo.w-AX-6)/lanesN();
const laneX=i=>AX+i*laneW();
const range=L=>L.max-L.min+1;
function targetAp(){
  const C=D.C, pads=C.loci.length*22, avail=geo.h-HEAD-10-pads;
  const re=range(C.loci[D.exp]), rc=C.loci.reduce((n,L,i)=>n+(i===D.exp?0:range(L)),0);
  let apc=4.6, ape=(avail-rc*apc)/re; if(ape<15){ apc=3.4; ape=(avail-rc*apc)/re; }
  if(ape>26){ ape=26; apc=Math.min(8,(avail-re*ape)/rc); }
  return C.loci.map((_,i)=>Math.max(2,i===D.exp?Math.min(28,ape):apc));
}
function layout(){
  let y=HEAD+8; return D.C.loci.map((L,i)=>{ const top=y, ap=D.ap[i], h=18+range(L)*ap+4; y+=h; return {top, ap, h, ya:a=>top+18+(L.max-a+.5)*ap}; });
}
// pistes : 0 échelle, 1 trace, 2 victime, 3+ suspects
function laneBands(li, i){
  const C=D.C, L=C.loci[i];
  if(li===0){ const r=[]; for(let a=L.min;a<=L.max;a++) r.push({a, al:.42, main:true}); return r; }
  if(li===1) return C.bands[i];
  const g=li===2?C.vic[i]:C.sus[li-3].g[i];
  return g[0]===g[1]?[{a:g[0], al:.95, main:true}]:g.map(a=>({a, al:.62, main:true}));
}

/* ---------- dessin ---------- */
function band(x,y,w,h,al,col='255,206,102'){
  ctx.fillStyle=`rgba(${col},${Math.min(1,al)})`; ctx.shadowColor=`rgba(${col},${Math.min(.9,al)})`; ctx.shadowBlur=al>.25?8:3;
  h=Math.max(1,h); ctx.beginPath(); ctx.roundRect(x,y-h/2,w,h,h/2); ctx.fill(); ctx.shadowBlur=0;
}
function draw(){
  if(!D.C) return;
  const C=D.C, {dpr,w,h}=geo, lw=laneW(), lay=layout(), n=lanesN();
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  // puits et couloirs
  for(let li=0;li<n;li++){ const x=laneX(li)+lw*.12, ww=lw*.76;
    const sel=li>=3&&D.sel===li-3, ex=li>=3&&C.sus[li-3].ex;
    ctx.fillStyle=sel?'rgba(63,224,200,.10)':li===1?'rgba(255,206,102,.05)':'rgba(255,255,255,.025)';
    ctx.fillRect(x,HEAD,ww,h-HEAD);
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x+2,HEAD+1,ww-4,4);
    // en-têtes
    const lbl=li===0?'Éch.':li===1?'Trace':li===2?'Vict.':'S'+(li-2);
    const drag=D.drag&&D.drag.li===li&&D.drag.moved;
    ctx.globalAlpha=drag?.35:1;
    ctx.fillStyle=sel?'#3fe0c8':li===1?'rgba(255,206,102,.18)':(li>=2?'rgba(255,255,255,.09)':'rgba(255,255,255,.04)');
    ctx.beginPath(); ctx.roundRect(laneX(li)+3,6,lw-6,32,9); ctx.fill();
    if(li===1 && D.drag && D.drag.moved){ ctx.strokeStyle='#ffce66'; ctx.lineWidth=2; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle=sel?'#022019':li===1?'#ffce66':li===0?'#8f9bb1':'#eef2f8';
    ctx.font=`700 ${lw<40?11:13}px "Instrument Sans",system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(lbl, laneX(li)+lw/2, 22); ctx.globalAlpha=1;
  }
  // loci
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  C.loci.forEach((L,i)=>{
    const g=lay[i], expd=i===D.exp;
    ctx.fillStyle=expd?'rgba(63,224,200,.07)':'rgba(255,255,255,.0)'; ctx.fillRect(2,g.top,w-4,g.h);
    ctx.strokeStyle='rgba(143,180,255,.12)'; ctx.beginPath(); ctx.moveTo(2,g.top+g.h); ctx.lineTo(w-2,g.top+g.h); ctx.stroke();
    ctx.fillStyle=expd?'#3fe0c8':'#8f9bb1'; ctx.font=`700 ${expd?12:10.5}px "IBM Plex Mono",monospace`; ctx.fillText(L.n,6,g.top+13);
    if(!expd){ ctx.fillStyle='#5d6880'; ctx.font='600 10px "Instrument Sans",sans-serif'; ctx.textAlign='right'; ctx.fillText('ouvrir ▾',w-8,g.top+13); ctx.textAlign='left'; }
    if(expd){ ctx.font='500 10.5px "IBM Plex Mono",monospace'; ctx.fillStyle='#8f9bb1'; ctx.textAlign='right';
      for(let a=L.min;a<=L.max;a++) ctx.fillText(a, AX-8, g.ya(a)+3.5); ctx.textAlign='left'; }
    const bh=expd?Math.min(6,g.ap*.3):2.2;
    for(let li=0;li<n;li++){
      if(D.drag&&D.drag.moved&&D.drag.li===li) continue;
      const ex=li>=3&&C.sus[li-3].ex, x=laneX(li)+lw*.19, bw=lw*.62;
      for(const b of laneBands(li,i)){ band(x,g.ya(b.a),bw,bh,b.al*(ex?.35:1), li===0?'200,215,240':undefined); }
    }
    // superpositions sur la trace
    const tx=laneX(1)+lw*.13, tw=lw*.74, oh=Math.max(bh+5,expd?11:5);
    if(D.ovV){ ctx.setLineDash([3,3]); ctx.strokeStyle='#8fb4ff'; ctx.lineWidth=1.4; for(const a of uniq(C.vic[i])){ ctx.strokeRect(tx,g.ya(a)-oh/2,tw,oh); } ctx.setLineDash([]); }
    if(D.ovS>=0){ ctx.strokeStyle='#3fe0c8'; ctx.lineWidth=1.6; for(const a of uniq(C.sus[D.ovS].g[i])){ ctx.strokeRect(tx-2,g.ya(a)-oh/2-2,tw+4,oh+4); } }
    // repère de preuve
    if(D.flash && D.flash.i===i){ const f=D.flash; ctx.strokeStyle=f.ok?'#46d98a':'#ff5d5d'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(laneX(f.li)+lw/2,g.ya(f.a),Math.max(9,g.ap*.6),0,TAU); ctx.stroke(); }
  });
  // exclus
  C.sus.forEach((s,k)=>{ if(!s.ex && !(D.won && s.perp)) return; const x=laneX(k+3)+lw/2, y=HEAD+(h-HEAD)/2;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-Math.PI/2); ctx.font='800 15px "Bricolage Grotesque",sans-serif'; ctx.textAlign='center';
    ctx.fillStyle=s.ex?'rgba(255,93,93,.9)':'rgba(70,217,138,.95)'; ctx.fillText(s.ex?'EXCLU':'CONCORDANT',0,5); ctx.restore(); });
  // piste glissée
  if(D.drag&&D.drag.moved){ const li=D.drag.li, dx=D.drag.x-lw/2, over=overTrace(D.drag.x);
    ctx.fillStyle=over?'rgba(255,206,102,.12)':'rgba(255,255,255,.06)'; ctx.fillRect(dx+lw*.1,HEAD,lw*.8,h-HEAD);
    ctx.fillStyle='#3fe0c8'; ctx.beginPath(); ctx.roundRect(dx+3,6,lw-6,32,9); ctx.fill();
    ctx.fillStyle='#022019'; ctx.font='700 13px "Instrument Sans",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(li===2?'Vict.':'S'+(li-2),dx+lw/2,22);
    C.loci.forEach((L,i)=>{ const g=lay[i], bh=i===D.exp?Math.min(6,g.ap*.3):2.2; for(const b of laneBands(li,i)) band(dx+lw*.19,g.ya(b.a),lw*.62,bh,b.al*.9,'63,224,200'); });
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; }
}
const TAU=Math.PI*2;
const overTrace=x=>x>=laneX(1)-6 && x<=laneX(2)+6;

/* ---------- interactions ---------- */
const rel=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
const laneAt=x=>Math.floor((x-AX)/laneW());
cv.addEventListener('pointerdown',e=>{
  if(!D.C || (D.over && Shell.st.mode!=='tuto')) return;
  cv.setPointerCapture(e.pointerId); const [x,y]=rel(e), li=laneAt(x);
  D.down={x,y,li,id:e.pointerId};
  if(y<HEAD && li>=2) D.drag={li,x,moved:false};
});
cv.addEventListener('pointermove',e=>{
  if(!D.drag||!D.down||D.down.id!==e.pointerId) return; const [x]=rel(e);
  if(Math.abs(x-D.down.x)>8) D.drag.moved=true; D.drag.x=x; D.dirty=true;
});
cv.addEventListener('pointerup',e=>{
  if(!D.down||D.down.id!==e.pointerId) return; const [x,y]=rel(e), dn=D.down; D.down=null;
  if(D.drag&&D.drag.moved){ const li=D.drag.li; D.drag=null; D.dirty=true; if(overTrace(x)) drop(li); return; }
  D.drag=null;
  if(Math.hypot(x-dn.x,y-dn.y)>12) return;
  tap(x,y,dn.li);
});
cv.addEventListener('pointercancel',()=>{ D.down=null; D.drag=null; D.dirty=true; });

function drop(li){
  if(li===2){ D.ovV=true; Shell.good(); Shell.toast('Victime superposée','info'); if(Shell.st.mode==='tuto'&&D.tuto===1) tutoNext(); }
  else { const k=li-3; D.ovS=k; select(k); Shell.good(); Shell.toast(`S${k+1} superposé`,'info'); }
  D.dirty=true;
}
function select(k){
  if(k<0||!D.C.sus[k]) return; D.sel=k; const s=D.C.sus[k];
  $('sel').innerHTML=`<span class="dot"></span><span>Sélection : <b>S${k+1} · ${s.nom} ${s.pre}</b>${s.ex?' · exclu':''}</span>`; D.dirty=true;
}
function tap(x,y,li){
  const C=D.C;
  if(y<HEAD){ if(li>=3) select(li-3); else if(li===2) Shell.toast('Glisse Vict. sur la Trace','info'); else if(li===1) Shell.toast('La trace mixte','info'); return; }
  const lay=layout(), i=lay.findIndex(g=>y>=g.top&&y<g.top+g.h);
  if(i<0) return;
  if(i!==D.exp){ D.exp=i; D.dirty=true; return; }
  if(li<1||li>=lanesN()) return;
  const g=lay[i]; let best=null, bd=Math.max(9,g.ap*.62);
  for(const b of laneBands(li,i)){ const d=Math.abs(g.ya(b.a)-y); if(d<bd){bd=d;best=b;} }
  if(li===2||li===0) return;
  if(li>=3){ const k=li-3; if(D.sel!==k){ select(k); return; } if(!best) return; proof(k,i,best.a,li,!C.trace[i].includes(best.a),'Allèle absent de la trace','Cet allèle est dans la trace'); return; }
  // piste trace
  if(D.sel<0){ Shell.toast('Choisis d’abord un suspect','info'); return; }
  if(!best) return;
  if(!best.main){ proof(D.sel,i,best.a,1,false,'','Stutter : artefact, pas un allèle'); return; }
  const s=C.sus[D.sel], ok=!C.vic[i].includes(best.a)&&!s.g[i].includes(best.a);
  proof(D.sel,i,best.a,1,ok,'Bande inexpliquée',`Bande expliquée par ${C.vic[i].includes(best.a)?'la victime':'S'+(D.sel+1)}`);
}
function proof(k,i,a,li,ok,okTxt,badTxt){
  const C=D.C, s=C.sus[k];
  if(s.ex){ Shell.toast('Déjà exclu','info'); return; }
  D.flash={i,a,li,ok,t:.9}; D.dirty=true;
  if(ok){ s.ex=true; Shell.good(); Shell.toast(`S${k+1} exclu · ${okTxt}`,'ok'); select(k); status();
    if(Shell.st.mode==='tuto'){ tutoNext(); return; }
    if(C.sus.every(x=>x.perp||x.ex)) finish(); return; }
  if(Shell.st.mode==='tuto'){ Shell.bad(); Shell.toast(badTxt,'bad'); return; }
  D.faults++; Shell.st.timeLeft=Math.max(0,Shell.st.timeLeft-PEN); Shell.bad(); Shell.toast(`${badTxt} · −${PEN} s`,'bad'); Shell.shake(gel); status();
}
function status(){ const C=D.C, n=C.sus.filter(s=>s.ex).length; $('exTxt').textContent=`Exclus ${n}/${C.sus.length-1}`; $('faultTxt').textContent=`Erreurs ${D.faults}`; }
function finish(){
  const C=D.C, k=C.sus.findIndex(s=>s.perp); D.over=true; D.won=true; D.dirty=true; Shell.stopTimer(); Shell.win();
  const used=Math.round(D.cfg.time-Shell.st.timeLeft);
  setTimeout(()=>Shell.result({ok:true, faults:D.faults, stats:[['Temps',used+' s'],['Erreurs',D.faults],['Auteur','S'+(k+1)]],
    note:D.faults===0?'Toutes les exclusions sans erreur : double point.':'Sans erreur de preuve, tu gagnes +2.'}),1100);
}
function start(C,cfg){
  Object.assign(D,{C,cfg,over:false,won:false,faults:0,sel:-1,ovV:false,ovS:-1,exp:0,drag:null,flash:null,dirty:true});
  D.ap=targetAp(); status();
  $('sel').innerHTML='Glisse la piste <b>Vict.</b> ou un suspect sur la <b>Trace</b> pour comparer.';
}

/* ---------- tutoriel ---------- */
let TSTEPS=[];
function tutoNext(){
  D.tuto++;
  if(D.tuto>TSTEPS.length-1){ D.over=true; D.won=true; D.dirty=true; Shell.win(); setTimeout(Shell.endTuto,900); return; }
  if(D.tuto===2) D.exp=0;
  Shell.coach(D.tuto,3,TSTEPS[D.tuto]); D.dirty=true;
}

Shell.init({
  key:'adn', service:'Renfort fédéral · Labo', serviceShort:'Labo',
  unit:['expert','experts'], effLabel:'Experts du labo sur le dossier',
  headline:'Profil ADN mixte',
  story:`<p>Le prélèvement sous les ongles de la victime contient un <b>mélange</b> : son ADN et celui de l’auteur. Le labo a typé les suspects.</p><p>Exclus chaque innocent <b>en montrant la preuve</b> sur le gel. Le dernier suspect restant est l’auteur.</p>`,
  diffs:{
    difficile:{agents:1,label:'Difficile',time:150,suspects:4,loci:6,types:['B','B','A','B'],wv:1,wp:.62,stutter:.2},
    normal:{agents:2,label:'Normal',time:180,suspects:4,loci:5,types:['A','B','B','A'],wv:1,wp:.85,stutter:.15},
    facile:{agents:3,label:'Facile',time:210,suspects:3,loci:4,types:['A','A','B'],wv:1,wp:1,stutter:0}},
  diffHint:'Plus d’experts : plus de temps, moins de loci et de suspects, et une trace plus nette.',
  desktopHint:'Glisse les en-têtes de piste avec la souris ; clique sur un locus pour l’ouvrir.',
  rules:['La <b>trace</b> mélange l’ADN de la <b>victime</b> et de l’<b>auteur</b> (1 ou 2 allèles par personne et par locus).','Glisse <b>Vict.</b> ou un suspect sur la Trace pour superposer ses allèles. Tape un locus pour l’ouvrir.','Exclure : sélectionne un suspect puis tape la preuve, soit <b>un de ses allèles absent de la trace</b>, soit <b>une bande de la trace</b> que ni la victime ni lui n’expliquent.','Les bandes pâles juste sous une vraie bande sont des <b>stutters</b> (artefacts) : elles ne comptent pas.','Mauvaise preuve : −8 s. Sans erreur : <b>+2</b> sur la jauge skins.'],
  winTitle:'Auteur identifié', loseTitle:'Profil non concluant', skin:'Paillasse du labo',
  malus:'le labo conclut « profil non interprétable » : pas d’indice supplémentaire aujourd’hui.',
  onMenu(){ D.over=true; },
  onInit(){ const c={suspects:3,loci:4,types:['A','A','B'],wv:1,wp:1,stutter:.15}; start(makeCase(c),c); D.over=true; },
  onFrame(dt){
    if(!D.C) return;
    const t=targetAp(); let moving=false;
    D.ap=D.ap.map((a,i)=>{ const d=t[i]-a; if(Math.abs(d)>.05){ moving=true; return a+d*Math.min(1,dt*14); } return t[i]; });
    if(D.flash){ D.flash.t-=dt; if(D.flash.t<=0) D.flash=null; D.dirty=true; }
    if(moving||D.dirty){ D.dirty=false; draw(); }
  },
  onPlay(cfg){ start(makeCase(cfg),cfg);
    Shell.startTimer(cfg.time,()=>{ if(!D.over){ D.over=true; Shell.bad(); Shell.result({ok:false,faults:1,stats:[['Exclus',D.C.sus.filter(s=>s.ex).length+'/'+(D.C.sus.length-1)],['Erreurs',D.faults],['Temps','écoulé']]}); } }); },
  onTuto(){
    const c={suspects:3,loci:4,wv:1,wp:1,stutter:.15,time:999};
    const C=makeCase(c,{loci:['TH01','vWA','D8S1179','FGA'],src:2,types:['A','B'],at:[0,1]});
    start(C,c); D.over=false; D.tuto=0;
    const a=C.sus[0].g[0].find(x=>!C.trace[0].includes(x));
    TSTEPS=[null,
      'La piste <b>Trace</b> mélange l’ADN de la victime et de l’auteur. Glisse l’en-tête <b>Vict.</b> jusque sur <b>Trace</b> : ses allèles s’y dessinent en pointillés.',
      `Tape <b>S1</b> pour le sélectionner. Au locus <b>TH01</b>, son allèle <b>${a}</b> n’existe pas dans la trace : tape cette bande dans la piste S1.`,
      'Tous les allèles de <b>S2</b> sont dans la trace… Glisse <b>S2</b> sur la Trace, puis ouvre <b>vWA</b> : une bande de la trace n’est encadrée ni par la victime ni par S2. Tape-la dans la piste <b>Trace</b>.'];
    tutoNext();
  }
});

</script>
