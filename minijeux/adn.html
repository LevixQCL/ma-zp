<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Fragment d’ADN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-cyb{--accent:#b49bff;--accent-ink:#170a33;--accent-soft:rgba(180,155,255,.16)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:76px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.debrief-list{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;display:grid;gap:6px}
.debrief-list ul{gap:6px}
.debrief-list li::before{background:var(--bad)!important}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}


.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:7px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);font:600 11px var(--f-body);cursor:pointer;text-align:left}
.tab b{font:700 15px var(--f-disp);color:var(--ink)}
.tab{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:box-shadow .2s,border-color .2s}
.tab[aria-selected="true"]{background:linear-gradient(180deg,rgba(63,224,200,.16),rgba(63,224,200,.05));border-color:rgba(63,224,200,.8);color:var(--accent);box-shadow:0 0 0 1px rgba(63,224,200,.35),0 0 18px rgba(63,224,200,.28),inset 0 1px 0 rgba(255,255,255,.12)}
.lab{position:relative;flex:1;min-height:240px;border-radius:18px;overflow:hidden;touch-action:none;
  background:#06111a;
  box-shadow:inset 0 0 0 1px rgba(63,224,200,.22),0 14px 34px rgba(0,0,0,.45)}
.lab canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.lab canvas:active{cursor:grabbing}
.tag{position:absolute;top:9px;font:700 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:#bfeee6;pointer-events:none;padding:4px 10px;border-radius:8px;background:rgba(8,24,32,.72);box-shadow:inset 0 0 0 1px rgba(63,224,200,.25),inset 0 -2px 0 rgba(63,224,200,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pairs{display:flex;gap:8px;justify-content:center;flex:0 0 auto}
.pair{display:flex;align-items:center;gap:6px;font:700 12px var(--f-mono);color:var(--mute);background:var(--surface);border:1px solid var(--stroke);border-radius:999px;padding:4px 11px}
.pair{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.pair i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 11px var(--f-mono);font-style:normal;color:#0a0f18;box-shadow:inset 0 -3px 5px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.65),0 0 8px rgba(255,255,255,.08)}
.pair span{opacity:.6}
.ctrls{display:flex;gap:8px;flex:0 0 auto}
.ctrls .btn.small{min-width:56px;font-size:18px;line-height:1;padding:10px 0;color:#e8f6f4;background:linear-gradient(180deg,#1c2b38,#0d1620);border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 14px rgba(0,0,0,.35)}
.ctrls .btn.small:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.ctrls #cmp{background:linear-gradient(180deg,#7ff2de,#3fe0c8 55%,#25bfa8);color:#03221c;border:0;box-shadow:0 0 22px rgba(63,224,200,.35),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.15)}
.ctrls #cmp{flex:1}
.ctrls #cmp:disabled{opacity:.5}
.status{flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}

</style>
</head>
<body>
<script>document.body.classList.add('svc-lab')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg></div>
    <div class="ttl"><div class="eyebrow">Labo · démo</div><h1>ADN</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>
  <div class="gauge" id="gaugeRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg><span>Jauge skins</span><div class="gbar"><i id="gfill"></i></div><span><b id="gtext">46</b> / 50</span></div>
  <div class="coach" id="coach" hidden></div>
  <div class="stage" id="stage">

  <div class="tabs" id="tabs" role="tablist" aria-label="ADN des suspects"></div>
  <div class="lab" id="lab"><canvas id="cv" aria-label="Le fragment de la scène à gauche, l’ADN du suspect à droite"></canvas><span class="tag" id="tagF">Scène</span><span class="tag" id="tagS">Suspect</span></div>
  <div class="pairs"><span class="pair"><i style="background:#ff5d6c">A</i><span>avec</span><i style="background:#ffc94a">T</i></span><span class="pair"><i style="background:#4fa3ff">C</i><span>avec</span><i style="background:#46d98a">G</i></span></div>
  <div class="ctrls"><button class="btn small" id="up" aria-label="Remonter d’un barreau">▲</button><button class="btn small" id="dn" aria-label="Descendre d’un barreau">▼</button><button class="btn primary" id="cmp">Comparer</button></div>
  <div class="status"><span id="posTxt">Barreaux 1 à 10</span><span id="faultTxt">Erreurs 0</span></div>

  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3.5 13h17"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',

/* Fragment d'ADN : la scène n'a livré qu'un morceau d'ADN (une suite de barreaux).
   Il faut le retrouver, à l'identique, quelque part dans l'ADN d'un des suspects.
   Chaque barreau = une paire de bases : A avec T, C avec G. « ? » = barreau illisible (compte comme bon). */
const TAU=Math.PI*2, TW=TAU/10, PEN=6;
const BASES='ATCG', COMP={A:'T',T:'A',C:'G',G:'C','?':'?'};
const COL={A:[255,93,108],T:[255,201,74],C:[79,163,255],G:[70,217,138],'?':[110,120,138]};
const NOMS=['DUBOIS','LAMBERT','PEETERS','JANSSENS','LEROY','RENARD','MERTENS','LEJEUNE','HERMANS','CLAES','WAUTERS','MICHAUX','DUMONT','GILSON'];
const rseq=n=>Array.from({length:n},()=>BASES[randi(0,3)]);

function matchAt(seq,p,frag,wild){ for(let k=0;k<frag.length;k++) if(!wild.has(k)&&seq[p+k]!==frag[k]) return false; return true; }
function diffs(seq,p,frag,wild){ let d=0; for(let k=0;k<frag.length;k++) if(!wild.has(k)&&seq[p+k]!==frag[k]) d++; return d; }
function makeCase(cfg,tuto){
  for(let t=0;t<500;t++){
    const N=cfg.n, frag=rseq(N), wild=new Set(shuffle([...Array(N).keys()]).slice(0,cfg.wild));
    const sus=Array.from({length:cfg.suspects},()=>({seq:rseq(cfg.len), used:[]}));
    const src=tuto?0:randi(0,cfg.suspects-1);
    const place=(s,seg,at)=>{ const free=[]; for(let p=0;p<=cfg.len-N;p++) if(!s.used.some(([a,b])=>p<b+2&&p+N>a-2)) free.push(p);
      if(!free.length) return false; const p=at??pick(free); seg.forEach((b,k)=>s.seq[p+k]=b); s.used.push([p,p+N]); return true; };
    if(!place(sus[src],frag.slice(),tuto?6:null)) continue;
    // faux amis : le même fragment à 1 ou 2 barreaux près (toujours sur un barreau lisible)
    const lisibles=[...Array(N).keys()].filter(k=>!wild.has(k)); let ok=true;
    for(let m=0;m<cfg.near;m++){
      const seg=frag.slice(); for(const k of shuffle(lisibles).slice(0,cfg.miss)) seg[k]=pick([...BASES].filter(b=>b!==frag[k]));
      if(!place(tuto?sus[1]:pick(sus),seg)){ ok=false; break; }
    }
    if(!ok) continue;
    let n=0; sus.forEach(s=>{ for(let p=0;p<=cfg.len-N;p++) if(matchAt(s.seq,p,frag,wild)) n++; });
    if(n!==1) continue;
    const noms=shuffle(NOMS); sus.forEach((s,k)=>{ s.nom=noms[k]; s.scroll=0; s.target=0; });
    return {N, frag, wild, sus, src};
  }
  throw new Error('cas introuvable');
}

/* ---------- état ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'), lab=$('lab');
const D={C:null,cfg:null,cur:0,rot:0,over:true,faults:0,drag:null,cmp:null,mark:null,won:false,tuto:0,moved:0};
let geo={w:0,h:0,dpr:1};
function resize(){ const r=lab.getBoundingClientRect(), dpr=Math.min(2.5,devicePixelRatio||1); cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); geo={w:r.width,h:r.height,dpr};
  $('tagF').style.left=Math.max(8,r.width*.2-24)+'px'; $('tagS').style.left=(r.width*.62-30)+'px'; }
new ResizeObserver(resize).observe(lab);
const S=()=>D.C.sus[D.cur];
function dims(){ const N=D.C.N, dy=Math.max(16,Math.min(32,(geo.h-30)*.74/N)), top=(geo.h-N*dy)/2;
  return {dy, top, xF:geo.w*.2, xS:geo.w*.62, R:Math.min(geo.w*.15,64)}; }
const maxScroll=()=>D.C.sus[D.cur].seq.length-D.C.N;

/* ---------- rendu pseudo-3D d'une double hélice ----------
   Chaque barreau i : angle θ = i·36° + rotation. Brin 1 en (cx + R cos θ, profondeur sin θ), brin 2 à l'opposé.
   Tous les éléments (demi-barreaux, nœuds, tronçons de squelette) sont triés par profondeur. */
const rgba=(c,a,k=1)=>`rgba(${Math.round(c[0]*k)},${Math.round(c[1]*k)},${Math.round(c[2]*k)},${a})`;
function helix(items, cx, R, rungs, fade){
  // rungs: [{y, th, b, a}] dans l'ordre
  for(let j=0;j<rungs.length;j++){
    const r=rungs[j], c=Math.cos(r.th), s=Math.sin(r.th), al=r.a;
    const x1=cx+R*c, x2=cx-R*c, z1=s, z2=-s;
    items.push({z:z1*.5-.02, f:()=>bar(x1,cx,r.y,r.b,z1,al,r.mark)});
    items.push({z:z2*.5-.02, f:()=>bar(x2,cx,r.y,COMP[r.b],z2,al,r.mark)});
    items.push({z:z1, f:()=>node(x1,r.y,z1,al)}); items.push({z:z2, f:()=>node(x2,r.y,z2,al)});
    const n=rungs[j+1]; if(!n) continue;
    // squelette : 4 sous-tronçons entre deux barreaux, pour une courbe lisse
    for(const sgn of [1,-1]) for(let q=0;q<6;q++){
      const t0=q/6, t1=(q+1)/6, a0=r.th+(n.th-r.th)*t0, a1=r.th+(n.th-r.th)*t1, y0=r.y+(n.y-r.y)*t0, y1=r.y+(n.y-r.y)*t1;
      const za=sgn*Math.sin(a0), zb=sgn*Math.sin(a1), alp=al+(n.a-al)*t0;
      items.push({z:(za+zb)/2, f:()=>bone(cx+sgn*R*Math.cos(a0),y0,cx+sgn*R*Math.cos(a1),y1,(za+zb)/2,alp)});
    }
  }
}
const depthK=z=>.42+.58*(z+1)/2;
const mix=(c,k,wt=0)=>`rgb(${Math.round(c[0]*k+(255-c[0]*k)*wt)},${Math.round(c[1]*k+(255-c[1]*k)*wt)},${Math.round(c[2]*k+(255-c[2]*k)*wt)})`;
/* Barreau : capsule de verre coloré (bord sombre, corps, reflet). */
function bar(x,cx,y,b,z,al,mark){
  const k=depthK(z), col=COL[b], w=Math.max(5,D.dims.dy*.38)*(.85+.25*(z+1)/2), xe=cx+(x-cx)*.05;
  ctx.save(); ctx.globalAlpha=al; ctx.lineCap='round';
  ctx.lineWidth=w; ctx.strokeStyle=mix(col,k*.55); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(xe,y); ctx.stroke();
  ctx.lineWidth=w*.74; ctx.strokeStyle=mix(col,k); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(xe,y); ctx.stroke();
  ctx.lineWidth=Math.max(1.2,w*.2); ctx.strokeStyle=mix(col,k,.6); const dx=Math.sign(xe-x)*w*.35;
  ctx.beginPath(); ctx.moveTo(x+dx,y-w*.2); ctx.lineTo(xe-dx,y-w*.2); ctx.stroke();
  if(z>-.2 && Math.abs(x-cx)>D.dims.R*.42 && D.dims.dy>=17){
    ctx.fillStyle='rgba(6,10,16,.88)'; ctx.font=`800 ${Math.round(w*.8)}px "IBM Plex Mono",monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(b,(x+cx)/2+(x-cx)*.18,y+.5);
  }
  ctx.restore();
}
/* Nœud : bille de verre. */
function node(x,y,z,al){
  const k=depthK(z), r=Math.max(3.6,D.dims.dy*.21)*(.8+.35*(z+1)/2);
  ctx.save(); ctx.globalAlpha=al;
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.35,`rgb(${Math.round(170*k)},${Math.round(220*k)},${Math.round(228*k)})`); g.addColorStop(1,`rgb(${Math.round(40*k)},${Math.round(80*k)},${Math.round(92*k)})`);
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  ctx.strokeStyle=`rgba(220,250,255,${.55*k})`; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
/* Squelette : tube de verre (bords clairs, cœur sombre, filet de reflet). */
function bone(x0,y0,x1,y1,z,al){
  const k=depthK(z), W=Math.max(4,D.dims.dy*.28)*(.75+.35*(z+1)/2);
  ctx.save(); ctx.globalAlpha=al; ctx.lineCap='butt';
  ctx.lineWidth=W; ctx.strokeStyle=`rgb(${Math.round(175*k)},${Math.round(225*k)},${Math.round(232*k)})`; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.lineWidth=W*.6; ctx.strokeStyle=`rgb(${Math.round(28*k+8)},${Math.round(62*k+10)},${Math.round(72*k+12)})`; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.lineWidth=Math.max(1,W*.16); ctx.strokeStyle=`rgba(255,255,255,${.75*k})`; ctx.beginPath(); ctx.moveTo(x0-W*.18,y0); ctx.lineTo(x1-W*.18,y1); ctx.stroke();
  ctx.restore();
}
/* Fond fixe : lueur centrale + pistes de circuit du labo, dessiné une fois par taille. */
let bgC=null;
function buildBg(){
  const {w,h,dpr}=geo, c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height;
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  let bgr=g.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);
  bgr.addColorStop(0,'#103340'); bgr.addColorStop(.55,'#0a1d28'); bgr.addColorStop(1,'#050d14'); g.fillStyle=bgr; g.fillRect(0,0,w,h);
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  g.lineCap='round'; g.lineJoin='round';
  for(let n=0;n<Math.round(w*h/5200);n++){
    let x=Math.round(rnd()*w/8)*8, y=Math.round(rnd()*h/8)*8; const a=.05+rnd()*.09;
    g.strokeStyle=`rgba(90,210,200,${a})`; g.lineWidth=1.2; g.beginPath(); g.moveTo(x,y);
    for(let q=0;q<3;q++){ const L=16+rnd()*60, d=Math.floor(rnd()*4); if(d===0)x+=L; else if(d===1)x-=L; else if(d===2)y+=L; else { x+=L*.7; y+=L*.7; } g.lineTo(x,y); }
    g.stroke(); g.fillStyle=`rgba(120,235,220,${a*1.6})`; g.beginPath(); g.arc(x,y,2.2,0,TAU); g.fill();
  }
  // grains « cellulaires » flous dans les coins
  for(const [cx,cy,r] of [[w*.92,h*.08,w*.22],[w*.06,h*.94,w*.2]]){ const rg=g.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,'rgba(120,200,200,.08)'); rg.addColorStop(1,'rgba(120,200,200,0)'); g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,r,0,TAU); g.fill(); }
  return c;
}

function draw(){
  if(!D.C||!geo.w) return;
  const {w,h,dpr}=geo, d=D.dims=dims(), C=D.C, s=S(), N=C.N;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  if(!bgC||bgC.width!==cv.width||bgC.height!==cv.height) bgC=buildBg();
  ctx.drawImage(bgC,0,0,w,h);
  // vitre de comparaison
  const fy=d.top-6, fh=N*d.dy+12, fx=8, fw=w-30;
  ctx.save(); ctx.shadowColor='rgba(63,224,200,.25)'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.roundRect(fx,fy,fw,fh,16); const gl=ctx.createLinearGradient(0,fy,0,fy+fh); gl.addColorStop(0,'rgba(160,240,235,.13)'); gl.addColorStop(1,'rgba(160,240,235,.04)'); ctx.fillStyle=gl; ctx.fill(); ctx.restore();
  ctx.strokeStyle='rgba(150,240,230,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(fx,fy,fw,fh,16); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(fx+16,fy+2.5); ctx.lineTo(fx+fw-16,fy+2.5); ctx.stroke();
  // liens de comparaison (fermeture éclair)
  const mk=D.mark; for(let k=0;k<N;k++){ const y=d.top+(k+.5)*d.dy, m=mk&&mk[k];
    ctx.strokeStyle=m==='ok'?'rgba(70,217,138,.9)':m==='bad'?'rgba(255,93,93,.95)':'rgba(255,255,255,.07)';
    ctx.lineWidth=m?2:1; ctx.setLineDash(m?[]:[3,5]); ctx.beginPath(); ctx.moveTo(d.xF+d.R+8,y); ctx.lineTo(d.xS-d.R-8,y); ctx.stroke(); ctx.setLineDash([]);
    if(m){ ctx.save(); ctx.shadowColor=m==='ok'?'#46d98a':'#ff5d5d'; ctx.shadowBlur=8; ctx.fillStyle=m==='ok'?'#46d98a':'#ff5d5d'; ctx.beginPath(); ctx.arc((d.xF+d.xS)/2,y,4,0,TAU); ctx.fill(); ctx.restore(); } }
  const items=[];
  helix(items,d.xF,d.R*.85,C.frag.map((b,k)=>({y:d.top+(k+.5)*d.dy, th:(s.scroll+k)*TW+D.rot, b:C.wild.has(k)?'?':b, a:1})));
  const rungs=[]; for(let i=0;i<s.seq.length;i++){ const y=d.top+(i-s.scroll+.5)*d.dy; if(y<-d.dy*2||y>h+d.dy*2) continue;
    const inF=y>d.top&&y<d.top+N*d.dy; rungs.push({y, th:i*TW+D.rot, b:s.seq[i], a:inF?1:.38}); }
  helix(items,d.xS,d.R,rungs);
  items.sort((a,b)=>a.z-b.z).forEach(it=>it.f());
  // reflet diagonal sur la vitre
  ctx.save(); ctx.beginPath(); ctx.roundRect(fx,fy,fw,fh,16); ctx.clip();
  const rf=ctx.createLinearGradient(fx,fy,fx+fw*.6,fy+fh*.6); rf.addColorStop(0,'rgba(255,255,255,.08)'); rf.addColorStop(.4,'rgba(255,255,255,.02)'); rf.addColorStop(.41,'rgba(255,255,255,0)'); ctx.fillStyle=rf; ctx.fillRect(fx,fy,fw,fh); ctx.restore();
  // fondu haut et bas
  const gt=ctx.createLinearGradient(0,0,0,44); gt.addColorStop(0,'rgba(5,13,20,.95)'); gt.addColorStop(1,'rgba(5,13,20,0)'); ctx.fillStyle=gt; ctx.fillRect(0,0,w,44);
  const gb=ctx.createLinearGradient(0,h-44,0,h); gb.addColorStop(0,'rgba(5,13,20,0)'); gb.addColorStop(1,'rgba(5,13,20,.95)'); ctx.fillStyle=gb; ctx.fillRect(0,h-44,w,44);
  // mini-carte : position dans l'ADN du suspect
  const L=s.seq.length, mx=w-12, my=26, mh=h-52;
  ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.roundRect(mx-2.5,my,5,mh,3); ctx.fill();
  ctx.save(); ctx.shadowColor='#3fe0c8'; ctx.shadowBlur=10; ctx.fillStyle='#3fe0c8'; ctx.beginPath(); ctx.roundRect(mx-3.5,my+mh*s.scroll/L,7,Math.max(10,mh*N/L),4); ctx.fill(); ctx.restore();
  if(D.won){ ctx.save(); ctx.translate(d.xS,h/2); ctx.rotate(-.18); ctx.font='800 24px "Bricolage Grotesque",sans-serif'; ctx.textAlign='center'; ctx.lineWidth=3;
    ctx.strokeStyle='rgba(70,217,138,.95)'; ctx.fillStyle='rgba(70,217,138,.95)'; ctx.strokeRect(-92,-20,184,40); ctx.fillText('CONCORDANT',0,9); ctx.restore(); }
}

/* ---------- interactions ---------- */
const busy=()=>!D.C||D.cmp||(D.over&&Shell.st.mode!=='tuto');
function setStatus(){
  const s=S(), p=Math.round(s.target); $('posTxt').textContent=`${s.nom} · barreaux ${p+1} à ${p+D.C.N} sur ${s.seq.length}`;
  $('faultTxt').textContent=`Erreurs ${D.faults}`;
}
function go(t){ const s=S(); s.target=Math.max(0,Math.min(maxScroll(),t)); D.mark=null; setStatus(); }
cv.addEventListener('pointerdown',e=>{ if(busy()) return; cv.setPointerCapture(e.pointerId); D.drag={x:e.clientX,y:e.clientY,id:e.pointerId,axis:null}; });
cv.addEventListener('pointermove',e=>{
  const g=D.drag; if(!g||g.id!==e.pointerId) return; const dx=e.clientX-g.x, dy=e.clientY-g.y; g.x=e.clientX; g.y=e.clientY;
  if(!g.axis && Math.abs(dx)+Math.abs(dy)>4) g.axis=Math.abs(dy)>=Math.abs(dx)?'y':'x';
  const s=S();
  if(g.axis==='y'){ s.scroll=Math.max(-.4,Math.min(maxScroll()+.4,s.scroll-dy/D.dims.dy)); s.target=s.scroll; D.mark=null; D.moved+=Math.abs(dy/D.dims.dy); }
  if(g.axis==='x') D.rot+=dx*.012;
});
function release(){ if(!D.drag) return; D.drag=null; go(Math.round(S().scroll));
  if(Shell.st.mode==='tuto'&&D.tuto===1&&D.moved>=2) tutoNext(); }
cv.addEventListener('pointerup',release); cv.addEventListener('pointercancel',release);
cv.addEventListener('wheel',e=>{ e.preventDefault(); if(busy()) return; go(Math.round(S().target)+Math.sign(e.deltaY)); D.moved+=1; if(Shell.st.mode==='tuto'&&D.tuto===1&&D.moved>=2) tutoNext(); },{passive:false});
$('up').onclick=()=>{ if(!busy()){ go(Math.round(S().target)-1); D.moved+=1; } };
$('dn').onclick=()=>{ if(!busy()){ go(Math.round(S().target)+1); D.moved+=1; if(Shell.st.mode==='tuto'&&D.tuto===1&&D.moved>=2) tutoNext(); } };
document.addEventListener('keydown',e=>{ if(busy()) return; if(e.key==='ArrowUp'){ e.preventDefault(); go(Math.round(S().target)-1); } if(e.key==='ArrowDown'){ e.preventDefault(); go(Math.round(S().target)+1); } if(e.key==='Enter') compare(); });
$('tabs').onclick=e=>{ const b=e.target.closest('.tab'); if(!b||busy()) return; D.cur=+b.dataset.i; D.mark=null; renderTabs(); setStatus(); };
function renderTabs(){ $('tabs').innerHTML=D.C.sus.map((s,i)=>`<button class="tab" role="tab" data-i="${i}" aria-selected="${i===D.cur}"><b>S${i+1}</b>${s.nom}</button>`).join(''); }
$('cmp').onclick=()=>compare();
function compare(){
  if(busy()) return; const s=S(); s.scroll=s.target=Math.round(s.target);
  D.cmp={k:0,t:0,res:[]}; D.mark=[]; $('cmp').disabled=true;
}
function cmpStep(dt){
  const c=D.cmp; c.t+=dt; if(c.t<.075) return; c.t=0;
  const C=D.C, s=S(), k=c.k, ok=C.wild.has(k)||s.seq[s.target+k]===C.frag[k];
  D.mark[k]=ok?'ok':'bad'; ok?Shell.blip(700+k*60,.05,'triangle',.04):Shell.blip(160,.08,'sawtooth',.05);
  c.k++; if(c.k<C.N) return;
  D.cmp=null; $('cmp').disabled=false;
  const nd=D.mark.filter(m=>m==='bad').length;
  if(!nd){ D.won=true; D.over=true; Shell.stopTimer(); Shell.win(); Shell.toast('Correspondance !','ok');
    if(Shell.st.mode==='tuto'){ setTimeout(Shell.endTuto,1100); return; }
    const used=Math.round(D.cfg.time-Shell.st.timeLeft);
    setTimeout(()=>Shell.result({ok:true,faults:D.faults,stats:[['Temps',used+' s'],['Erreurs',D.faults],['Auteur','S'+(D.cur+1)]],
      note:D.faults===0?'Trouvé du premier coup : double point.':'Sans comparaison ratée, tu gagnes +2.'}),1200); return; }
  const txt=`${nd} barreau${nd>1?'x':''} différent${nd>1?'s':''}`;
  if(Shell.st.mode==='tuto'){ Shell.bad(); Shell.toast(txt,'bad'); return; }
  D.faults++; Shell.st.timeLeft=Math.max(0,Shell.st.timeLeft-PEN); Shell.bad(); Shell.toast(`${txt} · −${PEN} s`,'bad'); Shell.shake(lab); setStatus();
}
function start(C,cfg){ Object.assign(D,{C,cfg,cur:0,over:false,won:false,faults:0,drag:null,cmp:null,mark:null,moved:0}); $('cmp').disabled=false; renderTabs(); setStatus(); }

/* ---------- tutoriel ---------- */
const TSTEPS=[null,
  'Voici l’ADN du suspect <b>S1</b>, en double hélice. Fais-le <b>glisser vers le haut ou le bas</b> : il défile en tournant comme une vis. Glisse sur le côté pour le faire pivoter.',
  'À gauche, le <b>fragment trouvé sur la scène</b>. Fais défiler S1 jusqu’à ce que le <b>cadre</b> contienne exactement la même suite de barreaux (mêmes couleurs, même ordre), puis touche <b>Comparer</b>.'];
function tutoNext(){ D.tuto++; if(D.tuto<TSTEPS.length) Shell.coach(D.tuto,2,TSTEPS[D.tuto]); }

Shell.init({
  key:'adn', service:'Renfort fédéral · Labo', serviceShort:'Labo',
  unit:['expert','experts'], effLabel:'Experts du labo sur le dossier',
  headline:'Fragment d’ADN',
  story:`<p>Sur la scène, le labo n’a pu lire qu’un <b>fragment</b> de l’ADN de l’auteur.</p><p>Retrouve ce fragment, barreau par barreau, dans l’ADN d’un des suspects. Attention : plusieurs passages se ressemblent à un barreau près. Chaque comparaison ratée coûte ${PEN} secondes.</p>`,
  diffs:{
    difficile:{agents:1,label:'Difficile',time:150,suspects:5,len:48,n:10,wild:3,near:9,miss:1},
    normal:{agents:2,label:'Normal',time:150,suspects:4,len:40,n:10,wild:2,near:6,miss:1},
    facile:{agents:3,label:'Facile',time:180,suspects:3,len:32,n:8,wild:0,near:3,miss:2}},
  diffHint:'Plus d’experts : plus de temps, moins de suspects, des ADN plus courts et moins de faux amis.',
  desktopHint:'Sur ordinateur : molette ou flèches pour faire défiler, Entrée pour comparer, glisser sur le côté pour faire pivoter.',
  rules:['Retrouve le <b>fragment de la scène</b> (à gauche) dans l’ADN d’un suspect (à droite).','Glisser haut/bas : faire défiler l’hélice. Glisser sur le côté : la faire pivoter. Onglets : changer de suspect.','Chaque barreau est une paire : <b>A avec T</b>, <b>C avec G</b>. Un barreau gris <b>?</b> est illisible : il compte comme bon.','Place la bonne suite dans le cadre puis <b>Comparer</b>. Comparaison ratée : −6 s.','Trouvé sans erreur : <b>+2</b> sur la jauge skins. Sinon : <b>+1</b>.'],
  winTitle:'Auteur identifié', loseTitle:'Fragment non retrouvé', skin:'Paillasse du labo',
  malus:'le labo conclut « profil non exploitable » : pas d’indice supplémentaire aujourd’hui.',
  onMenu(){ D.over=true; },
  onInit(){ const c={suspects:3,len:32,n:8,wild:0,near:3,miss:2}; start(makeCase(c),c); D.over=true; },
  onFrame(dt){
    if(!D.C) return;
    if(!D.drag&&!D.cmp) D.rot+=dt*.32;
    const s=S(); if(!D.drag){ const dd=s.target-s.scroll; s.scroll+=Math.abs(dd)<.002?dd:dd*Math.min(1,dt*12); }
    if(D.cmp) cmpStep(dt);
    draw();
  },
  onPlay(cfg){ start(makeCase(cfg),cfg);
    Shell.startTimer(cfg.time,()=>{ if(!D.over){ D.over=true; Shell.bad(); Shell.result({ok:false,faults:1,stats:[['Erreurs',D.faults],['Suspects',D.C.sus.length],['Temps','écoulé']]}); } }); },
  onTuto(){ const c={suspects:2,len:28,n:8,wild:0,near:1,miss:2,time:999}; start(makeCase(c,true),c); D.tuto=0; tutoNext(); }
});
