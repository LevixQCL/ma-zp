<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Réseau à reconnecter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-cyb{--accent:#b49bff;--accent-ink:#170a33;--accent-soft:rgba(180,155,255,.16)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast{max-width:calc(100vw - 24px);white-space:normal;text-align:center;line-height:1.25}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:56px}
/* dans Ma ZP, la barre « Retour à ma zone » affiche déjà le nom du jeu : en-tête réduit à une ligne */
.embed .app{gap:8px;padding-block:8px}
.embed .top{gap:8px}
.embed .top .badge,.embed .top h1{display:none}
.embed .top .eyebrow{font-size:13px;font-weight:700}
.embed .top .iconbtn{width:32px;height:32px;border-radius:10px}
.embed .top .ring{width:40px;height:40px}
.embed .top .timer{font-size:13px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.confirm-fin{border:1px solid color-mix(in srgb,#E5484D 55%,transparent);background:color-mix(in srgb,#E5484D 10%,transparent);border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.confirm-fin p{margin:0}
.btn.danger{background:transparent;border-color:#E5484D;color:#FF7A7E}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.tuto-mini{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;margin:-4px 0 -6px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);background:transparent;color:var(--mute);font:600 12.5px var(--f-body);cursor:pointer}
.minis{align-self:flex-end;display:flex;gap:8px;margin:-4px 0 -6px}.minis .tuto-mini{margin:0}#guideBtn{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini:hover{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.debrief-list{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;display:grid;gap:6px}
.debrief-list ul{gap:6px}
.debrief-list li::before{background:var(--bad)!important}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}
/* Défi d'endurance (entraînement) */
.defi-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,#FFB23F 45%,transparent);background:color-mix(in srgb,#FFB23F 10%,transparent);border-radius:14px;padding:12px}
.defi-box>div{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.defi-box b{font-family:var(--f-disp);font-size:15px}
.btn.defi{flex:0 0 auto;background:#FFB23F;color:#241400;border-color:transparent}
.coeurs{color:#FF6E6A;letter-spacing:2px}


.boardwrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;border-radius:22px;overflow:hidden;
  background:radial-gradient(70% 55% at 50% 50%,rgba(90,200,255,.12),transparent 70%),linear-gradient(180deg,#131a2a,#0a0f1a);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.traces path{fill:none;stroke:rgba(150,190,230,.16);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.traces circle{fill:rgba(150,190,230,.22)}
.board{position:relative;display:grid;gap:4px;padding:10px;border-radius:16px;touch-action:manipulation;
  background:linear-gradient(180deg,rgba(30,40,60,.92),rgba(14,20,32,.95));
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 0 3px #9aa6ba,0 0 0 4px #e3e9f2,0 0 0 6px #5b6577,0 0 0 7px rgba(0,0,0,.5),0 24px 50px rgba(0,0,0,.55),inset 0 2px 10px rgba(0,0,0,.7)}
.cell{position:relative;padding:0;border:0;border-radius:9px;cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(155deg,rgba(215,232,255,.2),rgba(150,180,225,.07) 55%,rgba(120,150,200,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(200,222,255,.2),inset 0 -2px 4px rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.45);transition:background .2s}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 42%);pointer-events:none}
.cell:active{filter:brightness(1.2)}
.cell.pc{background:linear-gradient(160deg,#232c44,#121827);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(170,150,255,.3),0 2px 4px rgba(0,0,0,.5)}
.cell.srvc{background:radial-gradient(circle at 50% 50%,rgba(120,230,255,.4),rgba(40,90,140,.35) 70%);box-shadow:inset 0 0 0 1.5px rgba(150,235,255,.8),0 0 18px rgba(90,210,255,.55)}
.cell.lock{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1.5px rgba(150,235,255,.55),0 2px 4px rgba(0,0,0,.45)}
.cell.lock::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:2px;background:#9fefff;box-shadow:0 0 6px #5fd8ff}
.cell.hint{animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{box-shadow:inset 0 0 0 2px #7fe6ff,0 0 16px rgba(90,210,255,.6)}}
.cell svg{position:absolute;inset:0;width:100%;height:100%}
.cell .t{transition:transform .16s cubic-bezier(.3,.8,.4,1.25)}
.cell .t path{fill:none;stroke-linecap:round}
.cell .t .rim path{stroke:rgba(225,240,255,.55);stroke-width:17}
.cell .t .core path{stroke:rgba(30,45,70,.75);stroke-width:9;transition:stroke .2s}
.cell .t .flow path{stroke:transparent;stroke-width:6;stroke-dasharray:3 17}
.cell .t .rim circle{fill:rgba(225,240,255,.55)} .cell .t .core circle{fill:rgba(30,45,70,.75);transition:fill .2s}
.cell.on .t .rim path{stroke:#63dcff;filter:drop-shadow(0 0 5px rgba(80,215,255,.95))}
.cell.on .t .rim circle{fill:#63dcff}
.cell.on .t .core path{stroke:#dff9ff} .cell.on .t .core circle{fill:#dff9ff}
.cell.on .t .flow path{stroke:rgba(110,225,255,.55);animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.cell.on .t .flow path{animation:none}}
.cell .ic .scr{fill:#0f1424;stroke:#8f86c9;stroke-width:4;transition:fill .25s,stroke .25s}
.cell .ic .ft{fill:#8f86c9}
.cell.on .ic .scr{fill:#3df59a;stroke:#c9ffe3;filter:drop-shadow(0 0 6px rgba(61,245,154,.9))}
.cell.on .ic .ft{fill:#c9ffe3}
.cell .srv rect{fill:rgba(10,40,60,.6);stroke:#bff4ff;stroke-width:4}
.cell .srv path{stroke:#bff4ff}
.cell .srv circle{fill:#3df59a;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{fill:#63dcff}}
.board.won .cell .t .rim path{stroke:#3df59a;filter:drop-shadow(0 0 5px rgba(61,245,154,.9))}
.board.won .cell .t .rim circle{fill:#3df59a}
.board.won .cell .t .flow path{stroke:rgba(30,200,120,.9)}
.hintline{font-size:12.5px;color:var(--mute);text-align:center;flex:0 0 auto}
.status{flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}

</style>
</head>
<body>
<script>document.body.classList.add('svc-cyb')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg></div>
    <div class="ttl"><div class="eyebrow">RCCU · démo</div><h1>Réseau</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>
  <div class="gauge" id="gaugeRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg><span>Jauge skins</span><div class="gbar"><i id="gfill"></i></div><span><b id="gtext">46</b> / 50</span></div>
  <div class="coach" id="coach" hidden></div>
  <div class="stage" id="stage">

  <div class="boardwrap" id="wrap"><svg class="traces" id="traces" aria-hidden="true"></svg><div class="board" id="board" role="grid" aria-label="Réseau à reconnecter"></div></div>
  <div class="hintline">Toucher : tourner · Appui long (clic droit) : verrouiller une case sûre</div>
  <div class="status"><span id="pcTxt">PC reliés 0/0</span><span id="rotTxt">Rotations 0</span></div>

  </div>

<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */

const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {

  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',

  dna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',
  trace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="19" cy="15" r="2"/><path d="M6.2 16.3l4.6-7.6M13.4 8.6l4.3 4.8"/><path d="M19 3v4M17 5h4"/></svg>',
  barrage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="6" rx="1.5"/><path d="M8 7l-3 6M13 7l-3 6M18 7l-3 6"/><path d="M6 13v6M18 13v6M4 19h4M16 19h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    c.innerHTML=`<div class="av">CP</div><div class="body"><div class="step"><span class="dots" aria-label="Étape ${step} sur ${total}">${dots}</span><button class="skip" id="skipTuto">Passer le tuto</button></div><div>${html}</div></div>`;
    $('skipTuto').onclick=endTuto;
  }
  function hideCoach(){ $('coach').hidden=true; }
  const hero = sub => `<div class="hero"><div class="badge">${document.querySelector('.top .badge').innerHTML}</div><div><div class="eyebrow">${sub}</div></div></div>`;

  // Intégration dans Ma ZP : ?mode=incident (incident du jour, un seul essai), ?mode=renfort (renfort PJF pour
  // l'enquête, un seul essai, sans jauge) ou ?mode=train (entraînement).
  const Q = new URLSearchParams(location.search);
  const MODE = ['incident','train','renfort'].includes(Q.get('mode')) ? Q.get('mode') : null;
  const RENF = MODE==='renfort';
  const INC = MODE==='incident' || RENF;
  const escH = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function post(type, data={}){ try{ if(window.parent!==window) window.parent.postMessage({source:'mazp-mj', jeu:G.key, id:Q.get('id'), type, ...data}, location.origin); }catch(e){} }
  let joue=false, fini=false;

  // ───── Challenge (l'entraînement aux mini-jeux dans Ma ZP) : niveaux 1 → ∞, trois erreurs et la course s'arrête. ─────
  // Le record de la partie (et son détenteur) arrive par l'adresse ; chaque niveau réussi est signalé à Ma ZP.
  const DEFI = { rec: Math.max(0, Number(Q.get('rec'))||0), recNom: Q.get('recNom')||'', moi: Math.max(0, Number(Q.get('moi'))||0), erreurs: 3 };
  let run = null; // { niveau, erreurs, reussis } pendant une course
  /**
   * Réglages d'un niveau : du niveau 1 (plus doux que « facile ») au niveau 10 (= « difficile »), en passant par
   * facile (4) et normal (7) ; au-delà, chaque réglage continue de se serrer au même rythme que de normal à difficile,
   * en multipliant (au moins 3 % par niveau). Le temps, lui, tend vers un plancher jouable par un très bon joueur. Bornes par jeu.
   */
  function cfgNiveau(n){
    const F=G.diffs.facile, N=G.diffs.normal, D=G.diffs.difficile, B=G.bornes||{};
    const out={label:`Niveau ${n}`, niveau:n, defi:true};
    const val=(f,m,d,k)=>{
      if(n<=10){
        const pts=[[1,f+(f-m)*0.5],[4,f],[7,m],[10,d]];
        for(let i=0;i<3;i++){ const [a,va]=pts[i],[b,vb]=pts[i+1]; if(n<=b) return va+(vb-va)*(n-a)/(b-a); }
      }
      let r = m>0&&d>0 ? Math.pow(d/m,1/3) : 1;
      if(r===1 && k==='time') r=0.95;
      else if(r!==1 && Math.abs(r-1)<0.03) r = r>1?1.03:0.97;
      // Le temps s'approche de son plancher sans l'atteindre (un temps qu'un très bon joueur tient encore) :
      // ce sont la précision et la complexité qui finissent par départager.
      if(k==='time'){ const lo=(B.time&&B.time[0])||0; if(lo>0 && d>lo) return lo+(d-lo)*Math.pow(Math.min(r,.93),n-10); }
      return d*Math.pow(r,n-10);
    };
    const borne=(v,b,k,d,ent)=>{ const [lo,hi]=b||(k==='time'?[Math.max(15,d*0.3),Infinity]:[-Infinity,Infinity]); v=Math.min(hi,Math.max(lo,v)); return ent?Math.round(v):Math.round(v*1000)/1000; };
    const cles=new Set([...Object.keys(F),...Object.keys(N),...Object.keys(D)]);
    for(const k of cles){
      if(k==='agents'||k==='label') continue;
      const f=F[k], m=N[k], d=D[k];
      const ref = d!==undefined?d:m!==undefined?m:f;
      if(f===undefined||m===undefined||d===undefined){ // réglage propre aux niveaux durs
        if(d!==undefined && n>=10) out[k]=d; else if(m!==undefined && n>=7) out[k]=m; else if(f!==undefined && n<7) out[k]=f;
        continue;
      }
      if(typeof ref==='number') out[k]=borne(val(f,m,d,k),B[k],k,d,[f,m,d].every(Number.isInteger));
      else if(Array.isArray(ref)) out[k]=ref.map((_,i)=>borne(val(f[i],m[i],d[i],k),B[k]&&B[k][i],k,d[i],[f[i],m[i],d[i]].every(Number.isInteger)));
      else out[k] = n>=10?d:n>=7?m:f;
    }
    return G.niveau ? G.niveau(n,out) : out;
  }
  const eyebrow = t => { const eb=document.querySelector('.top .eyebrow'); if(eb) eb.textContent=t; };
  const eyebrowBase = () => (RENF?'Appui PJF · ':INC?'Incident du jour · ':G&&G.evt?'Événement · ':MODE==='train'?'Challenge · ':'')+G.serviceShort;
  const recLigne = () => DEFI.rec ? `Record de la partie : <b>niveau ${DEFI.rec}</b>${DEFI.recNom?` par ${escH(DEFI.recNom)}`:''}.` : 'Pas encore de record dans la partie : le premier niveau réussi le crée.';
  // Course en cours gardée sur l'appareil : on peut quitter le mini-jeu (ou être coupé) et reprendre au même niveau,
  // avec les mêmes cœurs. Un niveau quitté en cours de route est simplement rejoué. La sauvegarde vaut pour ce joueur
  // et pour la semaine du Challenge en cours (la prime du dimanche ne doit pas hériter d'une course de la semaine passée).
  const CLE_RUN = `defiRun.${Q.get('u')||'anon'}`;
  const sauverRun = () => { if(MODE==='train' && run) store.set(CLE_RUN, {...run, sem:Q.get('sem')||'', at:Date.now()}); };
  const oublierRun = () => store.set(CLE_RUN, null);
  function runSauvee(){
    const r = MODE==='train' ? store.get(CLE_RUN, null) : null;
    if(!r || !(r.niveau>1 || r.erreurs>0)) return null;
    if((r.sem||'') !== (Q.get('sem')||'')) { oublierRun(); return null; }
    return r;
  }
  function startDefi(){ oublierRun(); run={niveau:1, erreurs:0, reussis:0}; jouerNiveau(); }
  function reprendreDefi(){ const r=runSauvee(); if(!r) return startDefi(); run={niveau:r.niveau, erreurs:r.erreurs, reussis:r.reussis||r.niveau-1}; jouerNiveau(); }
  function jouerNiveau(){
    sauverRun();
    hide(); hideCoach(); st.mode='play';
    eyebrow(`Challenge · niv. ${run.niveau} · ${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`);
    G.onPlay(cfgNiveau(run.niveau)); toast(`Niveau ${run.niveau}`);
  }
  function resultDefi({ok, stats, details}){
    st.timerOn=false; st.mode='result';
    const n=run.niveau;
    post('result',{ok, defi:true}); // compté comme une partie d'entraînement
    const detailHtml = details && details.length && !ok ? `<div class="debrief-list"><b>Ce qui s’est mal passé</b><ul>${details.map(d=>`<li><span>${d}</span></li>`).join('')}</ul></div>` : '';
    const coeurs = `${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`;
    if(ok){
      run.reussis=n; run.niveau=n+1; sauverRun();
      const record = n>DEFI.rec, perso = n>DEFI.moi;
      post('defi',{niveau:n});
      if(record){ DEFI.rec=n; DEFI.recNom='toi'; } if(perso) DEFI.moi=n;
      showCard(`<div class="verdict ok">${ICONS.check}</div><h2>Niveau ${n} réussi</h2>
        <div class="stats">${stats.slice(0,2).map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="stat"><span>Erreurs</span><b class="coeurs">${coeurs}</b></div></div>
        ${record?'<div class="skin">Nouveau record de la partie ! Ton nom s’affiche sur la tuile du challenge.</div>':perso?'<p class="small">Nouveau record personnel.</p>':''}
        <p class="small">Le niveau ${n+1} sera un peu plus dur.</p>
        <div class="row"><button class="btn primary" id="suite">Niveau ${n+1}</button><button class="btn" id="stop">Terminer la course</button></div>
        ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n+1}.</p>`:''}`);
      $('suite').onclick=jouerNiveau; $('stop').onclick=()=>confirmerFin(n+1);
      return;
    }
    run.erreurs++; sauverRun();
    if(run.erreurs>=DEFI.erreurs){ finDefi(detailHtml); return; }
    const reste=DEFI.erreurs-run.erreurs;
    showCard(`<div class="verdict bad">${ICONS.cross}</div><h2>Niveau ${n} raté</h2>
      <p class="small">Encore <b>${reste} erreur${reste>1?'s':''}</b> permise${reste>1?'s':''} <span class="coeurs">${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}</span>.</p>${detailHtml}
      <div class="row"><button class="btn primary" id="suite">Retenter le niveau ${n}</button><button class="btn" id="stop">Terminer la course</button></div>
      ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n}.</p>`:''}`);
    $('suite').onclick=jouerNiveau; $('stop').onclick=()=>confirmerFin(n);
  }
  // « Terminer la course » efface la progression : on demande confirmation (un clic de travers ne doit rien coûter).
  function confirmerFin(prochain){
    const row=$('stop') && $('stop').parentNode; if(!row) return finDefi();
    const box=document.createElement('div'); box.className='confirm-fin'; box.setAttribute('role','alertdialog'); box.setAttribute('aria-label','Confirmer la fin de la course');
    box.innerHTML=`<p class="small"><b>Terminer la course ?</b> Ta progression sera perdue : la prochaine course repartira du niveau 1${prochain>1?` au lieu du niveau ${prochain}`:''}.</p>
      <div class="row"><button class="btn primary" id="garder">Non, je continue</button><button class="btn danger" id="confStop">Oui, terminer</button></div>`;
    row.replaceWith(box);
    $('garder').onclick=()=>{ box.replaceWith(row); };
    $('confStop').onclick=()=>finDefi();
    $('garder').focus();
  }
  function finDefi(detailHtml=''){
    st.timerOn=false; st.mode='result';
    const k=run?run.reussis:0; run=null; oublierRun(); eyebrow(eyebrowBase());
    showCard(`${hero('Challenge')}<h2>Fin de la course</h2>
      <div class="stats"><div class="stat"><span>Niveaux réussis</span><b>${k}</b></div><div class="stat"><span>Ton record</span><b>${DEFI.moi}</b></div><div class="stat"><span>Record partie</span><b>${DEFI.rec}</b></div></div>
      ${typeof detailHtml==='string'?detailHtml:''}
      <p class="small">${recLigne()}</p>
      <div class="row"><button class="btn primary" id="encore">Nouvelle course</button><button class="btn" id="tomenu">Menu</button></div>`);
    $('encore').onclick=startDefi; $('tomenu').onclick=menu;
  }
  const unite = n => `${n} ${G.unit ? G.unit[n>1?1:0] : (n>1?'agents':'agent')}`;
  const effectif = () => { const d=G.diffs[st.diff]; const n=Number(Q.get('agents')); return unite(Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents); };
  const effLabel = () => G.effLabel || `Effectif ${G.serviceShort} sur place`;

  function menu(){
    if(INC && fini){ post('close'); return; }
    st.mode='menu'; st.timerOn=false; hideCoach(); G.onMenu && G.onMenu();
    if(run){ run=null; eyebrow(eyebrowBase()); }
    const touch=matchMedia('(pointer:coarse)').matches;
    // Tuto déjà vu (ou en option) : petit bouton discret au-dessus de l'action principale, pas un second gros bouton.
    const tutoSeul = () => `<button class="tuto-mini" id="tuto" type="button"><i aria-hidden="true">?</i>${st.tuto?'Revoir le tuto':'Tuto'}</button>`;
    // Guide illustré (si le mini-jeu en a un) : petit bouton à côté du tuto, sur tous les écrans de départ.
    const guideMini = () => G.guide ? `<button class="tuto-mini" id="guideBtn" type="button"><i aria-hidden="true">i</i>Comment jouer</button>` : '';
    const tutoMini = () => G.guide ? `<div class="minis">${guideMini()}${tutoSeul()}</div>` : tutoSeul();
    const tutoBtns = (goLbl) => st.tuto
      ? `<button class="btn primary" id="go">${goLbl}</button>`
      : `<button class="btn primary" id="tuto">Commencer le tuto</button><button class="btn" id="go">${RENF?'Commencer sans tuto':INC?'Intervenir sans tuto':'Jouer directement'}</button>`;
    // Événement d'actualité (lancé depuis Ma ZP) : une seule partie, réglage normal, puis invitation au Challenge.
    if(G.evt && !INC){
      showCard(`
        ${hero('Événement · '+G.service)}
        <h2>${G.headline}</h2>
        ${G.story}
        ${tutoMini()}<div class="row"><button class="btn primary" id="evtGo">${G.evt.go||'Jouer'}</button></div>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}
        <p class="demo">Une partie en difficulté normale, sans effet sur ta zone.</p>`);
      $('evtGo').onclick=jouerEvt; $('tuto').onclick=startTuto; brancherGuide();
      return;
    }
    if(INC){
      const d=G.diffs[st.diff];
      showCard(`
        ${hero((RENF?'Appui PJF · ':'Incident du jour · ')+G.serviceShort)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="lbl2">${effLabel()}</div>
        <div class="seg seg1"><button aria-pressed="true" tabindex="-1"><span class="ppl">${'<i></i>'.repeat(Math.max(1,Math.min(12,Number(Q.get('agents'))||d.agents)))}</span><b>${effectif()}</b>${d.label}</button></div>
        ${Q.get('pourquoi')?`<p class="small" style="opacity:.8">${escH(Q.get('pourquoi'))}</p>`:''}
        <p class="small">${RENF?`Un seul essai. Réussi : ${escH(Q.get('gain')||'une pièce pour ton enquête')}. Raté ou abandonné : ${escH(Q.get('malus')||'pas de pièce')}.`:`Un seul essai. Réussi : ${escH(Q.get('gain')||'un bonus')} et des points de jauge des skins. Raté ou abandonné : ${escH(Q.get('malus')||G.malus)}. Tout s’applique à 20:00.`}</p>
        ${st.tuto?tutoMini():guideMini()?`<div class="minis">${guideMini()}</div>`:''}<div class="row">${tutoBtns(RENF?'Commencer':'Intervenir')}</div>
        <button class="btn small" id="later" style="align-self:center">Plus tard</button>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}`);
    } else if(MODE==='train'){
      // Dans Ma ZP, l'entraînement aux mini-jeux, c'est le challenge : les premiers niveaux servent d'échauffement.
      const reprise=runSauvee();
      showCard(`
        ${hero('Challenge · '+G.service)}

/* Réseau : un arbre de câbles relie le serveur (au centre) à tous les PC. Les cases ont été tournées au hasard.
   Il faut tout reconnecter : chaque PC relié au serveur, aucun bout de câble dans le vide. */
const N=1,E=2,S=4,W=8, DIRS=[[N,0,-1,S],[E,1,0,W],[S,0,1,N],[W,-1,0,E]];
const rot=(m,k)=>{ k=((k%4)+4)%4; return ((m<<k)|(m>>(4-k)))&15; };
const deg=m=>((m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1));
const R={cols:0,rows:0,cells:[],srv:0,over:true,rots:0,won:false,tuto:0};

function generate(cols,rows){
  const n=cols*rows, base=new Array(n).fill(0), seen=new Array(n).fill(false);
  const srv=Math.floor(rows/2)*cols+Math.floor(cols/2);
  seen[srv]=true; const front=[]; const push=i=>DIRS.forEach(([b,dx,dy],k)=>front.push([i,k]));
  push(srv); let cnt=1;
  while(cnt<n && front.length){
    const j=randi(0,front.length-1), [i,k]=front.splice(j,1)[0], [b,dx,dy,o]=DIRS[k];
    const x=i%cols+dx, y=Math.floor(i/cols)+dy; if(x<0||y<0||x>=cols||y>=rows) continue;
    const t=y*cols+x; if(seen[t]) continue;
    if(i!==srv && deg(base[i])>=3) continue;               // pas de croisement à 4 branches
    base[i]|=b; base[t]|=o; seen[t]=true; cnt++; push(t);
  }
  if(cnt<n) return generate(cols,rows);
  return {base,srv};
}
function cur(i){ const c=R.cells[i]; return rot(c.base,c.turns); }
function powered(){
  const on=new Set([R.srv]), q=[R.srv];
  while(q.length){ const i=q.pop(), m=cur(i), x=i%R.cols, y=Math.floor(i/R.cols);
    for(const [b,dx,dy,o] of DIRS){ if(!(m&b)) continue; const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=R.cols||ny>=R.rows) continue;
      const t=ny*R.cols+nx; if(!on.has(t) && (cur(t)&o)){ on.add(t); q.push(t); } } }
  return on;
}
/* Gagné : tous les PC reliés au serveur, et aucun câble du réseau allumé ne pend dans le vide.
   Une case de câble restée à l'écart (éteinte) ne compte pas : un autre branchement valable que celui
   du générateur est accepté (retour de joueur : tous les PC allumés, deux cases grises, pas de victoire). */
function solved(on){
  for(let i=0;i<R.cells.length;i++) if(i!==R.srv && deg(R.cells[i].base)===1 && !on.has(i)) return false;
  for(const i of on){ const m=cur(i), x=i%R.cols, y=Math.floor(i/R.cols);
    for(const [b,dx,dy,o] of DIRS){ if(!(m&b)) continue; const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=R.cols||ny>=R.rows) return false; if(!(cur(ny*R.cols+nx)&o)) return false; } }
  return true;
}

/* ---------- rendu ---------- */
const ARM={1:'M50 50V-2',2:'M50 50H102',4:'M50 50V102',8:'M50 50H-2'};
const PC='<svg class="ic" viewBox="0 0 100 100"><rect class="scr" x="29" y="30" width="42" height="31" rx="5"/><rect class="ft" x="44" y="61" width="12" height="6"/><rect class="ft" x="36" y="66" width="28" height="5" rx="2"/></svg>';
const SRV='<svg class="srv" viewBox="0 0 100 100"><rect x="27" y="22" width="46" height="56" rx="7"/><path d="M34 40h32M34 52h32M34 64h20" stroke="#b49bff" stroke-width="4" stroke-linecap="round"/><circle cx="63" cy="64" r="4.5"/></svg>';
function build(){
  const b=$('board'); b.classList.remove('won');
  b.style.gridTemplateColumns=`repeat(${R.cols},var(--cs))`; b.style.gridTemplateRows=`repeat(${R.rows},var(--cs))`;
  b.innerHTML=R.cells.map((c,i)=>{
    const arms=[1,2,4,8].filter(k=>c.base&k).map(k=>`<path d="${ARM[k]}"/>`).join('');
    const leaf=i!==R.srv && deg(c.base)===1, hub=!leaf&&i!==R.srv;
    const hubC=r=>hub?`<circle cx="50" cy="50" r="${r}"/>`:'';
    return `<button class="cell${leaf?' pc':''}${i===R.srv?' srvc':''}" data-i="${i}" aria-label="Case ${i+1}"><svg class="t" viewBox="0 0 100 100" style="transform:rotate(${c.turns*90}deg)"><g class="rim">${arms}${hubC(12)}</g><g class="core">${arms}${hubC(7)}</g><g class="flow">${arms}</g></svg>${leaf?PC:''}${i===R.srv?SRV:''}</button>`;
  }).join('');
  fit(); refresh();
}
function fit(){
  if(!R.cols) return; const w=$('wrap').getBoundingClientRect();
  const pad=20+16+12, cs=Math.floor(Math.min((w.width-pad-4*(R.cols-1))/R.cols,(w.height-pad-4*(R.rows-1))/R.rows,72));
  $('board').style.setProperty('--cs',Math.max(28,cs)+'px');
}
/* Pistes de circuit décoratives autour du plateau (fixes, régénérées à la taille). */
function traces(){
  const r=$('wrap').getBoundingClientRect(), w=Math.round(r.width), h=Math.round(r.height); if(!w) return;
  let seed=11; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); let out='';
  for(let n=0;n<Math.round(w*h/4500);n++){
    let x=Math.round(rnd()*w/10)*10, y=Math.round(rnd()*h/10)*10, d=`M${x} ${y}`;
    for(let q=0;q<3;q++){ const L=20+rnd()*70, k=Math.floor(rnd()*4); if(k===0)x+=L; else if(k===1)y+=L; else if(k===2){x+=L*.7;y+=L*.7;} else {x-=L*.7;y+=L*.7;} d+=`L${x|0} ${y|0}`; }
    out+=`<path d="${d}"/><circle cx="${x|0}" cy="${y|0}" r="2.4"/>`;
  }
  const t=$('traces'); t.setAttribute('viewBox',`0 0 ${w} ${h}`); t.innerHTML=out;
}
new ResizeObserver(()=>{ fit(); traces(); }).observe($('wrap'));
function refresh(){
  const on=powered(), els=$('board').children;
  for(let i=0;i<els.length;i++){ els[i].classList.toggle('on',on.has(i)); els[i].classList.toggle('lock',!!R.cells[i].lock); }
  const pcs=R.cells.map((c,i)=>i!==R.srv&&deg(c.base)===1?i:-1).filter(i=>i>=0);
  $('pcTxt').textContent=`PC reliés ${pcs.filter(i=>on.has(i)).length}/${pcs.length}`; $('rotTxt').textContent=`Rotations ${R.rots}`;
  return on;
}

/* ---------- interactions ---------- */
let press=null;
$('board').addEventListener('pointerdown',e=>{ const el=e.target.closest('.cell'); if(!el||R.over&&Shell.st.mode!=='tuto') return;
  if(e.button===2){ toggleLock(+el.dataset.i); return; }
  press={i:+el.dataset.i, t:setTimeout(()=>{ toggleLock(press.i); press.done=true; },430), done:false}; });
const endPress=e=>{ if(!press) return; clearTimeout(press.t); const p=press; press=null;
  if(!p.done && e.type==='pointerup'){ const el=e.target.closest('.cell'); if(el&&+el.dataset.i===p.i) turn(p.i); } };
$('board').addEventListener('pointerup',endPress); $('board').addEventListener('pointercancel',endPress);
$('board').addEventListener('pointerleave',()=>{ if(press){ clearTimeout(press.t); press=null; } });
function toggleLock(i){ if(R.won) return; R.cells[i].lock=!R.cells[i].lock; Shell.blip(R.cells[i].lock?520:380,.05,'triangle',.05); Shell.buzz(20); refresh(); }
function turn(i){
  if(R.won||R.over&&Shell.st.mode!=='tuto') return;
  const c=R.cells[i]; if(c.lock){ Shell.toast('Case verrouillée','info'); return; }
  if(deg(c.base)===4) return;
  c.turns++; R.rots++; $('board').children[i].querySelector('.t').style.transform=`rotate(${c.turns*90}deg)`;
  Shell.blip(900+randi(0,200),.03,'square',.03);
  const on=refresh();
  if(Shell.st.mode==='tuto' && R.tuto===1 && on.has(R.tutoPc)) tutoNext();
  if(solved(on)) win();
}
function win(){
  R.won=true; $('board').classList.add('won'); Shell.win();
  if(Shell.st.mode==='tuto'){ setTimeout(Shell.endTuto,900); return; }
  R.over=true; Shell.stopTimer();
  const used=Math.round(R.cfg.time-Shell.st.timeLeft), fast=used<=R.cfg.time*.6;
  setTimeout(()=>Shell.result({ok:true,faults:fast?0:1,stats:[['Temps',used+' s'],['Rotations',R.rots],['Cases',R.cells.length]],
    note:fast?'Rebranché en un temps record : double point.':`Termine en moins de ${Math.round(R.cfg.time*.6)} s pour gagner +2.`}),1000);
}
function newBoard(cols,rows,scr=1){
  const {base,srv}=generate(cols,rows);
  Object.assign(R,{cols,rows,srv,rots:0,won:false,cells:base.map(b=>({base:b,turns:0,lock:false}))});
  R.cells.forEach(c=>{ if(Math.random()<scr) c.turns=randi(0,3); });
  if(scr>0 && solved(powered())) return newBoard(cols,rows,scr);
  // les orientations « de départ » ne doivent pas déjà donner la solution pour une case droite (2 positions possibles)
  build();
}

  diffHint:'Plus d’enquêteurs : un réseau plus petit à reconnecter.',
  desktopHint:'Sur ordinateur : clic pour tourner, clic droit pour verrouiller une case.',
  rules:['Toucher une case la <b>tourne</b> d’un quart de tour.','Gagné quand <b>tous les PC</b> sont reliés au serveur et qu’<b>aucun câble</b> du réseau allumé ne pend dans le vide (une case restée grise ne compte pas).','Un câble au bord du plateau est forcément faux : commence par les bords et les coins.','<b>Appui long</b> (ou clic droit) : verrouiller une case sûre.','Terminé dans les 60 % du temps : <b>+2</b> sur la jauge skins. Sinon : <b>+1</b>.'],
  winTitle:'Réseau reconnecté', loseTitle:'Réseau toujours coupé', skin:'Baie de serveurs',
  malus:'la RCCU n’a pas pu accéder au réseau : pas d’indice supplémentaire aujourd’hui.',
  onMenu(){ R.over=true; },
  onInit(){ newBoard(5,5); R.over=true; },
  onPlay(cfg){ R.cfg=cfg; newBoard(cfg.cols,cfg.rows); R.over=false;
    Shell.startTimer(cfg.time,()=>{ if(!R.over&&!R.won){ R.over=true; Shell.bad(); const t=$('pcTxt').textContent.replace('PC reliés ','');
      Shell.result({ok:false,faults:1,stats:[['PC reliés',t],['Rotations',R.rots],['Temps','écoulé']]}); } }); },
  onTuto(){
    newBoard(3,3,0); R.over=false; R.tuto=0;
    // on ne mélange que deux PC : un à tourner d'abord (clignotant), un autre ensuite
    const pcs=shuffle(R.cells.map((c,i)=>i!==R.srv&&deg(c.base)===1?i:-1).filter(i=>i>=0));
    R.tutoPc=pcs[0]; R.cells[pcs[0]].turns=2; if(pcs[1]!==undefined) R.cells[pcs[1]].turns=1;
    build(); $('board').children[R.tutoPc].classList.add('hint'); tutoNext();
  }
});

</script>
