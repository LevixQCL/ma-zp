<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Interception</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-cyb{--accent:#b49bff;--accent-ink:#170a33;--accent-soft:rgba(180,155,255,.16)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:76px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.tuto-mini{align-self:flex-end;display:inline-flex;align-items:center;gap:6px;margin:-4px 0 -6px;padding:5px 11px;border-radius:999px;border:1px solid var(--stroke);background:transparent;color:var(--mute);font:600 12.5px var(--f-body);cursor:pointer}
.minis{align-self:flex-end;display:flex;gap:8px;margin:-4px 0 -6px}.minis .tuto-mini{margin:0}#guideBtn{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini:hover{color:var(--ink);border-color:var(--stroke-2)}
.tuto-mini i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.debrief-list{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;display:grid;gap:6px}
.debrief-list ul{gap:6px}
.debrief-list li::before{background:var(--bad)!important}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}
/* Défi d'endurance (entraînement) */
.defi-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,#FFB23F 45%,transparent);background:color-mix(in srgb,#FFB23F 10%,transparent);border-radius:14px;padding:12px}
.defi-box>div{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.defi-box b{font-family:var(--f-disp);font-size:15px}
.btn.defi{flex:0 0 auto;background:#FFB23F;color:#241400;border-color:transparent}
.coeurs{color:#FF6E6A;letter-spacing:2px}


/* Restylage « salle des serveurs RCCU » : en-tête en métal brossé avec afficheur LCD, plateau en circuit imprimé,
   relais en cristal bleu, câbles lumineux où circulent les données, cible rouge pour les coupures. */
.top{position:relative;padding:8px 10px;border-radius:16px;
  background:linear-gradient(180deg,#d9dee6 0%,#aeb6c3 48%,#c7cdd7 52%,#8f98a7 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 3px rgba(0,0,0,.35),0 0 0 1px #4b5262,0 6px 18px rgba(0,0,0,.5)}
.top::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px 3px)}
.top .badge{background:linear-gradient(180deg,#2a3354,#121a33);color:#bcd2ff;box-shadow:inset 0 0 0 1px #6c7a99,0 1px 0 rgba(255,255,255,.6)}
.top .eyebrow{color:#3c4456}.top h1{color:#141a28;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.top .iconbtn{background:linear-gradient(180deg,#2a3354,#121a33);border-color:#5b6886;color:#cfe0ff}
.top .ring .trk{stroke:#273152}.top .ring{border-radius:50%;background:radial-gradient(circle,#1a2340 60%,#0c1226);box-shadow:0 0 0 2px #59658a}
.top .timer{color:#d9e6ff}
.lcd{flex:0 0 auto;height:40px;min-width:86px;padding:0 10px;border-radius:8px;display:grid;place-items:center;
  font:400 25px/1 "Share Tech Mono",ui-monospace,monospace;letter-spacing:.08em;color:#b9d4ff;
  background:linear-gradient(180deg,#0a1230,#141f4a);box-shadow:inset 0 2px 6px rgba(0,0,0,.8),0 0 0 2px #59658a,0 1px 0 3px rgba(255,255,255,.4);
  text-shadow:0 0 6px rgba(140,180,255,.9)}
.lcd.r{color:#ff9aa1;text-shadow:0 0 6px rgba(255,90,102,.9)} .lcd.g{color:#8ff7c4;text-shadow:0 0 6px rgba(61,245,154,.9)}
@media (max-width:440px){.lcd{min-width:58px;height:36px;font-size:18px;padding:0 6px}.top .badge{display:none}.top{gap:8px}.top .hud{gap:5px}.top h1{font-size:20px}}
.gauge{padding:6px 10px;border-radius:10px;background:linear-gradient(180deg,#0b1430,#08102a);box-shadow:inset 0 0 0 1px #2b3a66}
.gauge .gbar{height:8px;background:repeating-linear-gradient(90deg,rgba(120,160,255,.12) 0 6px,transparent 6px 8px)}
.gauge .gbar i{background:linear-gradient(90deg,#3b6cff,#7fb0ff);box-shadow:0 0 8px rgba(110,150,255,.8)}

.boardwrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;
  background:radial-gradient(60% 45% at 50% 50%,rgba(40,120,255,.14),transparent 75%),linear-gradient(180deg,#0b1834,#06102a);
  box-shadow:inset 0 0 0 1px rgba(110,170,255,.25),inset 0 0 40px rgba(0,0,0,.6)}
.pcb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pcb path{fill:none;stroke:rgba(90,150,255,.16);stroke-width:1.6;stroke-linejoin:round}
.pcb circle{fill:none;stroke:rgba(90,150,255,.28);stroke-width:1.4}
.pcb text{font:500 9px "IBM Plex Mono",monospace;fill:rgba(110,170,255,.16)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.grid path{stroke:rgba(110,170,255,.06);stroke-width:1}
.e{stroke:rgba(80,190,255,.85);stroke-width:2.2;stroke-linecap:round;transition:stroke .3s,opacity .3s}
.eg{stroke:rgba(60,150,255,.35);stroke-width:9;stroke-linecap:round;filter:url(#flou);transition:opacity .3s}
.ef{stroke:#e8fbff;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1.5 22;animation:flux 1.6s linear infinite;opacity:.85}
@keyframes flux{to{stroke-dashoffset:-47}}
.dead .e{stroke:rgba(80,120,170,.25);stroke-dasharray:3 8}.dead .eg,.dead .ef{opacity:0}
.route{fill:none;stroke:#ff4d5e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 11;animation:march .6s linear infinite;filter:drop-shadow(0 0 5px rgba(255,60,80,.95))}
.route.piege{stroke:#3df59a;filter:drop-shadow(0 0 6px rgba(61,245,154,.95))}
.route.bloque{stroke:#ffb347;filter:drop-shadow(0 0 5px rgba(255,180,70,.9))}
@keyframes march{to{stroke-dashoffset:-13}}
.n{cursor:pointer}
.n .hit{fill:transparent}
.n .halo{fill:url(#halo);transition:opacity .3s}
.n .gem{fill:url(#cristal);stroke:#bfe6ff;stroke-width:1.4;transition:opacity .3s}
.n .facet{fill:rgba(255,255,255,.22)}
.n .core{fill:#f2fbff;filter:url(#flou2)}
.n:hover .gem{stroke:#fff}
.n .tgt{display:none}
.n.cut .gem,.n.cut .facet,.n.cut .core,.n.cut .halo{opacity:.18}
.n.cut .tgt{display:block}
.tgt .rg{fill:rgba(255,40,60,.16);stroke:#ff4d5e;stroke-width:2.4;filter:drop-shadow(0 0 6px rgba(255,60,80,.9))}
.tgt .rd{fill:none;stroke:#ff8890;stroke-width:1.6;stroke-dasharray:5 6;transform-origin:0 0;animation:spin 6s linear infinite}
.tgt .xx{stroke:#ff3347;stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,40,60,1))}
.tgt.neuf{animation:verrou .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes verrou{from{transform:scale(2.2) rotate(-45deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.n.hint .gem{animation:hintN 1s ease-in-out infinite}
@keyframes hintN{50%{stroke:#ffd166;stroke-width:4;filter:drop-shadow(0 0 9px rgba(255,209,102,1))}}
.n.fixe{cursor:default}
.src .beam{fill:url(#rayon);opacity:.75}
.src rect.box{fill:url(#rack);stroke:#ff5a66;stroke-width:2.6;filter:drop-shadow(0 0 10px rgba(255,60,80,.8))}
.src path{stroke:#ffb3b8;stroke-width:2.4;fill:none;stroke-linecap:round}
.src .led{animation:blink 1s steps(2) infinite}.src .led.b{animation-delay:.33s}.src .led.c{animation-delay:.66s}
@keyframes blink{50%{opacity:.25}}
.exit .globe{fill:url(#globe);stroke:#7fe6ff;stroke-width:2;filter:drop-shadow(0 0 10px rgba(80,220,255,.8))}
.exit path{stroke:rgba(210,250,255,.75);stroke-width:1.6;fill:none}
.exit .land{fill:rgba(160,240,220,.45);stroke:none}
.ear .disk{fill:#062a1c;stroke:#3df59a;stroke-width:3;filter:drop-shadow(0 0 10px rgba(61,245,154,.85))}
.ear .r1{fill:none;stroke:#3df59a;stroke-width:2;stroke-dasharray:14 8;transform-origin:0 0;animation:spin 9s linear infinite;opacity:.8}
.ear .r2{fill:none;stroke:#3df59a;stroke-width:1.2;stroke-dasharray:3 6;transform-origin:0 0;animation:spin 14s linear infinite reverse;opacity:.6}
.ear circle.p{fill:none;stroke:#3df59a;stroke-width:2;opacity:0;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{opacity:.8;r:24}100%{opacity:0;r:52}}
.ear path{stroke:#c9ffe3;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ear .bars rect{fill:#3df59a;opacity:.7}
.lbl{font:700 15px "Instrument Sans",system-ui,sans-serif;fill:#cdd8ee;text-anchor:middle;paint-order:stroke;stroke:#06102a;stroke-width:5px;pointer-events:none}
.lbl.r{fill:#ff8b94}.lbl.g{fill:#7ff5bb}.lbl.b{fill:#a6ecff}
.tag{font:600 9px "IBM Plex Mono",monospace;fill:#ffd9dc;pointer-events:none}
.tagbox{fill:rgba(60,8,16,.85);stroke:#ff4d5e;stroke-width:1}
.pkt,.trail{pointer-events:none}
.trail{fill:none;stroke:url(#queue);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#flou)}
.pkt .core{fill:#fff}

<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',
  alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="12" rx="2.5"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3.5 13h17"/><circle cx="17" cy="16.5" r="1" fill="currentColor"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16.5h14v-4l-2-5H7l-2 5z"/><path d="M5 12.5h14"/><circle cx="8" cy="16.5" r="1.8"/><circle cx="16" cy="16.5" r="1.8"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>',
  print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 8.5a6.5 6.5 0 0 1 11 0"/><path d="M5.5 13c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5c0 1.6-.2 3.1-.6 4.5"/><path d="M8.5 19.5c-.6-1.9-1-4-1-6.5a4.5 4.5 0 0 1 9 0c0 2.2-.4 4.3-1.1 6"/><path d="M12 12.5c0 3 .5 5.7 1.4 8"/><path d="M10.6 21c-.7-1.7-1.1-3.6-1.1-5.5"/></svg>',
  dna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7 3c0 6 10 6 10 12s-10 3-10 6"/><path d="M17 3c0 6-10 6-10 12s10 3 10 6"/><path d="M8.5 6.5h7M9 17.5h6M8 11.5h3M13 11.5h3"/></svg>',
  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',
  trace:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="19" cy="15" r="2"/><path d="M6.2 16.3l4.6-7.6M13.4 8.6l4.3 4.8"/><path d="M19 3v4M17 5h4"/></svg>',
  barrage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="6" rx="1.5"/><path d="M8 7l-3 6M13 7l-3 6M18 7l-3 6"/><path d="M6 13v6M18 13v6M4 19h4M16 19h4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>'
};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    c.innerHTML=`<div class="av">CP</div><div class="body"><div class="step"><span class="dots" aria-label="Étape ${step} sur ${total}">${dots}</span><button class="skip" id="skipTuto">Passer le tuto</button></div><div>${html}</div></div>`;
    $('skipTuto').onclick=endTuto;
  }
  function hideCoach(){ $('coach').hidden=true; }
  const hero = sub => `<div class="hero"><div class="badge">${document.querySelector('.top .badge').innerHTML}</div><div><div class="eyebrow">${sub}</div></div></div>`;

  // Intégration dans Ma ZP : ?mode=incident (incident du jour, un seul essai), ?mode=renfort (renfort PJF pour
  // l'enquête, un seul essai, sans jauge) ou ?mode=train (entraînement).
  const Q = new URLSearchParams(location.search);
  const MODE = ['incident','train','renfort'].includes(Q.get('mode')) ? Q.get('mode') : null;
  const RENF = MODE==='renfort';
  const INC = MODE==='incident' || RENF;
  const escH = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function post(type, data={}){ try{ if(window.parent!==window) window.parent.postMessage({source:'mazp-mj', jeu:G.key, id:Q.get('id'), type, ...data}, location.origin); }catch(e){} }
  let joue=false, fini=false;

  // ───── Challenge (l'entraînement aux mini-jeux dans Ma ZP) : niveaux 1 → ∞, trois erreurs et la course s'arrête. ─────
  // Le record de la partie (et son détenteur) arrive par l'adresse ; chaque niveau réussi est signalé à Ma ZP.
  const DEFI = { rec: Math.max(0, Number(Q.get('rec'))||0), recNom: Q.get('recNom')||'', moi: Math.max(0, Number(Q.get('moi'))||0), erreurs: 3 };
  let run = null; // { niveau, erreurs, reussis } pendant une course
  /**
   * Réglages d'un niveau : du niveau 1 (plus doux que « facile ») au niveau 10 (= « difficile »), en passant par
   * facile (4) et normal (7) ; au-delà, chaque réglage continue de se serrer au même rythme que de normal à difficile,
   * en multipliant (au moins 3 % par niveau). Le temps, lui, tend vers un plancher jouable par un très bon joueur. Bornes par jeu.
   */
  function cfgNiveau(n){
    const F=G.diffs.facile, N=G.diffs.normal, D=G.diffs.difficile, B=G.bornes||{};
    const out={label:`Niveau ${n}`, niveau:n, defi:true};
    const val=(f,m,d,k)=>{
      if(n<=10){
        const pts=[[1,f+(f-m)*0.5],[4,f],[7,m],[10,d]];
        for(let i=0;i<3;i++){ const [a,va]=pts[i],[b,vb]=pts[i+1]; if(n<=b) return va+(vb-va)*(n-a)/(b-a); }
      }
      let r = m>0&&d>0 ? Math.pow(d/m,1/3) : 1;
      if(r===1 && k==='time') r=0.95;
      else if(r!==1 && Math.abs(r-1)<0.03) r = r>1?1.03:0.97;
      // Le temps s'approche de son plancher sans l'atteindre (un temps qu'un très bon joueur tient encore) :
      // ce sont la précision et la complexité qui finissent par départager.
      if(k==='time'){ const lo=(B.time&&B.time[0])||0; if(lo>0 && d>lo) return lo+(d-lo)*Math.pow(Math.min(r,.93),n-10); }
      return d*Math.pow(r,n-10);
    };
    const borne=(v,b,k,d,ent)=>{ const [lo,hi]=b||(k==='time'?[Math.max(15,d*0.3),Infinity]:[-Infinity,Infinity]); v=Math.min(hi,Math.max(lo,v)); return ent?Math.round(v):Math.round(v*1000)/1000; };
    const cles=new Set([...Object.keys(F),...Object.keys(N),...Object.keys(D)]);
    for(const k of cles){
      if(k==='agents'||k==='label') continue;
      const f=F[k], m=N[k], d=D[k];
      const ref = d!==undefined?d:m!==undefined?m:f;
      if(f===undefined||m===undefined||d===undefined){ // réglage propre aux niveaux durs
        if(d!==undefined && n>=10) out[k]=d; else if(m!==undefined && n>=7) out[k]=m; else if(f!==undefined && n<7) out[k]=f;
        continue;
      }
      if(typeof ref==='number') out[k]=borne(val(f,m,d,k),B[k],k,d,[f,m,d].every(Number.isInteger));
      else if(Array.isArray(ref)) out[k]=ref.map((_,i)=>borne(val(f[i],m[i],d[i],k),B[k]&&B[k][i],k,d[i],[f[i],m[i],d[i]].every(Number.isInteger)));
      else out[k] = n>=10?d:n>=7?m:f;
    }
    return G.niveau ? G.niveau(n,out) : out;
  }
  const eyebrow = t => { const eb=document.querySelector('.top .eyebrow'); if(eb) eb.textContent=t; };
  const eyebrowBase = () => (RENF?'Appui PJF · ':INC?'Incident du jour · ':G&&G.evt?'Événement · ':MODE==='train'?'Challenge · ':'')+G.serviceShort;
  const recLigne = () => DEFI.rec ? `Record de la partie : <b>niveau ${DEFI.rec}</b>${DEFI.recNom?` par ${escH(DEFI.recNom)}`:''}.` : 'Pas encore de record dans la partie : le premier niveau réussi le crée.';
  // Course en cours gardée sur l'appareil : on peut quitter le mini-jeu (ou être coupé) et reprendre au même niveau,
  // avec les mêmes cœurs. Un niveau quitté en cours de route est simplement rejoué. La sauvegarde vaut pour ce joueur
  // et pour la semaine du Challenge en cours (la prime du dimanche ne doit pas hériter d'une course de la semaine passée).
  const CLE_RUN = `defiRun.${Q.get('u')||'anon'}`;
  const sauverRun = () => { if(MODE==='train' && run) store.set(CLE_RUN, {...run, sem:Q.get('sem')||'', at:Date.now()}); };
  const oublierRun = () => store.set(CLE_RUN, null);
  function runSauvee(){
    const r = MODE==='train' ? store.get(CLE_RUN, null) : null;
    if(!r || !(r.niveau>1 || r.erreurs>0)) return null;
    if((r.sem||'') !== (Q.get('sem')||'')) { oublierRun(); return null; }
    return r;
  }
  function startDefi(){ oublierRun(); run={niveau:1, erreurs:0, reussis:0}; jouerNiveau(); }
  function reprendreDefi(){ const r=runSauvee(); if(!r) return startDefi(); run={niveau:r.niveau, erreurs:r.erreurs, reussis:r.reussis||r.niveau-1}; jouerNiveau(); }
  function jouerNiveau(){
    sauverRun();
    hide(); hideCoach(); st.mode='play';
    eyebrow(`Challenge · niv. ${run.niveau} · ${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`);
    G.onPlay(cfgNiveau(run.niveau)); toast(`Niveau ${run.niveau}`);
  }
  function resultDefi({ok, stats, details}){
    st.timerOn=false; st.mode='result';
    const n=run.niveau;
    post('result',{ok, defi:true}); // compté comme une partie d'entraînement
    const detailHtml = details && details.length && !ok ? `<div class="debrief-list"><b>Ce qui s’est mal passé</b><ul>${details.map(d=>`<li><span>${d}</span></li>`).join('')}</ul></div>` : '';
    const coeurs = `${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`;
    if(ok){
      run.reussis=n; run.niveau=n+1; sauverRun();
      const record = n>DEFI.rec, perso = n>DEFI.moi;
      post('defi',{niveau:n});
      if(record){ DEFI.rec=n; DEFI.recNom='toi'; } if(perso) DEFI.moi=n;
      showCard(`<div class="verdict ok">${ICONS.check}</div><h2>Niveau ${n} réussi</h2>
        <div class="stats">${stats.slice(0,2).map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="stat"><span>Erreurs</span><b class="coeurs">${coeurs}</b></div></div>
        ${record?'<div class="skin">Nouveau record de la partie ! Ton nom s’affiche sur la tuile du challenge.</div>':perso?'<p class="small">Nouveau record personnel.</p>':''}
        <p class="small">Le niveau ${n+1} sera un peu plus dur.</p>
        <div class="row"><button class="btn primary" id="suite">Niveau ${n+1}</button><button class="btn" id="stop">Terminer la course</button></div>
        ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n+1}.</p>`:''}`);
      $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
      return;
    }
    run.erreurs++; sauverRun();
    if(run.erreurs>=DEFI.erreurs){ finDefi(detailHtml); return; }
    const reste=DEFI.erreurs-run.erreurs;
    showCard(`<div class="verdict bad">${ICONS.cross}</div><h2>Niveau ${n} raté</h2>
      <p class="small">Encore <b>${reste} erreur${reste>1?'s':''}</b> permise${reste>1?'s':''} <span class="coeurs">${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}</span>.</p>${detailHtml}
      <div class="row"><button class="btn primary" id="suite">Retenter le niveau ${n}</button><button class="btn" id="stop">Terminer la course</button></div>
      ${MODE==='train'?`<p class="small" style="opacity:.75">Besoin de partir ? Quitte le jeu : ta course reprendra au niveau ${n}.</p>`:''}`);
    $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
  }
  function finDefi(detailHtml=''){
    st.timerOn=false; st.mode='result';
    const k=run?run.reussis:0; run=null; oublierRun(); eyebrow(eyebrowBase());
    showCard(`${hero('Challenge')}<h2>Fin de la course</h2>
      <div class="stats"><div class="stat"><span>Niveaux réussis</span><b>${k}</b></div><div class="stat"><span>Ton record</span><b>${DEFI.moi}</b></div><div class="stat"><span>Record partie</span><b>${DEFI.rec}</b></div></div>
      ${typeof detailHtml==='string'?detailHtml:''}
      <p class="small">${recLigne()}</p>
      <div class="row"><button class="btn primary" id="encore">Nouvelle course</button><button class="btn" id="tomenu">Menu</button></div>`);
    $('encore').onclick=startDefi; $('tomenu').onclick=menu;
  }
  const unite = n => `${n} ${G.unit ? G.unit[n>1?1:0] : (n>1?'agents':'agent')}`;
  const effectif = () => { const d=G.diffs[st.diff]; const n=Number(Q.get('agents')); return unite(Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents); };
  const effLabel = () => G.effLabel || `Effectif ${G.serviceShort} sur place`;

  function menu(){
    if(INC && fini){ post('close'); return; }
    st.mode='menu'; st.timerOn=false; hideCoach(); G.onMenu && G.onMenu();
    if(run){ run=null; eyebrow(eyebrowBase()); }
    const touch=matchMedia('(pointer:coarse)').matches;

/* Interception : la connexion du suspect (paquet rouge) file au plus court vers une sortie VPN.
   Couper des relais pour la forcer à passer par l'écoute de la RCCU (vert). Si elle atteint une sortie : perdue.
   Si elle n'a plus aucune sortie possible : le suspect flaire le piège et coupe. Les coupures sont limitées.
   Profondeur (niveaux) : plusieurs connexions d'affilée (l'écoute grillée change de relais, les coupures restent),
   relais blindés (impossibles à couper), liaisons fibre (le paquet y file deux fois plus vite),
   et aux niveaux durs un suspect méfiant qui, à distance égale, évite l'écoute. */
const DENS={h:.72,v:.82,d:.22};
const R={nodes:[],adj:[],src:0,ears:[],ear:0,round:0,exits:[],pri:[],blind:new Set(),fast:new Set(),smart:false,
  cut:new Set(),pkt:0,next:-1,over:true,won:false,K:0,minK:0,mins:[],hops:0,cfg:null,anim:null,tuto:0,W:0,H:0,trail:[],sol:[]};
const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;

/* ---------- génération ---------- */
function maxflowCut(n,adj,src,exits,ear,removed,blind){
  // Coupe minimale en sommets (relais coupables) entre le suspect et les sorties, l'écoute et les relais déjà coupés retirés.
  const INF=1e9, N=2*n+1, T=2*n, cap=new Map(), g=Array.from({length:N},()=>[]);
  const add=(a,b,c)=>{ const k=a*N+b; if(!cap.has(k)){ g[a].push(b); g[b].push(a); cap.set(k,0); if(!cap.has(b*N+a)) cap.set(b*N+a,0); } cap.set(k,cap.get(k)+c); };
  const hors=v=>v===ear||removed.has(v);
  const fixe=v=>v===src||exits.includes(v)||blind.has(v);
  for(let v=0;v<n;v++){ if(hors(v)) continue; add(2*v,2*v+1,fixe(v)?INF:1); for(const w of adj[v]) if(!hors(w)) add(2*v+1,2*w,INF); }
  for(const x of exits) if(!hors(x)) add(2*x+1,T,INF);
  const S=2*src+1; let flow=0;
  for(;;){ const par=new Array(N).fill(-1); par[S]=S; const q=[S];
    while(q.length&&par[T]<0){ const a=q.shift(); for(const b of g[a]) if(par[b]<0&&cap.get(a*N+b)>0){ par[b]=a; q.push(b); } }
    if(par[T]<0) break; let f=INF; for(let b=T;b!==S;b=par[b]) f=Math.min(f,cap.get(par[b]*N+b));
    for(let b=T;b!==S;b=par[b]){ const a=par[b]; cap.set(a*N+b,cap.get(a*N+b)-f); cap.set(b*N+a,cap.get(b*N+a)+f); }
    flow+=f; if(flow>=INF) return {k:Infinity,set:[]}; }
  const seen=new Array(N).fill(false); seen[S]=true; const q=[S];
  while(q.length){ const a=q.shift(); for(const b of g[a]) if(!seen[b]&&cap.get(a*N+b)>0){ seen[b]=true; q.push(b); } }
  const set=[]; for(let v=0;v<n;v++) if(!hors(v)&&seen[2*v]&&!seen[2*v+1]) set.push(v);
  return {k:flow,set};
}
function distances(cut){
  const n=R.nodes.length, d=new Array(n).fill(Infinity), q=[];
  for(const x of R.exits) if(!cut.has(x)){ d[x]=0; q.push(x); }
  while(q.length){ const a=q.shift(); for(const b of R.adj[a]) if(!cut.has(b)&&d[b]===Infinity){ d[b]=d[a]+1; q.push(b); } }
  return d;
}
function hop(u,cut=R.cut,ear=R.ear){
  const d=distances(cut); if(d[u]===Infinity) return -1;
  let best=-1;
  for(const v of R.adj[u]){ if(cut.has(v)||d[v]!==d[u]-1) continue;
    // suspect méfiant : à distance égale, il évite l'écoute
    const sc=v=>(R.smart&&v===ear?1:0)*10+R.pri[v];
    if(best<0||sc(v)<sc(best)) best=v; }
  return best;
}
function route(from,cut=R.cut,ear=R.ear){ const r=[from]; let u=from; for(let i=0;i<80;i++){ if(u===ear||R.exits.includes(u)) break; const v=hop(u,cut,ear); if(v<0) break; r.push(v); u=v; } return r; }

function generate(c){
  const cols=Math.round(c.cols), rows=Math.round(c.rows), extra=Math.round(c.extra), kmin=Math.round(c.kmin), kmax=Math.round(c.kmax);
  const rounds=Math.max(1,Math.round(c.rounds||1)), nbBlind=Math.round(c.blind||0), nbFast=Math.round(c.fast||0);
  for(let t=0;t<500;t++){
    const n=cols*rows, id=(cc,r)=>r*cols+cc, nodes=[], adj=Array.from({length:n},()=>new Set());
    for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++) nodes.push({c:cc,r,x:cc*100+50+rand(-17,17),y:r*100+50+rand(-15,15)});
    const link=(a,b)=>{ adj[a].add(b); adj[b].add(a); };
    for(let r=0;r<rows;r++) for(let cc=0;cc<cols;cc++){
      if(cc+1<cols&&Math.random()<DENS.h) link(id(cc,r),id(cc+1,r));
      if(r+1<rows&&Math.random()<DENS.v) link(id(cc,r),id(cc,r+1));
      if(r+1<rows&&cc+1<cols&&Math.random()<DENS.d&&!adj[id(cc+1,r)].has(id(cc,r+1))) link(id(cc,r),id(cc+1,r+1));
      else if(r+1<rows&&cc>0&&Math.random()<DENS.d&&!adj[id(cc-1,r)].has(id(cc,r+1))) link(id(cc,r),id(cc-1,r+1));
    }
    const src=id(Math.floor(cols/2),0);
    const seen=new Set([src]), q=[src]; while(q.length){ const a=q.shift(); for(const b of adj[a]) if(!seen.has(b)){ seen.add(b); q.push(b); } }
    if(seen.size<n) continue;
    const nbx=cols>=5?3:2, bas=shuffle([...Array(cols).keys()]).slice(0,nbx).sort((a,b)=>a-b);
    if(nbx===2&&bas[1]-bas[0]<2&&cols>3) continue;
    const exits=bas.map(cc=>id(cc,rows-1));
    const libres=nodes.map((_,i)=>i).filter(i=>i!==src&&!exits.includes(i));
    const blind=new Set(shuffle(libres.filter(i=>nodes[i].r>=1)).slice(0,nbBlind));
    const edges=[]; adj.forEach((s,a)=>s.forEach(b=>{ if(a<b) edges.push(ek(a,b)); }));
    const fast=new Set(shuffle(edges).slice(0,nbFast));
    Object.assign(R,{nodes,adj,src,exits,blind,fast,pri:nodes.map(()=>Math.random()),cut:new Set(),smart:!!c.smart});
    // Connexions successives : chaque écoute est posée hors de la route du moment ; les coupures s'additionnent.
    const acc=new Set(), ears=[], mins=[], sols=[]; let ok=true;
    for(let k=0;k<rounds&&ok;k++){
      const r0=route(src,acc,-1);
      const cands=shuffle(libres.filter(i=>{ const rr=nodes[i].r; return rr>=2&&rr<=rows-2&&!adj[src].has(i)&&!r0.includes(i)&&!acc.has(i)&&!blind.has(i)&&!ears.includes(i); }));
      let trouve=false;
      for(const ear of cands){
        const mf=maxflowCut(n,adj,src,exits,ear,acc,blind);
        const lo=k===0?kmin:1, hi=k===0?kmax:Math.max(1,kmax-1);
        if(mf.k<lo||mf.k>hi) continue;
        const cs=new Set([...acc,...mf.set]), rr=route(src,cs,ear);
        if(rr[rr.length-1]!==ear||rr.length<4) continue;
        mf.set.forEach(v=>acc.add(v)); ears.push(ear); mins.push(mf.k); sols.push(mf.set); trouve=true; break;
      }
      ok=trouve;
    }
    if(!ok) continue;
    const minK=mins.reduce((a,b)=>a+b,0);
    Object.assign(R,{ears,ear:ears[0],round:0,mins,minK,sols,sol:[...acc],K:minK+extra});
    return true;
  }
  return false;
}

/* ---------- rendu ---------- */
const DEFS=`<defs>
  <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="flou2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="flou3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  <radialGradient id="halo"><stop offset="0" stop-color="#5ab4ff" stop-opacity=".55"/><stop offset="1" stop-color="#5ab4ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe8ff"/><stop offset=".45" stop-color="#3f8bff"/><stop offset="1" stop-color="#0d2a7a"/></linearGradient>
  <linearGradient id="blinde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe7a6"/><stop offset=".5" stop-color="#c79a3a"/><stop offset="1" stop-color="#5a3c0c"/></linearGradient>
  <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1420"/><stop offset="1" stop-color="#21060c"/></linearGradient>
  <radialGradient id="globe" cx=".35" cy=".3"><stop offset="0" stop-color="#9ff0ff"/><stop offset=".5" stop-color="#1b7fa8"/><stop offset="1" stop-color="#062436"/></radialGradient>
</defs>`;
function hexa(r){ return Array.from({length:6},(_,k)=>{ const a=Math.PI/180*(60*k-90); return `${(r*Math.cos(a)).toFixed(1)},${(r*Math.sin(a)).toFixed(1)}`; }).join(' '); }
function relaisSvg(i,a){
  const bl=R.blind.has(i);
  return `<g class="n${bl?' fixe blinde':''}" data-i="${i}" transform="translate(${a.x} ${a.y})"><circle class="hit" r="34"/><circle class="halo" r="30"/>
    <polygon class="gem" points="${hexa(16)}" ${bl?'style="fill:url(#blinde);stroke:#ffe7a6"':''}/><polygon class="facet" points="0,-16 13.9,-8 0,0 -13.9,-8"/>
    ${bl?'<path d="M0 -8l7 3v4c0 5-3 8-7 9-4-1-7-4-7-9v-4z" fill="#3a2606" stroke="#ffe7a6" stroke-width="1.5"/>':'<circle class="core" r="4.5"/>'}
    <g class="tgt"><circle class="rg" r="22"/><circle class="rd" r="30"/><path class="xx" d="M-12 -12l24 24M12 -12l-24 24"/></g></g>`;
}
function earSvg(i,a,k){
  const act=k===R.round, past=k<R.round;
  if(past) return relaisSvg(i,a);
  return `<g class="n fixe ear${act?'':' attente'}" data-i="${i}" transform="translate(${a.x} ${a.y})" ${act?'':'opacity=".42"'}>
    ${act?'<circle class="p" r="24"/>':''}<circle class="r2" r="38"/><circle class="r1" r="30"/><circle class="disk" r="22"/>
    <path d="M-9 6a11 11 0 0 1 9-15M-4 6l6-9M-2 -2l9 -9M6 -12l3 3"/><path d="M-11 9h22"/>
    <g class="bars" transform="translate(30 -30)"><rect x="0" y="6" width="3" height="6"/><rect x="5" y="2" width="3" height="10"/><rect x="10" y="-2" width="3" height="14"/><rect x="15" y="4" width="3" height="8"/></g>
    <text class="lbl g" y="${act?52:50}">${R.ears.length>1?`Écoute ${k+1}`:'Écoute'}</text></g>`;
}
function draw(){
  const cols=Math.max(...R.nodes.map(n=>n.c))+1, rows=Math.max(...R.nodes.map(n=>n.r))+1;
  R.W=cols*100; R.H=rows*100;
  const m=$('map'); m.setAttribute('viewBox',`-10 -28 ${R.W+20} ${R.H+58}`);
  let s=DEFS+'<g class="grid">'; for(let x=0;x<=R.W;x+=50) s+=`<path d="M${x} -28V${R.H+30}"/>`; for(let y=0;y<=R.H;y+=50) s+=`<path d="M-10 ${y}H${R.W+10}"/>`; s+='</g><g id="edges">';
  R.nodes.forEach((a,i)=>R.adj[i].forEach(j=>{ if(j>i){ const b=R.nodes[j], f=R.fast.has(ek(i,j)), L=`x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"`;
    s+=`<g class="edge${f?' fast':''}" data-a="${i}" data-b="${j}"><line class="eg" ${L}${f?' style="stroke:rgba(190,120,255,.45)"':''}/><line class="e" ${L}${f?' style="stroke:#d6a8ff;stroke-width:3.4"':''}/><line class="ef" ${L} style="animation-delay:-${(Math.random()*1.6).toFixed(2)}s${f?';animation-duration:.7s':''}"/></g>`; } }));
  s+='</g><polyline class="route" id="route" points=""/><polyline class="trail" id="trail" points=""/><g id="nodes">';
  R.nodes.forEach((a,i)=>{
    const ke=R.ears.indexOf(i);
    if(i===R.src) s+=`<g class="n fixe src" data-i="${i}" transform="translate(${a.x} ${a.y})">
      <rect class="box" x="-22" y="-26" width="44" height="46" rx="6"/><path d="M-13 -16h26M-13 -9h26M-13 -2h26M-13 5h26"/>
      <circle class="led" cx="-8" cy="13" r="2.4" fill="#ff5a66"/><circle class="led b" cx="0" cy="13" r="2.4" fill="#ffd166"/><circle class="led c" cx="8" cy="13" r="2.4" fill="#3df59a"/>
      <text class="lbl r" y="-34">Suspect</text></g>`;
    else if(ke>=0) s+=earSvg(i,a,ke);
    else if(R.exits.includes(i)) s+=`<g class="n fixe exit" data-i="${i}" transform="translate(${a.x} ${a.y})"><circle class="globe" r="21"/>
      <path class="land" d="M-12 -6c4-5 9-4 11 0s-2 7 2 9-3 7-7 4-8-8-6-13zM4 -14c5 0 9 3 10 7-3 1-6 0-8-2s-4-3-2-5z"/>
      <path d="M-21 0h42M0 -21c-9 9-9 33 0 42M0 -21c9 9 9 33 0 42M-18 -10h36M-18 10h36"/><text class="lbl b" y="42">Sortie VPN</text></g>`;
    else s+=relaisSvg(i,a);
  });
  s+=`</g><g class="pkt" id="pkt"><circle class="glow" r="17"/><circle class="core" r="7"/></g>`;
  m.innerHTML=s; R.trail=[]; placePkt(R.nodes[R.src]); refresh(); decor();
}
function placePkt(p){
  $('pkt').setAttribute('transform',`translate(${p.x} ${p.y})`);
  R.trail.push([p.x,p.y]); if(R.trail.length>14) R.trail.shift();
  $('trail').setAttribute('points',R.trail.map(q=>q.join(',')).join(' '));
}
function refresh(){
  document.querySelectorAll('#nodes .n').forEach(g=>g.classList.toggle('cut',R.cut.has(+g.dataset.i)));
  document.querySelectorAll('#edges .edge').forEach(l=>l.classList.toggle('dead',R.cut.has(+l.dataset.a)||R.cut.has(+l.dataset.b)));
  const from=R.next>=0?R.next:R.pkt, rr=R.won?[]:route(from), last=rr[rr.length-1];
  const pts=(R.next>=0?[R.pkt,...rr]:rr).map(i=>`${R.nodes[i].x},${R.nodes[i].y}`).join(' ');
  const el=$('route'); el.setAttribute('points',R.over&&!R.plan?'':pts);
  el.setAttribute('class','route'+(last===R.ear?' piege':(!R.exits.includes(last)&&last!==R.ear?' bloque':'')));
  $('cuts').innerHTML=Array.from({length:R.K},(_,k)=>`<i class="${k<R.cut.size?'used':''}"></i>`).join('');
  $('cutTxt').textContent=`${R.K-R.cut.size}/${R.K}`;
  $('hopTxt').textContent=R.ears.length>1?`Connexion ${Math.min(R.round+1,R.ears.length)}/${R.ears.length}`:`Relais franchis ${R.hops}`;
  //`TRACE  CNX ${Math.min(R.round+1,R.ears.length)}/${R.ears.length}\nNOEUDS ${R.nodes.length}  BLINDÉS ${R.blind.size}\nFIBRE ${R.fast.size}  MIN ${R.minK}`;
  return {last};
}
/* Circuit imprimé et colonnes de chiffres en fond (décor fixe, recalculé à la taille). */
function decor(){
  const r=$('wrap').getBoundingClientRect(), w=Math.round(r.width), h=Math.round(r.height); if(!w) return;
  let seed=7; const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647); let out='';
  for(let n=0;n<Math.round(w*h/5200);n++){
    let x=Math.round(rnd()*w/12)*12, y=Math.round(rnd()*h/12)*12, d=`M${x} ${y}`;
    for(let q=0;q<3;q++){ const L=24+rnd()*80, k=Math.floor(rnd()*4); if(k===0)x+=L; else if(k===1)y+=L; else if(k===2){x+=L*.7;y+=L*.7;} else {x-=L*.7;y+=L*.7;} d+=`L${x|0} ${y|0}`; }
    out+=`<path d="${d}"/><circle cx="${x|0}" cy="${y|0}" r="3"/>`;
  }
  for(let c=0;c<Math.round(w/70);c++){ const x=8+rnd()*w; for(let k=0;k<Math.round(h/16);k++) if(rnd()<.45) out+=`<text x="${x|0}" y="${(k*16+12)|0}">${Math.floor(rnd()*256).toString(16).padStart(2,'0')}</text>`; }
  const t=$('pcb'); t.setAttribute('viewBox',`0 0 ${w} ${h}`); t.innerHTML=out;
}
new ResizeObserver(decor).observe($('wrap'));
let flashT=0;
function flash(t,ok){ const f=$('flash'); f.textContent=t; f.className='flash'+(ok?' ok':''); f.style.opacity=1; clearTimeout(flashT); flashT=setTimeout(()=>f.style.opacity=0,2000); }
function lcd(t,k=''){ const l=$('lcd'); if(l){ l.textContent=t; l.className='lcd '+k; } }

/* ---------- jeu ---------- */
$('map').addEventListener('pointerdown',e=>{
  const g=e.target.closest('.n'); if(!g) return; const i=+g.dataset.i;
  if(R.won||(R.over&&!R.plan)) return;
  if(R.blind.has(i)){ Shell.toast('Relais blindé : impossible à couper','info'); Shell.buzz(30); return; }
  if(g.classList.contains('fixe')){ Shell.toast(R.ears.includes(i)?'C’est une écoute de la RCCU : laisse-la ouverte':i===R.src?'Le serveur du suspect : hors de portée':'Sortie VPN à l’étranger : hors de portée','info'); return; }
  if(R.cut.has(i)){ Shell.toast('Relais déjà coupé','info'); return; }
  if(i===R.pkt){ Shell.toast('Le paquet est déjà sur ce relais','info'); return; }
  if(i===R.next){ Shell.toast('Trop tard : le paquet y arrive','info'); Shell.buzz(30); return; }
  if(R.cut.size>=R.K){ Shell.toast('Plus de coupure disponible','info'); return; }
  R.cut.add(i); Shell.blip(240,.08,'sawtooth',.05); Shell.buzz(25);
  document.querySelectorAll('.n.hint').forEach(x=>x.classList.remove('hint'));
  const {last}=refresh();
  const tg=g.querySelector('.tgt'); tg.classList.remove('neuf'); void tg.getBBox(); tg.classList.add('neuf');
  if(last===R.ear) flash('Route déviée vers l’écoute',true);
  else if(!R.exits.includes(last)) flash('Plus aucune sortie : il va flairer le piège');
  if(Shell.st.mode==='tuto'&&R.tuto===1) tutoNext();
});

function depart(){
  if(R.over&&!R.plan) return;
  R.plan=false; R.over=false; lcd('TRACE','r');
  const v=hop(R.pkt);
  if(v<0){ lose('piege'); return; }
  R.next=v; refresh();
  const a=R.nodes[R.pkt], b=R.nodes[v], t0=performance.now(), dur=R.cfg.step*(R.fast.has(ek(R.pkt,v))?.45:1);
  const tick=now=>{ if(R.over) return; const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    placePkt({x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e}); if(k<1){ R.anim=requestAnimationFrame(tick); return; } arrive(v); };
  R.anim=requestAnimationFrame(tick);
}
function arrive(v){
  R.pkt=v; R.next=-1; R.hops++; Shell.blip(700,.03,'square',.02);
  if(v===R.ear){ capte(); return; }
  if(R.exits.includes(v)){ lose('sortie'); return; }
  refresh(); R.wait=setTimeout(depart,R.cfg.step*.45);
}
function stop(){ R.over=true; R.plan=false; cancelAnimationFrame(R.anim); clearTimeout(R.wait); clearTimeout(R.go); }
function capte(){
  if(R.round+1<R.ears.length){
    // Connexion interceptée, mais le suspect se reconnecte : l'écoute est grillée, la suivante prend le relais.
    stop(); $('pkt').classList.add('got'); Shell.good(); lcd('CAPTÉ','g');
    flash(`Connexion ${R.round+1} captée · il se reconnecte`,true);
    setTimeout(()=>{ R.round++; R.ear=R.ears[R.round]; R.pkt=R.src; R.next=-1; $('pkt').classList.remove('got'); const keep=new Set(R.cut); draw(); R.cut=keep; refresh();
      lancer(Math.max(2000,(R.cfg.plan||3000)*.6)); },1400);
    return;
  }
  win();
}
function win(){
  stop(); R.won=true; $('pkt').classList.add('got'); refresh(); lcd('CAPTÉ','g'); flash(R.ears.length>1?'Toutes les connexions captées':'Connexion interceptée',true); Shell.win();
  if(Shell.st.mode==='tuto'){ setTimeout(Shell.endTuto,1100); return; }
  Shell.stopTimer(); const sobre=R.cut.size<=R.minK;
  setTimeout(()=>Shell.result({ok:true,faults:sobre?0:1,stats:[['Coupures',`${R.cut.size} / ${R.K}`],['Minimum possible',R.minK],[R.ears.length>1?'Connexions':'Relais franchis',R.ears.length>1?R.ears.length:R.hops]],
    note:sobre?'Interception propre, sans coupure de trop : double point.':`Réussi avec ${R.minK} coupure${R.minK>1?'s':''} seulement pour gagner +2.`}),1100);
}
function lose(why){
  stop(); refresh(); Shell.bad(); Shell.stopTimer(); lcd('PERDU','r');
  flash(why==='sortie'?'Le paquet est sorti par le VPN':why==='temps'?'Temps écoulé':'Plus de sortie : le suspect a coupé');
  if(Shell.st.mode==='tuto'){ setTimeout(()=>{ Shell.toast('On recommence','info'); tutoStart(); },1500); return; }
  const det=[why==='sortie'?'Le paquet prend toujours le plus court chemin vers une sortie : coupe en avance les relais de la ligne rouge, pas seulement celui qu’il va atteindre.'
      :why==='temps'?'Le chrono est tombé avant la fin des connexions.'
      :'Ne bloque pas toutes les sorties : laisse-lui une seule route, celle qui passe par l’écoute (la ligne devient verte).'];
  if(R.ears.length>1) det.push('Plusieurs connexions : regarde aussi les écoutes suivantes (grisées) avant de couper. Une coupure faite pour la première peut gêner la suivante, et elles restent toutes.');
  setTimeout(()=>Shell.result({ok:false,faults:1,stats:[['Coupures',`${R.cut.size} / ${R.K}`],['Connexion',`${R.round+1} / ${R.ears.length}`],['Fin',why==='sortie'?'sortie VPN':why==='temps'?'chrono':'piège flairé']],details:det}),1300);
}
function newGame(cfg){
  stop(); R.cfg=cfg; R.won=false; R.hops=0; R.next=-1; $('pkt')&&$('pkt').classList.remove('got');
  if(!generate(cfg)) generate({cols:4,rows:5,extra:1,kmin:1,kmax:3,rounds:1});
  R.pkt=R.src; draw(); lcd('VEILLE');
}
function lancer(planMs){
  R.plan=true; R.over=true; refresh();
  const fin=performance.now()+planMs;
  const cd=()=>{ if(!R.plan) return; const s=Math.ceil((fin-performance.now())/1000); if(s>0){ lcd('T-'+s,'r'); setTimeout(cd,200); } }; cd();
  flash(R.round>0?`Connexion ${R.round+1} détectée`:`Connexion détectée · départ dans ${Math.round(planMs/1000)} s`);
  R.go=setTimeout(depart,planMs);
}

  // Au-delà du niveau 10 : trois connexions dès le niveau 13, suspect méfiant dès le niveau 16.

  niveau(n,c){

    if(neuf){ R.neuf=neuf; setTimeout(()=>flash(neuf,true),50); clearTimeout(flashT); setTimeout(()=>{ clearTimeout(flashT); flashT=setTimeout(()=>$('flash').style.opacity=0,5000); },60); }
  },
  onTuto(){ tutoStart(); }
});
