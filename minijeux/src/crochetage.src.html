<style>
/* ---- habillage « atelier » : métal brossé, laiton, LED ---- */
.lockview{position:relative;flex:1;min-height:190px;border-radius:26px;overflow:hidden;
  background:radial-gradient(80% 60% at 30% 20%,rgba(255,196,110,.08),transparent 70%),linear-gradient(160deg,#17191d,#0b0c0f);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.45)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;left:50%;transform:translateX(-50%);top:21px;display:flex;gap:6px;pointer-events:none}
.pins i{width:20px;height:7px;border-radius:4px;background:linear-gradient(180deg,#07080a,#1d2025);box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08);transition:background .25s,box-shadow .25s}
.pins i.on{background:radial-gradient(60% 90% at 50% 40%,#c8ffe0,#46d98a 55%,#1d8a52);box-shadow:0 0 10px rgba(70,217,138,.75),0 1px 0 rgba(255,255,255,.1)}
.status{padding:0 4px}
.status span{font:600 12px var(--f-mono,'IBM Plex Mono',monospace);letter-spacing:.06em;text-transform:uppercase;color:#a4977d}
.status b{color:#ffd88a;font-size:15px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:clamp(160px,30vh,236px);margin-bottom:env(safe-area-inset-bottom,0px)}
.pad{position:relative;border-radius:22px;touch-action:none;overflow:hidden;transition:opacity .2s,box-shadow .2s;
  background:radial-gradient(120% 90% at 30% 0%,rgba(255,255,255,.05),transparent 60%),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px),linear-gradient(180deg,#1a1c21,#0f1013);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.08),0 10px 24px rgba(0,0,0,.35)}
.pad.dim{opacity:.28}
.pad.focus{box-shadow:inset 0 0 0 1px rgba(255,200,110,.55),0 0 0 3px rgba(255,178,63,.18),0 10px 24px rgba(0,0,0,.35)}
.pad .ttl{position:absolute;left:14px;top:12px;font:800 16px var(--f-disp);letter-spacing:.02em;color:#ffd88a;text-shadow:0 1px 0 rgba(0,0,0,.6);pointer-events:none}
.pad .lbl{position:absolute;left:14px;bottom:12px;font-size:12px;color:#9c9382;line-height:1.35;pointer-events:none}
.tension .lbl{right:68px}
.tension .read{position:absolute;left:14px;top:36px;right:68px;font:600 12px var(--f-mono,'IBM Plex Mono',monospace);letter-spacing:.04em;text-transform:uppercase;color:#6f6a60;pointer-events:none}
.tension .read.ok{color:var(--ok)} .tension .read.bad{color:var(--bad)}
.tension.held{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.1),0 10px 24px rgba(0,0,0,.35)}
.meter{position:absolute;right:16px;top:12px;bottom:12px;width:38px;border-radius:19px;pointer-events:none;
  background:linear-gradient(90deg,#050607,#121418 50%,#050607);
  box-shadow:inset 0 2px 8px rgba(0,0,0,.9),0 0 0 3px #3a2f1c,0 0 0 4px #8a6a32,0 0 0 5px rgba(0,0,0,.6)}
.meter::before{content:"";position:absolute;inset:8px 3px;background:repeating-linear-gradient(180deg,rgba(255,216,138,.28) 0 1px,transparent 1px 10%);-webkit-mask:linear-gradient(90deg,#000 0 6px,transparent 6px calc(100% - 6px),#000 calc(100% - 6px));mask:linear-gradient(90deg,#000 0 6px,transparent 6px calc(100% - 6px),#000 calc(100% - 6px))}
.meter .zone{position:absolute;left:5px;right:5px;border-radius:12px;background:linear-gradient(180deg,rgba(70,217,138,.12),rgba(70,217,138,.38),rgba(70,217,138,.12));box-shadow:inset 0 0 0 1px rgba(70,217,138,.75),0 0 12px rgba(70,217,138,.25)}
.meter .needle{position:absolute;left:-8px;right:-8px;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(180deg,#ffffff,#b9c2cc);box-shadow:0 0 12px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.6);transition:background .15s,box-shadow .15s}
.meter .needle.out{background:linear-gradient(180deg,#ff9a9a,#ff5d5d);box-shadow:0 0 14px var(--bad)}
.meter .finger{position:absolute;left:3px;right:3px;height:24px;margin-top:-12px;border-radius:12px;border:2px solid rgba(255,216,138,.55);opacity:0;transition:opacity .15s}
.tension.held .finger{opacity:1}
.pick{display:grid;place-items:center;cursor:pointer}
.pick .ring{position:relative;width:clamp(88px,30vw,122px);height:clamp(88px,30vw,122px);margin-top:-16px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,transparent 0 52%,rgba(0,0,0,.18) 53%,transparent 56%),repeating-conic-gradient(from 10deg,rgba(255,255,255,.07) 0 2deg,rgba(0,0,0,.06) 2deg 4deg),radial-gradient(circle at 38% 30%,#fff1c4,#e2b866 30%,#a77a2c 70%,#6d4c18);
  color:#3a2508;font:800 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 0 rgba(255,240,200,.55);
  box-shadow:0 0 0 5px #2a2116,0 0 0 7px #8a6a32,0 0 26px 6px rgba(255,190,90,.35),0 12px 26px rgba(0,0,0,.55),inset 0 -6px 12px rgba(0,0,0,.25),inset 0 3px 6px rgba(255,255,255,.35);transition:transform .07s,box-shadow .15s}
.pick .ring::before{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(255,206,120,.55);box-shadow:0 0 14px rgba(255,190,90,.45),inset 0 0 10px rgba(255,190,90,.25);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pick .ring::before{animation:none}}
.pick.hit .ring{transform:scale(.92);box-shadow:0 0 0 5px #2a2116,0 0 0 7px #8a6a32,0 0 34px 10px rgba(255,190,90,.55),0 6px 14px rgba(0,0,0,.55),inset 0 4px 10px rgba(0,0,0,.35)}
.coach .prog{height:4px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.coach .prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s}
</style>
<body>
  <div class="lockview" id="lockview"><canvas id="cv"></canvas><div class="pins" id="pinsBar"></div></div>
  <div class="status"><span id="pinsTxt">Goupilles <b>0</b> / 5</span><span id="faultTxt">Erreurs <b>0</b></span></div>
  <div class="pads">
    <div class="pad tension" id="tpad" aria-label="Tension : maintiens et glisse">
      <div class="ttl">Tension</div>
      <div class="read" id="tread">Relâchée</div>
      <div class="meter" id="meter"><div class="zone" id="zone"></div><div class="finger" id="finger"></div><div class="needle" id="needle"></div></div>
      <div class="lbl">Maintiens ton pouce et glisse pour garder l'aiguille dans le vert.</div>
    </div>
    <div class="pad pick" id="ppad" aria-label="Crocheter">
      <div class="ring">Crocheter</div>
      <div class="lbl">Tape quand la goupille atteint son cran.</div>
    </div>
  </div>
</body>
<script>
const cv=$('cv'), ctx=cv.getContext('2d');
const N=5;
const BAND=.78;
const TUTO_CFG={time:0,band:.075,zone:.14,drift:.12,speed:.7};
const S={cfg:{band:.06,zone:.11,drift:.2,speed:1}, pins:[], active:0, tension:0, finger:.5, holding:false,
  t:0,p1:0,p2:0,jolt:0,outT:0,faults:0,shake:0,over:true,openT:-1,canPick:false,assist:false,checkTension:false,freeze:false,
  tutoStep:-1,tutoProg:0,tutoSets:0};
const mode=()=>Shell.st.mode;

function resetPins(){
  const tg=[]; for(let i=0;i<N;i++){ let t,k=0; do{ t=.4+Math.random()*.5; k++; }while(i>0 && Math.abs(t-tg[i-1])<.15 && k<50); tg.push(t); }
  S.pins=Array.from({length:N},(_,i)=>({h:.15,phi:Math.random()*6.28,w:2+i*.5,set:false,flash:0,target:tg[i]}));
  S.active=0;
}
const pinH=(p,i)=>.5+.42*Math.sin(p.phi)+.06*Math.sin(2.7*p.phi+i);
function startRound(cfg,o={}){
  S.cfg=cfg; resetPins(); keys.kbd=false; keys.up=keys.down=false; S.finger=.5; tpad.classList.remove('held');
  Object.assign(S,{t:0,p1:Math.random()*6,p2:Math.random()*6,jolt:0,outT:0,faults:0,shake:0,over:false,openT:-1,tension:0,holding:false,
    canPick:o.canPick??true, assist:!!o.assist, checkTension:o.checkTension??true, freeze:!!o.freeze});
  const z=cfg.zone; $('zone').style.top=((.5-z)*100)+'%'; $('zone').style.height=(z*200)+'%';
}
function finish(win){
  S.over=true; S.canPick=false; S.holding=false; Shell.stopTimer();
  const used=S.cfg.time-Shell.st.timeLeft;
  setTimeout(()=>Shell.result(win
    ?{ok:true,faults:S.faults,stats:[['Temps',used.toFixed(1)+' s'],['Erreurs',S.faults]]}
    :{ok:false,faults:S.faults,stats:[['Goupilles',S.active+'/5'],['Erreurs',S.faults]]}), win?1100:400);
}

/* ---------- tutoriel ---------- */
const STEPS=[
  {id:'tension',html:'<b>Pouce gauche sur Tension.</b> Garde l\'aiguille blanche dans le vert pendant 3 secondes. Elle dérive toute seule : corrige en glissant ton pouce.'},
  {id:'pick',html:'<b>Pouce droit.</b> La goupille active monte et descend. Chaque goupille a son propre cran, comme une vraie clé. Tape quand la jonction laiton-acier passe dans le cran lumineux. Tension assistée pour cet exercice.'},
  {id:'both',html:'<b>Les deux pouces ensemble.</b> Garde la tension dans le vert et cale 2 goupilles. Si la tension sort trop longtemps, la dernière goupille retombe.'}
];
function tutoGo(i){
  S.tutoStep=i; S.tutoProg=0; S.tutoSets=0;
  const id=STEPS[i].id;
  if(id==='tension'){ startRound(TUTO_CFG,{canPick:false,checkTension:false,freeze:true}); setPads('t'); }
  if(id==='pick'){ startRound(TUTO_CFG,{assist:true,checkTension:false}); setPads('p'); }
  if(id==='both'){ startRound(TUTO_CFG,{}); setPads('both'); }
  Shell.coach(i+1,3,STEPS[i].html+'<div class="prog"><i id="tprog"></i></div>');
}
function prog(f){ const e=$('tprog'); if(e) e.style.width=Math.min(100,f*100)+'%'; }
function tutoAdvance(){
  Shell.win(); Shell.toast('Bien joué','ok');
  S.canPick=false; S.checkTension=false;
  if(S.tutoStep<STEPS.length-1){ const nx=S.tutoStep+1; S.tutoStep+=.5; setTimeout(()=>{ if(mode()==='tuto') tutoGo(nx); },700); }
  else setTimeout(Shell.endTuto,700);
}
function setPads(w){
  const t=$('tpad'),p=$('ppad');
  t.classList.toggle('dim',w==='p'); p.classList.toggle('dim',w==='t');
  t.classList.toggle('focus',w==='t'||w==='both'); p.classList.toggle('focus',w==='p'||w==='both');
}

/* ---------- actions ---------- */
const inZone=()=>S.assist||Math.abs(S.tension-.5)<=S.cfg.zone;
function tap(){
  const pp=$('ppad'); pp.classList.add('hit'); setTimeout(()=>pp.classList.remove('hit'),90);
  if(!S.canPick||S.over||S.active>=N) return;
  const p=S.pins[S.active];
  if(!inZone()){ miss(S.holding?'Tension hors zone':'Pas de tension'); return; }
  const d=p.h-p.target;
  if(Math.abs(d)<=S.cfg.band){
    p.set=true; p.flash=1; S.active++;
    Shell.blip(1400,.05,'square',.05); Shell.buzz(15); Shell.toast('Goupille calée','ok');
    if(mode()==='tuto'){ S.tutoSets++; const need=STEPS[S.tutoStep].id==='pick'?1:2; prog(S.tutoSets/need); if(S.tutoSets>=need) tutoAdvance(); }
    else if(S.active>=N){ S.openT=0; Shell.win(); finish(true); }
  } else miss(d<0?'Trop bas':'Trop haut');
}
function miss(msg){
  if(mode()!=='tuto'||STEPS[S.tutoStep].id!=='pick') S.faults++;
  if(!S.assist) S.jolt+=(Math.random()<.5?-1:1)*(S.cfg.jolt??.13);
  S.shake=.25; Shell.bad(); Shell.toast(msg,'bad');
}
function dropLast(){
  if(S.active===0) return;
  S.active--; const p=S.pins[S.active]; p.set=false; p.phi=Math.random()*6.28;
  if(mode()==='play') S.faults++;
  S.shake=.35; Shell.blip(90,.25,'sawtooth',.06); Shell.buzz(80); Shell.toast('Goupille retombée','bad');
  if(mode()==='tuto'){ S.tutoSets=Math.max(0,S.tutoSets-1); prog(S.tutoSets/2); }
}

/* ---------- entrées ---------- */
const tpad=$('tpad'); let tId=null;
const fingerFrom=e=>{ const r=$('meter').getBoundingClientRect(); return Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height)); };
tpad.addEventListener('pointerdown',e=>{ e.preventDefault(); tId=e.pointerId; try{tpad.setPointerCapture(e.pointerId)}catch(_){} S.holding=true; S.finger=fingerFrom(e); tpad.classList.add('held'); Shell.blip(300,.04,'triangle',.03); });
tpad.addEventListener('pointermove',e=>{ if(e.pointerId===tId) S.finger=fingerFrom(e); });
const tRelease=e=>{ if(e.pointerId===tId){ tId=null; if(!keys.kbd){ S.holding=false; tpad.classList.remove('held'); } } };
tpad.addEventListener('pointerup',tRelease); tpad.addEventListener('pointercancel',tRelease);
$('ppad').addEventListener('pointerdown',e=>{ e.preventDefault(); tap(); });
const keys={};
/* Ordinateur : la tension se règle à la souris (clic maintenu sur Tension) OU au clavier (flèches / Z-S / W-S :
   elle reste alors engagée toute seule, pas besoin de tenir une touche) ; on crochète avec Espace, K ou Entrée,
   ou d'un clic sur « Crocheter » quand la tension est au clavier. Jamais plus de deux mains occupées. */
const HAUT=['ArrowUp','KeyW','KeyZ'], BAS=['ArrowDown','KeyS'];
addEventListener('keydown',e=>{
  if(!$('overlay').hidden) return;
  if(HAUT.includes(e.code)||BAS.includes(e.code)){
    e.preventDefault();
    if(HAUT.includes(e.code)) keys.up=true; else keys.down=true;
    if(!keys.kbd&&!e.repeat){ keys.kbd=true; keys.hold=0; S.holding=true; tpad.classList.add('held'); }
  }
  if((e.code==='Space'||e.code==='KeyK'||e.code==='Enter')&&!e.repeat){ e.preventDefault(); tap(); }
});
addEventListener('keyup',e=>{
  if(HAUT.includes(e.code)) keys.up=false;
  if(BAS.includes(e.code)) keys.down=false;
  if(!keys.up&&!keys.down) keys.hold=0;
});
// Reprendre la souris sur Tension rend la main à la souris.
tpad.addEventListener('pointerdown',()=>{ keys.kbd=false; });

/* ---------- boucle ---------- */
function update(dt){
  const live=mode()==='play'||mode()==='tuto';
  S.t+=dt;
  if(keys.kbd){
    S.holding=!S.over;
    const dir=(keys.up?1:0)-(keys.down?1:0);
    if(dir){ keys.hold=(keys.hold||0)+dt; S.finger=Math.min(1,Math.max(0,S.finger+dir*dt*(keys.hold<.25?.32:.75))); }
  }
  const d=S.cfg.drift*(.6*Math.sin(S.t*.8+S.p1)+.4*Math.sin(S.t*1.9+S.p2));
  S.jolt*=Math.exp(-1.6*dt);
  if(S.assist) S.tension+=(.5-S.tension)*Math.min(1,dt*10);
  else if(S.holding&&!S.over){ const tg=Math.min(1,Math.max(0,S.finger+d+S.jolt)); S.tension+=(tg-S.tension)*Math.min(1,dt*14); }
  else S.tension+=(0-S.tension)*Math.min(1,dt*5);
  const ok=inZone();
  if(live&&!S.over){
    if(S.checkTension){ if(!ok){ S.outT+=dt; if(S.outT>(S.cfg.grace??.85)){ dropLast(); S.outT=0; } } else S.outT=Math.max(0,S.outT-dt*2); }
    if(mode()==='tuto'&&Number.isInteger(S.tutoStep)&&STEPS[S.tutoStep].id==='tension'){
      if(S.holding&&ok) S.tutoProg+=dt; else S.tutoProg=Math.max(0,S.tutoProg-dt*1.5);
      prog(S.tutoProg/3);
      if(S.tutoProg>=3){ S.tutoProg=-99; tutoAdvance(); }
    }
  }
  S.pins.forEach((p,i)=>{
    p.flash=Math.max(0,p.flash-dt*2);
    if(p.set) p.h+=(p.target-p.h)*Math.min(1,dt*20);
    else if(i===S.active&&!S.freeze&&live&&!S.over){ p.phi+=p.w*S.cfg.speed*dt; p.h=pinH(p,i); }
    else p.h+=(.15+.015*Math.sin(S.t*3+i)-p.h)*Math.min(1,dt*8);
  });
  S.shake=Math.max(0,S.shake-dt);
  if(S.openT>=0) S.openT+=dt;
  $('pinsTxt').innerHTML=`Goupilles <b>${S.active}</b> / ${N}`;
  $('faultTxt').innerHTML=`Erreurs <b>${S.faults}</b>`;
  $('pinsBar').innerHTML=S.pins.map(p=>`<i class="${p.set?'on':''}"></i>`).join('');
  $('needle').style.top=((1-S.tension)*100)+'%';
  $('needle').classList.toggle('out',!ok&&!S.assist&&live);
  $('finger').style.top=((1-S.finger)*100)+'%';
  const rd=$('tread'), st=!live?['Au repos','']:S.assist?['Assistée','ok']:!S.holding?['Relâchée','bad']:ok?['Zone verte','ok']:(S.tension>.5?['Trop forte','bad']:['Trop faible','bad']);
  const rc='read '+st[1]; if(rd.textContent!==st[0]) rd.textContent=st[0]; if(rd.className!==rc) rd.className=rc;
}

/* ---------- dessin ---------- */
let W=0,H=0,dpr=1, bg=null;
function resize(){ const r=cv.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; bg=null; }
new ResizeObserver(resize).observe(cv);
let g=ctx;
function rr(x,y,w,h,r){ g.beginPath(); g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h); }
function lg(x0,y0,x1,y1,stops){ const k=g.createLinearGradient(x0,y0,x1,y1); stops.forEach(([o,c])=>k.addColorStop(o,c)); return k; }
function rg(x,y,r0,r1,stops){ const k=g.createRadialGradient(x,y,r0,x,y,r1); stops.forEach(([o,c])=>k.addColorStop(o,c)); return k; }
const ACC='#ffc35a', OK='#46d98a', BAD='#ff5d5d';
const STEEL=[[0,'#4b525c'],[.18,'#9aa3ae'],[.38,'#f4f7fa'],[.55,'#b8c0c9'],[1,'#3d434b']];
const BRASS=[[0,'#6e4b17'],[.2,'#b8862f'],[.4,'#ffe3a0'],[.58,'#d6a548'],[1,'#5c3e12']];
function geo(){
  const top=40, bot=H-26, Hl=Math.max(90,bot-top), x0=14, w=W-28;
  return {top,Hl,x0,w, ys:top+Hl*.5, K:Hl*.42, Lk:Hl*.16, Ld:Hl*.17, xs:i=>x0+w*(.3+i*.155), cw:Math.min(30,w*.08)};
}
function screw(x,y,r){
  g.fillStyle=rg(x-r*.3,y-r*.3,0,r*1.2,[[0,'#d9dde2'],[.5,'#7b828c'],[1,'#2b2f35']]); g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.strokeStyle='rgba(0,0,0,.6)'; g.lineWidth=1; g.stroke();
  g.strokeStyle='rgba(20,22,26,.85)'; g.lineWidth=Math.max(1.2,r*.28); g.beginPath(); g.moveTo(x-r*.6,y-r*.25); g.lineTo(x+r*.6,y+r*.25); g.stroke();
}
function brushed(x,y,w,h,alpha,vertical){
  g.save(); rr(x,y,w,h,0); g.clip();
  for(let k=0;k<(vertical?w:h);k+=1.5){ const a=Math.random()*alpha; g.fillStyle=Math.random()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a*1.4})`;
    vertical?g.fillRect(x+k,y,1,h):g.fillRect(x,y+k,w,1); }
  g.restore();
}
/* Couche fixe (cadre, plaque, rotor, logements) : dessinée une fois par taille d'écran. */
function buildBg(){
  const c=document.createElement('canvas'); c.width=cv.width; c.height=cv.height; g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const {top,Hl,x0,w,xs,cw}=geo();
  // cadre extérieur (métal sombre biseauté)
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=26; g.shadowOffsetY=12;
  rr(x0,top-14,w,Hl+22,26); g.fillStyle=lg(0,top-14,0,top+Hl+8,[[0,'#40444b'],[.5,'#26292e'],[1,'#17191c']]); g.fill(); g.restore();
  rr(x0+.5,top-13.5,w-1,Hl+21,25.5); g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1; g.stroke();
  rr(x0+7,top-7,w-14,Hl+8,20); g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=2; g.stroke();
  // plaque intérieure brossée
  rr(x0+9,top-5,w-18,Hl+4,18); g.fillStyle=lg(0,top,0,top+Hl,[[0,'#3c4149'],[1,'#22262c']]); g.fill();
  brushed(x0+9,top-5,w-18,Hl+4,.05,false);
  rr(x0+9.5,top-4.5,w-19,Hl+3,17.5); g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1; g.stroke();
  // vis aux coins
  const sr=Math.max(4,Math.min(7,w*.016));
  screw(x0+20,top+6,sr); screw(x0+w-20,top+6,sr); screw(x0+w-20,top+Hl-14,sr);
  // rotor laiton (fenêtre de coupe)
  const plugX=x0+w*.15, ys=top+Hl*.5, pw=w*.83, ph=top+Hl-ys-10;
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=10; g.shadowOffsetY=3;
  rr(plugX,ys,pw,ph,14); g.fillStyle=lg(0,ys,0,ys+ph,[[0,'#8a6a33'],[.18,'#c79a4c'],[.45,'#8e6a2c'],[1,'#3f2d10']]); g.fill(); g.restore();
  brushed(plugX,ys,pw,ph,.06,true);
  rr(plugX+.5,ys+.5,pw-1,ph-1,13.5); g.strokeStyle='rgba(255,226,160,.35)'; g.lineWidth=1; g.stroke();
  // ligne de cisaillement
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=2; g.beginPath(); g.moveTo(plugX+8,ys+1); g.lineTo(plugX+pw-8,ys+1); g.stroke();
  // canal de clé
  rr(plugX+6,top+Hl*.86,pw-12,Hl*.07,6); g.fillStyle=lg(0,top+Hl*.86,0,top+Hl*.93,[[0,'#020203'],[1,'#15171b']]); g.fill();
  g.strokeStyle='rgba(255,226,160,.18)'; g.stroke();
  // logements de goupilles (creusés)
  for(let i=0;i<N;i++){
    const x=xs(i)-cw/2-5, y=top+8, hh=Hl*.83+2, ww=cw+10;
    rr(x-1.5,y-1.5,ww+3,hh+3,12); g.fillStyle=lg(x,0,x+ww,0,[[0,'#6b5530'],[.5,'#2b2418'],[1,'#a2834a']]); g.fill();
    rr(x,y,ww,hh,11); g.fillStyle=lg(x,0,x+ww,0,[[0,'#020203'],[.25,'#0e1013'],[.7,'#15181c'],[1,'#050607']]); g.fill();
    g.save(); rr(x,y,ww,hh,11); g.clip(); g.fillStyle=lg(0,y,0,y+18,[[0,'rgba(0,0,0,.8)'],[1,'rgba(0,0,0,0)']]); g.fillRect(x,y,ww,18); g.restore();
  }
  // médaillon de serrure en laiton
  const mx=x0+w*.09, my=top+Hl*.895, mr=Math.min(w*.075,Hl*.088);
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=12; g.shadowOffsetY=4;
  g.fillStyle=rg(mx-mr*.35,my-mr*.4,0,mr*1.25,[[0,'#ffeab0'],[.35,'#d4a24a'],[.8,'#7d5719'],[1,'#4a320c']]); g.beginPath(); g.arc(mx,my,mr,0,7); g.fill(); g.restore();
  g.strokeStyle='rgba(60,40,10,.8)'; g.lineWidth=1.5; g.beginPath(); g.arc(mx,my,mr*.82,0,7); g.stroke();
  g.fillStyle='#0a0705'; g.beginPath(); g.arc(mx,my-mr*.18,mr*.22,0,7); g.fill();
  g.beginPath(); g.moveTo(mx-mr*.11,my-mr*.1); g.lineTo(mx+mr*.11,my-mr*.1); g.lineTo(mx+mr*.17,my+mr*.42); g.lineTo(mx-mr*.17,my+mr*.42); g.closePath(); g.fill();
  g=ctx; return c;
}
function spring(cx,y0,y1,r){
  const turns=Math.max(5,Math.round((y1-y0)/12)), n=turns*14, tilt=Math.min(4.5,(y1-y0)/turns*.3);
  const P=k=>{ const f=k/n, a=f*turns*Math.PI*2; return [cx+Math.sin(a)*r, y0+(y1-y0)*f+Math.cos(a)*tilt, Math.cos(a)]; };
  g.lineCap='round';
  for(const front of [false,true]){
    for(let k=0;k<n;k++){ const a=P(k), b=P(k+1); if((a[2]+b[2]>0)!==front) continue;
      const s=front?(.55+.45*Math.abs(Math.sin((k/n)*turns*Math.PI*2))):0;
      g.strokeStyle=front?`rgb(${150+s*95|0},${158+s*92|0},${168+s*84|0})`:'#3d434b'; g.lineWidth=front?2.2:1.6;
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  }
}
function driverPin(x,y,cw,h,i){
  rr(x,y,cw,h,cw*.22); g.fillStyle=lg(x,0,x+cw,0,STEEL); g.fill();
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(x+cw*.1,y+1.5,cw*.8,1.2);
  // goupilles de sécurité : profil en bobine / dentelé
  const grooves=i%2? [ .35,.5,.65 ] : [ .5 ];
  grooves.forEach(f=>{ const yy=y+h*f; g.fillStyle='rgba(15,17,20,.75)'; g.fillRect(x,yy-1.6,cw,3.2); g.fillStyle='rgba(255,255,255,.4)'; g.fillRect(x+1,yy+1.6,cw-2,1); });
  if(i%2){ g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x,y+h*.3,cw*.14,h*.4); g.fillRect(x+cw*.86,y+h*.3,cw*.14,h*.4); }
}
function keyPin(x,y,cw,Lk,cx){
  g.beginPath(); g.moveTo(x,y); g.lineTo(x+cw,y); g.lineTo(x+cw,y+Lk*.74); g.quadraticCurveTo(cx+cw*.2,y+Lk,cx,y+Lk); g.quadraticCurveTo(cx-cw*.2,y+Lk,x,y+Lk*.74); g.closePath();
  g.fillStyle=lg(x,0,x+cw,0,BRASS); g.fill();
  g.fillStyle='rgba(255,240,200,.5)'; g.fillRect(x+cw*.1,y+1,cw*.8,1.2);
  g.fillStyle='rgba(60,38,8,.65)'; g.fillRect(x,y+Lk*.3,cw,2.4); g.fillStyle='rgba(255,230,170,.45)'; g.fillRect(x+1,y+Lk*.3+2.4,cw-2,1);
}
function draw(){
  if(!bg && W>0) bg=buildBg();
  g=ctx; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  if(S.shake>0){ const a=S.shake*10; ctx.translate((Math.random()-.5)*a,(Math.random()-.5)*a); }
  if(bg) ctx.drawImage(bg,0,0,W,H);
  const live=mode()==='play'||mode()==='tuto';
  const {top,Hl,x0,w,ys,K,Lk,Ld,xs,cw}=geo();
  const open=S.openT>=0?Math.min(1,S.openT/.6):0;
  const plugX=x0+w*.15, bw=S.cfg.band*K;

  S.pins.forEach((p,i)=>{
    const cx=xs(i), x=cx-cw/2, yTop=ys+(BAND-p.h)*K, isAct=i===S.active&&live&&!S.over;
    const ch={x:x-5,y:top+8,w:cw+10,h:Hl*.83+2};
    spring(cx,top+12,yTop-Ld,cw*.36);
    driverPin(x,yTop-Ld,cw,Ld-2,i);
    keyPin(x,yTop+1,cw,Lk,cx);
    // cran cible : anneau lumineux autour du logement
    const yT=ys+(BAND-p.target)*K, good=p.set||open, col=good?OK:ACC;
    ctx.save();
    if(isAct||good){ ctx.shadowColor=col; ctx.shadowBlur=isAct?18:10; }
    rr(x-9,yT-bw,cw+18,bw*2,bw); ctx.fillStyle=good?'rgba(70,217,138,.2)':(isAct?'rgba(255,195,90,.22)':'rgba(255,195,90,.05)'); ctx.fill();
    ctx.strokeStyle=good?OK:(isAct?ACC:'rgba(255,195,90,.32)'); ctx.lineWidth=isAct?2.4:1.3; ctx.stroke();
    ctx.restore();
    if(p.set&&p.flash>0){ ctx.save(); ctx.globalAlpha=p.flash; ctx.strokeStyle=OK; ctx.lineWidth=3; ctx.shadowColor=OK; ctx.shadowBlur=14; rr(x-6,yTop-Ld-4,cw+12,Ld+Lk*.8+8,10); ctx.stroke(); ctx.restore(); }
    if(isAct){ ctx.save(); ctx.shadowColor=ACC; ctx.shadowBlur=16; ctx.strokeStyle='rgba(255,195,90,.85)'; ctx.lineWidth=2; rr(ch.x,ch.y,ch.w,ch.h,11); ctx.stroke(); ctx.restore(); }
  });

  // clé qui se dessine au fil des goupilles calées
  if(S.active>0){
    const kb=top+Hl*.93, tip=i=>ys+(BAND-S.pins[i].h)*K+Lk;
    ctx.beginPath(); ctx.moveTo(plugX+8,kb); ctx.lineTo(plugX+8,tip(0)+10);
    for(let i=0;i<S.active;i++){ const cx=xs(i); ctx.lineTo(cx-cw*.8,tip(i)+9); ctx.lineTo(cx,tip(i)+2); ctx.lineTo(cx+cw*.8,tip(i)+9); }
    ctx.lineTo(xs(S.active-1)+cw*1.2,kb); ctx.closePath();
    ctx.fillStyle=lg(0,top+Hl*.5,0,kb,[[0,'rgba(255,227,160,.9)'],[1,'rgba(150,108,34,.9)']]); ctx.fill();
    ctx.strokeStyle='rgba(255,240,200,.5)'; ctx.lineWidth=1; ctx.stroke();
  }
  // crochet : tige d'acier poli
  if(live&&S.active<N&&!S.over){
    const p=S.pins[S.active], cx=xs(S.active), tipY=Math.min(ys+(BAND-p.h)*K+Lk+2,top+Hl*.895-2), base=top+Hl*.895;
    const path=()=>{ ctx.beginPath(); ctx.moveTo(-4,base); ctx.lineTo(cx-18,base); ctx.quadraticCurveTo(cx-4,base,cx,tipY); };
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2; ctx.strokeStyle='#30353c'; ctx.lineWidth=6.5; path(); ctx.stroke(); ctx.restore();
    ctx.strokeStyle='#a9b2bd'; ctx.lineWidth=4.5; path(); ctx.stroke();
    ctx.strokeStyle='#f6f9fc'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(-4,base-1.2); ctx.lineTo(cx-18,base-1.2); ctx.stroke();
  }
  // clé de tension : barre d'acier avec LED
  const ok=inZone(), led=!live?'#3b4048':(ok?OK:BAD);
  ctx.save(); ctx.translate(x0+w*.09,top+Hl*.895); ctx.rotate(-S.tension*.35+open*.5);
  const L1=Hl*.24, L2=w*.08; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.7)'; ctx.shadowBlur=8; ctx.shadowOffsetY=3;
  ctx.strokeStyle='#2b3036'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(-w*.025,-L1); ctx.lineTo(0,0); ctx.lineTo(L2,0); ctx.stroke(); ctx.restore();
  ctx.strokeStyle=lg(-6,0,6,0,STEEL); ctx.lineWidth=7.5; ctx.beginPath(); ctx.moveTo(-w*.025,-L1); ctx.lineTo(0,0); ctx.lineTo(L2,0); ctx.stroke();
  for(let k=0;k<4;k++){ const f=.18+k*.22, lx=-w*.025*f, ly=-L1*f;
    ctx.save(); if(live){ ctx.shadowColor=led; ctx.shadowBlur=10; }
    ctx.fillStyle=led; ctx.beginPath(); ctx.arc(lx,ly,2.6,0,7); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(lx-.7,ly-.8,.8,0,7); ctx.fill(); }
  ctx.restore();

  // reflet de la vitre
  ctx.save(); rr(x0+9,top-5,w-18,Hl+4,18); ctx.clip();
  ctx.fillStyle=lg(x0,top,x0+w*.7,top+Hl*.7,[[0,'rgba(255,255,255,.07)'],[.35,'rgba(255,255,255,.02)'],[.36,'rgba(255,255,255,0)'],[1,'rgba(255,255,255,0)']]); ctx.fillRect(x0,top-5,w,Hl+4);
  ctx.restore();

  if(open>0){ ctx.save(); ctx.globalAlpha=open; ctx.fillStyle=OK; ctx.shadowColor=OK; ctx.shadowBlur=14; ctx.font='800 24px "Bricolage Grotesque", system-ui, sans-serif'; ctx.textAlign='right'; ctx.fillText('Ouvert', x0+w-34, top+14); ctx.restore(); }
}

  onTuto(){ tutoGo(0); },
  onFrame(dt){ update(dt); draw(); }
});
