<style>
.field{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.field canvas{display:block;touch-action:none;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.55)}
.status .fu i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:3px;background:var(--surface-2);vertical-align:-1px}
.status .fu i.on{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.bar2{display:flex;gap:8px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.chips{flex:1;min-width:0;display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.chips .lb{font-weight:600;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--stroke);border-radius:999px;padding:3px 8px 3px 5px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px}
.btn.go{flex:0 0 auto;min-width:0;padding:11px 16px;font-size:14px}
.btn.spd{flex:0 0 auto;min-width:0;padding:11px 12px;font-size:14px;font-family:var(--f-mono)}
.btn.spd[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
/* tiroir de choix des moyens */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(18,24,40,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--stroke-2);border-radius:18px;padding:12px;display:grid;gap:8px;box-shadow:0 -14px 40px rgba(0,0,0,.45);animation:up .2s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.sheet .sh-h b{color:var(--ink);font-family:var(--f-disp);font-size:16px}
.sheet .x{background:none;border:0;color:var(--mute);font:600 13px var(--f-body);cursor:pointer;padding:4px}
.opt{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:8px 10px;color:var(--ink);cursor:pointer;font:inherit}
.opt:active{transform:scale(.985)}
.opt canvas{width:44px;height:44px;border-radius:10px;background:#1a2133}
.opt .nm{font-weight:700;font-size:14px}
.opt .ds{font-size:12px;color:var(--mute);line-height:1.35}
.opt .ct{text-align:right;font-size:12px;color:var(--mute);white-space:nowrap}
.opt .ct b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--accent)}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.opt[disabled] .ct b{color:var(--mute)}
.sheet .acts{display:flex;gap:8px}
.sheet .acts .btn{padding:11px 10px;font-size:14px}
.legend{display:grid;gap:8px}
.legend .it{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:13px;line-height:1.4;color:#d5dce8}
.legend .it b{color:var(--ink)}
.legend canvas{width:40px;height:40px;border-radius:10px;background:#1a2133}
</style>
<body>
  <div class="status"><span id="stWave">Préparation</span><span id="stAg">Agents <b>10</b></span><span class="fu" id="stFu">Fuites</span></div>
  <div class="field" id="field"><canvas id="cv"></canvas><div class="sheet" id="sheet" hidden></div></div>
  <div class="bar2"><div class="chips" id="chips"></div><button class="btn spd" id="spd" aria-pressed="false" aria-label="Vitesse double">×2</button><button class="btn primary go" id="launch">Lancer</button></div>
</body>
<script>
/* ───────────── Plan de bouclage : tower defense « réaliste » du service Intervention ─────────────
   Les fuyards partent du lieu des faits (en haut) et tentent de sortir du périmètre par l'une des trois sorties.
   Le joueur place ses moyens (combi en barrage, herse, patrouille à pied, voiture anonymisée, drone) sur des emplacements fixes. */
const MW=9, MH=14;
const PT={S:[4.5,-0.7],N1:[4.5,2.5],N2:[1.5,2.5],N3:[7.5,2.5],N4:[1.5,7],N5:[4.5,7],N6:[7.5,7],N7:[4.5,11.5],N8:[1.5,11.5],N9:[7.5,11.5],
  XB:[4.5,14.7],XW:[-0.7,11.5],XE:[9.7,11.5],rE1:[6,2.5],rE2:[6,7],rW1:[3,7],rW2:[3,11.5]};
const STREETS=[
  {n:'rue de la Halle',pts:['S','N1','N5','N7','XB']},
  {n:'rue des Tanneurs',pts:['N2','N4','N8']},
  {n:'rue du Rempart',pts:['N3','N6','N9']},
  {n:'rue Neuve',pts:['N2','N1','rE1','N3']},
  {n:'rue des Carmes',pts:['N4','rW1','N5','rE2','N6']},
  {n:'boulevard du Ring',pts:['XW','N8','rW2','N7','N9','XE']}];
const ALLEYS=[{n:'passage des Arbalétriers',pts:['rE1','rE2']},{n:'ruelle du Béguinage',pts:['rW1','rW2']}];
const EXITS={XB:'sud',XW:'ouest',XE:'est'};
const ROUTES_V=[['S','N1','N5','N7','XB'],['S','N1','N2','N4','N8','XW'],['S','N1','N3','N6','N9','XE'],['S','N1','N2','N4','N5','N7','XB'],
  ['S','N1','N3','N6','N5','N7','XB'],['S','N1','N5','N4','N8','XW'],['S','N1','N5','N6','N9','XE']];
const ROUTES_P=[['S','N1','rE1','rE2','N6','N9','XE'],['S','N1','N5','rW1','rW2','N8','XW']];
const SLOTS=[
  {id:'r1',k:'road',x:1.5,y:4.75},{id:'r3',k:'road',x:4.5,y:4.75},{id:'r2',k:'road',x:7.5,y:4.75},
  {id:'r5',k:'road',x:1.5,y:9.25},{id:'r4',k:'road',x:4.5,y:9.25},{id:'r6',k:'road',x:7.5,y:9.25},
  {id:'p1',k:'post',x:3.3,y:1.35},{id:'p2',k:'post',x:3.0,y:4.75},{id:'p3',k:'post',x:5.45,y:4.1},
  {id:'p7',k:'post',x:8.47,y:5.6},{id:'p4',k:'post',x:0.53,y:9.25},{id:'p5',k:'post',x:3.8,y:8.5},
  {id:'p6',k:'post',x:6.0,y:9.25},{id:'p9',k:'post',x:2.6,y:12.85},{id:'p8',k:'post',x:6.4,y:12.85}];

/* Moyens. pr = pression (en points de résistance par seconde) selon le type de fuyard. */
const MEANS={
  combi:{nom:'Combi en barrage',slot:'road',cout:3,range:1.0,bhp:100,pr:{pieton:16,scooter:16,voiture:16,volee:16,fourgon:16},
    ds:'Bloque voitures et fourgons. Scooters et piétons le contournent.'},
  herse:{nom:'Herse',slot:'road',cout:1,ds:'Crève les pneus du premier véhicule qui passe. Invisible. Une par vague.'},
  patrouille:{nom:'Patrouille à pied',slot:'post',cout:2,range:1.7,pr:{pieton:34,scooter:9,voiture:8,volee:8,fourgon:6},
    ds:'Interpelle les piétons, et les conducteurs arrêtés.'},
  anon:{nom:'Voiture anonymisée',slot:'post',cout:2,range:1.9,pr:{pieton:12,scooter:36,voiture:34,volee:34,fourgon:20},
    ds:'Prend en chasse les véhicules, scooters compris.'},
  drone:{nom:'Drone',slot:'post',cout:1,range:2.4,
    ds:'Repère les fuyards (+35 % d’efficacité des autres) et voit dans les ruelles.'}};
const UPG={cout:2, txt:{combi:'Barrage renforcé : tient bien plus longtemps, plus d’agents sur place.',patrouille:'Binôme renforcé : +45 % d’efficacité, portée accrue.',
  anon:'Équipage chevronné : +45 % d’efficacité, portée accrue.',drone:'Caméra thermique : portée et repérage accrus.'}};
/* Fuyards : résistance (hp) et vitesse (cases/s). */
const FOES={
  pieton:{nom:'Fuyard à pied',un:'un fuyard à pied',f:0,hp:40,v:.75,veh:false},
  scooter:{nom:'Scooter',un:'un scooter',f:0,hp:48,v:2.3,veh:true},
  voiture:{nom:'Voiture',un:'une voiture',f:1,hp:80,v:1.5,veh:true,car:true,ram:8},
  volee:{nom:'Voiture volée (2 occupants)',un:'une voiture volée',f:1,hp:110,v:1.7,veh:true,car:true,ram:8},
  fourgon:{nom:'Fourgon',un:'un fourgon',f:0,hp:190,v:1.1,veh:true,car:true,ram:28}};
const WAVES=[
  {voiture:2,pieton:3},
  {voiture:3,pieton:3,scooter:2},
  {voiture:3,volee:2,scooter:3,pieton:2},
  {fourgon:1,voiture:4,scooter:3,pieton:4},
  {fourgon:2,volee:2,voiture:4,scooter:4,pieton:3}];
const TUTO_WAVE={voiture:2,pieton:1};

const Q2=new URLSearchParams(location.search);
const R={cfg:null,phase:'idle',wave:0,waves:5,agents:0,placed:{},fuites:0,caught:0,units:[],queue:[],spawnT:0,fx:[],det:[],speed:1,sel:null,tuto:0,t:0,over:true,
  dispo:{combi:2,anon:2,drone:1,herse:2},usure:0,renf:3};
const C={cv:null,ctx:null,s:30,ox:0,oy:0,dpr:1,map:null};
const routes=[];

/* ───── géométrie ───── */
function buildRoute(keys,ped){
  const pts=keys.map(k=>PT[k]), cum=[0], seg=[];
  for(let i=1;i<pts.length;i++){ const [a,b]=[pts[i-1],pts[i]]; cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));
    const al=ALLEYS.find(A=>A.pts.includes(keys[i-1])&&A.pts.includes(keys[i]));
    const st=al||STREETS.find(S=>{const ia=S.pts.indexOf(keys[i-1]),ib=S.pts.indexOf(keys[i]);return ia>=0&&ib>=0;});
    seg.push({ruelle:!!al,nom:st?st.n:''}); }
  const r={keys,pts,cum,seg,len:cum[cum.length-1],exit:keys[keys.length-1],ped,slotD:{}};
  for(const s of SLOTS){ if(s.k!=='road') continue;
    for(let i=1;i<pts.length;i++){ const d=projSeg(s.x,s.y,pts[i-1],pts[i]); if(d.dist<.15){ r.slotD[s.id]=cum[i-1]+d.t*(cum[i]-cum[i-1]); break; } } }
  return r;
}
function projSeg(x,y,a,b){ const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy; let t=((x-a[0])*dx+(y-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); return {t,dist:Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y)}; }
function posAt(r,d){
  d=Math.max(0,Math.min(r.len,d)); let i=1; while(i<r.cum.length-1&&r.cum[i]<d) i++;
  const a=r.pts[i-1],b=r.pts[i],t=(d-r.cum[i-1])/((r.cum[i]-r.cum[i-1])||1);
  return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[1]-a[1],b[0]-a[0]),seg:r.seg[i-1]};
}
ROUTES_V.forEach(k=>routes.push(buildRoute(k,false)));
ROUTES_P.forEach(k=>routes.push(buildRoute(k,true)));

/* ───── partie ───── */
function resetGame(cfg,tuto){
  R.cfg=cfg; R.tuto=tuto?1:0; R.wave=0; R.fuites=0; R.caught=0; R.units=[]; R.queue=[]; R.fx=[]; R.det=[]; R.placed={}; R.sel=null; closeSheet();
  R.waves=tuto?1:cfg.waves; R.renf=cfg.renf;
  const qn=(k,d)=>{ const v=Q2.get(k); return v!==null&&v!==''&&Number.isFinite(Number(v))?Number(v):d; };
  const inc=Q2.get('mode')==='incident';
  R.agents=tuto?12:(inc?qn('agents',cfg.eff):cfg.eff);
  R.dispo={combi:inc?qn('combi',cfg.combi):cfg.combi, anon:inc?qn('anon',cfg.anon):cfg.anon, drone:inc?qn('drone',cfg.drone):cfg.drone, herse:cfg.herses};
  R.usure=inc?Math.max(0,Math.min(1,qn('usure',0)/100)):0;
  R.over=false; prep(true);
}
function prep(first){
  R.phase='prep'; if(!R.tuto) Shell.st.mode='play';
  if(!first){ R.agents+=R.renf; Shell.toast(`Renfort : +${R.renf} agents`,'ok'); }
  for(const id in R.placed){ const m=R.placed[id]; m.broken=false; m.bhp=maxBhp(m); m.armed=true; }
  if(R.tuto) Shell.stopTimer(); else Shell.startTimer(first?R.cfg.prep:R.cfg.prep2,launchWave);
  ui();
}
function maxBhp(m){ return (m.lvl>1?170:100)*(1-.3*R.usure); }
function launchWave(){
  if(R.phase!=='prep'||R.over) return;
  Shell.stopTimer(); R.phase='wave'; R.wave++; closeSheet();
  const comp=R.tuto?TUTO_WAVE:waveComp(R.wave);
  const list=[]; for(const k in comp) for(let i=0;i<comp[k];i++) list.push(k);
  R.units=R.units.filter(u=>!u.done); R.queue=shuffle(list); if(R.tuto) R.queue=['voiture','pieton','voiture'];
  R.waveTotal=R.queue.length; R.spawnT=.4; Shell.blip(520,.12,'triangle',.06); Shell.toast(`Vague ${R.wave}`,'info'); ui();
}
function waveComp(w){ return WAVES[Math.min(WAVES.length-1,w-1)]; }
function spawn(type){
  const F=FOES[type];
  let cand=routes.filter(r=>!r.ped);
  if(type==='pieton') cand = Math.random()<.6 ? routes.filter(r=>r.ped) : cand;
  if(R.tuto) cand=[routes[0]];
  const w=cand.map(r=>{ if(type!=='voiture'&&type!=='volee') return 1; let n=0; for(const id in r.slotD){ const m=R.placed[id]; if(m&&m.type==='combi'&&!m.broken) n++; } return 1/(1+.9*n); });
  let x=Math.random()*w.reduce((a,b)=>a+b,0), r=cand[0]; for(let i=0;i<cand.length;i++){ x-=w[i]; if(x<=0){ r=cand[i]; break; } }
  addUnit(type,r,0);
}
let UID=0;
function addUnit(type,r,dist){ const F=FOES[type]; const hp=F.hp*R.cfg.hp;
  R.units.push({id:UID++,type,r,dist,hp,max:hp,done:null,blocked:null,punct:false,marked:false,dark:false,got:0,col:pick(['#c9ced6','#a33a34','#3f6fc0','#d9dde2','#2f2f35','#6b7a8c','#8a6b3b']),bob:Math.random()*6}); }

const isCar=u=>FOES[u.type].car, isVeh=u=>FOES[u.type].veh;
function meansPos(id){ const s=SLOTS.find(s=>s.id===id); return [s.x,s.y]; }
function rangeOf(m){ const b=MEANS[m.type].range||0; return b+(m.lvl>1?(m.type==='drone'?.6:.3):0); }

function step(dt){
  R.t+=dt;
  if(R.phase!=='wave') return;
  // apparitions
  if(R.queue.length){ R.spawnT-=dt; if(R.spawnT<=0){ spawn(R.queue.shift()); R.spawnT=R.cfg.gap*(.75+Math.random()*.5); } }
  const units=R.units.filter(u=>!u.done);
  // repérage du drone
  for(const u of units){ u.marked=false; }
  for(const id in R.placed){ const m=R.placed[id]; if(m.type!=='drone') continue; const [mx,my]=meansPos(id), rg=rangeOf(m);
    for(const u of units){ const p=posAt(u.r,u.dist); if(Math.hypot(p.x-mx,p.y-my)<=rg) u.marked=m.lvl>1?1.5:1.35; } }
  // déplacements
  for(const u of units){
    const F=FOES[u.type]; const p=posAt(u.r,u.dist); u.dark=p.seg.ruelle;
    if(u.blocked){ const m=R.placed[u.blocked];
      if(!m||m.broken){ u.blocked=null; }
      else { if(frontOf(u)){ m.bhp-=F.ram*dt; if(m.bhp<=0){ m.broken=true; fx(...meansPos(u.blocked),'Barrage enfoncé','bad'); Shell.bad(); Shell.shake(); release(u.blocked); } } continue; }
    }
    let v=F.v*(u.punct?(u.type==='fourgon'?.45:.4):1);
    if(isVeh(u)&&nearTurn(u)) v*=.55; // on ralentit pour tourner
    if(u.type==='scooter'){ for(const id in u.r.slotD){ const m=R.placed[id]; if(m&&m.type==='combi'&&!m.broken&&Math.abs(u.r.slotD[id]-u.dist)<.7) v*=.5; } }
    const adv=v*dt, nd=u.dist+adv;
    let stop=null;
    if(isCar(u)){ for(const id in u.r.slotD){ const m=R.placed[id]; if(!m||m.type!=='combi'||m.broken) continue; const sd=u.r.slotD[id]; if(sd<u.dist-.05) continue;
      const q=R.units.filter(o=>!o.done&&o.blocked===id&&o!==u).length; const at=sd-.62-.58*q; if(nd>=at){ stop={id,at}; break; } } }
    if(stop){ u.dist=Math.max(u.dist,Math.min(nd,stop.at)); u.blocked=stop.id; continue; }
    if(isVeh(u)){ for(const id in u.r.slotD){ const m=R.placed[id]; if(!m||m.type!=='herse'||!m.armed) continue; const sd=u.r.slotD[id];
      if(u.dist<sd&&nd>=sd){ m.armed=false; u.punct=true; u.hp=Math.max(1,u.hp-.2*u.max); const pp=meansPos(id); fx(pp[0],pp[1],'Pneus crevés','ok'); Shell.good(); } } }
    u.dist=nd;
    if(u.dist>=u.r.len){ escape(u); }
  }
  // pression des moyens
  for(const id in R.placed){ const m=R.placed[id], M=MEANS[m.type]; if(!M.pr) continue; if(m.type==='combi'&&m.broken) continue;
    const [mx,my]=meansPos(id), rg=rangeOf(m), boost=m.lvl>1?1.45:1;
    const inR=R.units.filter(u=>!u.done).map(u=>({u,p:posAt(u.r,u.dist)})).filter(o=>Math.hypot(o.p.x-mx,o.p.y-my)<=rg);
    m.tgt=null;
    if(!inR.length) continue;
    const wear = (m.type==='anon'||m.type==='combi') ? 1-.25*R.usure : 1;
    const hit=(u)=>{ let k=M.pr[u.type]*boost*wear; if(u.marked) k*=u.marked; else if(u.dark) k*=.35;
      if(m.type==='patrouille'&&isVeh(u)&&(u.blocked||u.punct)) k*=3; if(m.type==='anon'&&u.blocked) k*=1.3; u.hp-=k*dt; u.got+=k*dt; };
    if(m.type==='combi'){ inR.forEach(o=>hit(o.u)); m.tgt=inR.map(o=>o.u); continue; }
    const score=o=>{ const u=o.u; let s=u.dist/30;
      if(m.type==='patrouille'){ if(!isVeh(u)) s+=3; else if(u.blocked||u.punct) s+=2; }
      else { if(isVeh(u)) s+=3; }
      if(u.dark&&!u.marked) s-=1.5; return s; };
    inR.sort((a,b)=>score(b)-score(a)); const t=inR[0].u; hit(t); m.tgt=[t];
  }
  for(const u of R.units){ if(u.done) continue;
    if(u.type==='volee'&&u.hp<=.45*u.max){ u.done='abandon'; release(u.blocked); const p=posAt(u.r,u.dist); fx(p.x,p.y,'Abandonnée !','info');
      for(let i=0;i<2;i++){ addUnit('pieton',u.r,u.dist+(i?-.15:.1)); } continue; }
    if(u.hp<=0){ u.done='caught'; R.caught++; release(u.blocked); const p=posAt(u.r,u.dist); fx(p.x,p.y,'Interpellé','ok'); Shell.good(); }
  }
  R.fx=R.fx.filter(f=>R.t-f.t<1.4);
  if(!R.queue.length && !R.units.some(u=>!u.done)) endWave();
}
function nearTurn(u){ const r=u.r; for(let i=1;i<r.pts.length-1;i++){ if(Math.abs(r.cum[i]-u.dist)<.45){ const a=r.pts[i-1],b=r.pts[i],c=r.pts[i+1]; if((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0])!==0) return true; } } return false; }
function frontOf(u){ const sd=u.r.slotD[u.blocked]; return !R.units.some(o=>o!==u&&!o.done&&o.blocked===u.blocked&&o.r.slotD[u.blocked]-o.dist < sd-u.dist-.01); }
function release(id){ if(!id) return; R.units.forEach(o=>{ if(o.blocked===id) o.blocked=null; }); }
function fx(x,y,txt,k){ R.fx.push({x,y,txt,k,t:R.t}); }
function escape(u){
  u.done='escaped'; R.fuites++; Shell.bad(); Shell.shake(); Shell.toast(`Fuite par la sortie ${EXITS[u.r.exit]} !`,'bad');
  R.det.push(raison(u)); fx(...edgePos(u.r.exit),'Fuite !','bad');
  if(R.fuites>=3 && !R.tuto) setTimeout(()=>finish(false),700);
  ui();
}
function edgePos(k){ const p=PT[k]; return [Math.max(.4,Math.min(MW-.4,p[0])),Math.max(.4,Math.min(MH-.4,p[1]))]; }
function raison(u){
  const F=FOES[u.type], sortie=`la sortie ${EXITS[u.r.exit]}`, v=`Vague ${R.wave} · `;
  const sur=t=>Object.keys(u.r.slotD).some(id=>R.placed[id]&&R.placed[id].type===t);
  const ruelle=u.r.seg.find(s=>s.ruelle);
  if(u.type==='pieton'&&ruelle&&!Object.values(R.placed).some(m=>m.type==='drone')) return `${v}un fuyard à pied a filé par le ${ruelle.nom} vers ${sortie} : dans le noir des ruelles, sans drone, tes agents le voient mal.`;
  if(u.type==='scooter'&&sur('combi')&&!sur('herse')) return `${v}un scooter a contourné ton combi vers ${sortie} : contre eux, il faut une herse ou une voiture anonymisée.`;
  if(u.type==='fourgon') return `${v}un fourgon est sorti par ${sortie} : il enfonce vite un barrage seul. Crève-lui d’abord les pneus avec une herse, puis concentre plusieurs moyens.`;
  if(u.got<2) return `${v}${F.un} est sorti${F.f?'e':''} par ${sortie} sans qu’aucun moyen ne l’approche : cet itinéraire n’était pas couvert.`;
  if(u.type==='pieton') return `${v}un fuyard à pied est sorti par ${sortie} : une patrouille à pied plus près de son chemin l’aurait arrêté.`;
  return `${v}${F.un} est sorti${F.f?'e':''} par ${sortie} : tes moyens l’ont ralenti${F.f?'e':''} sans l’arrêter. Un barrage ou une herse l’immobilise, et les agents à pied finissent le travail.`;
}
function endWave(){
  if(R.over) return;
  if(R.tuto){ R.over=true; R.phase='idle'; Shell.win(); setTimeout(()=>tutoStep(4),500); return; }
  if(R.wave>=R.waves){ finish(R.fuites<3); return; }
  Shell.win(); prep(false);
}
function finish(ok){
  if(R.over) return; R.over=true; R.phase='idle'; Shell.stopTimer(); closeSheet(); ui();
  if(ok) Shell.win();
  Shell.result({ok, faults:R.fuites, stats:[['Interpellés',R.caught],['Fuites',`${R.fuites} / 3`]], details:R.det.slice(0,4),
    note:R.fuites===0?'Bouclage parfait : double point.':'Sans aucune fuite : +2 sur la jauge.'});
}

function closeSheet(){ R.sel=null; const sh=$('sheet'); if(sh) sh.hidden=true; }
function place(id,t){
  const M=MEANS[t]; if(R.agents<M.cout) return; if(R.dispo[t]!==undefined){ if(R.dispo[t]<=0) return; R.dispo[t]--; }
  R.agents-=M.cout; R.placed[id]={type:t,lvl:1,broken:false,armed:true,bhp:0,born:R.t}; R.placed[id].bhp=maxBhp(R.placed[id]);

function tutoStep(n){
  R.tuto=n; ui();
  if(n===1) Shell.coach(1,3,'Les fuyards partent du <b>lieu des faits</b> (en haut) et foncent vers les <b>sorties</b> du périmètre. Touche l’emplacement de chaussée qui clignote et poses-y un <b>combi en barrage</b>.');
  if(n===2) Shell.coach(2,3,'Une voiture arrêtée au barrage est une proie facile. Pose une <b>patrouille à pied</b> sur le point d’appui qui clignote : elle interpelle les piétons et les conducteurs bloqués.');
  if(n===3) Shell.coach(3,3,'Tout est en place. Touche <b>Lancer</b> : deux voitures et un fuyard à pied vont descendre la rue de la Halle.');
  if(n===4) Shell.endTuto();
}

function resize(){
  const f=$('field'), w=f.clientWidth, h=f.clientHeight; if(!w||!h) return;
  const s=Math.min(w/MW,h/MH); C.s=s; C.dpr=Math.min(2.5,window.devicePixelRatio||1);
  const cw=Math.floor(MW*s), ch=Math.floor(MH*s);
  C.cv.style.width=cw+'px'; C.cv.style.height=ch+'px'; C.cv.width=Math.round(cw*C.dpr); C.cv.height=Math.round(ch*C.dpr);
  C.map=document.createElement('canvas'); C.map.width=C.cv.width; C.map.height=C.cv.height;
  const g=C.map.getContext('2d'); g.setTransform(s*C.dpr,0,0,s*C.dpr,0,0); drawMap(g);
}
function rng(seed){ let x=seed||1; return ()=>{ x=(x*16807)%2147483647; return (x-1)/2147483646; }; }
const RW=.92, SW=.26; // largeur chaussée, trottoir
function drawMap(g){
  const rnd=rng(5324);
  g.fillStyle='#10151f'; g.fillRect(0,0,MW,MH);
  // trottoirs puis chaussées
  const line=(keys,w,col)=>{ g.strokeStyle=col; g.lineWidth=w; g.lineCap='butt'; g.lineJoin='miter'; g.beginPath(); keys.forEach((k,i)=>{ const p=PT[k]; i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); }); g.stroke(); };
  STREETS.forEach(S=>line(S.pts,RW+SW*2,'#3a404c'));
  STREETS.forEach(S=>line(S.pts,RW,'#262b35'));
  // grain de l'asphalte
  for(let i=0;i<900;i++){ g.fillStyle=`rgba(255,255,255,${rnd()*.03})`; g.fillRect(rnd()*MW,rnd()*MH,.03,.03); }
  // marquage central
  g.setLineDash([.28,.26]); STREETS.forEach(S=>line(S.pts,.035,'rgba(240,240,230,.35)')); g.setLineDash([]);
  // ruelles pavées
  ALLEYS.forEach(A=>{ line(A.pts,.42,'#2b2722'); g.setLineDash([.06,.06]); line(A.pts,.36,'#3a342c'); g.setLineDash([]); });
  // pâtés de maisons
  const xs=[0,1.5,4.5,7.5,MW], ys=[0,2.5,7,11.5,MH], ins=RW/2+SW+.06;
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    let x0=xs[i]+(i?ins:0), x1=xs[i+1]-(i<3?ins:0), y0=ys[j]+(j?ins:0), y1=ys[j+1]-(j<3?ins:0);
    if(i===2&&j===0){ park(g,x0,y0,x1,y1+.02,rnd); continue; }
    if(i===1&&j===0){ // le haut de la rue de la Halle traverse ce pâté : on le coupe
    }
    const cuts=[];
    if(i===2&&j===1) cuts.push(6); if(i===1&&j===2) cuts.push(3);
    if(j===0&&i===1){ x1=Math.min(x1,4.5-ins); }
    if(j===0&&i===2){ x0=Math.max(x0,4.5+ins); }
    let segs=[[x0,x1]]; cuts.forEach(c=>{ segs=segs.flatMap(([a,b])=>c>a&&c<b?[[a,c-.24],[c+.24,b]]:[[a,b]]); });
    segs.forEach(([a,b])=>buildings(g,a,y0,b,y1,rnd));
  }
  // passages piétons
  ['N1','N2','N3','N4','N5','N6','N7','N8','N9'].forEach(k=>{ const [x,y]=PT[k]; g.fillStyle='rgba(235,235,225,.5)';
    for(let d=-.36;d<=.36;d+=.12){ g.fillRect(x+d-.03,y-RW/2-.2,.06,.16); g.fillRect(x+d-.03,y+RW/2+.04,.06,.16); g.fillRect(x-RW/2-.2,y+d-.03,.16,.06); g.fillRect(x+RW/2+.04,y+d-.03,.16,.06); } });
  // lampadaires
  g.globalCompositeOperation='lighter';
  STREETS.forEach(S=>{ for(let i=1;i<S.pts.length;i++){ const a=PT[S.pts[i-1]],b=PT[S.pts[i]], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    for(let d=.8;d<L;d+=1.6){ const t=d/L, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t, nx=-(b[1]-a[1])/L, ny=(b[0]-a[0])/L, sd=((d/1.6|0)%2?1:-1)*(RW/2+.12);
      const lx=x+nx*sd, ly=y+ny*sd, gr=g.createRadialGradient(lx,ly,0,lx,ly,1.0); gr.addColorStop(0,'rgba(255,196,120,.11)'); gr.addColorStop(1,'rgba(255,196,120,0)');
      g.fillStyle=gr; g.fillRect(lx-1,ly-1,2,2); } } });
  g.globalCompositeOperation='source-over';
  STREETS.forEach(S=>{ for(let i=1;i<S.pts.length;i++){ const a=PT[S.pts[i-1]],b=PT[S.pts[i]], L=Math.hypot(b[0]-a[0],b[1]-a[1]);
    for(let d=.8;d<L;d+=1.6){ const t=d/L, x=a[0]+(b[0]-a[0])*t, y=a[1]+(b[1]-a[1])*t, nx=-(b[1]-a[1])/L, ny=(b[0]-a[0])/L, sd=((d/1.6|0)%2?1:-1)*(RW/2+.12);
      g.fillStyle='#ffe2b0'; g.beginPath(); g.arc(x+nx*sd,y+ny*sd,.035,0,7); g.fill(); } } });
  // noms de rues
  g.font='600 .2px "Instrument Sans",system-ui,sans-serif'; g.fillStyle='rgba(220,228,240,.42)'; g.textBaseline='middle';
  const lab=(t,x,y,rot)=>{ g.save(); g.translate(x,y); g.rotate(rot); g.textAlign='center'; g.fillText(t.toUpperCase(),0,0); g.restore(); };
  g.font='600 .14px "Instrument Sans",system-ui,sans-serif';
  lab('rue de la Halle',4.5,3.83,-Math.PI/2); lab('rue des Tanneurs',1.5,3.83,-Math.PI/2); lab('rue du Rempart',7.5,3.83,-Math.PI/2);
  lab('rue Neuve',3.0,2.5,0); lab('boulevard du Ring',6.0,11.5,0);
  g.font='600 .15px "Instrument Sans",system-ui,sans-serif'; g.fillStyle='rgba(220,200,170,.4)';
  lab('passage des Arbalétriers',6,4.75,-Math.PI/2); lab('ruelle du Béguinage',3,9.6,-Math.PI/2);
  // vignette
  const v=g.createRadialGradient(MW/2,MH/2,MH*.25,MW/2,MH/2,MH*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.45)'); g.fillStyle=v; g.fillRect(0,0,MW,MH);
}
function buildings(g,x0,y0,x1,y1,rnd){
  if(x1-x0<.2||y1-y0<.2) return;
  g.fillStyle='#161b26'; g.fillRect(x0-.04,y0-.04,x1-x0+.08,y1-y0+.08);
  const cols=Math.max(1,Math.round((x1-x0)/1.0)), rows=Math.max(1,Math.round((y1-y0)/1.1));
  const cw=(x1-x0)/cols, ch=(y1-y0)/rows;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    // une cour intérieure de temps en temps
    if(cols>1&&rows>1&&i>0&&i<cols-1&&j>0&&j<rows-1&&rnd()<.6) continue;
    const bx=x0+i*cw+.03, by=y0+j*ch+.03, bw=cw-.06, bh=ch-.06, hgt=.06+rnd()*.14;
    g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(bx+hgt,by+hgt,bw,bh);
    const base=24+rnd()*16, hue=210+rnd()*30;
    const gr=g.createLinearGradient(bx,by,bx+bw,by+bh); gr.addColorStop(0,`hsl(${hue} 14% ${base+8}%)`); gr.addColorStop(1,`hsl(${hue} 16% ${base-4}%)`);
    g.fillStyle=gr; g.fillRect(bx,by,bw,bh);
    g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=.02; g.strokeRect(bx+.01,by+.01,bw-.02,bh-.02);
    if(rnd()<.5){ g.strokeStyle='rgba(0,0,0,.22)'; g.beginPath(); if(bw>bh){ g.moveTo(bx+.04,by+bh/2); g.lineTo(bx+bw-.04,by+bh/2); } else { g.moveTo(bx+bw/2,by+.04); g.lineTo(bx+bw/2,by+bh-.04); } g.stroke(); }
    const n=Math.floor(rnd()*3); for(let k=0;k<n;k++){ const w=.1+rnd()*.12, h=.08+rnd()*.1, ax=bx+.06+rnd()*(bw-w-.12), ay=by+.06+rnd()*(bh-h-.12);
      g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(ax+.03,ay+.03,w,h); g.fillStyle=`hsl(${hue} 10% ${base+14}%)`; g.fillRect(ax,ay,w,h); }
    if(rnd()<.25){ g.fillStyle='rgba(120,170,255,.12)'; g.fillRect(bx+bw*.2,by+bh*.2,bw*.25,bh*.15); }
  }
}
function park(g,x0,y0,x1,y1,rnd){
  g.fillStyle='#14231b'; g.fillRect(x0,y0,x1-x0,y1-y0);
  g.strokeStyle='#2c3328'; g.lineWidth=.12; g.beginPath(); g.moveTo(x0,y1-.5); g.quadraticCurveTo((x0+x1)/2,y0+.3,x1,y0+.8); g.stroke();
  for(let i=0;i<34;i++){ const x=x0+.2+rnd()*(x1-x0-.4), y=y0+.15+rnd()*(y1-y0-.3), r=.14+rnd()*.14;
    g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.arc(x+.06,y+.06,r,0,7); g.fill();
    const gr=g.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r); gr.addColorStop(0,'#3d6b45'); gr.addColorStop(1,'#1d3a24'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  g.font='600 .17px "Instrument Sans",system-ui,sans-serif'; g.fillStyle='rgba(190,230,200,.4)'; g.textAlign='center'; g.fillText('PARC DU BEFFROI',(x0+x1)/2,y1-.18);
}

  g.fillStyle='#1f3256'; g.beginPath(); g.ellipse(0,0,.1,.065,0,0,7); g.fill(); g.fillStyle='#d7ee3a'; g.fillRect(-.03,-.065,.06,.13);
  g.fillStyle='#16233c'; g.beginPath(); g.arc(.01,0,.045,0,7); g.fill(); g.restore(); }
function drawPatrouille(g,lvl,t,aim){ const a=aim??0; g.save(); g.scale(1.45,1.45); drawAgent(g,-.1,-.06,a); drawAgent(g,.1,.08,a); if(lvl>1) drawAgent(g,-.08,.14,a); g.restore(); }
function drawCar(g,col,len,wid){ g.fillStyle='rgba(0,0,0,.45)'; rr(g,-len/2+.04,-wid/2+.04,len,wid,.08); g.fill();
  g.fillStyle=col; rr(g,-len/2,-wid/2,len,wid,.08); g.fill(); g.fillStyle='#17202c'; rr(g,len*.12,-wid/2+.04,len*.18,wid-.08,.03); g.fill(); rr(g,-len*.36,-wid/2+.05,len*.12,wid-.1,.03); g.fill();
  g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(-len*.22,-wid/2+.05,len*.32,wid-.1); }
function drawAnon(g,lvl,t,active){ drawCar(g,'#2a2e35',.56,.28);
  if(active){ const on=Math.floor(t*8)%2; g.fillStyle=on?'#4c9bff':'#9cc6ff'; g.fillRect(.22,-.08,.04,.05); g.fillStyle=on?'#9cc6ff':'#4c9bff'; g.fillRect(.22,.03,.04,.05);
    g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(.24,0,0,.24,0,.6); gr.addColorStop(0,'rgba(70,140,255,.35)'); gr.addColorStop(1,'rgba(70,140,255,0)'); g.fillStyle=gr; g.fillRect(-.4,-.6,1.2,1.2); g.globalCompositeOperation='source-over'; } }
function drawDrone(g,lvl,t){ g.fillStyle='rgba(0,0,0,.35)'; g.beginPath(); g.arc(.12,.16,.16,0,7); g.fill();
  const bob=Math.sin(t*3)*.02; g.translate(0,bob);
  g.strokeStyle='#5b6472'; g.lineWidth=.05; g.beginPath(); g.moveTo(-.17,-.17); g.lineTo(.17,.17); g.moveTo(.17,-.17); g.lineTo(-.17,.17); g.stroke();
  [[-.17,-.17],[.17,-.17],[-.17,.17],[.17,.17]].forEach(([x,y],i)=>{ g.fillStyle='rgba(200,215,235,.22)'; g.beginPath(); g.arc(x,y,.1,0,7); g.fill();
    g.strokeStyle='rgba(230,240,255,.7)'; g.lineWidth=.015; const r=t*30+i; g.beginPath(); g.moveTo(x+Math.cos(r)*.1,y+Math.sin(r)*.1); g.lineTo(x-Math.cos(r)*.1,y-Math.sin(r)*.1); g.stroke(); });
  g.fillStyle='#e9edf2'; rr(g,-.08,-.06,.16,.12,.03); g.fill(); g.fillStyle=Math.floor(t*3)%2?'#ff4a4a':'#5a1a1a'; g.beginPath(); g.arc(0,0,.025,0,7); g.fill(); }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawMeans(g,type,lvl,t,m){
  if(type==='combi') drawCombi(g,lvl,t,m&&m.broken);
  else if(type==='herse') drawHerse(g,!m||m.armed);
  else if(type==='patrouille') drawPatrouille(g,lvl,t,m&&m.aim);
  else if(type==='anon'){ g.save(); g.rotate(-.6); drawAnon(g,lvl,t,m&&m.tgt&&m.tgt.length); g.restore(); }
  else if(type==='drone') drawDrone(g,lvl,t);
}
function drawIcon(c,type){ const d=2; c.width=88; c.height=88; const g=c.getContext('2d'); g.setTransform(44,0,0,44,44,44);
  if(type==='combi'||type==='herse'){ g.fillStyle='#262b35'; g.fillRect(-.48,-1,.96,2); g.save(); g.scale(.85,.85); drawMeans(g,type,1,0,null); g.restore(); }
  else { g.save(); g.scale(1.6,1.6); drawMeans(g,type,1,.3,null); g.restore(); } }
function drawFoe(g,u,t){
  const p=posAt(u.r,u.dist), F=FOES[u.type];
  let off = isVeh(u) ? .2 : (p.seg.ruelle?0:.44);
  if(u.type==='scooter'){ for(const id in u.r.slotD){ const m=R.placed[id]; if(m&&m.type==='combi'&&!m.broken&&Math.abs(u.r.slotD[id]-u.dist)<.75) off=.4; } }
  const x=p.x-Math.sin(p.ang)*off, y=p.y+Math.cos(p.ang)*off;
  u.px=x; u.py=y;
  g.save(); g.translate(x,y);
  if(u.dark&&!u.marked) g.globalAlpha=.32;
  g.save(); g.rotate(p.ang);
  if(isVeh(u)){ // phares
    g.globalCompositeOperation='lighter'; const L=u.type==='scooter'?.2:.3, gr=g.createRadialGradient(L,0,0,L+.4,0,.7); gr.addColorStop(0,'rgba(255,240,200,.28)'); gr.addColorStop(1,'rgba(255,240,200,0)');
    g.fillStyle=gr; g.beginPath(); g.moveTo(L,0); g.lineTo(L+1.0,-.4); g.lineTo(L+1.0,.4); g.closePath(); g.fill(); g.globalCompositeOperation='source-over'; }
  if(u.type==='voiture') drawCar(g,u.col,.54,.27);
  else if(u.type==='volee'){ drawCar(g,'#2f2f35',.58,.29); g.strokeStyle='#ff5d5d'; g.lineWidth=.025; rr(g,-.29,-.145,.58,.29,.08); g.stroke(); }
  else if(u.type==='fourgon'){ g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(-.36,-.14,.76,.32); g.fillStyle='#eceef1'; rr(g,-.38,-.16,.76,.32,.04); g.fill(); g.fillStyle='#17202c'; rr(g,.22,-.13,.1,.26,.02); g.fill(); g.fillStyle='rgba(0,0,0,.08)'; g.fillRect(-.3,-.1,.45,.2); }
  else if(u.type==='scooter'){ g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(-.14,-.04,.32,.1); g.fillStyle='#d9dde2'; rr(g,-.16,-.05,.32,.1,.05); g.fill(); g.fillStyle='#2b2f36'; g.beginPath(); g.arc(-.02,0,.065,0,7); g.fill(); }
  else { const sw=Math.sin(t*9+u.bob)*.03; g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(.03,.03,.1,.07,0,0,7); g.fill();
    g.fillStyle='#3a3f4a'; g.beginPath(); g.ellipse(sw,0,.09,.07,0,0,7); g.fill(); g.fillStyle='#2a2d33'; g.beginPath(); g.arc(.01,0,.045,0,7); g.fill(); }
  if(isVeh(u)){ g.fillStyle=u.punct?'#ffb21f':'#ff3b3b'; const L=u.type==='fourgon'?.38:u.type==='scooter'?.16:.27; g.fillRect(-L-.01,-.09,.03,.05); g.fillRect(-L-.01,.04,.03,.05); }
  g.restore();
  if(u.marked){ g.strokeStyle='rgba(255,93,93,.85)'; g.lineWidth=.025; const r=.26+Math.sin(t*6)*.02; g.beginPath(); g.arc(0,0,r,0,7); g.stroke();
    g.beginPath(); g.moveTo(-r-.07,0); g.lineTo(-r+.05,0); g.moveTo(r-.05,0); g.lineTo(r+.07,0); g.moveTo(0,-r-.07); g.lineTo(0,-r+.05); g.moveTo(0,r-.05); g.lineTo(0,r+.07); g.stroke(); }
  if(u.hp<u.max){ const w=.4,f=Math.max(0,u.hp/u.max); g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(-w/2,-.34,w,.06); g.fillStyle=f>.5?'#ffb23f':'#ff5d5d'; g.fillRect(-w/2,-.34,w*f,.06); }
  if(u.blocked){ g.fillStyle='#ffb23f'; g.font='800 .2px "Instrument Sans",sans-serif'; g.textAlign='center'; g.fillText('!',0,-.42); }
  g.restore();
}
function render(){
  const g=C.ctx; if(!C.map) return; const s=C.s*C.dpr, t=R.t;
  g.setTransform(1,0,0,1,0,0); g.drawImage(C.map,0,0); g.setTransform(s,0,0,s,0,0);
  // lieu des faits
  { const x=4.5,y=.55, on=Math.floor(t*4)%2; g.save(); g.translate(x+.62,y+.1); g.rotate(.5); drawCar(g,'#8fa3b8',.54,.27); g.restore();
    g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(x,y,0,x,y,1.1); gr.addColorStop(0,on?'rgba(255,70,70,.32)':'rgba(70,120,255,.32)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-1.2,y-1.2,2.4,2.4); g.globalCompositeOperation='source-over';
    pill(g,x-1.05,y-.05,'LIEU DES FAITS','#ff5d5d'); }
  // sorties
  for(const k in EXITS){ const [ex,ey]=edgePos(k), a=.35+.25*Math.sin(t*4);
    const vert=k==='XB'; g.fillStyle=`rgba(255,70,70,${a*.6})`; if(vert) g.fillRect(ex-RW/2,MH-.18,RW,.18); else g.fillRect(k==='XW'?0:MW-.18,ey-RW/2,.18,RW);
    pill(g,vert?ex+1.25:(k==='XW'?.95:MW-.95),vert?MH-.32:ey-.75,'SORTIE '+EXITS[k].toUpperCase(),'#ff5d5d'); }
  // emplacements
  const prep=R.phase==='prep'||R.phase==='idle';
  for(const sl of SLOTS){ if(R.placed[sl.id]) continue;
    const hl=(R.tuto===1&&sl.id==='r3')||(R.tuto===2&&sl.id==='p2'), sel=R.sel===sl.id, pulse=.5+.5*Math.sin(t*5);
    g.save(); g.translate(sl.x,sl.y);
    g.strokeStyle=hl?`rgba(255,122,89,${.5+.5*pulse})`:sel?'#ff7a59':`rgba(255,255,255,${prep?.42:.18})`; g.lineWidth=hl||sel?.05:.03; g.setLineDash([.08,.06]);
    if(sl.k==='road'){ g.fillStyle=hl||sel?'rgba(255,122,89,.22)':'rgba(255,255,255,.05)'; rr(g,-.44,-.28,.88,.56,.06); g.fill(); g.stroke(); }
    else { g.fillStyle=hl||sel?'rgba(255,122,89,.22)':'rgba(18,24,38,.75)'; g.beginPath(); g.arc(0,0,.34,0,7); g.fill(); g.stroke(); }
    g.setLineDash([]); g.strokeStyle=hl||sel?'#ff7a59':`rgba(255,255,255,${prep?.6:.25})`; g.lineWidth=.04; g.beginPath(); g.moveTo(-.1,0); g.lineTo(.1,0); g.moveTo(0,-.1); g.lineTo(0,.1); g.stroke();
    if(hl){ g.strokeStyle=`rgba(255,122,89,${1-pulse})`; g.lineWidth=.04; g.beginPath(); g.arc(0,0,.45+pulse*.25,0,7); g.stroke(); }
    g.restore(); }
  // portée de l'élément sélectionné
  if(R.sel&&R.placed[R.sel]){ const m=R.placed[R.sel], rg=rangeOf(m); if(rg){ const [x,y]=meansPos(R.sel); g.fillStyle='rgba(255,122,89,.08)'; g.strokeStyle='rgba(255,122,89,.6)'; g.lineWidth=.03; g.beginPath(); g.arc(x,y,rg,0,7); g.fill(); g.stroke(); } }
  // drones : zone survolée
  for(const id in R.placed){ const m=R.placed[id]; if(m.type!=='drone') continue; const [x,y]=meansPos(id); g.strokeStyle='rgba(255,255,255,.12)'; g.setLineDash([.1,.1]); g.lineWidth=.02; g.beginPath(); g.arc(x,y,rangeOf(m),0,7); g.stroke(); g.setLineDash([]); }
  // moyens au sol (hors drones)
  for(const id in R.placed){ const m=R.placed[id]; if(m.type==='drone') continue; const [x,y]=meansPos(id); g.save(); g.translate(x,y);
    if(m.type==='patrouille'&&m.tgt&&m.tgt[0]&&m.tgt[0].px!==undefined) m.aim=Math.atan2(m.tgt[0].py-y,m.tgt[0].px-x);
    const sc=Math.min(1,(R.t-(m.born||0))*5+.4); g.scale(sc,sc); drawMeans(g,m.type,m.lvl,t,m); g.restore();
    if(m.type==='combi'&&!m.broken&&m.bhp<maxBhp(m)){ const w=.7,f=m.bhp/maxBhp(m); g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(x-w/2,y+.42,w,.07); g.fillStyle=f>.4?'#46d98a':'#ff5d5d'; g.fillRect(x-w/2,y+.42,w*f,.07); }
    if(m.lvl>1) chevron(g,x+.3,y-.3); }
  // fuyards
  for(const u of R.units) if(!u.done) drawFoe(g,u,t);
  // liaisons moyens → cibles
  for(const id in R.placed){ const m=R.placed[id]; if(!m.tgt||m.type==='herse'||R.phase!=='wave') continue; const [x,y]=meansPos(id);
    for(const u of m.tgt){ if(u.done||u.px===undefined) continue; g.strokeStyle=m.type==='combi'?'rgba(120,170,255,.45)':'rgba(255,122,89,.7)'; g.lineWidth=.03; g.setLineDash([.08,.07]); g.lineDashOffset=-t*.6;
      g.beginPath(); g.moveTo(x,y); g.lineTo(u.px,u.py); g.stroke(); g.setLineDash([]); } }
  // drones (au-dessus de tout)
  for(const id in R.placed){ const m=R.placed[id]; if(m.type!=='drone') continue; const [x,y]=meansPos(id); g.save(); g.translate(x,y); drawDrone(g,m.lvl,t); g.restore(); if(m.lvl>1) chevron(g,x+.3,y-.3); }
  // textes flottants
  for(const f of R.fx){ const k=(R.t-f.t)/1.4; g.globalAlpha=1-k; g.font='800 .24px "Instrument Sans",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=.07; g.strokeStyle='rgba(8,10,18,.85)'; g.strokeText(f.txt,f.x,f.y-.35-k*.5); g.fillStyle=f.k==='ok'?'#46d98a':f.k==='bad'?'#ff5d5d':'#ffb23f'; g.fillText(f.txt,f.x,f.y-.35-k*.5); g.globalAlpha=1; }
}
function pill(g,x,y,txt,col){ g.font='800 .17px "Instrument Sans",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; const w=g.measureText(txt).width+.22;
  g.fillStyle='rgba(10,12,20,.82)'; rr(g,x-w/2,y-.13,w,.26,.13); g.fill(); g.strokeStyle=col; g.lineWidth=.02; g.stroke(); g.fillStyle=col; g.fillText(txt,x,y+.005); }
function chevron(g,x,y){ g.fillStyle='#ffb23f'; g.beginPath(); g.arc(x,y,.11,0,7); g.fill(); g.strokeStyle='#241400'; g.lineWidth=.035; g.beginPath(); g.moveTo(x-.05,y+.03); g.lineTo(x,y-.03); g.lineTo(x+.05,y+.03); g.stroke(); }

/* ───── entrées ───── */
function onTap(e){
  const r=C.cv.getBoundingClientRect(), x=(e.clientX-r.left)/C.s, y=(e.clientY-r.top)/C.s;
  if(R.over&&!R.tuto) return; if(R.phase==='idle') return;
  let best=null,bd=.62; for(const s of SLOTS){ const d=Math.hypot(s.x-x,s.y-y); if(d<bd){ bd=d; best=s; } }
  if(R.tuto===1&&best&&best.id!=='r3') best=null; if(R.tuto===2&&best&&best.id!=='p2') best=null; if(R.tuto===3&&best&&!R.placed[best.id]) best=null;
  if(!best){ closeSheet(); return; }
  if(R.sel===best.id){ closeSheet(); return; }
  openSheet(best);
}

  diffs:{
    difficile:{agents:9,label:'Difficile',eff:9,renf:3,combi:2,anon:1,drone:1,herses:1,hp:1.05,gap:1.35,prep:45,prep2:15,waves:5},

  bornes:{eff:[7,14],renf:[2,4],gap:[.75,3],hp:[.5,Infinity],prep:[25,60],prep2:[10,25],combi:[1,3],anon:[1,3],herses:[1,3],drone:[1,1]},

  rules:['Touche un emplacement pour y poser un moyen : <b>rectangle sur la chaussée</b> = combi en barrage ou herse ; <b>rond</b> = patrouille, voiture anonymisée ou drone. Chaque moyen coûte des agents.',
    'Les fuyards partent du <b>lieu des faits</b> (en haut) vers les trois <b>sorties</b>. À la <b>3<sup>e</sup> fuite</b>, le bouclage a échoué.',
    'Le <b>combi</b> arrête voitures et fourgons, mais scooters et piétons le contournent, et un <b>fourgon</b> l’enfonce vite. Les voitures évitent les barrages qu’elles voient : la <b>herse</b>, elle, est invisible.',

    'Une <b>voiture volée</b> à bout est abandonnée : ses deux occupants continuent à pied.',
    'Entre deux vagues : des agents de renfort arrivent, tu peux <b>renforcer</b> ou <b>retirer</b> un moyen (touche-le). Aucune fuite : <b>+2</b> sur la jauge.'],
  winTitle:'Périmètre tenu', loseTitle:'Le bouclage a cédé', skin:'Barrage de nuit',
  malus:'les auteurs restent dans la nature : moral des équipes Intervention en baisse et un combi immobilisé jusqu’à demain.',
  // Challenge : de 3 vagues (niveau 1) à 5 vagues (niveau 6+), puis les fuyards résistent davantage et arrivent plus serrés.
  niveau(n,cfg){ cfg.waves=n<=2?3:n<=5?4:5; return cfg; },
  onInit(){
    C.cv=$('cv'); C.ctx=C.cv.getContext('2d');

  onFrame(dt){

window.__bouclage={R,SLOTS,place,launchWave,step,routes,resetGame,MEANS,UPG,FOES,WAVES};
