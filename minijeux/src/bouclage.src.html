<style>
.field{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.field canvas{display:block;touch-action:none;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.55)}
.hudrow{display:flex;gap:8px;align-items:center}
.hudrow .pillh{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.hudrow .pillh b{font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.hudrow .pillh svg{width:18px;height:18px}
.hudrow .lives svg{color:#ff4d6a} .hudrow .ag svg{color:#62b0ff}
.hudrow .pillh.hit{animation:hit .4s} @keyframes hit{30%{background:var(--bad-soft);border-color:var(--bad)}}
.hudrow .wv{margin-left:auto}
.tip{min-height:38px;display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.35;color:#d5dce8;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:6px 11px}
.tip b{color:var(--ink)} .tip .c{color:#ffd166;font-weight:700}
.bar2{display:flex;gap:8px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn.pw{flex:0 0 auto;min-width:0;padding:10px 12px;font-size:14px;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden}
.btn.pw svg{width:20px;height:20px}
.btn.pw .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s linear}
.btn.pw[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.spd{flex:0 0 auto;min-width:0;padding:10px 12px;font-size:14px;font-family:var(--f-mono)}
.btn.spd[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.btn.go{flex:1;min-width:0;padding:11px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.go small{font-weight:600;opacity:.8}
.btn.go:disabled{background:var(--surface);color:var(--mute);box-shadow:none;border-color:var(--stroke)}
.newfoe{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);z-index:3;background:rgba(18,24,40,.96);border:1px solid var(--stroke-2);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.newfoe .hd{display:flex;gap:12px;align-items:center}
.newfoe canvas{width:64px;height:64px;border-radius:14px;background:#2a2f3b;flex:0 0 auto}
.newfoe .ey{font-size:12px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.newfoe h3{margin:2px 0 0;font-family:var(--f-disp);font-size:22px}
.newfoe p{margin:0;font-size:14px;line-height:1.45;color:#d5dce8}
.newfoe p b{color:var(--ink)}
</style>
<body>
  <div class="hudrow">
    <span class="pillh lives" id="hLives" title="Fuites encore tolérées"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.4 3.6 5 7 5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg><b id="stLives">10</b></span>
    <span class="pillh ag" id="hAg" title="Agents disponibles"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 20.5c.4-4.4 3.6-7 7.5-7s7.1 2.6 7.5 7z"/></svg><b id="stAg">16</b><span>agents</span></span>
    <span class="pillh wv">Vague <b id="stWave">0/6</b></span>
  </div>
  <div class="field" id="field"><canvas id="cv"></canvas><div class="newfoe" id="newfoe" hidden></div></div>
  <div class="tip" id="tip"></div>
  <div class="bar2">
    <button class="btn pw" id="herse" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="10" width="19" height="5" rx="1.2"/><path d="M5 10l1.5-3 1.5 3M10 10l1.5-3 1.5 3M15 10l1.5-3 1.5 3"/></svg><span id="herseTxt">Herse</span><i class="cd" id="herseCd"></i></button>
    <button class="btn spd" id="spd" aria-pressed="false" aria-label="Vitesse double">×2</button>
    <button class="btn primary go" id="launch">Lancer la vague 1</button>
  </div>
</body>
<script>
/* ───────────── Plan de bouclage : tower defense du service Intervention ─────────────
   Un seul itinéraire : du lieu des faits (en haut) jusqu'au périmètre (en bas). Les fuyards le suivent tous.
   Le joueur pose ses moyens sur les emplacements bleus le long du trajet. Chaque interpellation rapporte des agents. */
const MW=9, MH=14;
const PATH=[[1.5,-.6],[1.5,2.6],[7.5,2.6],[7.5,5.6],[1.5,5.6],[1.5,8.6],[7.5,8.6],[7.5,11.6],[4.5,11.6],[4.5,14.7]];
const PADS=[
  {id:'a',x:3.4,y:1.2},{id:'b',x:6.0,y:1.2},
  {id:'c',x:3.0,y:4.1},{id:'d',x:6.0,y:4.1},{id:'e',x:8.45,y:4.1},
  {id:'f',x:0.55,y:7.1},{id:'g',x:3.0,y:7.1},{id:'h',x:6.0,y:7.1},
  {id:'i',x:3.0,y:10.1},{id:'j',x:6.0,y:10.1},{id:'k',x:8.45,y:10.1},
  {id:'l',x:2.9,y:13.1},{id:'m',x:6.1,y:13.1}];

/* Moyens. dps = interpellation (points de résistance par seconde) selon le type de fuyard. */
const MEANS={
  patrouille:{nom:'Patrouille à pied',cout:5,range:2.0,dps:{pieton:16,scooter:6,voiture:5,fourgon:4},
    ds:'Interpelle les <b>piétons</b>. Contre un véhicule <b>ralenti</b> (combi, herse) : ×2,5.'},
  anon:{nom:'Voiture anonymisée',cout:7,range:2.2,dps:{pieton:4,scooter:14,voiture:14,fourgon:10},
    ds:'Prend en chasse les <b>véhicules</b>. Peu utile contre les piétons.'},
  combi:{nom:'Combi (barrage filtrant)',cout:6,range:1.7,aoe:3,slow:[.5,.6,.7],
    ds:'<b>Ralentit</b> tous les véhicules à portée (les piétons un peu). Les autres moyens en profitent.'},
  drone:{nom:'Drone',cout:5,range:2.6,mark:[.3,.45,.6],
    ds:'<b>Repère</b> les fuyards : +30 % d’efficacité pour tous les moyens autour.'}};
const LV={dmg:[1,1.5,2.1],rng:[0,.2,.35],cout:[0,.8,1.2]};
const UPTXT={patrouille:['','Binôme renforcé','Équipe d’intervention'],anon:['','Équipage chevronné','Deux voitures'],combi:['','Barrage renforcé','Double barrage'],drone:['','Caméra thermique','Drone longue portée']};
/* Fuyards : résistance, vitesse (cases/s), agents gagnés à l'interpellation, vies perdues s'il sort. */
const FOES={
  pieton:{nom:'Fuyard à pied',hp:30,v:.85,gain:1,vies:1,veh:false,
    ds:'Lent mais nombreux. La <b>patrouille à pied</b> est faite pour lui.'},
  scooter:{nom:'Scooter',hp:34,v:2.4,gain:2,vies:1,veh:true,
    ds:'<b>Très rapide</b>, fragile. Ralentis-le avec un <b>combi</b> ; la <b>voiture anonymisée</b> le rattrape.'},
  voiture:{nom:'Voiture',hp:70,v:1.6,gain:2,vies:1,veh:true,
    ds:'Résistante et rapide. <b>Voiture anonymisée</b>, ou patrouille derrière un <b>combi</b>.'},
  fourgon:{nom:'Fourgon',hp:220,v:1.0,gain:5,vies:2,veh:true,
    ds:'<b>Très résistant</b> et coûte <b>2 vies</b> s’il passe. Concentre tes moyens et pose une <b>herse</b>.'}};
const WAVES=[
  [['pieton',6]],
  [['pieton',4],['voiture',3]],
  [['scooter',6],['pieton',3]],
  [['voiture',5],['pieton',4],['scooter',2]],
  [['fourgon',2],['voiture',4],['scooter',4]],
  [['pieton',6],['voiture',6],['scooter',5],['fourgon',3]]];
const TUTO_WAVE=[['pieton',4]];
const HERSE={cd:20,dure:10};

const Q2=new URLSearchParams(location.search);
const R={cfg:null,phase:'idle',wave:0,waves:6,lives:10,agents:0,towers:{},units:[],spawnQ:[],nextIn:null,sel:null,waveEnd:0,
  herse:{cd:0,placing:false,strips:[]},seen:new Set(),pause:false,caught:0,leaks:{},fx:[],speed:1,t:0,tuto:0,dispo:{},usure:0,over:true};
const C={cv:null,ctx:null,s:30,dpr:1,map:null};

/* ───── géométrie du trajet ───── */
const CUM=[0]; for(let i=1;i<PATH.length;i++) CUM.push(CUM[i-1]+Math.hypot(PATH[i][0]-PATH[i-1][0],PATH[i][1]-PATH[i-1][1]));
const LEN=CUM[CUM.length-1];
function posAt(d){ d=Math.max(0,Math.min(LEN,d)); let i=1; while(i<CUM.length-1&&CUM[i]<d) i++;
  const a=PATH[i-1],b=PATH[i],t=(d-CUM[i-1])/(CUM[i]-CUM[i-1]); return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}; }
function nearestOnPath(x,y){ let best={dist:1e9,d:0}; for(let i=1;i<PATH.length;i++){ const a=PATH[i-1],b=PATH[i],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;
  let t=((x-a[0])*dx+(y-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); const px=a[0]+t*dx,py=a[1]+t*dy,dd=Math.hypot(px-x,py-y);
  if(dd<best.dist) best={dist:dd,d:CUM[i-1]+t*(CUM[i]-CUM[i-1])}; } return best; }
const padOf=id=>PADS.find(p=>p.id===id);
const rangeOf=tw=>MEANS[tw.type].range+LV.rng[tw.lvl-1];
const upCost=tw=>tw.lvl>=3?null:Math.round(MEANS[tw.type].cout*LV.cout[tw.lvl]);
const sellVal=tw=>Math.floor(tw.spent*.6);

/* ───── partie ───── */
function resetGame(cfg,tuto){
  R.cfg=cfg; R.tuto=tuto?1:0; R.wave=0; R.units=[]; R.spawnQ=[]; R.fx=[]; R.towers={}; R.sel=null; R.caught=0; R.leaks={}; R.seen=new Set(); R.pause=false;
  R.herse={cd:0,placing:false,strips:[]}; $('newfoe').hidden=true;
  R.waves=tuto?1:cfg.waves; R.lives=tuto?10:cfg.lives;
  const qn=(k,d)=>{ const v=Q2.get(k); return v!==null&&v!==''&&Number.isFinite(Number(v))?Number(v):d; };
  const inc=Q2.get('mode')==='incident';
  // En incident, l'effectif Intervention réel de la zone fixe les agents de départ (2,5 points par policier présent).
  R.agents=tuto?10:(inc?Math.max(10,Math.round(qn('agents',cfg.agents)*2.5)):cfg.eff);
  // Moyens disponibles : nombre de combis et de voitures de la zone, drone seulement avec une cellule drone.
  R.dispo={combi:inc?qn('combi',cfg.combi):cfg.combi, anon:inc?qn('anon',cfg.anon):cfg.anon, drone:inc?qn('drone',cfg.drone):cfg.drone};
  R.usure=inc?Math.max(0,Math.min(1,qn('usure',0)/100)):0;
  R.phase='build'; R.nextIn=null; R.over=false; if(!tuto) Shell.st.mode='play';
  tip(); ui();
}
function launchWave(){
  if(R.over||R.wave>=R.waves) return;
  const early = R.nextIn!==null&&R.wave>0 ? Math.ceil(R.nextIn/4) : 0;
  if(early>0){ R.agents+=early; Shell.toast(`Appel anticipé : +${early} agents`,'ok'); }
  R.wave++; R.phase='run'; R.nextIn=null;
  const groups=R.tuto?TUTO_WAVE:WAVES[Math.min(WAVES.length-1,R.wave-1)];
  // Les groupes arrivent l'un après l'autre, à intervalle régulier.
  let t=Math.max(R.t,R.waveEnd)+.3; const gap=R.cfg.gap;
  for(const [type,n] of groups) for(let i=0;i<n;i++){ R.spawnQ.push({type,at:t}); t+=gap*(type==='fourgon'?2:type==='scooter'?.6:1); }
  R.waveEnd=t;
  Shell.blip(520,.12,'triangle',.06); Shell.toast(`Vague ${R.wave}`,'info'); ui(); if(!R.sel) tip();
}
function addUnit(type,d){ const F=FOES[type], hp=F.hp*R.cfg.hp;
  R.units.push({type,d,hp,max:hp,slow:0,mark:1,punct:false,alive:true,bob:Math.random()*6,col:pick(['#e8283c','#c81e32','#ff4d5e','#d7263d'])});
  if(!R.seen.has(type)){ R.seen.add(type); if(!R.tuto&&!R.sim) introFoe(type); }
}
function step(dt){
  if(R.over||R.pause) return;
  R.t+=dt;
  if(R.herse.cd>0) R.herse.cd=Math.max(0,R.herse.cd-dt);
  R.herse.strips=R.herse.strips.filter(s=>R.t<s.until);
  if(R.phase!=='run') return;
  while(R.spawnQ.length&&R.spawnQ[0].at<=R.t) addUnit(R.spawnQ.shift().type,0);
  // vague suivante : compte à rebours dès que la vague en cours a fini d'arriver
  if(!R.spawnQ.length&&R.wave<R.waves&&R.nextIn===null&&R.t>=R.waveEnd&&!R.tuto) R.nextIn=R.cfg.pause;
  if(R.nextIn!==null){ R.nextIn-=dt; if(R.nextIn<=0){ R.nextIn=null; launchWave(); } }
  const live=R.units.filter(u=>u.alive);
  for(const u of live){ u.slow=0; u.mark=1; u.p=posAt(u.d); }
  // soutien : combis (ralentissement) et drones (repérage)
  for(const id in R.towers){ const tw=R.towers[id], M=MEANS[tw.type], P=padOf(id), rg=rangeOf(tw);
    if(tw.type!=='combi'&&tw.type!=='drone') continue;
    for(const u of live){ if(Math.hypot(u.p.x-P.x,u.p.y-P.y)>rg) continue;
      if(tw.type==='combi'){ const s=M.slow[tw.lvl-1]*(1-.25*R.usure); u.slow=Math.max(u.slow,FOES[u.type].veh?s:s*.5); }
      else u.mark=Math.max(u.mark,1+M.mark[tw.lvl-1]); } }
  // déplacements
  for(const u of live){ const F=FOES[u.type];
    const v=F.v*(1-u.slow)*(u.punct?.5:1), nd=u.d+v*dt;
    if(F.veh&&!u.punct) for(const s of R.herse.strips){ if(u.d<s.d&&nd>=s.d){ u.punct=true; u.hp-=.25*u.max; fx(u.p.x,u.p.y,'Pneus crevés','ok'); Shell.good(); } }
    u.d=nd; if(u.d>=LEN) leak(u); }
  // interpellations
  for(const id in R.towers){ const tw=R.towers[id], M=MEANS[tw.type], P=padOf(id), rg=rangeOf(tw);
    tw.tgt=null; if(tw.type==='drone') continue;
    const inR=live.filter(u=>u.alive&&Math.hypot(u.p.x-P.x,u.p.y-P.y)<=rg);
    if(!inR.length) continue;
    const wear=(tw.type==='anon'||tw.type==='combi')?1-.25*R.usure:1, k=LV.dmg[tw.lvl-1]*wear;
    if(tw.type==='combi'){ inR.forEach(u=>u.hp-=M.aoe*k*u.mark*dt); tw.tgt=inR; continue; }
    // cible : le plus avancé, en commençant par ceux pour qui le moyen est fait
    const pref=u=>tw.type==='patrouille'?(!FOES[u.type].veh||u.slow>0||u.punct?1:0):(FOES[u.type].veh?1:0);
    inR.sort((a,b)=>pref(b)-pref(a)||b.d-a.d); const t=inR[0];
    let dps=M.dps[t.type]*k; if(tw.type==='patrouille'&&FOES[t.type].veh&&(t.slow>0||t.punct)) dps*=2.5;
    t.hp-=dps*t.mark*dt; tw.tgt=[t]; }
  for(const u of live){ if(u.alive&&u.hp<=0){ u.alive=false; R.caught++; const F=FOES[u.type]; R.agents+=F.gain;
    fx(u.p.x,u.p.y,`+${F.gain}`,'gain'); fx(u.p.x,u.p.y,'','catch'); Shell.good(); } }
  R.units=R.units.filter(u=>u.alive);
  R.fx=R.fx.filter(f=>R.t-f.t<1.2);
  if(R.wave>=R.waves&&!R.spawnQ.length&&!R.units.length) endGame();
}
function leak(u){
  u.alive=false; const F=FOES[u.type]; R.lives-=F.vies; R.leaks[u.type]=(R.leaks[u.type]||0)+1;
  Shell.bad(); if(!R.sim){ Shell.shake(); const h=$('hLives'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit'); }
  fx(4.5,13.2,`−${F.vies} vie${F.vies>1?'s':''}`,'bad');
  if(R.lives<=0&&!R.tuto){ R.lives=0; finish(false); }
  ui();
}
function fx(x,y,txt,k){ R.fx.push({x,y,txt,k,t:R.t}); }
function endGame(){
  if(R.over) return;
  if(R.tuto){ R.over=true; R.phase='idle'; Shell.win(); setTimeout(()=>tutoStep(5),400); return; }
  finish(R.lives>0);
}
function finish(ok){
  if(R.over) return; R.over=true; R.phase='idle'; R.sel=null; R.herse.placing=false; ui(); tip();
  if(R.sim) return;
  if(ok) Shell.win();
  const fuites=Object.values(R.leaks).reduce((a,b)=>a+b,0);
  const conseils={pieton:'<b>piétons</b> : place des <b>patrouilles à pied</b> le long du trajet.',
    scooter:'<b>scooters</b> : un <b>combi</b> les ralentit et la <b>voiture anonymisée</b> les rattrape.',
    voiture:'<b>voitures</b> : la <b>voiture anonymisée</b> est faite pour elles, une patrouille derrière un <b>combi</b> aussi.',
    fourgon:'<b>fourgons</b> : très résistants, <b>renforce</b> tes moyens et pose une <b>herse</b> à leur passage.'};
  const details=Object.entries(R.leaks).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${n} fuite${n>1?'s':''} de ${conseils[k]}`);
  Shell.result({ok, faults:fuites, stats:[['Interpellés',R.caught],['Fuites',String(fuites)]], details,
    note:fuites===0?'Bouclage parfait : double point.':'Sans aucune fuite : +2 sur la jauge.'});
}

/* ───── nouveaux fuyards : petite fiche, jeu en pause ───── */
function introFoe(type){
  const F=FOES[type], el=$('newfoe'); R.pause=true;
  el.innerHTML=`<div class="hd"><canvas id="nfc"></canvas><div><div class="ey">Nouveau fuyard</div><h3>${F.nom}</h3></div></div>
    <p>${F.ds}</p><p style="color:var(--mute);font-size:13px">Interpellé : <b>+${F.gain} agent${F.gain>1?'s':''}</b> · S’il sort : <b>−${F.vies} vie${F.vies>1?'s':''}</b></p>
    <button class="btn primary" id="nfOk">Compris</button>`;
  el.hidden=false;
  const c=$('nfc'); c.width=128; c.height=128; const g=c.getContext('2d'); const z=type==='pieton'?240:type==='scooter'?220:type==='fourgon'?120:150; g.setTransform(z,0,0,z,64,64); g.rotate(-Math.PI/2);
  drawFoeBody(g,{type,col:'#e8283c',bob:0},0);
  $('nfOk').onclick=()=>{ el.hidden=true; R.pause=false; };
}

/* ───── interface ───── */
function ui(){
  $('stLives').textContent=Math.max(0,R.lives); $('stAg').textContent=R.agents; $('stWave').textContent=`${Math.min(R.wave,R.waves)}/${R.waves}`;
  const b=$('launch');
  if(R.phase==='build'){ b.disabled=R.tuto>0&&R.tuto<4; b.innerHTML='Lancer la vague 1'; }
  else if(R.phase==='run'&&R.nextIn!==null){ b.disabled=false; b.innerHTML=`Vague ${R.wave+1} dans ${Math.ceil(R.nextIn)} s <small>· maintenant : +${Math.ceil(R.nextIn/4)}</small>`; }
  else { b.disabled=true; b.innerHTML=R.phase==='run'?(R.wave>=R.waves?'Dernière vague':`Vague ${R.wave} en cours`):'—'; }
  const hz=$('herse'); hz.hidden=R.phase==='idle'||R.tuto>0; hz.disabled=R.herse.cd>0||R.phase!=='run';
  hz.setAttribute('aria-pressed',R.herse.placing); $('herseTxt').textContent=R.herse.cd>0?`${Math.ceil(R.herse.cd)} s`:'Herse';
  $('herseCd').style.width=(R.herse.cd>0?(1-R.herse.cd/HERSE.cd)*100:0)+'%';
  $('spd').hidden=R.phase==='idle';
}
function tip(html){
  const el=$('tip');
  if(html){ el.innerHTML=html; return; }
  if(R.herse.placing){ el.innerHTML='<span><b>Herse :</b> touche la route là où la poser. Pendant 10 s, elle crève les pneus des véhicules qui passent.</span>'; return; }
  if(R.sel){ const tw=R.towers[R.sel.pad];
    if(R.sel.opt){ const o=R.sel.opt;
      if(o==='up'){ el.innerHTML=`<span><b>${UPTXT[tw.type][tw.lvl]}</b> · <span class="c">${upCost(tw)} agents</span> — plus efficace, portée accrue. <b>Touche encore pour confirmer.</b></span>`; return; }
      if(o==='sell'){ el.innerHTML=`<span><b>Retirer</b> ce moyen · récupère <span class="c">${sellVal(tw)} agents</span>. <b>Touche encore pour confirmer.</b></span>`; return; }

/* menu circulaire autour de l'emplacement sélectionné */
function menuItems(){
  if(!R.sel) return [];
  const P=padOf(R.sel.pad), tw=R.towers[R.sel.pad];
  let items;
  if(tw){ items=[]; if(tw.lvl<3) items.push({k:'up',a:-Math.PI/2}); items.push({k:'sell',a:Math.PI/2}); }
  else { const keys=['patrouille','anon','combi','drone'], allow=R.tuto?['patrouille']:keys; items=keys.map((k,i)=>({k,a:-Math.PI/2+i*Math.PI/2,lock:!allow.includes(k)})); }
  const r=.92, cx=Math.min(MW-r-.42,Math.max(r+.42,P.x)), cy=Math.min(MH-r-.6,Math.max(r+.42,P.y));
  return items.map(it=>{ const x=cx+Math.cos(it.a)*r, y=cy+Math.sin(it.a)*r; let ok=true, why='';
    if(it.k==='up') ok=R.agents>=upCost(tw);

      if(it.lock){ ok=false; why='pas pour le moment'; }
      else if(lim!==undefined&&used>=lim){ ok=false; why=it.k==='drone'&&!lim?'ta zone n’a pas de cellule drone':`tous tes véhicules sont engagés (${lim})`; }

    return {...it,x,y,ok,why}; });
}
function choose(it){
  const id=R.sel.pad;
  if(R.sel.opt!==it.k){ R.sel.opt=it.k; tip(); if(!it.ok){ const nm=it.k==='up'?'Renforcer':MEANS[it.k].nom; tip(`<span><b>${nm}</b> : ${it.why||'pas assez d’agents'}.</span>`); } return; }
  if(!it.ok) return;
  if(it.k==='sell'){ R.agents+=sellVal(R.towers[id]); delete R.towers[id]; }
  else if(it.k==='up'){ const tw=R.towers[id], c=upCost(tw); R.agents-=c; tw.spent+=c; tw.lvl++; tw.born=R.t; }
  else { const M=MEANS[it.k]; R.agents-=M.cout; R.towers[id]={type:it.k,lvl:1,spent:M.cout,born:R.t}; if(R.tuto===3) tutoStep(4); }

function onTap(e){
  const r=C.cv.getBoundingClientRect(), x=(e.clientX-r.left)/C.s, y=(e.clientY-r.top)/C.s;
  if((R.over&&!R.tuto)||R.phase==='idle'||R.pause) return;
  if(R.herse.placing){ const n=nearestOnPath(x,y);
    if(n.dist<.75){ R.herse.strips.push({d:n.d,until:R.t+HERSE.dure}); R.herse.cd=HERSE.cd; Shell.good(); }
    R.herse.placing=false; tip(); ui(); return; }
  for(const it of menuItems()){ if(Math.hypot(it.x-x,it.y-y)<.44){ choose(it); return; } }
  let best=null,bd=.6; for(const p of PADS){ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){ bd=d; best=p; } }
  if(R.tuto===1&&best&&best.id!=='c') best=null;
  if(R.tuto===3&&best&&best.id!=='c') best=null;
  if(best){ R.sel={pad:best.id,opt:null}; if(R.tuto===1) tutoStep(3); Shell.blip(700,.04,'square',.03); }
  else if(R.tuto!==3) R.sel=null;

}

/* ───── tutoriel ───── */
function tutoStep(n){
  R.tuto=n; ui();
  if(n===1) Shell.coach(1,3,'Les fuyards suivent <b>la route</b>, du lieu des faits jusqu’au <b>périmètre</b>. Touche l’<b>emplacement bleu</b> qui clignote.');
  if(n===3) Shell.coach(2,3,'Choisis la <b>patrouille à pied</b> au-dessus de l’emplacement. Premier toucher : sa portée s’affiche. Deuxième toucher : elle est posée.');
  if(n===4) Shell.coach(3,3,'Parfait. Touche <b>Lancer la vague</b> : quatre fuyards à pied arrivent. Chaque interpellation te rapporte des agents.');
  if(n===5) Shell.endTuto();
}

    g.fillStyle='rgba(98,176,255,.09)'; g.strokeStyle='rgba(98,176,255,.35)'; g.lineWidth=.03; g.setLineDash([.12,.1]); g.beginPath(); g.arc(P.x,P.y,rangeOf(tw),0,7); g.fill(); g.stroke(); g.setLineDash([]); }
  // herses posées
  for(const st of R.herse.strips){ const p=posAt(st.d), left=st.until-R.t; g.save(); g.translate(p.x,p.y); g.rotate(p.ang+Math.PI/2); g.globalAlpha=left<2?.4+.6*(Math.floor(rt*6)%2):1; g.scale(1.1,1.1); drawHerse(g,true); g.restore(); g.globalAlpha=1; }
  // emplacements libres
  for(const P of PADS){ if(R.towers[P.id]) continue; const hl=R.tuto===1&&P.id==='c', sel=R.sel&&R.sel.pad===P.id, pu=.5+.5*Math.sin(rt*5);
    g.fillStyle=sel?'rgba(98,176,255,.45)':'rgba(40,110,220,.3)'; g.beginPath(); g.arc(P.x,P.y,.42,0,7); g.fill();
    g.strokeStyle=sel?'#fff':'#62b0ff'; g.lineWidth=sel?.06:.045; g.beginPath(); g.arc(P.x,P.y,.42,0,7); g.stroke();
    g.fillStyle='rgba(232,241,255,.9)'; g.beginPath(); g.arc(P.x,P.y-.08,.08,0,7); g.fill(); g.beginPath(); g.moveTo(P.x-.16,P.y+.18); g.quadraticCurveTo(P.x-.15,P.y+.02,P.x,P.y+.02); g.quadraticCurveTo(P.x+.15,P.y+.02,P.x+.16,P.y+.18); g.closePath(); g.fill();
    if(hl){ g.strokeStyle=`rgba(255,255,255,${1-pu})`; g.lineWidth=.05; g.beginPath(); g.arc(P.x,P.y,.5+pu*.3,0,7); g.stroke(); } }
  // moyens posés
  for(const id in R.towers){ const tw=R.towers[id], P=padOf(id);
    g.fillStyle='rgba(40,110,220,.32)'; g.strokeStyle=R.sel&&R.sel.pad===id?'#fff':'rgba(98,176,255,.8)'; g.lineWidth=.035; g.beginPath(); g.arc(P.x,P.y,.42,0,7); g.fill(); g.stroke();
    if(tw.type!=='drone'){ const sc=Math.min(1,(R.t-(tw.born||0))*5+.5); g.save(); g.translate(P.x,P.y); g.scale(sc,sc); drawTower(g,tw,0,0,rt); g.restore(); }
    for(let i=0;i<tw.lvl;i++) star(g,P.x+(i-(tw.lvl-1)/2)*.2,P.y+.47,.08); }
  // fuyards
  for(const u of R.units) drawFoe(g,u,rt);
  // liaisons moyens → cibles
  if(R.phase==='run') for(const id in R.towers){ const tw=R.towers[id], P=padOf(id); if(!tw.tgt||tw.type==='combi') continue;
    for(const u of tw.tgt){ if(u.px===undefined) continue; g.strokeStyle=tw.type==='anon'?'rgba(98,176,255,.85)':'rgba(255,209,102,.85)'; g.lineWidth=.04; g.setLineDash([.1,.08]); g.lineDashOffset=-rt*1.2;
      g.beginPath(); g.moveTo(P.x,P.y); g.lineTo(u.px,u.py); g.stroke(); g.setLineDash([]); } }
  // drones au-dessus
  for(const id in R.towers){ const tw=R.towers[id]; if(tw.type!=='drone') continue; const P=padOf(id);
    g.strokeStyle='rgba(255,209,102,.3)'; g.setLineDash([.1,.1]); g.lineWidth=.025; g.beginPath(); g.arc(P.x,P.y,rangeOf(tw),0,7); g.stroke(); g.setLineDash([]);
    drawTower(g,tw,P.x,P.y-.05,rt); }
  // panneaux
  pill(g,2.75,.42,'LIEU DES FAITS','#fff',.21,'#d81f35');
  pill(g,6.05,13.75,'PÉRIMÈTRE ▼','#fff',.22,'#d81f35');
  // mode herse : route en surbrillance
  if(R.herse.placing){ g.save(); g.globalAlpha=.35+.2*Math.sin(rt*6); strokePath(g,RW,'rgba(255,178,63,.6)'); g.restore(); }
  // portée et menu de l'emplacement sélectionné
  if(R.sel){ const P=padOf(R.sel.pad), tw=R.towers[R.sel.pad];
    let rg=null;
    if(R.sel.opt&&MEANS[R.sel.opt]) rg=MEANS[R.sel.opt].range;
    else if(tw) rg=MEANS[tw.type].range+LV.rng[Math.min(2,tw.lvl-1+(R.sel.opt==='up'?1:0))];
    if(rg){ g.fillStyle='rgba(255,255,255,.07)'; g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=.035; g.beginPath(); g.arc(P.x,P.y,rg,0,7); g.fill(); g.stroke(); }
    for(const it of menuItems()){ const on=R.sel.opt===it.k;
      g.fillStyle='rgba(0,0,0,.5)'; g.beginPath(); g.arc(it.x+.03,it.y+.05,.38,0,7); g.fill();
      g.fillStyle=on?'#ffd166':it.ok?'#1d2638':'#2a2d35'; g.beginPath(); g.arc(it.x,it.y,.38,0,7); g.fill();
      g.strokeStyle=on?'#fff':it.ok?'#ffd166':'#5a5f6a'; g.lineWidth=.045; g.beginPath(); g.arc(it.x,it.y,.38,0,7); g.stroke();
      g.save(); g.translate(it.x,it.y-.03); g.globalAlpha=it.ok?1:.4;
      if(it.k==='up'){ g.fillStyle=on?'#241400':'#ffd166'; g.beginPath(); g.moveTo(0,-.17); g.lineTo(.15,.03); g.lineTo(.05,.03); g.lineTo(.05,.15); g.lineTo(-.05,.15); g.lineTo(-.05,.03); g.lineTo(-.15,.03); g.closePath(); g.fill(); }
      else if(it.k==='sell'){ g.strokeStyle=on?'#241400':'#ff8a8a'; g.lineWidth=.05; g.beginPath(); g.moveTo(-.11,-.11); g.lineTo(.11,.11); g.moveTo(.11,-.11); g.lineTo(-.11,.11); g.stroke(); }
      else { g.scale(.62,.62); drawTower(g,{type:it.k,lvl:1,tgt:null},0,0,rt); }
      g.restore(); g.globalAlpha=1;
      const cost=it.k==='up'?upCost(tw):it.k==='sell'?'+'+sellVal(tw):MEANS[it.k].cout;
      pill(g,it.x,it.y+.42,String(cost),it.k==='sell'?'#46d98a':it.ok?'#ffd166':'#8a8f99',.17,'#10141d'); } }
  // textes flottants et flashs d'interpellation
  for(const f of R.fx){ const k=(R.t-f.t)/1.2;
    if(f.k==='catch'){ const on=Math.floor((R.t-f.t)*10)%2; g.globalAlpha=Math.max(0,1-k); g.fillStyle=on?'rgba(70,140,255,.55)':'rgba(255,60,60,.5)'; g.beginPath(); g.arc(f.x,f.y,.2+k*.35,0,7); g.fill(); g.globalAlpha=1; continue; }
    g.globalAlpha=Math.max(0,1-k); g.font=`800 ${f.k==='gain'?.26:.22}px "Instrument Sans",sans-serif`; g.textAlign='center'; g.textBaseline='middle';
    g.lineWidth=.07; g.strokeStyle='rgba(8,10,18,.85)'; g.strokeText(f.txt,f.x,f.y-.35-k*.5); g.fillStyle=f.k==='gain'?'#62b0ff':f.k==='ok'?'#46d98a':f.k==='bad'?'#ff5d5d':'#ffd166'; g.fillText(f.txt,f.x,f.y-.35-k*.5); g.globalAlpha=1; }
}
function star(g,x,y,r){ g.fillStyle='#ffd166'; g.strokeStyle='#241400'; g.lineWidth=.02; g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; i?g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):g.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } g.closePath(); g.fill(); g.stroke(); }
function pill(g,x,y,txt,col,sz=.17,bg){ g.font=`800 ${sz}px "Instrument Sans",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; const w=g.measureText(txt).width+sz*1.3, h=sz*1.55;
  g.fillStyle=bg||'rgba(10,12,20,.85)'; rr(g,x-w/2,y-h/2,w,h,h/2); g.fill(); g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=.022; g.stroke(); g.fillStyle=col; g.fillText(txt,x,y+.01); }

Shell.init({
  key:'bouclage', service:'Incident Intervention', serviceShort:'Intervention',
  headline:'Car-jacking, bouclage du quartier',
  story:`<p>Car-jacking violent : les auteurs et leurs complices s’enfuient à pied, en scooter, en voiture et en fourgon par la seule route qui sort du quartier.</p><p>Place tes moyens le long du trajet et interpelle-les avant le périmètre. Chaque interpellation te rapporte des agents pour renforcer ton dispositif.</p>`,
  diffs:{
    difficile:{agents:6,label:'Difficile',eff:16,lives:8,combi:2,anon:2,drone:1,hp:1.15,gap:1.1,pause:12,waves:6},
    normal:{agents:8,label:'Normal',eff:20,lives:12,combi:2,anon:3,drone:1,hp:1,gap:1.25,pause:14,waves:6},
    facile:{agents:10,label:'Facile',eff:22,lives:15,combi:3,anon:4,drone:1,hp:.85,gap:1.4,pause:16,waves:5}},
  bornes:{eff:[10,24],lives:[5,15],gap:[.6,2],hp:[.5,Infinity],pause:[8,20],combi:[1,4],anon:[1,4],drone:[1,1]},
  diffHint:'Plus d’agents au départ et plus de fuites tolérées.',
  desktopHint:'Sur ordinateur : clique sur un emplacement bleu, puis sur le moyen voulu (deux fois pour confirmer).',
  rules:['Les fuyards suivent tous <b>la route</b>, du lieu des faits au <b>périmètre</b>. Chaque fuyard qui sort te coûte une <b>vie</b> (deux pour un fourgon).',
    'Touche un <b>emplacement bleu</b> : quatre moyens apparaissent autour. Premier toucher : portée et prix. Deuxième toucher : c’est posé.',
    '<b>Patrouille</b> contre les piétons, <b>voiture anonymisée</b> contre les véhicules, <b>combi</b> pour ralentir, <b>drone</b> pour rendre tout le monde plus efficace autour de lui.',
    'Chaque interpellation rapporte des <b>agents</b> : dépense-les pour poser ou <b>renforcer</b> tes moyens (touche un moyen posé), même pendant la vague.',
    'La <b>herse</b> (en bas à gauche) se pose sur la route et crève les pneus des véhicules qui passent. Elle se recharge en 20 s.',
    'Lancer la vague suivante <b>en avance</b> rapporte des agents en bonus. Aucune fuite : <b>+2</b> sur la jauge.'],
  winTitle:'Périmètre tenu', loseTitle:'Le bouclage a cédé', skin:'Barrage de nuit',
  malus:'les auteurs restent dans la nature : moral des équipes Intervention en baisse et un combi immobilisé jusqu’à demain.',
  // Challenge : 3 vagues au niveau 1, jusqu'à 6 ; ensuite les fuyards résistent davantage et arrivent plus serrés.
  niveau(n,cfg){ cfg.waves=n<=2?3:n<=4?4:n<=7?5:6; return cfg; },
  onInit(){
    C.cv=$('cv'); C.ctx=C.cv.getContext('2d');
    resize(); new ResizeObserver(resize).observe($('field'));
    if(document.fonts) document.fonts.ready.then(resize);
    C.cv.addEventListener('pointerdown',onTap);
    $('launch').onclick=()=>{ if(R.phase==='build'){ if(R.tuto===4) Shell.hideCoach(); launchWave(); } else if(R.phase==='run'&&R.nextIn!==null) launchWave(); };
    $('spd').onclick=()=>{ R.speed=R.speed===1?2:1; $('spd').setAttribute('aria-pressed',R.speed===2); };
    $('herse').onclick=()=>{ if(R.herse.cd>0||R.phase!=='run') return; R.herse.placing=!R.herse.placing; R.sel=null; tip(); ui(); };
    R.phase='idle'; R.cfg=this.diffs.normal; ui(); tip();
  },
  onMenu(){ R.over=true; R.phase='idle'; R.units=[]; R.towers={}; R.tuto=0; R.sel=null; $('newfoe').hidden=true; R.pause=false; ui(); tip(); },
  onPlay(cfg){ resetGame(cfg,false); },
  onTuto(){ resetGame(this.diffs.facile,true); tutoStep(1); },
  onFrame(dt){
    if(!C.ctx) return;
    const n=R.speed*2; for(let i=0;i<n;i++) step(dt*R.speed/n);
    if(R.phase==='build'||R.phase==='run'){
      const T=$('timer'); $('ring').classList.remove('warn');
      if(R.phase==='run'&&R.nextIn!==null){ T.textContent=Math.ceil(R.nextIn); $('ringval').style.strokeDashoffset=2*Math.PI*21*(1-R.nextIn/R.cfg.pause); }
      else { T.textContent=R.phase==='run'?'V'+R.wave:'–'; $('ringval').style.strokeDashoffset=0; }
      if(((R.t*5)|0)!==R._lu){ R._lu=(R.t*5)|0; ui(); }
    }
    render();
  }
});
// Accès pour les simulations d'équilibrage (sans effet en jeu).
window.__bouclage={R,PADS,MEANS,FOES,WAVES,LV,resetGame,launchWave,step,upCost,
  build(pad,type){ const M=MEANS[type]; if(R.towers[pad]||R.agents<M.cout) return false; const used=Object.values(R.towers).filter(t=>t.type===type).length; if(R.dispo[type]!==undefined&&used>=R.dispo[type]) return false; R.agents-=M.cout; R.towers[pad]={type,lvl:1,spent:M.cout,born:R.t}; return true; },
  up(pad){ const tw=R.towers[pad]; if(!tw||tw.lvl>=3) return false; const c=upCost(tw); if(R.agents<c) return false; R.agents-=c; tw.spent+=c; tw.lvl++; return true; },
  herse(d){ if(R.herse.cd>0||R.phase!=='run') return false; R.herse.strips.push({d,until:R.t+HERSE.dure}); R.herse.cd=HERSE.cd; return true; }};
