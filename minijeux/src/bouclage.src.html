<script>
/* ───────────── Maintien de l'ordre : tower defense du service Intervention ─────────────
   Des cortèges de casseurs remontent les rues vers l'hôtel de ville. On ne les « élimine » pas : on les repousse.
   Quand leur détermination tombe à zéro, ils font demi-tour et repartent par où ils sont venus. */
const MW=9, MH=14;
const T2=[[4.5,3.5],[4.5,6.5],[1.8,6.5],[1.8,10],[7,10],[7,12.3],[4.5,12.3],[4.5,14.7]];
const T3=[[4.5,6],[4.5,9],[7.5,9],[7.5,11.6],[2,11.6],[2,14.7]];
const T4=[[4.5,4],[4.5,8],[6.8,8],[6.8,11.2],[4.5,11.2],[4.5,14.7]];
const MAPS=[
  {nom:'Place du Marché',sous:'1 cortège',hp:1.8,w:[1],
    paths:[[[1.5,-.6],[1.5,2.6],[7.5,2.6],[7.5,5.6],[1.5,5.6],[1.5,8.6],[7.5,8.6],[7.5,11.6],[4.5,11.6],[4.5,14.7]]]},
  {nom:'Quartier de la Gare',sous:'2 cortèges',hp:1.85,w:[1,1],
    paths:[[[1.5,-.6],[1.5,3.5],...T2],[[7.5,-.6],[7.5,3.5],...T2]]},
  {nom:'Grand-Place',sous:'2 cortèges, dont un par le côté',hp:2.2,w:[1,1],
    paths:[[[4.5,-.6],[4.5,2],[1.5,2],[1.5,6],...T3],[[9.7,3.5],[7.5,3.5],[7.5,6],...T3]]},
  {nom:'Abords du stade',sous:'3 cortèges',hp:1.6,w:[1,1,.6],
    paths:[[[1.5,-.6],[1.5,4],...T4],[[7.5,-.6],[7.5,4],...T4],[[-.7,8.6],[2.4,8.6],[2.4,11.2],[4.5,11.2],[4.5,14.7]]]}];

/* Moyens de maintien de l'ordre. dps = perte de détermination par seconde selon le type d'émeutier. */
const MEANS={
  peloton:{nom:'Peloton MO',cout:5,range:1.8,dps:{manif:14,casseur:11,meneur:10,bloc:7},
    ds:'Les agents descendent sur la chaussée et <b>retiennent</b> chacun un émeutier au bouclier. Un agent de plus à chaque niveau.'},
  autopompe:{nom:'Lance à eau / autopompe',cout:9,range:2.1,splash:.8,dmg:15,cd:1.6,recul:.45,mult:{manif:1,casseur:.8,meneur:.8,bloc:1.6},
    ds:'<b>Disperse</b> : le jet fait reculer un groupe, lui fait perdre sa <b>cohésion</b> (plus facile à repousser) et <b>fait éclater</b> les blocs compacts entamés.'},
  barrage:{nom:'Barrage (combi + barrières)',cout:6,range:1.8,
    ds:'Barrières en travers de la rue : elles <b>bloquent</b> le cortège jusqu’à céder, puis le combi les relève. Niveau 3 : <b>cheval de frise</b>, bien plus solide, ses barbelés découragent ceux qui poussent.'},
  cavalerie:{nom:'Cavalerie',cout:8,range:2.6,cd:[4,3.3,2.6],choc:{manif:16,casseur:20,meneur:28,bloc:10},
    ds:'<b>Charge</b> dans le groupe le plus dense (meneurs en priorité). Seul moyen <b>mobile</b> : fais-la glisser vers un autre emplacement pour la redéployer.'}};
const LV={dmg:[1,1.5,2.1],rng:[0,.2,.35],cout:[0,1,1.5]};
const UPTXT={peloton:['','Deux agents MO','Trois agents MO'],autopompe:['','Deux lances à eau','Camion autopompe'],
  barrage:['','Deux barrières Heras','Cheval de frise (barbelés)'],cavalerie:['','Deux cavaliers','Escouade montée']};
/* Émeutiers : détermination, vitesse (cases/s), agents récupérés quand ils renoncent, tenue du cordon perdue s'ils passent. */
const FOES={
  manif:{nom:'Émeutier',hp:24,v:.9,gain:1,vies:1,ds:'Avance en masse. Le <b>peloton MO</b> en repousse plusieurs à la fois.'},
  casseur:{nom:'Casseur',hp:18,v:1.7,gain:1,vies:2,ds:'<b>Rapide</b> et agressif : ses projectiles renversent les barrières et <b>désorganisent</b> tes moyens quelques secondes. Coûte <b>2</b> s’il passe.'},
  meneur:{nom:'Meneur',hp:70,v:.85,gain:3,vies:1,aura:1.3,ds:'Au mégaphone, il <b>galvanise</b> ceux qui l’entourent : plus rapides et plus durs à repousser. Vise-le avec la <b>cavalerie</b>.'},
  bloc:{nom:'Bloc compact',hp:160,v:.55,gain:5,vies:3,ds:'Groupe serré derrière une banderole : <b>très résistant</b>, coûte <b>3</b> s’il passe. Entamé, un jet d’<b>autopompe</b> le fait <b>éclater</b> en petits groupes.'}};
/* Chaque vague a une intention : prise de contact, pression, groupes compacts, meneurs, casseurs, nuit tendue. */
const WAVES=[
  [['manif',9]],
  [['manif',14],['casseur',4]],
  [['manif',6],['bloc',2],['casseur',3],['manif',6]],
  [['manif',8],['meneur',2],['manif',8],['casseur',4]],
  [['casseur',10],['manif',10],['meneur',1],['bloc',1],['casseur',4]],
  [['manif',12],['bloc',2],['meneur',2],['casseur',8],['manif',8],['bloc',2],['meneur',1]]];
const WAVE_NOM=['Prise de contact','Pression','Groupes compacts','Meneurs','Casseurs','Nuit tendue'];
/* Économie : les agents engagés sont immobilisés ; repousser rapporte de moins en moins au fil des vagues. */
const REND=[1,.6,.42,.32,.26,.22,.2,.18], RETOUR=6, COMBO={n:4,dt:1.2,r:1.6,gain:1}, BLOC_ECLATE={seuil:.6,n:3,gain:3};
const DIR={tient:{nom:'On tient',c:'+2 cordon',ds:'+2 au cordon'},renfort:{nom:'Renfort',c:'+6 agents · vague +30 %',ds:'+6 agents tout de suite, mais la vague suivante est 30 % plus nombreuse'},
  pousse:{nom:'On pousse',c:'+10 si 0 perte · plus durs',ds:'+10 agents si la vague suivante passe sans perte, mais ses émeutiers sont plus déterminés'}};
const MODS={rapides:'Émeutiers plus rapides',compacts:'Cortèges très soudés',sommation:'Sommations moins fréquentes',barricade:'Un emplacement est en feu'};
const TUTO_WAVE=[['manif',8]];
const SOMM={cd:25,dure:4,rayon:1.6,perte:10,demiTour:.35};

const Q2=new URLSearchParams(location.search);
const R={cfg:null,map:0,M:null,pads:[],phase:'idle',wave:0,waves:6,lives:15,lives0:15,agents:0,towers:{},units:[],spawnQ:[],nextIn:null,sel:null,waveEnd:0,
  somm:{cd:0,placing:false,fx:[]},mods:{},jets:[],seen:new Set(),pause:false,disp:0,leaks:{},fx:[],speed:1,t:0,tuto:0,dispo:{},usure:0,over:true};
const C={cv:null,ctx:null,s:30,dpr:1,map:null};
const store={get(k,d){ try{ const v=localStorage.getItem('bouclage.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bouclage.'+k,JSON.stringify(v)); }catch(e){} }};

/* ───── géométrie ───── */
function mkPath(pts){ const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return {pts,cum,len:cum[cum.length-1]}; }
/* Rues sinueuses : chaque virage du plan (à angle droit) est arrondi. Un même coin garde le même rayon pour tous les cortèges
   qui y passent, pour que les tronçons communs restent superposés. k : facteur de vitesse sur le trajet (1 : vitesse inchangée,
   les simulations donnent alors la même difficulté qu'avec les rues à angle droit, sauf « Abords du stade », rééquilibré). */
const RVIRAGE=1.4;
function mkPaths(paths){
  const R0=new Map(), key=q=>q[0].toFixed(2)+','+q[1].toFixed(2), Ls=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
  return paths.map(raw=>{
    const n=raw.length, corner=i=>{ const a=raw[i-1],b=raw[i],c=raw[i+1]; return Math.abs((b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]))>1e-6; };
    const r=new Array(n).fill(0);
    for(let i=1;i<n-1;i++){ if(!corner(i)) continue; const k=key(raw[i]);
      if(R0.has(k)){ r[i]=R0.get(k); continue; }
      const nxt=i+1<n-1&&corner(i+1)?(R0.get(key(raw[i+1]))??Ls(raw[i],raw[i+1])/2):0;
      r[i]=Math.max(0,Math.min(RVIRAGE,Ls(raw[i-1],raw[i])-r[i-1],Ls(raw[i],raw[i+1])-nxt)); R0.set(k,r[i]); }
    const pts=[raw[0]];
    for(let i=1;i<n-1;i++){ if(!r[i]){ pts.push(raw[i]); continue; } const a=raw[i-1],b=raw[i],c=raw[i+1], la=Ls(a,b), lc=Ls(b,c);
      const t1=[b[0]+(a[0]-b[0])*r[i]/la,b[1]+(a[1]-b[1])*r[i]/la], t2=[b[0]+(c[0]-b[0])*r[i]/lc,b[1]+(c[1]-b[1])*r[i]/lc];
      for(let k=0;k<=12;k++){ const t=k/12, u=1-t; pts.push([u*u*t1[0]+2*u*t*b[0]+t*t*t2[0],u*u*t1[1]+2*u*t*b[1]+t*t*t2[1]]); } }
    pts.push(raw[n-1]);
    const P=mkPath(pts), Q=mkPath(raw); P.raw=raw; P.rawLen=Q.len; P.k=1; return P; });
}
function posOn(P,d){ d=Math.max(0,Math.min(P.len,d)); let i=1; while(i<P.cum.length-1&&P.cum[i]<d) i++;
  const a=P.pts[i-1],b=P.pts[i],t=(d-P.cum[i-1])/(P.cum[i]-P.cum[i-1]); return {x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang:Math.atan2(b[1]-a[1],b[0]-a[0])}; }
function nearestOn(P,x,y){ let best={dist:1e9,d:0}; const pts=P.pts; for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;
  let t=((x-a[0])*dx+(y-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); const dd=Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y); if(dd<best.dist) best={dist:dd,d:P.cum[i-1]+t*(P.cum[i]-P.cum[i-1])}; } return best; }
/* Emplacements générés le long des rues : assez loin de la chaussée, là où ils couvrent le plus de trajet.
   Choisis sur le plan à angle droit (comme avant l'arrondi des rues, pour garder l'équilibrage), puis écartés de la
   chaussée arrondie s'ils la touchent. */
function genPads(paths){
  const raws=paths.map(P=>P.raw?mkPath(P.raw):P), pts=[]; raws.forEach(P=>{ for(let d=0;d<P.len;d+=.2){ const q=posOn(P,d); if(q.y>-.3&&q.y<MH&&q.x>-.3&&q.x<MW+.3) pts.push(q); } });
  const cand=[];
  for(let y=.7;y<=MH-1.05;y+=.25) for(let x=.55;x<=MW-.55;x+=.25){ let dmin=9; for(const q of pts){ const d=Math.hypot(q.x-x,q.y-y); if(d<dmin) dmin=d; }
    if(dmin<1.05||dmin>1.7) continue; let cov=0; for(const q of pts) if(Math.hypot(q.x-x,q.y-y)<=2) cov++; cand.push({x,y,cov}); }
  cand.sort((a,b)=>b.cov-a.cov);
  const out=[]; for(const c of cand){ if(out.every(o=>Math.hypot(o.x-c.x,o.y-c.y)>=1.55)) out.push(c); if(out.length>=14) break; }
  out.forEach(c=>{
    for(let i=0;i<12;i++){ let best=null; paths.forEach(P=>{ const n=nearestOn(P,c.x,c.y); if(!best||n.dist<best.dist) best={...n,P}; });
      if(best.dist>=1.0) break; const q=posOn(best.P,best.d), dx=c.x-q.x, dy=c.y-q.y, L=Math.hypot(dx,dy)||1;
      c.x=Math.max(.5,Math.min(MW-.5,c.x+dx/L*.06)); c.y=Math.max(.6,Math.min(MH-1,c.y+dy/L*.06)); } });
  return out.map((c,i)=>({id:'p'+i,x:c.x,y:c.y}));
}
const MAPDATA=MAPS.map(m=>{ const o={...m,P:mkPaths(m.paths)}; let pads=null; Object.defineProperty(o,'pads',{get(){ return pads||(pads=genPads(o.P)); },enumerable:true}); return o; });
/* ───── Cartes générées (Challenge, après les 4 quartiers) ─────
   Un tronc qui serpente du haut jusqu'à l'hôtel de ville, puis des cortèges secondaires (par le haut ou par un côté)
   qui le rejoignent. Rues à angle droit, jamais collées les unes aux autres, assez d'emplacements le long du trajet. */
const RUES=['Rue Haute','Rue Neuve','Boulevard du Midi','Quartier des Casernes','Place du Jeu de Balle','Rue des Tanneurs','Quai aux Briques','Place Rouppe',
  'Rue de Flandre','Porte de Hal','Place Fontainas','Rue Royale','Quartier Nord','Place Flagey','Boulevard Anspach','Rue du Marché','Place Liedts','Avenue de Stalingrad',
  'Rue de la Loi','Place Saint-Josse','Parvis de Saint-Gilles','Square Ambiorix','Rue Belliard','Place Bara','Quartier Matonge','Rue Blaes','Place Sainte-Catherine','Rue Haute (bas)'];

function segDist(a,b){ // segments à angle droit [[x1,y1],[x2,y2]]

          puff(c.x,c.y,14,{v:1.1,r:.07,grow:2.5,life:.7,col:'rgba(150,140,125,',flat:.35}); }

      for(const o of live) if(o.alive!==false&&Math.hypot(o.p.x-best.p.x,o.p.y-best.p.y)<=M.splash*(tw.lvl>2?1.2:1)){ hit(o,M.dmg*k*M.mult[o.type],true); o.dispUntil=R.t+4; if(!o.held) o.d=Math.max(0,o.d-M.recul*(o.type==='bloc'?.35:1));

  }

  R.projs=(R.projs||[]).filter(p=>{ if(R.t<p.t0+p.dur) return true;
    puff(p.x,p.y-.35,7,{v:1,r:.03,life:.45,grav:3,col:'rgba(150,155,165,',sq:true,flat:1});
    if(p.bar){ const tw=R.towers[p.bar]; if(tw&&tw.bar&&tw.bar.up){ tw.bar.hp-=8; if(tw.bar.hp<=0){ tw.bar.up=false; tw.bar.hp=0; tw.bar.downAt=R.t; fx(tw.rx,tw.ry,'Barrières renversées !','bad'); } } }

      if(tw.type==='peloton') tw.agents.forEach(a=>{ if(a.st==='back') return; const d=Math.hypot(a.x-u.p.x,a.y-u.p.y); if(d<bd&&d>.3){ bd=d; cible={ag:a,x:a.x,y:a.y}; } });

function puff(x,y,n,o={}){ if(R.sim) return; const P=R.parts||(R.parts=[]);
  for(let i=0;i<n;i++){ const a=(o.a??-Math.PI/2)+(Math.random()-.5)*(o.spread??Math.PI*2), v=(o.v??.8)*(.4+Math.random()*.8);

function finish(ok){
  if(R.over) return; R.over=true; R.phase='idle'; R.sel=null; R.somm.placing=false; ui(); tip();
  if(R.sim) return;
  if(ok) Shell.win();
  const perdu=R.lives0-Math.max(0,R.lives);
  const etoiles = !ok ? 0 : perdu===0 ? 3 : perdu<=R.lives0*.4 ? 2 : 1;
  let note='';
  if(ok&&campagne()){ const c=store.get('campagne',{}); if(etoiles>(c[R.map]||0)) c[R.map]=etoiles; store.set('campagne',c);
    note=`${'★'.repeat(etoiles)}${'☆'.repeat(3-etoiles)} sur ce quartier.${R.map<MAPS.length-1?` Quartier suivant débloqué : ${MAPS[R.map+1].nom}.`:' Campagne terminée !'}`; }
  const conseils={manif:'<b>émeutiers</b> : place des <b>pelotons MO</b>, ils en repoussent plusieurs à la fois.',
    casseur:'<b>casseurs</b> : un <b>barrage</b> les freine et la <b>cavalerie</b> les rattrape.',
    meneur:'<b>meneurs</b> : la <b>cavalerie</b> les vise en priorité ; sans eux, le cortège faiblit.',
    bloc:'<b>blocs compacts</b> (3 chacun) : l’<b>autopompe</b> les fait reculer, renforce-la.'};
  const details=Object.entries(R.leaks).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${n} passage${n>1?'s':''} de ${conseils[k]}`);
  const evalu=!ok?'Dispositif débordé':perdu===0?'Maîtrise':perdu<=R.lives0*.25?'Bon dispositif':'Sous tension';
  const st=[['Repoussés',R.disp],['Agents récupérés',`+${R.stats.rec}`],['Cordon perdu',`${perdu} / ${R.lives0}`]];
  if(R.stats.blocs) st.push(['Blocs dispersés',R.stats.blocs]); if(R.stats.combos) st.push(['Interventions maîtrisées',R.stats.combos]);
  Shell.result({ok, faults:perdu, stats:st, details, note:`Évaluation : ${evalu.toUpperCase()}. `+(note||(perdu===0?'Cordon intact : double point.':'Cordon intact : +2 sur la jauge.'))});
}

/* menu circulaire en quartiers : peloton (haut-gauche), autopompe (haut-droite), barrage (bas-gauche), cavalerie (bas-droite) */

/* ───── tutoriel ───── */
function tutoStep(n){
  R.tuto=n; ui();
  if(n===1) Shell.coach(1,3,'Le cortège suit <b>la rue</b> jusqu’à l’<b>hôtel de ville</b>. Touche l’<b>emplacement bleu</b> qui clignote.');
  if(n===3) Shell.coach(2,3,'Choisis le <b>peloton MO</b> au-dessus. Premier toucher : sa portée. Deuxième toucher : il est posé.');
  if(n===4) Shell.coach(3,3,'Lance la vague. Les émeutiers repoussés <b>font demi-tour</b> et te rendent des agents.');
  if(n===5) Shell.endTuto();
}

  const cw=Math.floor(MW*s), ch=Math.floor(MH*s), W=Math.round(cw*C.dpr), H=Math.round(ch*C.dpr);
  if(C.cv.width!==W||C.cv.height!==H){ C.cv.style.width=cw+'px'; C.cv.style.height=ch+'px'; C.cv.width=W; C.cv.height=H; }
  // Le décor est lourd à dessiner (surtout sur téléphone) : on ne le refait que si la carte ou la taille change,
  // et après avoir laissé l'écran s'afficher.
  if(C.mapFor===R.M&&C.mapW===W&&C.mapH===H) return;
  C.mapFor=R.M; C.mapW=W; C.mapH=H; C.map=null; const M=R.M, pads=R.pads;

  for(let i=0;i<5;i++){ const ph=t*6+i*1.7, h=.25+.12*Math.sin(ph), x0=x-.2+i*.1; g.fillStyle=i%2?'#ffb02e':'#ff6a1f'; g.beginPath(); g.moveTo(x0-.06,y-.2); g.quadraticCurveTo(x0,y-.2-h*1.3,x0+.06,y-.2); g.closePath(); g.fill(); }
}
function star(g,x,y,r){ g.fillStyle='#ffd166'; g.strokeStyle='#241400'; g.lineWidth=.02; g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.45:r; i?g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q):g.moveTo(x+Math.cos(a)*q,y+Math.sin(a)*q); } g.closePath(); g.fill(); g.stroke(); }
function pill(g,x,y,txt,col,sz=.17,bg){ g.font=`800 ${sz}px "Instrument Sans",sans-serif`; g.textAlign='center'; g.textBaseline='middle'; const w=g.measureText(txt).width+sz*1.3, h=sz*1.55;
  g.fillStyle=bg||'rgba(10,12,20,.85)'; rr(g,x-w/2,y-h/2,w,h,h/2); g.fill(); g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=.022; g.stroke(); g.fillStyle=col; g.fillText(txt,x,y+.01); }

  winTitle:'Ordre rétabli', loseTitle:'Le cordon a cédé', skin:'Cordon de nuit',

  // Challenge : on enchaîne les quartiers, puis les cortèges deviennent plus déterminés et plus serrés.

  niveau(n,cfg){
    if(n<=MAPS.length){ cfg.map=n-1; cfg.waves=n<=2?4:5; return cfg; }
    cfg.map=-1; cfg.seed=n; cfg.cort=n<=5?1:n<=10?2:n<=14?(n%2?3:2):3;

  onInit(){
    C.cv=$('cv'); C.ctx=C.cv.getContext('2d'); Object.values(SETS).forEach(S=>S.f.forEach(spr)); spr('autopompe'); spr('lance'); spr('frise'); spr('heras-tombee'); R.M=MAPDATA[0]; R.pads=R.M.pads;

window.__bouclage={R,posOn,MAPS,MAPDATA,genMap,mapOk,MEANS,FOES,WAVES,LV,resetGame,launchWave,step,upCost,

  build(pad,type){ const M=MEANS[type]; if(R.towers[pad]||pad===R.fire||R.agents<M.cout) return false; const used=Object.values(R.towers).filter(t=>t.type===type).length; if(R.dispo[type]!==undefined&&used>=R.dispo[type]) return false; R.agents-=M.cout; R.towers[pad]=newTower(pad,type); return true; },
  up(pad){ const tw=R.towers[pad]; if(!tw||tw.lvl>=3) return false; const c=upCost(tw); if(R.agents<c) return false; R.agents-=c; tw.spent+=c; tw.lvl++; setupTower(tw,pad); return true; },
