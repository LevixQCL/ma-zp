<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Maintien de l'ordre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: one-screen thumb game. Compact header (service badge, title, timer ring), game stage, floating glass cards.
   Identity: night shift. Deep blue-ink ground lit from above by the service colour; glass surfaces; one accent per service. */
:root{
  --bg:#0c1124; --bg-2:#141b33; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.09); --stroke-2:rgba(255,255,255,.16);
  --ink:#eef2f8; --mute:#8f9bb1; --faint:#5d6880;
  --accent:#ffb23f; --accent-ink:#241400; --accent-soft:rgba(255,178,63,.16);
  --ok:#46d98a; --ok-soft:rgba(70,217,138,.16); --bad:#ff5d5d; --bad-soft:rgba(255,93,93,.16);
  --scrim:rgba(6,9,22,.74);
  --paper:#f4f1e8; --paper-ink:#22252b; --paper-mute:#6b6f77;
  /* compat (anciens noms) */
  --panel:#141b33; --panel-2:#1c2442; --line:var(--stroke); --gold:var(--accent); --brass:var(--accent); --steel:#b7c1d1;
  --f-disp:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
body.svc-ser{--accent:#ffb23f;--accent-ink:#241400;--accent-soft:rgba(255,178,63,.16)}
body.svc-int{--accent:#ff7a59;--accent-ink:#260b03;--accent-soft:rgba(255,122,89,.16)}
body.svc-rou{--accent:#c9ec4f;--accent-ink:#161d02;--accent-soft:rgba(201,236,79,.15)}
body.svc-lab{--accent:#3fe0c8;--accent-ink:#022019;--accent-soft:rgba(63,224,200,.15)}
body.svc-cyb{--accent:#b49bff;--accent-ink:#170a33;--accent-soft:rgba(180,155,255,.16)}
body.svc-pro{--accent:#62b0ff;--accent-ink:#04182c;--accent-soft:rgba(98,176,255,.16)}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,var(--accent-soft),transparent 60%),linear-gradient(180deg,var(--bg-2),var(--bg) 55%);background-color:var(--bg);
  color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:560px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:12px}

/* header */
.top{display:flex;align-items:center;gap:12px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.badge svg{width:22px;height:22px}
.ttl{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(21px,6.2vw,26px);line-height:1.05;margin:1px 0 0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:flex;align-items:center;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--stroke);color:var(--mute);cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px}
.iconbtn.off{opacity:.45}
.ring{position:relative;width:50px;height:50px;flex:0 0 auto}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke .3s}
.ring.warn .val{stroke:var(--bad)}
.timer{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring.warn .timer{color:var(--bad)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.gauge{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.gauge svg{width:15px;height:15px;color:var(--accent)}
.gbar{flex:1;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gauge b{color:var(--ink);font-weight:700}

.status{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;gap:8px}
.status b{color:var(--ink);font-weight:700}
.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{display:flex;gap:10px;align-items:flex-start;background:rgba(20,27,51,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-md);padding:11px 12px;font-size:14px;line-height:1.45}
.coach .av{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:800 12px var(--f-disp)}
.coach .body{flex:1;min-width:0}
.coach b{color:var(--accent);font-weight:700}
.coach .step{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-bottom:3px}
.coach .dots{display:flex;gap:4px} .coach .dots i{width:14px;height:4px;border-radius:2px;background:var(--surface-2)} .coach .dots i.on{background:var(--accent)}
.coach .skip{cursor:pointer;color:var(--mute);background:none;border:0;font:600 12px var(--f-body);padding:2px 0}

/* toast */
.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-6px);display:flex;align-items:center;gap:8px;font:700 15px var(--f-body);padding:9px 16px;border-radius:999px;background:rgba(20,27,51,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--stroke-2);box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;z-index:4}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{color:var(--ok)} .toast.bad{color:var(--bad)} .toast.info{color:var(--accent)}

/* overlay cards */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:5}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,#182133,#121a28);border:1px solid var(--stroke-2);border-radius:var(--r-lg);padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.card .hero{display:flex;align-items:center;gap:12px}
.card .hero .badge{width:52px;height:52px;border-radius:16px}
.card .hero .badge svg{width:26px;height:26px}
.card .hero .eyebrow{font-size:13px}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.card h2.ok{color:var(--ok)} .card h2.bad{color:var(--bad)}
.card p{margin:0;line-height:1.55;font-size:15px;color:#d5dce8}
.card p b{color:var(--ink)}
.card .small{font-size:13px;color:var(--mute)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;line-height:1.45;color:#d5dce8}
.card ul li{display:flex;gap:10px}
.card ul li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.lbl2{font-size:13px;font-weight:700;color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:5px}
.seg button{background:transparent;border:0;color:var(--mute);border-radius:12px;padding:9px 4px 8px;font:600 12px var(--f-body);cursor:pointer;line-height:1.2;display:grid;justify-items:center;gap:4px;transition:background .15s,color .15s}
.seg button b{display:block;font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.seg button .ppl{display:flex;gap:2px} .seg button .ppl i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.seg.seg1{grid-template-columns:1fr}.seg.seg1 button{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.embed .top{position:relative;z-index:6}
/* en jeu intégré, l’en-tête reste au-dessus des cartes : elles commencent donc sous lui */
.embed .overlay{padding-top:76px}
.btn{flex:1;min-width:120px;border-radius:14px;padding:14px 12px;font:700 15px var(--f-body);cursor:pointer;border:1px solid var(--stroke-2);background:var(--surface);color:var(--ink);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 14px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:10px 12px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.pts b{color:var(--accent)}
.verdict{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.verdict svg{width:28px;height:28px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.malus{background:var(--bad-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;color:#ffd9d9}
.malus b{color:var(--bad)}
.debrief-list{background:var(--surface);border:1px solid var(--stroke);border-radius:var(--r-md);padding:12px 14px;font-size:14px;line-height:1.45;display:grid;gap:6px}
.debrief-list ul{gap:6px}
.debrief-list li::before{background:var(--bad)!important}
.skin{background:var(--accent-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--accent);font-weight:600}
.demo{font-size:12px;color:var(--faint);text-align:center}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.gbar i,.toast,.btn{transition:none}.shake,.card,.verdict{animation:none}}
/* Défi d'endurance (entraînement) */
.defi-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,#FFB23F 45%,transparent);background:color-mix(in srgb,#FFB23F 10%,transparent);border-radius:14px;padding:12px}
.defi-box>div{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.4}
.defi-box b{font-family:var(--f-disp);font-size:15px}
.btn.defi{flex:0 0 auto;background:#FFB23F;color:#241400;border-color:transparent}
.coeurs{color:#FF6E6A;letter-spacing:2px}


.field{position:relative;flex:1;min-height:0;display:grid;place-items:center}
.field canvas#cv{display:block;touch-action:none;border-radius:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 50px rgba(0,0,0,.55)}
.hudrow{display:flex;gap:8px;align-items:center}
.hudrow .pillh{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--stroke);border-radius:999px;padding:5px 11px 5px 8px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.hudrow .pillh b{font-family:var(--f-disp);font-size:17px;color:var(--ink)}
.hudrow .pillh svg{width:18px;height:18px}
.hudrow .lives svg{color:#ffd166} .hudrow .ag svg{color:#62b0ff}
.hudrow .pillh.hit{animation:hit .4s} @keyframes hit{30%{background:var(--bad-soft);border-color:var(--bad)}}
.hudrow .wv{margin-left:auto}
.tip{min-height:38px;display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.35;color:#d5dce8;background:var(--surface);border:1px solid var(--stroke);border-radius:12px;padding:6px 11px}
.tip b{color:var(--ink)} .tip .c{color:#ffd166;font-weight:700}
.bar2{display:flex;gap:8px;align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.btn.pw{flex:0 0 auto;min-width:0;padding:10px 12px;font-size:14px;display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden}
.btn.pw svg{width:20px;height:20px}
.btn.pw .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .2s linear}
.btn.pw[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.spd{flex:0 0 auto;min-width:0;padding:10px 12px;font-size:14px;font-family:var(--f-mono)}
.btn.spd[aria-pressed="true"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.btn.go{flex:1;min-width:0;padding:11px 12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.go small{font-weight:600;opacity:.8}
.btn.go:disabled{background:var(--surface);color:var(--mute);box-shadow:none;border-color:var(--stroke)}
.panel{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);z-index:3;background:rgba(18,24,40,.97);border:1px solid var(--stroke-2);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.55);max-height:calc(100% - 16px);overflow:auto}
.panel .hd{display:flex;gap:12px;align-items:center}
.panel canvas.ic{width:64px;height:64px;border-radius:14px;background:#2a2f3b;flex:0 0 auto}
.panel .ey{font-size:12px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.06em}
.panel h3{margin:2px 0 0;font-family:var(--f-disp);font-size:22px}
.panel p{margin:0;font-size:14px;line-height:1.45;color:#d5dce8}
.panel p b{color:var(--ink)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvl{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--stroke);border-radius:14px;padding:8px;color:var(--ink);cursor:pointer;font:inherit;position:relative}
.lvl canvas{width:100%;aspect-ratio:9/14;max-height:150px;object-fit:cover;border-radius:9px;background:#14171f}
.lvl b{font-family:var(--f-disp);font-size:15px;line-height:1.15}
.lvl span{font-size:12px;color:var(--mute)}
.lvl .st{color:#ffd166;letter-spacing:2px;font-size:14px}
.lvl[disabled]{opacity:.45;cursor:not-allowed}
.lvl .lock{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:28px}
.lvl .n{position:absolute;top:12px;left:12px;background:rgba(10,12,20,.85);border-radius:999px;padding:2px 9px;font:800 13px var(--f-disp);color:#ffd166}

</style>
</head>
<body>
<script>document.body.classList.add('svc-int')</script>
<div class="app" id="app">
  <div class="top">
    <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="6" rx="1.5"/><path d="M8 7l-3 6M13 7l-3 6M18 7l-3 6"/><path d="M6 13v6M18 13v6M4 19h4M16 19h4"/></svg></div>
    <div class="ttl"><div class="eyebrow">Intervention · démo</div><h1>Maintien de l'ordre</h1></div>
    <div class="hud">
      <button class="iconbtn" id="sound" aria-label="Couper le son"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
      <div class="ring" id="ring"><svg viewBox="0 0 50 50"><circle class="trk" cx="25" cy="25" r="21" fill="none" stroke-width="4"/><circle class="val" id="ringval" cx="25" cy="25" r="21" fill="none" stroke-width="4" stroke-linecap="round"/></svg><div class="timer" id="timer">–</div></div>
    </div>
  </div>
  <div class="gauge" id="gaugeRow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8L3.5 9.7l5.9-.8z"/></svg><span>Jauge skins</span><div class="gbar"><i id="gfill"></i></div><span><b id="gtext">46</b> / 50</span></div>
  <div class="coach" id="coach" hidden></div>
  <div class="stage" id="stage">

  <div class="hudrow">
    <span class="pillh lives" id="hLives" title="Tenue du cordon : chaque casseur qui passe la fait baisser"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l8 3v6.2c0 4.6-3.3 8.4-8 9.8-4.7-1.4-8-5.2-8-9.8V5.5z"/></svg><b id="stLives">15</b></span>
    <span class="pillh ag" title="Agents disponibles"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 20.5c.4-4.4 3.6-7 7.5-7s7.1 2.6 7.5 7z"/></svg><b id="stAg">18</b><span>agents</span></span>
    <span class="pillh wv">Vague <b id="stWave">0/6</b></span>
  </div>
  <div class="field" id="field"><canvas id="cv"></canvas><div class="panel" id="panel" hidden></div></div>
  <div class="tip" id="tip"></div>
  <div class="bar2">
    <button class="btn pw" id="somm" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h3l7 4V6L6 10z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><span id="sommTxt">Sommation</span><i class="cd" id="sommCd"></i></button>
    <button class="btn spd" id="spd" aria-pressed="false" aria-label="Vitesse double">×2</button>
    <button class="btn primary go" id="launch">Lancer la vague 1</button>
  </div>

  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
/* Socle commun des mini-jeux Ma ZP (démo) : menu, tuto, résultat, jauge skins, sons, toasts. */
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const ICONS = {
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor"/></svg>',

  net:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg>',

};

const Shell = (() => {
  let G = null;
  const st = {diff:'normal', tuto:false, gauge:46, sound:true, mode:'menu', timeLeft:0, timeTotal:1, timerOn:false, timerRate:1, onTimeout:null};
  const store = {
    get(k,d){try{const v=localStorage.getItem(G.key+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
    set(k,v){try{localStorage.setItem(G.key+'.'+k,JSON.stringify(v))}catch(e){}}
  };
  let ac=null;
  function blip(freq,dur,type='square',vol=.06){
    if(!st.sound) return;
    try{
      ac = ac || new (window.AudioContext||window.webkitAudioContext)();
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=freq; g.gain.value=vol;
      g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
    }catch(e){}
  }
  const good = () => { blip(1200,.06,'square',.05); buzz(15); };
  const bad  = () => { blip(130,.18,'sawtooth',.06); buzz([30,40,30]); };
  const win  = () => { blip(660,.12,'triangle',.08); setTimeout(()=>blip(990,.25,'triangle',.08),120); buzz(60); };
  function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p) }catch(e){} }
  let tt=0;
  function toast(txt,kind='info'){ const t=$('toast'); t.textContent=txt; t.className='toast show '+kind; clearTimeout(tt); tt=setTimeout(()=>t.className='toast '+kind,850); }
  function shake(el){ el=el||$('stage'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  function showCard(html){ $('card').innerHTML=html; $('overlay').hidden=false; $('card').scrollTop=0; const c=$('card'); c.style.animation='none'; void c.offsetWidth; c.style.animation=''; }
  function hide(){ $('overlay').hidden=true; }
  function renderGauge(){ $('gfill').style.width=(st.gauge/50*100)+'%'; $('gtext').textContent=st.gauge; }

  function coach(step,total,html){
    const c=$('coach'); c.hidden=false;
    const dots=Array.from({length:total},(_,i)=>`<i class="${i<step?'on':''}"></i>`).join('');
    c.innerHTML=`<div class="av">CP</div><div class="body"><div class="step"><span class="dots" aria-label="Étape ${step} sur ${total}">${dots}</span><button class="skip" id="skipTuto">Passer le tuto</button></div><div>${html}</div></div>`;
    $('skipTuto').onclick=endTuto;
  }
  function hideCoach(){ $('coach').hidden=true; }
  const hero = sub => `<div class="hero"><div class="badge">${document.querySelector('.top .badge').innerHTML}</div><div><div class="eyebrow">${sub}</div></div></div>`;

  // Intégration dans Ma ZP : ?mode=incident (incident du jour, un seul essai), ?mode=renfort (renfort PJF pour
  // l'enquête, un seul essai, sans jauge) ou ?mode=train (entraînement).
  const Q = new URLSearchParams(location.search);
  const MODE = ['incident','train','renfort'].includes(Q.get('mode')) ? Q.get('mode') : null;
  const RENF = MODE==='renfort';
  const INC = MODE==='incident' || RENF;
  const escH = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function post(type, data={}){ try{ if(window.parent!==window) window.parent.postMessage({source:'mazp-mj', jeu:G.key, id:Q.get('id'), type, ...data}, location.origin); }catch(e){} }
  let joue=false, fini=false;

  // ───── Challenge (l'entraînement aux mini-jeux dans Ma ZP) : niveaux 1 → ∞, trois erreurs et la course s'arrête. ─────
  // Le record de la partie (et son détenteur) arrive par l'adresse ; chaque niveau réussi est signalé à Ma ZP.
  const DEFI = { rec: Math.max(0, Number(Q.get('rec'))||0), recNom: Q.get('recNom')||'', moi: Math.max(0, Number(Q.get('moi'))||0), erreurs: 3 };
  let run = null; // { niveau, erreurs, reussis } pendant une course
  /**
   * Réglages d'un niveau : du niveau 1 (plus doux que « facile ») au niveau 10 (= « difficile »), en passant par
   * facile (4) et normal (7) ; au-delà, chaque réglage continue de se serrer au même rythme que de normal à difficile,
   * en multipliant (au moins 3 % par niveau). Le temps, lui, tend vers un plancher jouable par un très bon joueur. Bornes par jeu.
   */
  function cfgNiveau(n){
    const F=G.diffs.facile, N=G.diffs.normal, D=G.diffs.difficile, B=G.bornes||{};
    const out={label:`Niveau ${n}`, niveau:n, defi:true};
    const val=(f,m,d,k)=>{
      if(n<=10){
        const pts=[[1,f+(f-m)*0.5],[4,f],[7,m],[10,d]];
        for(let i=0;i<3;i++){ const [a,va]=pts[i],[b,vb]=pts[i+1]; if(n<=b) return va+(vb-va)*(n-a)/(b-a); }
      }
      let r = m>0&&d>0 ? Math.pow(d/m,1/3) : 1;
      if(r===1 && k==='time') r=0.95;
      else if(r!==1 && Math.abs(r-1)<0.03) r = r>1?1.03:0.97;
      // Le temps s'approche de son plancher sans l'atteindre (un temps qu'un très bon joueur tient encore) :
      // ce sont la précision et la complexité qui finissent par départager.
      if(k==='time'){ const lo=(B.time&&B.time[0])||0; if(lo>0 && d>lo) return lo+(d-lo)*Math.pow(Math.min(r,.93),n-10); }
      return d*Math.pow(r,n-10);
    };
    const borne=(v,b,k,d,ent)=>{ const [lo,hi]=b||(k==='time'?[Math.max(15,d*0.3),Infinity]:[-Infinity,Infinity]); v=Math.min(hi,Math.max(lo,v)); return ent?Math.round(v):Math.round(v*1000)/1000; };
    const cles=new Set([...Object.keys(F),...Object.keys(N),...Object.keys(D)]);
    for(const k of cles){
      if(k==='agents'||k==='label') continue;
      const f=F[k], m=N[k], d=D[k];
      const ref = d!==undefined?d:m!==undefined?m:f;
      if(f===undefined||m===undefined||d===undefined){ // réglage propre aux niveaux durs
        if(d!==undefined && n>=10) out[k]=d; else if(m!==undefined && n>=7) out[k]=m; else if(f!==undefined && n<7) out[k]=f;
        continue;
      }
      if(typeof ref==='number') out[k]=borne(val(f,m,d,k),B[k],k,d,[f,m,d].every(Number.isInteger));
      else if(Array.isArray(ref)) out[k]=ref.map((_,i)=>borne(val(f[i],m[i],d[i],k),B[k]&&B[k][i],k,d[i],[f[i],m[i],d[i]].every(Number.isInteger)));
      else out[k] = n>=10?d:n>=7?m:f;
    }
    return G.niveau ? G.niveau(n,out) : out;
  }
  const eyebrow = t => { const eb=document.querySelector('.top .eyebrow'); if(eb) eb.textContent=t; };
  const eyebrowBase = () => (RENF?'Appui PJF · ':INC?'Incident du jour · ':MODE==='train'?'Challenge · ':'')+G.serviceShort;
  const recLigne = () => DEFI.rec ? `Record de la partie : <b>niveau ${DEFI.rec}</b>${DEFI.recNom?` par ${escH(DEFI.recNom)}`:''}.` : 'Pas encore de record dans la partie : le premier niveau réussi le crée.';
  function startDefi(){ run={niveau:1, erreurs:0, reussis:0}; jouerNiveau(); }
  function jouerNiveau(){
    hide(); hideCoach(); st.mode='play';
    eyebrow(`Challenge · niv. ${run.niveau} · ${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`);
    G.onPlay(cfgNiveau(run.niveau)); toast(`Niveau ${run.niveau}`);
  }
  function resultDefi({ok, stats, details}){
    st.timerOn=false; st.mode='result';
    const n=run.niveau;
    post('result',{ok, defi:true}); // compté comme une partie d'entraînement
    const detailHtml = details && details.length && !ok ? `<div class="debrief-list"><b>Ce qui s’est mal passé</b><ul>${details.map(d=>`<li><span>${d}</span></li>`).join('')}</ul></div>` : '';
    const coeurs = `${'♥'.repeat(DEFI.erreurs-run.erreurs)}${'♡'.repeat(run.erreurs)}`;
    if(ok){
      run.reussis=n; run.niveau=n+1;
      const record = n>DEFI.rec, perso = n>DEFI.moi;
      post('defi',{niveau:n});
      if(record){ DEFI.rec=n; DEFI.recNom='toi'; } if(perso) DEFI.moi=n;
      showCard(`<div class="verdict ok">${ICONS.check}</div><h2>Niveau ${n} réussi</h2>
        <div class="stats">${stats.slice(0,2).map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="stat"><span>Erreurs</span><b class="coeurs">${coeurs}</b></div></div>
        ${record?'<div class="skin">Nouveau record de la partie ! Ton nom s’affiche sur la tuile du challenge.</div>':perso?'<p class="small">Nouveau record personnel.</p>':''}
        <p class="small">Le niveau ${n+1} sera un peu plus dur.</p>
        <div class="row"><button class="btn primary" id="suite">Niveau ${n+1}</button><button class="btn" id="stop">Arrêter</button></div>`);
      $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
      return;
    }
    run.erreurs++;
    if(run.erreurs>=DEFI.erreurs){ finDefi(detailHtml); return; }
    const reste=DEFI.erreurs-run.erreurs;
    showCard(`<div class="verdict bad">${ICONS.cross}</div><h2>Niveau ${n} raté</h2>
      <p class="small">Encore <b>${reste} erreur${reste>1?'s':''}</b> permise${reste>1?'s':''} <span class="coeurs">${coeurs}</span>.</p>${detailHtml}
      <div class="row"><button class="btn primary" id="suite">Retenter le niveau ${n}</button><button class="btn" id="stop">Arrêter</button></div>`);
    $('suite').onclick=jouerNiveau; $('stop').onclick=finDefi;
  }
  function finDefi(detailHtml=''){
    st.timerOn=false; st.mode='result';
    const k=run?run.reussis:0; run=null; eyebrow(eyebrowBase());
    showCard(`${hero('Challenge')}<h2>Fin de la course</h2>
      <div class="stats"><div class="stat"><span>Niveaux réussis</span><b>${k}</b></div><div class="stat"><span>Ton record</span><b>${DEFI.moi}</b></div><div class="stat"><span>Record partie</span><b>${DEFI.rec}</b></div></div>
      ${typeof detailHtml==='string'?detailHtml:''}
      <p class="small">${recLigne()}</p>
      <div class="row"><button class="btn primary" id="encore">Nouvelle course</button><button class="btn" id="tomenu">Menu</button></div>`);
    $('encore').onclick=startDefi; $('tomenu').onclick=menu;
  }
  const unite = n => `${n} ${G.unit ? G.unit[n>1?1:0] : (n>1?'agents':'agent')}`;
  const effectif = () => { const d=G.diffs[st.diff]; const n=Number(Q.get('agents')); return unite(Number.isFinite(n)&&Q.get('agents')!==null?n:d.agents); };
  const effLabel = () => G.effLabel || `Effectif ${G.serviceShort} sur place`;

  function menu(){
    if(INC && fini){ post('close'); return; }
    st.mode='menu'; st.timerOn=false; hideCoach(); G.onMenu && G.onMenu();
    if(run){ run=null; eyebrow(eyebrowBase()); }
    const touch=matchMedia('(pointer:coarse)').matches;
    const tutoBtns = (goLbl) => st.tuto
      ? `<button class="btn primary" id="go">${goLbl}</button><button class="btn" id="tuto">Revoir le tuto</button>`
      : `<button class="btn primary" id="tuto">Commencer le tuto</button><button class="btn" id="go">${RENF?'Commencer sans tuto':INC?'Intervenir sans tuto':'Jouer directement'}</button>`;
    if(INC){
      const d=G.diffs[st.diff];
      showCard(`
        ${hero((RENF?'Appui PJF · ':'Incident du jour · ')+G.serviceShort)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="lbl2">${effLabel()}</div>
        <div class="seg seg1"><button aria-pressed="true" tabindex="-1"><span class="ppl">${'<i></i>'.repeat(Math.max(1,Math.min(12,Number(Q.get('agents'))||d.agents)))}</span><b>${effectif()}</b>${d.label}</button></div>
        ${Q.get('pourquoi')?`<p class="small" style="opacity:.8">${escH(Q.get('pourquoi'))}</p>`:''}
        <p class="small">${RENF?`Un seul essai. Réussi : ${escH(Q.get('gain')||'une pièce pour ton enquête')}. Raté ou abandonné : ${escH(Q.get('malus')||'pas de pièce')}.`:`Un seul essai. Réussi : ${escH(Q.get('gain')||'un bonus')} et des points de jauge des skins. Raté ou abandonné : ${escH(Q.get('malus')||G.malus)}. Tout s’applique à 20:00.`}</p>
        <div class="row">${tutoBtns(RENF?'Commencer':'Intervenir')}</div>
        <button class="btn small" id="later" style="align-self:center">Plus tard</button>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}`);
    } else if(MODE==='train'){
      // Dans Ma ZP, l'entraînement aux mini-jeux, c'est le challenge : les premiers niveaux servent d'échauffement.
      showCard(`
        ${hero('Challenge · '+G.service)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="defi-box"><div><b>🏆 Challenge</b><span>Du niveau 1 (tout doux) à aussi haut que possible : chaque niveau est un peu plus dur. Trois erreurs et la course s’arrête.</span><span>${recLigne()}${DEFI.moi?` Ton record : niveau ${DEFI.moi}.`:''}</span></div></div>
        <div class="row"><button class="btn primary" id="defiGo">Lancer le challenge</button><button class="btn" id="tuto">${st.tuto?'Revoir le tuto':'Tuto'}</button></div>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}
        <p class="demo">Rien ne compte pour ta zone : seul ton record s’affiche.</p>`);
      $('tuto').onclick=startTuto; $('defiGo').onclick=startDefi;
      return;
    } else {
      const seg=Object.entries(G.diffs).map(([k,d])=>`<button data-k="${k}" aria-pressed="${k===st.diff}"><span class="ppl">${'<i></i>'.repeat(d.agents)}</span><b>${G.unit ? unite(d.agents) : ({difficile:'Sous-effectif',normal:'Effectif de base',facile:'Renforcé'})[k]}</b>${d.label}</button>`).join('');
      showCard(`
        ${hero('Ma ZP · '+G.service)}
        <h2>${G.headline}</h2>
        ${G.story}
        <div class="lbl2">${effLabel()}</div>
        <div class="seg" id="seg">${seg}</div>
        <p class="small">${G.diffHint}</p>
        <div class="row">${tutoBtns('Jouer')}</div>
        ${(!touch && G.desktopHint)?`<p class="small">${G.desktopHint}</p>`:''}
        <p class="demo">Démo jouable, rien n'est enregistré dans ta partie Ma ZP.</p>`);
      $('seg').onclick=e=>{const b=e.target.closest('button'); if(!b) return; st.diff=b.dataset.k; store.set('diff',st.diff);
        [...$('seg').children].forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===st.diff));};
    }
    $('go').onclick=play; $('tuto').onclick=startTuto;
    if($('later')) $('later').onclick=()=>post('close');
  }
  function play(){
    if(INC){ if(fini) return; if(!joue){ joue=true; post('start'); } }
    hide(); hideCoach(); st.mode='play'; G.onPlay(G.diffs[st.diff]);
  }
  function startTuto(){ hide(); st.mode='tuto'; st.timerOn=false; G.onTuto(); }
  function endTuto(){
    st.tuto=true; store.set('tuto',true); hideCoach(); st.mode='menu'; st.timerOn=false; G.onMenu && G.onMenu();
    showCard(`${hero('Tutoriel terminé')}<h2>Les règles en bref</h2><ul>${G.rules.map(r=>`<li><span>${r}</span></li>`).join('')}</ul>
      <div class="row"><button class="btn primary" id="go">${INC?'Intervenir':MODE==='train'?'Lancer le challenge':'Lancer une partie'}</button><button class="btn" id="tomenu">${INC?'Plus tard':'Menu'}</button></div>`);
    $('go').onclick=MODE==='train'?startDefi:play; $('tomenu').onclick=INC?()=>post('close'):menu;
  }
  function startTimer(sec,onTimeout){ st.timeLeft=sec; st.timeTotal=sec; st.timerOn=true; st.timerRate=1; st.onTimeout=onTimeout; }
  function stopTimer(){ st.timerOn=false; }
  function fmt(s){ s=Math.max(0,Math.ceil(s)); return s>=60? Math.floor(s/60)+':'+String(s%60).padStart(2,'0') : String(s); }

  function result({ok, stats, faults, malus, note, details}){
    if(run && !INC){ resultDefi({ok, stats, details}); return; }
    st.timerOn=false; st.mode='result';
    let pts=0, skin=false;
    if(ok) pts=faults===0?2:1;
    if(INC){
      fini=true; post('result',{ok, fautes:faults, pts});
      if(ok && !RENF){ st.gauge+=pts; renderGauge(); }
    } else if(MODE!=='train' && ok){ st.gauge+=pts; if(st.gauge>=50){st.gauge-=50; skin=true;} store.set('gauge',st.gauge); renderGauge(); }
    const statHtml=stats.map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('')+(MODE==='train'||RENF?'':`<div class="stat pts"><span>Jauge skins</span><b>${ok?'+'+pts:'+0'}</b></div>`);
    const boutons = INC ? `<button class="btn primary" id="mjBack">${RENF?'Retour à l’enquête':'Retour au commissariat'}</button>`
      : `<button class="btn primary" id="again">${ok?'Rejouer':'Réessayer'}</button><button class="btn" id="tomenu">Menu</button>`;
    const detailHtml = details && details.length ? `<div class="debrief-list"><b>${ok?'Tes erreurs':'Ce qui s’est mal passé'}</b><ul>${details.map(d=>`<li><span>${d}</span></li>`).join('')}</ul></div>` : '';
    const noteInc = RENF ? (ok ? 'Analyse réussie : la pièce arrivera dans ton dossier d’enquête à 20:00.' : '') : INC ? (ok ? `Résultat enregistré : ${escH(Q.get('gain')||'ton bonus')} et +${pts} sur la jauge des skins, à 20:00.${st.gauge>=50?' Ta jauge sera pleine ce soir : un nouveau skin t’attend.':''}` : '') : '';
    showCard(ok?`

function mkPath(pts){ const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return {pts,cum,len:cum[cum.length-1]}; }

  let t=((x-a[0])*dx+(y-a[1])*dy)/L; t=Math.max(0,Math.min(1,t)); const dd=Math.hypot(a[0]+t*dx-x,a[1]+t*dy-y); if(dd<best.dist) best={dist:dd,d:P.cum[i-1]+t*(P.cum[i]-P.cum[i-1])}; } return best; }

function genPads(paths){
  const pts=[]; paths.forEach(P=>{ for(let d=0;d<P.len;d+=.2){ const q=posOn(P,d); if(q.y>-.3&&q.y<MH&&q.x>-.3&&q.x<MW+.3) pts.push(q); } });

  for(let y=.7;y<=MH-1.05;y+=.25) for(let x=.55;x<=MW-.55;x+=.25){ let dmin=9; for(const q of pts){ const d=Math.hypot(q.x-x,q.y-y); if(d<dmin) dmin=d; }
    if(dmin<1.05||dmin>1.7) continue; let cov=0; for(const q of pts) if(Math.hypot(q.x-x,q.y-y)<=2) cov++; cand.push({x,y,cov}); }

function launchWave(){

let UID=0;

function endGame(){

function finish(ok){

  const perdu=R.lives0-Math.max(0,R.lives);
  const etoiles = !ok ? 0 : perdu===0 ? 3 : perdu<=R.lives0*.4 ? 2 : 1;
  let note='';

    note=`${'★'.repeat(etoiles)}${'☆'.repeat(3-etoiles)} sur ce quartier.${R.map<MAPS.length-1?` Quartier suivant débloqué : ${MAPS[R.map+1].nom}.`:' Campagne terminée !'}`; }
  const conseils={manif:'<b>émeutiers</b> : place des <b>pelotons MO</b>, ils en repoussent plusieurs à la fois.',

  const details=Object.entries(R.leaks).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`${n} passage${n>1?'s':''} de ${conseils[k]}`);
  Shell.result({ok, faults:perdu, stats:[['Repoussés',R.disp],['Cordon perdu',`${perdu} / ${R.lives0}`]], details, note:note||(perdu===0?'Cordon intact : double point.':'Cordon intact : +2 sur la jauge.')});

/* ───── interface ───── */
function ui(){

  else { b.disabled=true; b.innerHTML=R.phase==='run'?(R.wave>=R.waves?'Dernière vague':`Vague ${R.wave} en cours`):'—'; }
  const sm=$('somm'); sm.hidden=R.phase==='idle'||R.tuto>0; sm.disabled=R.somm.cd>0||R.phase!=='run';
  sm.setAttribute('aria-pressed',R.somm.placing); $('sommTxt').textContent=R.somm.cd>0?`${Math.ceil(R.somm.cd)} s`:'Sommation';

function tip(html){
  const el=$('tip');
  if(html){ el.innerHTML=html; return; }
  if(R.somm.placing){ el.innerHTML='<span><b>Sommations :</b> touche le cortège. Ceux qui sont autour ralentissent 4 s et perdent de la détermination.</span>'; return; }
  if(R.sel){ const tw=R.towers[R.sel.pad];
    if(R.sel.opt){ const o=R.sel.opt;
      if(o==='up'){ el.innerHTML=`<span><b>${UPTXT[tw.type][tw.lvl]}</b> · <span class="c">${upCost(tw)} agents</span> — plus efficace, portée accrue. <b>Touche encore pour confirmer.</b></span>`; return; }
      if(o==='sell'){ el.innerHTML=`<span><b>Retirer</b> ce moyen · récupère <span class="c">${sellVal(tw)} agents</span>. <b>Touche encore pour confirmer.</b></span>`; return; }
      const M=MEANS[o]; el.innerHTML=`<span><b>${M.nom}</b> · <span class="c">${M.cout} agents</span> — ${M.ds} <b>Touche encore pour poser.</b></span>`; return; }
    el.innerHTML= tw ? `<span><b>${MEANS[tw.type].nom}</b> (niveau ${tw.lvl}) — ${MEANS[tw.type].ds}</span>` : '<span>Choisis un moyen autour de l’emplacement.</span>'; return; }
  if(R.phase==='build') el.innerHTML='<span>Touche un <b>emplacement bleu</b> pour poser un moyen, puis lance la vague. Les cortèges suivent les rues jusqu’à l’<b>hôtel de ville</b>.</span>';
  else if(R.phase==='run') el.innerHTML='<span>Chaque émeutier repoussé rend des <b>agents</b> : pose ou <b>renforce</b> tes moyens à tout moment.</span>';
  else el.innerHTML='';
}
const ORDER=['peloton','autopompe','barrage','cavalerie'];
function menuItems(){
  if(!R.sel) return [];
  const P=padOf(R.sel.pad), tw=R.towers[R.sel.pad];
  let items;
  if(tw){ items=[]; if(tw.lvl<3) items.push({k:'up',a:-Math.PI/2}); items.push({k:'sell',a:Math.PI/2}); }
  else { const allow=R.tuto?['peloton']:ORDER; items=ORDER.map((k,i)=>({k,a:-Math.PI/2+i*Math.PI/2,lock:!allow.includes(k)})); }
  const r=.92, cx=Math.min(MW-r-.42,Math.max(r+.42,P.x)), cy=Math.min(MH-r-.6,Math.max(r+.42,P.y));
  return items.map(it=>{ const x=cx+Math.cos(it.a)*r, y=cy+Math.sin(it.a)*r; let ok=true, why='';
    if(it.k==='up') ok=R.agents>=upCost(tw);
    else if(it.k!=='sell'){ const used=Object.values(R.towers).filter(t=>t.type===it.k).length, lim=R.dispo[it.k];
      if(it.lock){ ok=false; why='pas pour le moment'; }
      else if(lim!==undefined&&used>=lim){ ok=false; why=`tous engagés (${lim} disponible${lim>1?'s':''})`; }
      else if(R.agents<MEANS[it.k].cout){ ok=false; why=`il faut ${MEANS[it.k].cout} agents`; } }
    return {...it,x,y,ok,why}; });
}
function choose(it){
  const id=R.sel.pad;
  if(R.sel.opt!==it.k){ R.sel.opt=it.k; tip(); if(!it.ok){ const nm=it.k==='up'?'Renforcer':MEANS[it.k].nom; tip(`<span><b>${nm}</b> : ${it.why||'pas assez d’agents'}.</span>`); } return; }
  if(!it.ok) return;
  if(it.k==='sell'){ R.agents+=sellVal(R.towers[id]); delete R.towers[id]; }
  else if(it.k==='up'){ const tw=R.towers[id], c=upCost(tw); R.agents-=c; tw.spent+=c; tw.lvl++; tw.born=R.t; }
  else { const M=MEANS[it.k]; R.agents-=M.cout; R.towers[id]=newTower(id,it.k); if(R.tuto===3) tutoStep(4); }
  Shell.good(); R.sel=null; tip(); ui();
}
function newTower(id,type){ const P=padOf(id), tw={type,lvl:1,spent:MEANS[type].cout,born:R.t,cd:0,face:Math.PI/2};
  // orientation : face à la rue la plus proche (et, pour le barrage, les barrières posées en travers de la chaussée)
  let best=null; R.M.P.forEach((Pa,pi)=>{ const n=nearestOn(Pa,P.x,P.y); if(!best||n.dist<best.dist) best={...n,pi}; });
  const q=posOn(R.M.P[best.pi],best.d); tw.face=Math.atan2(q.y-P.y,q.x-P.x); tw.road={pi:best.pi,d:best.d};
  return tw; }
function onTap(e){
  const r=C.cv.getBoundingClientRect(), x=(e.clientX-r.left)/C.s, y=(e.clientY-r.top)/C.s;
  if((R.over&&!R.tuto)||R.phase==='idle'||R.pause) return;
  if(R.somm.placing){ R.somm.placing=false;
    const hitN=R.units.filter(u=>u.state==='go'&&Math.hypot(u.p.x-x,u.p.y-y)<=SOMM.rayon);
    hitN.forEach(u=>{ u.somUntil=R.t+SOMM.dure; u.hp-=SOMM.perte; }); R.somm.fx.push({x,y,t:R.t}); R.somm.cd=SOMM.cd; Shell.blip(440,.3,'square',.05);
    tip(); ui(); return; }
  for(const it of menuItems()){ if(Math.hypot(it.x-x,it.y-y)<.44){ choose(it); return; } }
  let best=null,bd=.6; for(const p of R.pads){ const d=Math.hypot(p.x-x,p.y-y); if(d<bd){ bd=d; best=p; } }
  if((R.tuto===1||R.tuto===3)&&best&&best.id!=='p0') best=null;
  if(best){ R.sel={pad:best.id,opt:null}; if(R.tuto===1) tutoStep(3); Shell.blip(700,.04,'square',.03); }
  else if(R.tuto!==3) R.sel=null;
  tip();
}

/* ───── tutoriel ───── */
function tutoStep(n){
  R.tuto=n; ui();
  if(n===1) Shell.coach(1,3,'Le cortège suit <b>la rue</b> jusqu’à l’<b>hôtel de ville</b>. Touche l’<b>emplacement bleu</b> qui clignote.');
  if(n===3) Shell.coach(2,3,'Choisis le <b>peloton MO</b> au-dessus. Premier toucher : sa portée. Deuxième toucher : il est posé.');
  if(n===4) Shell.coach(3,3,'Lance la vague. Les émeutiers repoussés <b>font demi-tour</b> et te rendent des agents.');

}

/* ───── rendu ───── */
function resize(){
  const f=$('field'), w=f.clientWidth, h=f.clientHeight; if(!w||!h||!R.M) return;
  const s=Math.min(w/MW,h/MH); C.s=s; C.dpr=Math.min(2.5,window.devicePixelRatio||1);
  const cw=Math.floor(MW*s), ch=Math.floor(MH*s);
  C.cv.style.width=cw+'px'; C.cv.style.height=ch+'px'; C.cv.width=Math.round(cw*C.dpr); C.cv.height=Math.round(ch*C.dpr);
  C.map=document.createElement('canvas'); C.map.width=C.cv.width; C.map.height=C.cv.height;
  const g=C.map.getContext('2d'); g.setTransform(s*C.dpr,0,0,s*C.dpr,0,0); drawMap(g,R.M);
}
function rng(seed){ let x=seed||1; return ()=>{ x=(x*16807)%2147483647; return (x-1)/2147483646; }; }
const RW=1.05;
function strokeP(g,P,w,col,dash){ g.strokeStyle=col; g.lineWidth=w; g.lineJoin='round'; g.lineCap='butt'; if(dash) g.setLineDash(dash); g.beginPath(); P.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); g.setLineDash([]); }
function drawMap(g,M){
  const rnd=rng(5324+M.paths.length*17);
  g.fillStyle='#16191f'; g.fillRect(0,0,MW,MH);
  for(let y=-.2;y<MH;y+=1.15) for(let x=-.2;x<MW;x+=1.05){
    const w=.8+rnd()*.25, h=.85+rnd()*.25, bx=x+.06, by=y+.06, l=17+rnd()*6, hue=rnd()<.25?20:222;
    g.fillStyle='rgba(0,0,0,.45)'; g.fillRect(bx+.08,by+.08,w,h);
    g.fillStyle=`hsl(${hue} ${hue===20?18:12}% ${l}%)`; g.fillRect(bx,by,w,h);
    g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=.02; g.strokeRect(bx+.02,by+.02,w-.04,h-.04);
    if(rnd()<.5){ g.fillStyle=`hsl(${hue} 10% ${l+6}%)`; g.fillRect(bx+.15+rnd()*.3,by+.15+rnd()*.3,.14+rnd()*.1,.12+rnd()*.08); } }
  // pavés gris : trottoirs puis chaussée
  M.P.forEach(P=>strokeP(g,P,RW+.5,'#4e5562')); M.P.forEach(P=>strokeP(g,P,RW+.07,'#d9dee8')); M.P.forEach(P=>strokeP(g,P,RW,'#3d4351'));
  for(let i=0;i<800;i++){ g.fillStyle=`rgba(255,255,255,${rnd()*.035})`; g.fillRect(rnd()*MW,rnd()*MH,.03,.03); }
  M.P.forEach(P=>strokeP(g,P,.045,'rgba(240,240,230,.4)',[.3,.25]));
  // flèches au sol : le sens du cortège
  M.P.forEach(P=>{ for(let d=1.2; d<P.len-.8; d+=1.6){ const p=posOn(P,d); g.save(); g.translate(p.x,p.y); g.rotate(p.ang); g.fillStyle='rgba(255,255,255,.12)';
    g.beginPath(); g.moveTo(.22,0); g.lineTo(-.08,-.2); g.lineTo(-.08,-.08); g.lineTo(-.26,-.08); g.lineTo(-.26,.08); g.lineTo(-.08,.08); g.lineTo(-.08,.2); g.closePath(); g.fill(); g.restore(); } });
  // lampadaires
  M.P.forEach(P=>{ for(let d=.8; d<P.len; d+=1.7){ const p=posOn(P,d), sd=((d/1.7|0)%2?1:-1)*(RW/2+.16), x=p.x-Math.sin(p.ang)*sd, y=p.y+Math.cos(p.ang)*sd;
    g.globalCompositeOperation='lighter'; const gr=g.createRadialGradient(x,y,0,x,y,.9); gr.addColorStop(0,'rgba(255,196,120,.06)'); gr.addColorStop(1,'rgba(255,196,120,0)'); g.fillStyle=gr; g.fillRect(x-.9,y-.9,1.8,1.8);
    g.globalCompositeOperation='source-over'; g.fillStyle='#ffe2b0'; g.beginPath(); g.arc(x,y,.035,0,7); g.fill(); } });
  // hôtel de ville en bas : façade à colonnes, la rue y débouche
  const ex=M.P[0].pts.at(-1)[0];
  g.fillStyle='#2a2e3a'; g.fillRect(0,MH-.75,MW,.75); g.fillStyle='#3a3f4e'; g.fillRect(0,MH-.75,MW,.12);
  for(let x=.3;x<MW;x+=.45){ if(Math.abs(x-ex)<.8) continue; g.fillStyle='#c9c2b0'; g.fillRect(x,MH-.6,.14,.6); g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(x+.1,MH-.6,.04,.6); }
  g.fillStyle='#b9b2a0'; g.fillRect(ex-.75,MH-.75,1.5,.1);
  const v=g.createRadialGradient(MW/2,MH/2,MH*.3,MW/2,MH/2,MH*.75); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.3)'); g.fillStyle=v; g.fillRect(0,0,MW,MH);
}

  desktopHint:'Sur ordinateur : clique sur un emplacement bleu, puis sur le moyen voulu (deux fois pour confirmer).',
  rules:['Les cortèges suivent les rues jusqu’à l’<b>hôtel de ville</b>. Chaque émeutier qui arrive entame le <b>cordon</b> (bouclier jaune).',
    'On ne blesse personne : on <b>repousse</b>. À bout de détermination, l’émeutier fait <b>demi-tour</b> et te rend des agents.',
    'Touche un <b>emplacement bleu</b> : quatre moyens apparaissent. Premier toucher : portée et prix. Deuxième toucher : c’est posé.',
    '<b>Peloton MO</b> contre la masse, <b>autopompe</b> pour faire reculer les groupes, <b>barrage</b> pour ralentir, <b>cavalerie</b> contre les meneurs et les casseurs.',
    'Touche un moyen posé pour le <b>renforcer</b> (jusqu’au niveau 3, son allure change) ou le retirer.',
    'Les <b>sommations</b> (en bas à gauche) ralentissent un groupe. Lancer la vague suivante <b>en avance</b> rapporte des agents.'],
  winTitle:'Ordre rétabli', loseTitle:'Le cordon a cédé', skin:'Cordon de nuit',
  malus:'l’hôtel de ville est dégradé : moral des équipes Intervention en baisse et un combi immobilisé jusqu’à demain.',
  // Challenge : on enchaîne les quartiers, puis les cortèges deviennent plus déterminés et plus serrés.
  niveau(n,cfg){ cfg.map=(n-1)%MAPS.length; cfg.waves=n<=2?4:n<=4?5:6; return cfg; },
  onInit(){
    C.cv=$('cv'); C.ctx=C.cv.getContext('2d'); R.M=MAPDATA[0]; R.pads=R.M.pads;
    resize(); new ResizeObserver(resize).observe($('field'));
    if(document.fonts) document.fonts.ready.then(resize);
    C.cv.addEventListener('pointerdown',onTap);
    $('launch').onclick=()=>{ if(R.phase==='build'){ if(R.tuto===4) Shell.hideCoach(); launchWave(); } else if(R.phase==='run'&&R.nextIn!==null) launchWave(); };
    $('spd').onclick=()=>{ R.speed=R.speed===1?2:1; $('spd').setAttribute('aria-pressed',R.speed===2); };
    $('somm').onclick=()=>{ if(R.somm.cd>0||R.phase!=='run') return; R.somm.placing=!R.somm.placing; R.sel=null; tip(); ui(); };
    R.phase='idle'; R.cfg=this.diffs.normal; ui(); tip();
  },
  onMenu(){ R.over=true; R.phase='idle'; R.units=[]; R.towers={}; R.tuto=0; R.sel=null; $('panel').hidden=true; R.pause=false; ui(); tip(); },
  onPlay(cfg){
    if(Shell.enDefi) return resetGame(cfg,false,cfg.map||0);
    if(Q2.get('mode')==='incident'){ const cq=Number(Q2.get('carte')); return resetGame(cfg,false,Number.isInteger(cq)&&MAPS[cq]?cq:({facile:0,normal:1,difficile:2}[Q2.get('diff')]??1)); }
    chooseMap(cfg);
  },
  onTuto(){ resetGame(this.diffs.facile,true,0); tutoStep(1); },
  onFrame(dt){
    if(!C.ctx) return;
    const n=R.speed*2; for(let i=0;i<n;i++) step(dt*R.speed/n);
    if(R.phase==='build'||R.phase==='run'){
      const T=$('timer'); $('ring').classList.remove('warn');
      if(R.phase==='run'&&R.nextIn!==null){ T.textContent=Math.ceil(R.nextIn); $('ringval').style.strokeDashoffset=2*Math.PI*21*(1-R.nextIn/R.cfg.pause); }
      else { T.textContent=R.phase==='run'?'V'+R.wave:'–'; $('ringval').style.strokeDashoffset=0; }
      if(((R.t*5)|0)!==R._lu){ R._lu=(R.t*5)|0; ui(); }
    }
    render();
  }
});
// Accès pour les simulations d'équilibrage (sans effet en jeu).
window.__bouclage={R,MAPS,MAPDATA,MEANS,FOES,WAVES,LV,resetGame,launchWave,step,upCost,
  build(pad,type){ const M=MEANS[type]; if(R.towers[pad]||R.agents<M.cout) return false; const used=Object.values(R.towers).filter(t=>t.type===type).length; if(R.dispo[type]!==undefined&&used>=R.dispo[type]) return false; R.agents-=M.cout; R.towers[pad]=newTower(pad,type); return true; },
  up(pad){ const tw=R.towers[pad]; if(!tw||tw.lvl>=3) return false; const c=upCost(tw); if(R.agents<c) return false; R.agents-=c; tw.spent+=c; tw.lvl++; return true; },
  somm(x,y){ if(R.somm.cd>0||R.phase!=='run') return false; R.units.filter(u=>u.state==='go'&&u.p&&Math.hypot(u.p.x-x,u.p.y-y)<=SOMM.rayon).forEach(u=>{ u.somUntil=R.t+SOMM.dure; u.hp-=SOMM.perte; }); R.somm.cd=SOMM.cd; return true; }};

</script>
